ed in this building have been recycled.","answer":"materials"},{"num":6,"sentence":"She ______ the carrots and potatoes before putting them in the pot.","answer":"peeled"},{"num":7,"sentence":"Vegetables ______ better in earth that contains plenty of organic matter.","answer":"grow"},{"num":8,"sentence":"Nothing is ______ in this kitchen: even the vegetable skins are used.","answer":"wasted"},{"num":9,"sentence":"Dry leaves and wet food scraps must be well ______ together.","answer":"mixed"},{"num":10,"sentence":"The school asked the council for ______ funding to build a compost area.","answer":"additional"}]},"6":{"title":"WRITING","words":[{"word":"solve","ipa":"/sɒlv/","pos":"v.","meaning":"giải quyết"},{"word":"solution","ipa":"/səˈluːʃn/","pos":"n.","meaning":"giải pháp"},{"word":"solvable","ipa":"/ˈsɒlvəbl/","pos":"adj.","meaning":"có thể giải quyết"},{"word":"compost piles","ipa":"/ˈkɒmpɒst paɪlz/","pos":"n.pl.","meaning":"đống ủ phân"},{"word":"compost","ipa":"/ˈkɒmpɒst/","pos":"n., v.","meaning":"phân ủ; ủ phân"},{"word":"automatic","ipa":"/ˌɔːtəˈmætɪk/","pos":"adj.","meaning":"tự động"},{"word":"automatically","ipa":"/ˌɔːtəˈmætɪkli/","pos":"adv.","meaning":"một cách tự động"},{"word":"recycle","ipa":"/ˌriːˈsaɪkl/","pos":"v.","meaning":"tái chế"},{"word":"recycling","ipa":"/ˌriːˈsaɪklɪŋ/","pos":"n.","meaning":"sự tái chế"},{"word":"recycler","ipa":"/ˌriːˈsaɪklə(r)/","pos":"n.","meaning":"người/cơ sở tái chế"},{"word":"recyclable","ipa":"/ˌriːˈsaɪkləbl/","pos":"adj.","meaning":"có thể tái chế"},{"word":"decompose","ipa":"/ˌdiːkəmˈpəʊz/","pos":"v.","meaning":"phân hủy"},{"word":"decomposition","ipa":"/ˌdiːˌkɒmpəˈzɪʃn/","pos":"n.","meaning":"sự phân hủy"},{"word":"landfill","ipa":"/ˈlændfɪl/","pos":"n.","meaning":"bãi chôn lấp rác"},{"word":"sensor","ipa":"/ˈsensə(r)/","pos":"n.","meaning":"cảm biến"},{"word":"turn off","ipa":"/ˌtɜːn ˈɒf/","pos":"phr.v","meaning":"tắt"},{"word":"create","ipa":"/kriˈeɪt/","pos":"v.","meaning":"tạo ra"},{"word":"creation","ipa":"/kriˈeɪʃn/","pos":"n.","meaning":"sự tạo ra"},{"word":"creative","ipa":"/kriˈeɪtɪv/","pos":"adj.","meaning":"sáng tạo"},{"word":"creatively","ipa":"/kriˈeɪtɪvli/","pos":"adv.","meaning":"một cách sáng tạo"},{"word":"creator","ipa":"/kriˈeɪtə(r)/","pos":"n.","meaning":"người sáng tạo"},{"word":"leftover","ipa":"/ˈleftəʊvə(r)/","pos":"n., adj.","meaning":"đồ ăn thừa; còn lại"},{"word":"contaminate","ipa":"/kənˈtæmɪneɪt/","pos":"v.","meaning":"làm ô nhiễm, làm bẩn"},{"word":"contaminated","ipa":"/kənˈtæmɪneɪtɪd/","pos":"adj.","meaning":"bị ô nhiễm"},{"word":"contamination","ipa":"/kənˌtæmɪˈneɪʃn/","pos":"n.","meaning":"sự ô nhiễm, sự nhiễm bẩn"},{"word":"promote","ipa":"/prəˈməʊt/","pos":"v.","meaning":"thúc đẩy, khuyến khích"},{"word":"promotion","ipa":"/prəˈməʊʃn/","pos":"n.","meaning":"sự thúc đẩy; khuyến mãi"},{"word":"promoter","ipa":"/prəˈməʊtə(r)/","pos":"n.","meaning":"người thúc đẩy"}],"mcq":[{"num":1,"question":"Composting at home is a simple ______ to the problem of food waste.","options":["solution","solve","solvable","solved"],"answerIndex":0,"explanation":"Sau \"a simple\" cần danh từ: \"a solution to a problem\" (giải pháp cho một vấn đề). \"solve/solved\" là động từ; \"solvable\" là tính từ."},{"num":2,"question":"Technology alone cannot ______ the problem of climate change.","options":["solution","solvable","solved","solve"],"answerIndex":3,"explanation":"Sau \"cannot\" cần động từ nguyên thể: \"solve a problem\" (giải quyết một vấn đề). \"solution\" là danh từ; \"solvable\" là tính từ; \"solved\" sai dạng sau động từ khuyết thiếu."},{"num":3,"question":"The engineers believe that the problem is ______ with existing technology.","options":["solve","solution","solvable","solved"],"answerIndex":2,"explanation":"Sau \"is\" cần tính từ chỉ khả năng: \"solvable\" (có thể giải quyết được). \"solved\" nghĩa là đã giải quyết xong nên mâu thuẫn với \"believe … with existing technology\"; hai phương án còn lại sai từ loại."},{"num":4,"question":"The lights in the corridor turn off ______ when nobody is there.","options":["automatic","automatically","automate","automation"],"answerIndex":1,"explanation":"Chỗ trống bổ nghĩa cho động từ \"turn off\" nên cần trạng từ: \"automatically\" (một cách tự động). \"automatic\" là tính từ; \"automate\" là động từ; \"automation\" là danh từ."},{"num":5,"question":"The building has an ______ system that controls the heating and the lights.","options":["automatically","automatic","automate","automation"],"answerIndex":1,"explanation":"Trước danh từ \"system\" cần tính từ: \"an automatic system\" (hệ thống tự động). \"automatically\" là trạng từ; \"automate\" là động từ; \"automation\" là danh từ."},{"num":6,"question":"A movement ______ switches the light on when someone walks past.","options":["sensor","landfill","leftover","recycler"],"answerIndex":0,"explanation":"\"a movement sensor\" (cảm biến chuyển động) là thiết bị bật đèn khi có người đi qua. \"landfill\" (bãi rác), \"leftover\" (đồ ăn thừa) và \"recycler\" (cơ sở tái chế) sai nghĩa hoàn toàn."},{"num":7,"question":"Remember to ______ the tap while you are brushing your teeth.","options":["throw away","rinse out","rush out","turn off"],"answerIndex":3,"explanation":"\"turn off the tap\" (khóa vòi nước) là hành động tiết kiệm nước. \"throw away\" (vứt bỏ), \"rinse out\" (tráng sạch) và \"rush out\" (lao vội ra ngoài) đều sai nghĩa với \"the tap\" ở đây."},{"num":8,"question":"The students found a very ______ way of reusing old car tyres.","options":["creation","creatively","creative","creator"],"answerIndex":2,"explanation":"Trước danh từ \"way\" cần tính từ: \"a creative way\" (một cách sáng tạo). \"creation/creator\" là danh từ; \"creatively\" là trạng từ."},{"num":9,"question":"She thinks ______ and always finds new uses for old things.","options":["creative","creation","creatively","creator"],"answerIndex":2,"explanation":"Chỗ trống bổ nghĩa cho động từ \"thinks\" nên cần trạng từ: \"think creatively\" (suy nghĩ sáng tạo). \"creative\" là tính từ; \"creation/creator\" là danh từ."},{"num":10,"question":"The ______ of a school garden gave students a place to compost their food waste.","options":["create","creative","creatively","creation"],"answerIndex":3,"explanation":"Chủ ngữ của \"gave\" cần danh từ: \"the creation of sth\" (việc tạo ra cái gì). \"create\" là động từ; \"creative\" là tính từ; \"creatively\" là trạng từ."},{"num":11,"question":"Almost all the packaging sold in this shop is ______.","options":["recyclable","recycling","recycle","recycler"],"answerIndex":0,"explanation":"Sau \"is\" cần tính từ: \"recyclable\" (có thể tái chế). \"recycling\" là danh từ chỉ hoạt động; \"recycle\" là động từ; \"recycler\" chỉ người/cơ sở tái chế."},{"num":12,"question":"The company is now the biggest ______ of glass in the whole country.","options":["recycling","recycler","recyclable","recycle"],"answerIndex":1,"explanation":"Sau \"the biggest\" và chỉ một công ty nên cần danh từ chỉ đơn vị thực hiện: \"recycler\" (cơ sở tái chế). \"recycling\" là hoạt động; \"recyclable\" là tính từ; \"recycle\" là động từ."},{"num":13,"question":"A single dirty carton can make a whole load of paper ______.","options":["contaminate","contaminated","contamination","contaminating"],"answerIndex":1,"explanation":"Cấu trúc \"make + tân ngữ + tính từ\" cần \"contaminated\" (bị nhiễm bẩn). \"contaminate\" là động từ nguyên thể; \"contamination\" là danh từ; \"contaminating\" mang nghĩa chủ động (gây nhiễm bẩn) nên không mô tả trạng thái của giấy."},{"num":14,"question":"The campaign was designed to ______ composting among people living in flats.","options":["promote","promotion","promoter","promoted"],"answerIndex":0,"explanation":"Sau \"designed to\" cần động từ nguyên thể: \"promote\" (thúc đẩy, khuyến khích). \"promotion\" là danh từ; \"promoter\" chỉ người; \"promoted\" sai dạng sau \"to\"."},{"num":15,"question":"Every tonne of compost means a tonne less waste going to ______.","options":["sensor","leftover","creation","landfill"],"answerIndex":3,"explanation":"\"go to landfill\" (bị đưa ra bãi chôn lấp) là collocation chuẩn khi nói về rác. \"sensor\" (cảm biến), \"leftover\" (đồ ăn thừa) và \"creation\" (sự tạo ra) sai nghĩa."},{"num":16,"question":"Instead of throwing ______ away, use them for the next day's lunch.","options":["sensors","solutions","leftovers","promoters"],"answerIndex":2,"explanation":"\"leftovers\" (thức ăn thừa) là thứ có thể dùng cho bữa trưa hôm sau. \"sensors\", \"solutions\" và \"promoters\" đều không phải thức ăn."}],"gapfill":[{"num":1,"sentence":"Please ______ your computer at the end of the lesson.","answer":"turn off"},{"num":2,"sentence":"The new bins have ______ that open the lid when you come close.","answer":"sensors"},{"num":3,"sentence":"______ of food waste produces a gas that can be burned as fuel.","answer":"Decomposition"},{"num":4,"sentence":"Two large ______ at the back of the garden take all our kitchen scraps.","answer":"compost piles"},{"num":5,"sentence":"Nearly all the paper used in our school now goes for ______.","answer":"recycling"},{"num":6,"sentence":"The doors are ______ and open as soon as you step in front of them.","answer":"automatic"},{"num":7,"sentence":"Even a small amount of oil can cause serious ______ of a whole batch of paper.","answer":"contamination"},{"num":8,"sentence":"Students were asked to ______ a poster about saving energy at home.","answer":"create"},{"num":9,"sentence":"No single law can ______ the problem of plastic waste.","answer":"solve"},{"num":10,"sentence":"The city spends a lot of money on the ______ of cycling.","answer":"promotion"}]},"7":{"title":"COMMUNICATION AND CULTURE/ CILL","words":[{"word":"impress","ipa":"/ɪmˈpres/","pos":"v.","meaning":"gây ấn tượng"},{"word":"impressive","ipa":"/ɪmˈpresɪv/","pos":"adj.","meaning":"ấn tượng"},{"word":"impression","ipa":"/ɪmˈpreʃn/","pos":"n.","meaning":"ấn tượng"},{"word":"predict","ipa":"/prɪˈdɪkt/","pos":"v.","meaning":"dự đoán"},{"word":"prediction","ipa":"/prɪˈdɪkʃn/","pos":"n.","meaning":"sự dự đoán"},{"word":"predictable","ipa":"/prɪˈdɪktəbl/","pos":"adj.","meaning":"có thể đoán trước"},{"word":"unpredictable","ipa":"/ˌʌnprɪˈdɪktəbl/","pos":"adj.","meaning":"không thể đoán trước"},{"word":"lead to","ipa":"/liːd tə/","pos":"phr.v","meaning":"dẫn đến"},{"word":"propose","ipa":"/prəˈpəʊz/","pos":"v.","meaning":"đề xuất"},{"word":"proposal","ipa":"/prəˈpəʊzl/","pos":"n.","meaning":"đề xuất"},{"word":"proposition","ipa":"/ˌprɒpəˈzɪʃn/","pos":"n.","meaning":"đề nghị; mệnh đề"},{"word":"judge","ipa":"/dʒʌdʒ/","pos":"v., n.","meaning":"đánh giá; giám khảo/thẩm phán"},{"word":"judgement","ipa":"/ˈdʒʌdʒmənt/","pos":"n.","meaning":"sự phán xét (chính tả khác)"},{"word":"festival","ipa":"/ˈfestɪvl/","pos":"n.","meaning":"lễ hội"},{"word":"sustainable","ipa":"/səˈsteɪnəbl/","pos":"adj.","meaning":"bền vững"},{"word":"sustain","ipa":"/səˈsteɪn/","pos":"v.","meaning":"duy trì"},{"word":"sustainability","ipa":"/səˌsteɪnəˈbɪləti/","pos":"n.","meaning":"tính bền vững"},{"word":"lantern","ipa":"/ˈlæntən/","pos":"n.","meaning":"đèn lồng"},{"word":"frame","ipa":"/freɪm/","pos":"n., v.","meaning":"khung; đóng khung"},{"word":"wildfire","ipa":"/ˈwaɪldfaɪə(r)/","pos":"n.","meaning":"cháy rừng"},{"word":"fascinating","ipa":"/ˈfæsɪneɪtɪŋ/","pos":"adj.","meaning":"hấp dẫn, lôi cuốn"},{"word":"fascinate","ipa":"/ˈfæsɪneɪt/","pos":"v.","meaning":"làm mê hoặc, cuốn hút"},{"word":"fascination","ipa":"/ˌfæsɪˈneɪʃn/","pos":"n.","meaning":"sự say mê, sức hấp dẫn"}],"mcq":[{"num":1,"question":"The lantern festival was one of the most ______ events I have ever seen.","options":["impress","impressive","impression","impressively"],"answerIndex":1,"explanation":"Sau \"the most\" và trước danh từ \"events\" cần tính từ: \"impressive\" (ấn tượng). \"impress\" là động từ; \"impression\" là danh từ; \"impressively\" là trạng từ."},{"num":2,"question":"The floating lanterns made a deep ______ on all the visitors.","options":["impression","impress","impressive","impressively"],"answerIndex":0,"explanation":"\"make an impression on sb\" (gây ấn tượng với ai) là cụm cố định, cần danh từ sau \"a deep\"."},{"num":3,"question":"Scientists' ______ about rising sea levels are slowly becoming reality.","options":["predict","predictable","predictions","unpredictable"],"answerIndex":2,"explanation":"Chủ ngữ số nhiều đi với \"are\" nên cần danh từ số nhiều: \"predictions\" (những dự đoán). \"predict\" là động từ; \"predictable/unpredictable\" là tính từ."},{"num":4,"question":"The weather in the mountains is completely ______, so take warm clothes with you.","options":["predictable","prediction","predict","unpredictable"],"answerIndex":3,"explanation":"Lời khuyên \"take warm clothes\" cho thấy thời tiết khó lường: \"unpredictable\" (không thể đoán trước). \"predictable\" trái nghĩa nên mâu thuẫn với lời khuyên; \"prediction\" là danh từ; \"predict\" là động từ."},{"num":5,"question":"The ending of the film was so ______ that I guessed it after ten minutes.","options":["unpredictable","predictable","prediction","predict"],"answerIndex":1,"explanation":"Chi tiết \"I guessed it after ten minutes\" chốt nghĩa \"predictable\" (dễ đoán). \"unpredictable\" trái nghĩa; \"prediction\" là danh từ; \"predict\" là động từ."},{"num":6,"question":"Releasing burning lanterns in dry weather can ______ serious wildfires.","options":["lead to","turn off","rinse out","throw away"],"answerIndex":0,"explanation":"\"lead to sth\" (dẫn đến điều gì) diễn tả quan hệ nguyên nhân – kết quả. \"turn off\" (tắt), \"rinse out\" (tráng sạch) và \"throw away\" (vứt bỏ) đều sai nghĩa với \"serious wildfires\"."},{"num":7,"question":"The committee accepted her ______ to use bamboo frames instead of plastic ones.","options":["propose","proposition","proposed","proposal"],"answerIndex":3,"explanation":"Sau \"her\" và làm tân ngữ của \"accepted\" cần danh từ: \"a proposal to do sth\" (đề xuất làm gì). \"propose/proposed\" là động từ; \"proposition\" thường mang nghĩa lời đề nghị trong kinh doanh hoặc mệnh đề lô-gic, không đi với \"to use\" theo cách này."},{"num":8,"question":"I would like to ______ a simple solution to this problem.","options":["proposal","proposition","propose","proposed"],"answerIndex":2,"explanation":"Sau \"would like to\" cần động từ nguyên thể: \"propose a solution\" (đề xuất một giải pháp). \"proposal/proposition\" là danh từ; \"proposed\" sai dạng sau \"to\"."},{"num":9,"question":"In my ______, the festival should be held well away from the forest.","options":["judgement","judge","judging","judged"],"answerIndex":0,"explanation":"\"in my judgement\" (theo đánh giá của tôi) là cụm cố định, cần danh từ. \"judge\" là danh từ chỉ người hoặc động từ; \"judging/judged\" là dạng động từ."},{"num":10,"question":"Bamboo is a ______ material because it grows back very quickly.","options":["sustain","sustainable","sustainability","sustainably"],"answerIndex":1,"explanation":"Trước danh từ \"material\" cần tính từ: \"a sustainable material\" (vật liệu bền vững), khớp với \"grows back very quickly\". \"sustain\" là động từ; \"sustainability\" là danh từ; \"sustainably\" là trạng từ."},{"num":11,"question":"The report examines the ______ of very large music festivals.","options":["sustainable","sustain","sustainability","sustainably"],"answerIndex":2,"explanation":"Sau \"the\" và làm tân ngữ của \"examines\" cần danh từ: \"sustainability\" (tính bền vững). \"sustainable\" là tính từ; \"sustain\" là động từ; \"sustainably\" là trạng từ."},{"num":12,"question":"The small island cannot ______ so many visitors during the summer months.","options":["sustainable","sustainability","sustainably","sustain"],"answerIndex":3,"explanation":"Sau \"cannot\" cần động từ nguyên thể: \"sustain\" (duy trì, gánh được). \"sustainable\" là tính từ; \"sustainability\" là danh từ; \"sustainably\" là trạng từ."},{"num":13,"question":"Thousands of paper ______ were released into the night sky at the end of the ceremony.","options":["frames","lanterns","festivals","judgements"],"answerIndex":1,"explanation":"\"paper lanterns\" (đèn lồng giấy) là thứ được thả lên trời. \"frames\" (khung), \"festivals\" (lễ hội) và \"judgements\" (sự phán xét) không phải vật thả lên bầu trời."},{"num":14,"question":"The kite has a light bamboo ______ covered with brightly coloured paper.","options":["lantern","wildfire","festival","frame"],"answerIndex":3,"explanation":"\"a bamboo frame\" (khung tre) là bộ khung của con diều. \"lantern\" (đèn lồng), \"wildfire\" (cháy rừng) và \"festival\" (lễ hội) sai nghĩa."},{"num":15,"question":"Dry weather and strong winds have caused several ______ in the region this summer.","options":["lanterns","frames","wildfires","proposals"],"answerIndex":2,"explanation":"\"wildfires\" (các vụ cháy rừng) là hậu quả của \"dry weather and strong winds\". \"lanterns\", \"frames\" và \"proposals\" không phải hiện tượng do thời tiết gây ra."},{"num":16,"question":"The exhibition about traditional crafts was absolutely ______.","options":["fascinating","fascinated","fascination","fascinate"],"answerIndex":0,"explanation":"Chủ ngữ là sự vật (\"the exhibition\") gây ra cảm giác nên cần tính từ chủ động \"fascinating\" (hấp dẫn). \"fascinated\" dùng cho người cảm thấy say mê; \"fascination\" là danh từ; \"fascinate\" là động từ."}],"gapfill":[{"num":1,"sentence":"Nobody can ______ exactly when the next big storm will arrive.","answer":"predict"},{"num":2,"sentence":"Burning rubbish in very dry weather can ______ a serious fire.","answer":"lead to"},{"num":3,"sentence":"A single spark started the ______ that destroyed thousands of trees.","answer":"wildfire"},{"num":4,"sentence":"The visitors were deeply ______ by the beauty of the old town.","answer":"impressed"},{"num":5,"sentence":"Our teacher ______ a new way of collecting waste paper in class.","answer":"proposed"},{"num":6,"sentence":"You should never ______ a book by its cover.","answer":"judge"},{"num":7,"sentence":"The lantern ______ takes place on the fifteenth night of the first lunar month.","answer":"festival"},{"num":8,"sentence":"Solar power is a ______ source of energy for the whole village.","answer":"sustainable"},{"num":9,"sentence":"Her ______ with insects began when she was a small child.","answer":"fascination"},{"num":10,"sentence":"The small farm can no longer ______ the whole family.","answer":"sustain"}]}},"4":{"1":{"title":"GETTING STARTED","words":[{"word":"urban","ipa":"/ˈɜːbən/","pos":"adj","meaning":"thuộc đô thị"},{"word":"urbanize","ipa":"/ˈɜːbənaɪz/","pos":"v","meaning":"đô thị hóa"},{"word":"urbanization","ipa":"/ˌɜːbənaɪˈzeɪʃn/","pos":"n","meaning":"sự đô thị hóa"},{"word":"shopping facilities","ipa":"/ˈʃɒpɪŋ fəˈsɪlətiz/","pos":"n (plural)","meaning":"cơ sở mua sắm"},{"word":"facility","ipa":"/fəˈsɪləti/","pos":"n","meaning":"cơ sở; tiện ích"},{"word":"convenience","ipa":"/kənˈviːniəns/","pos":"n","meaning":"sự tiện lợi"},{"word":"convenient","ipa":"/kənˈviːniənt/","pos":"adj","meaning":"tiện lợi"},{"word":"conveniently","ipa":"/kənˈviːniəntli/","pos":"adv","meaning":"một cách tiện lợi"},{"word":"high-rise","ipa":"/ˈhaɪ raɪz/","pos":"adj","meaning":"cao tầng"},{"word":"high-rise (noun)","ipa":"/ˈhaɪ raɪz/","pos":"n","meaning":"tòa nhà cao tầng"},{"word":"resident","ipa":"/ˈrezɪdənt/","pos":"n","meaning":"cư dân"},{"word":"residential","ipa":"/ˌrezɪˈdenʃl/","pos":"adj","meaning":"thuộc khu dân cư"},{"word":"residency","ipa":"/ˈrezɪdənsi/","pos":"n","meaning":"nơi cư trú"}],"mcq":[{"num":1,"question":"More than half of the world's population now lives in ______ areas.","options":["urban","urbanize","urbanization","urbanized"],"answerIndex":0,"explanation":"Trước danh từ \"areas\" cần tính từ: \"urban areas\" (khu vực đô thị). \"urbanize\" là động từ; \"urbanization\" là danh từ; \"urbanized\" là phân từ chỉ trạng thái đã đô thị hóa, không dùng trong cụm cố định này."},{"num":2,"question":"Rapid ______ has completely changed the landscape around many Asian cities.","options":["urban","urbanization","urbanize","urbanized"],"answerIndex":1,"explanation":"Chủ ngữ của \"has changed\" cần danh từ: \"urbanization\" (sự đô thị hóa). \"urban\" là tính từ; \"urbanize/urbanized\" là động từ."},{"num":3,"question":"The whole area began to ______ soon after the new factory opened.","options":["urban","urbanization","urbanized","urbanize"],"answerIndex":3,"explanation":"Sau \"began to\" cần động từ nguyên thể: \"urbanize\" (đô thị hóa). \"urban\" là tính từ; \"urbanization\" là danh từ; \"urbanized\" sai dạng sau \"to\"."},{"num":4,"question":"The new district has excellent shopping ______ as well as two large parks.","options":["residents","conveniences","facilities","residencies"],"answerIndex":2,"explanation":"\"shopping facilities\" (cơ sở mua sắm) là cụm cố định. \"residents\" chỉ cư dân; \"conveniences\" và \"residencies\" không kết hợp với \"shopping\" theo nghĩa này."},{"num":5,"question":"The sports ______ near my house has a swimming pool and a large gym.","options":["resident","convenience","residency","facility"],"answerIndex":3,"explanation":"\"a sports facility\" (cơ sở thể thao) là nơi có bể bơi và phòng tập. \"resident\" chỉ người; \"convenience\" (sự tiện lợi) và \"residency\" (nơi cư trú) sai nghĩa."},{"num":6,"question":"Many people move to the centre for the ______ of living close to their workplace.","options":["convenient","convenience","conveniently","conveniences"],"answerIndex":1,"explanation":"Sau \"the\" và trước \"of\" cần danh từ không đếm được: \"the convenience of doing sth\" (sự tiện lợi của việc gì). \"convenient\" là tính từ; \"conveniently\" là trạng từ; \"conveniences\" số nhiều mang nghĩa các tiện nghi cụ thể."},{"num":7,"question":"The new bus route is very ______ for students living in the suburbs.","options":["convenience","conveniently","convenient","conveniences"],"answerIndex":2,"explanation":"Sau \"is very\" cần tính từ: \"convenient\" (tiện lợi). \"convenience/conveniences\" là danh từ; \"conveniently\" là trạng từ."},{"num":8,"question":"The supermarket is ______ located just opposite the bus station.","options":["conveniently","convenient","convenience","conveniences"],"answerIndex":0,"explanation":"Chỗ trống bổ nghĩa cho phân từ \"located\" nên cần trạng từ: \"conveniently located\" (nằm ở vị trí thuận tiện)."},{"num":9,"question":"Thousands of families in the city now live in ______ blocks of flats.","options":["high-rise","convenient","urban","gradual"],"answerIndex":0,"explanation":"\"high-rise blocks of flats\" (chung cư cao tầng) là cụm chuẩn. \"convenient\" (tiện lợi), \"urban\" (thuộc đô thị) và \"gradual\" (dần dần) không mô tả được chiều cao của tòa nhà."},{"num":10,"question":"From the roof of the ______, you can see the whole city and the river.","options":["facility","convenience","high-rise","residency"],"answerIndex":2,"explanation":"Ở đây \"high-rise\" được dùng như danh từ chỉ tòa nhà cao tầng, nơi có mái để ngắm cảnh. \"facility\" (cơ sở), \"convenience\" (sự tiện lợi) và \"residency\" (nơi cư trú) không phải tòa nhà cao tầng cụ thể."},{"num":11,"question":"Local ______ complained about the noise from the building site.","options":["facilities","residents","conveniences","residencies"],"answerIndex":1,"explanation":"Chủ thể biết phàn nàn phải là người: \"residents\" (cư dân). \"facilities\", \"conveniences\" và \"residencies\" đều không chỉ người."},{"num":12,"question":"This is a quiet ______ area with no shops or factories at all.","options":["resident","residency","reside","residential"],"answerIndex":3,"explanation":"Trước danh từ \"area\" cần tính từ: \"a residential area\" (khu dân cư). \"resident\" là danh từ chỉ người; \"residency\" là danh từ; \"reside\" là động từ."}],"gapfill":[{"num":1,"sentence":"Nearly forty per cent of Viet Nam's people now live in ______ areas.","answer":"urban"},{"num":2,"sentence":"Rapid ______ has brought both benefits and problems to the country.","answer":"urbanization"},{"num":3,"sentence":"The whole region was ______ very quickly after the new road was built.","answer":"urbanized"},{"num":4,"sentence":"Our neighbourhood has good sports and shopping ______.","answer":"facilities"},{"num":5,"sentence":"Every ______ of the building is given a parking space.","answer":"resident"},{"num":6,"sentence":"The flats are in a quiet ______ area far from the main road.","answer":"residential"},{"num":7,"sentence":"She applied for permanent ______ in Australia last year.","answer":"residency"},{"num":8,"sentence":"The hotel is ______ situated next to the railway station.","answer":"conveniently"},{"num":9,"sentence":"People value the ______ of having a supermarket nearby.","answer":"convenience"},{"num":10,"sentence":"He lives on the twentieth floor of a ______ building.","answer":"high-rise"}]},"2":{"title":"LANGUAGE","words":[{"word":"pronounce","ipa":"/prəˈnaʊns/","pos":"v","meaning":"phát âm"},{"word":"pronunciation","ipa":"/prəˌnʌnsiˈeɪʃn/","pos":"n","meaning":"sự phát âm"},{"word":"afford","ipa":"/əˈfɔːd/","pos":"v","meaning":"có khả năng chi trả"},{"word":"affordable","ipa":"/əˈfɔːdəbl/","pos":"adj","meaning":"giá phải chăng"},{"word":"affordability","ipa":"/əˌfɔːdəˈbɪləti/","pos":"n","meaning":"tính hợp túi tiền"},{"word":"expand","ipa":"/ɪkˈspænd/","pos":"v","meaning":"mở rộng"},{"word":"expansion","ipa":"/ɪkˈspænʃn/","pos":"n","meaning":"sự mở rộng"},{"word":"expansive","ipa":"/ɪkˈspænsɪv/","pos":"adj","meaning":"rộng lớn"},{"word":"employ","ipa":"/ɪmˈplɔɪ/","pos":"v","meaning":"thuê, tuyển dụng"},{"word":"employee","ipa":"/ˌemplɔɪˈiː/","pos":"n","meaning":"nhân viên"},{"word":"employer","ipa":"/ɪmˈplɔɪə(r)/","pos":"n","meaning":"người tuyển dụng"},{"word":"employment","ipa":"/ɪmˈplɔɪmənt/","pos":"n","meaning":"việc làm"},{"word":"unemployed","ipa":"/ˌʌnɪmˈplɔɪd/","pos":"adj","meaning":"thất nghiệp"},{"word":"unemployment","ipa":"/ˌʌnɪmˈplɔɪmənt/","pos":"n","meaning":"sự thất nghiệp"},{"word":"seek =look for","ipa":"/siːk/","pos":"v","meaning":"tìm kiếm"},{"word":"Seek- sought-sought","ipa":"/ˈsiːk/  /sɔːt/","pos":"n","meaning":""},{"word":"migrate","ipa":"/maɪˈɡreɪt/","pos":"v","meaning":"di cư"},{"word":"migration","ipa":"/maɪˈɡreɪʃn/","pos":"n","meaning":"sự di cư"},{"word":"migrant","ipa":"/ˈmaɪɡrənt/","pos":"n","meaning":"người di cư"},{"word":"migratory","ipa":"/ˈmaɪɡrətri/","pos":"adj","meaning":"thuộc di cư"},{"word":"housing","ipa":"/ˈhaʊzɪŋ/","pos":"n","meaning":"nhà ở"},{"word":"house (verb)","ipa":"/haʊz/","pos":"v","meaning":"cung cấp chỗ ở"},{"word":"household","ipa":"/ˈhaʊshəʊld/","pos":"n","meaning":"hộ gia đình"},{"word":"shortage","ipa":"/ˈʃɔːtɪdʒ/","pos":"n","meaning":"sự thiếu hụt"},{"word":"short","ipa":"/ʃɔːt/","pos":"adj","meaning":"ngắn; thiếu"},{"word":"shorten","ipa":"/ˈʃɔːtn/","pos":"v","meaning":"làm ngắn lại"},{"word":"shortfall","ipa":"/ˈʃɔːtfɔːl/","pos":"n","meaning":"sự thiếu hụt (thiếu so với mức cần thiết)"},{"word":"in short supply (collocation)","ipa":"/ɪn ʃɔːt səˈplaɪ/","pos":"phr","meaning":"khan hiếm"}],"mcq":[{"num":1,"question":"Her English ______ has improved a great deal since she moved to London.","options":["pronounce","pronounced","pronunciation","pronouncing"],"answerIndex":2,"explanation":"Chủ ngữ của \"has improved\" cần danh từ: \"pronunciation\" (cách phát âm). Ba phương án còn lại đều là dạng động từ."},{"num":2,"question":"Could you show me how to ______ this word correctly?","options":["pronunciation","pronounce","pronounced","pronouncing"],"answerIndex":1,"explanation":"Sau \"how to\" cần động từ nguyên thể: \"pronounce\" (phát âm). \"pronunciation\" là danh từ; \"pronounced/pronouncing\" sai dạng sau \"to\"."},{"num":3,"question":"Many young couples simply cannot ______ a flat in the city centre.","options":["afford","affordable","affordability","afforded"],"answerIndex":0,"explanation":"Sau \"cannot\" cần động từ nguyên thể: \"afford sth\" (đủ tiền mua cái gì). \"affordable\" là tính từ; \"affordability\" là danh từ; \"afforded\" sai dạng sau động từ khuyết thiếu."},{"num":4,"question":"The city needs to build much more ______ housing for low-income families.","options":["afford","affordability","afforded","affordable"],"answerIndex":3,"explanation":"Trước danh từ \"housing\" cần tính từ: \"affordable housing\" (nhà ở giá phải chăng). \"afford/afforded\" là động từ; \"affordability\" là danh từ."},{"num":5,"question":"The report examines the ______ of housing in ten large cities.","options":["affordability","affordable","afford","afforded"],"answerIndex":0,"explanation":"Sau \"the\" và trước \"of\" cần danh từ: \"the affordability of housing\" (mức độ hợp túi tiền của nhà ở). \"affordable\" là tính từ; \"afford/afforded\" là động từ."},{"num":6,"question":"The city plans to ______ its underground railway network by 2030.","options":["expansion","expand","expansive","expanded"],"answerIndex":1,"explanation":"Sau \"plans to\" cần động từ nguyên thể: \"expand\" (mở rộng). \"expansion\" là danh từ; \"expansive\" là tính từ; \"expanded\" sai dạng sau \"to\"."},{"num":7,"question":"The rapid ______ of the city has swallowed up several nearby villages.","options":["expand","expansive","expanded","expansion"],"answerIndex":3,"explanation":"Chủ ngữ của \"has swallowed up\" cần danh từ: \"the expansion of sth\" (sự mở rộng của cái gì). \"expand/expanded\" là động từ; \"expansive\" là tính từ."},{"num":8,"question":"The steel factory is the largest ______ in the whole province.","options":["employee","employment","employer","unemployed"],"answerIndex":2,"explanation":"Một nhà máy thuê nhiều lao động nên là \"employer\" (đơn vị tuyển dụng). \"employee\" là nhân viên; \"employment\" là việc làm; \"unemployed\" là tính từ."},{"num":9,"question":"The company now has more than two thousand ______ in three cities.","options":["employers","employment","employees","unemployment"],"answerIndex":2,"explanation":"Công ty sở hữu số nhân viên nên cần \"employees\" (nhân viên). \"employers\" là người sử dụng lao động; \"employment/unemployment\" là danh từ trừu tượng không đếm được."},{"num":10,"question":"______ rose sharply in the province after several factories closed down.","options":["Unemployment","Unemployed","Employment","Employ"],"answerIndex":0,"explanation":"Việc nhà máy đóng cửa làm tăng \"unemployment\" (tỷ lệ thất nghiệp). \"Employment\" (việc làm) sẽ mâu thuẫn với \"factories closed down\"; \"Unemployed\" là tính từ; \"Employ\" là động từ."},{"num":11,"question":"He has been ______ since the factory closed at the end of last year.","options":["unemployment","unemployed","employment","employ"],"answerIndex":1,"explanation":"Sau \"has been\" cần tính từ mô tả tình trạng của người: \"unemployed\" (thất nghiệp). \"unemployment/employment\" là danh từ; \"employ\" là động từ."},{"num":12,"question":"Thousands of young people move to the city every year to ______ better jobs.","options":["sought","seeking","seeks","seek"],"answerIndex":3,"explanation":"Sau \"to\" chỉ mục đích cần động từ nguyên thể: \"seek better jobs\" (tìm kiếm việc làm tốt hơn). \"sought\" là quá khứ; \"seeking\" là V-ing; \"seeks\" là dạng chia ngôi thứ ba."},{"num":13,"question":"Every year thousands of workers ______ from the countryside to the big cities.","options":["migrate","migration","migrant","migratory"],"answerIndex":0,"explanation":"Câu ở thì hiện tại đơn với chủ ngữ số nhiều cần động từ: \"migrate\" (di cư). \"migration\" và \"migrant\" là danh từ; \"migratory\" là tính từ."},{"num":14,"question":"The ______ of young people to the cities has left many villages half empty.","options":["migrate","migration","migrant","migratory"],"answerIndex":1,"explanation":"Chủ ngữ của \"has left\" cần danh từ trừu tượng: \"the migration of sb\" (sự di cư của ai). \"migrate\" là động từ; \"migrant\" chỉ người; \"migratory\" là tính từ."},{"num":15,"question":"The government has promised to build much more low-cost ______.","options":["house","household","houses","housing"],"answerIndex":3,"explanation":"\"low-cost housing\" (nhà ở giá rẻ) dùng danh từ không đếm được chỉ nhà ở nói chung. \"house/houses\" là danh từ đếm được và không đi với \"much more\"; \"household\" nghĩa là hộ gia đình."},{"num":16,"question":"There is a serious ______ of clean water in several urban districts.","options":["short","shorten","shortage","shortfall"],"answerIndex":2,"explanation":"\"a shortage of sth\" (sự thiếu hụt cái gì) là cụm chuẩn khi nói về nước, lương thực, nhà ở. \"short\" là tính từ; \"shorten\" là động từ; \"shortfall\" chỉ phần thiếu hụt so với con số dự tính (thường về tiền hoặc số lượng), không đi với \"clean water\"."}],"gapfill":[{"num":1,"sentence":"Skilled workers are in ______ in this area, so wages are rising quickly.","answer":"short supply"},{"num":2,"sentence":"Most ______ in the village still have their own vegetable garden.","answer":"households"},{"num":3,"sentence":"Many ______ send money home to their families every month.","answer":"migrants"},{"num":4,"sentence":"Some birds are ______ and fly south every winter.","answer":"migratory"},{"num":5,"sentence":"She ______ the word slowly so that everyone in the class could hear it.","answer":"pronounced"},{"num":6,"sentence":"The company is trying to ______ the working week to four days.","answer":"shorten"},{"num":7,"sentence":"He has been ______ for six months and is still looking for work.","answer":"unemployed"},{"num":8,"sentence":"The new factory will create ______ for three hundred local people.","answer":"employment"},{"num":9,"sentence":"He ______ advice from his teacher before choosing a university.","answer":"sought"},{"num":10,"sentence":"The view from the hilltop is ______ and takes in the whole valley.","answer":"expansive"}]},"3":{"title":"READING","words":[{"word":"exhibition","ipa":"/ˌeksɪˈbɪʃn/","pos":"n","meaning":"cuộc triển lãm"},{"word":"bring back","ipa":"/brɪŋ bæk/","pos":"phrasal v","meaning":"mang lại, gợi nhớ lại"},{"word":"resident","ipa":"/ˈrezɪdənt/","pos":"n","meaning":"cư dân"},{"word":"reside","ipa":"/rɪˈzaɪd/","pos":"v","meaning":"sinh sống, cư trú"},{"word":"residential","ipa":"/ˌrezɪˈdenʃl/","pos":"adj","meaning":"thuộc khu dân cư"},{"word":"residency","ipa":"/ˈrezɪdənsi/","pos":"n","meaning":"nơi cư trú"},{"word":"date back","ipa":"/deɪt bæk/","pos":"phrasal v","meaning":"có từ (thời điểm nào đó trong quá khứ)"},{"word":"trade","ipa":"/treɪd/","pos":"n, v","meaning":"thương mại, buôn bán"},{"word":"craft","ipa":"/krɑːft/","pos":"n","meaning":"nghề thủ công, đồ thủ công"},{"word":"afford","ipa":"/əˈfɔːd/","pos":"v","meaning":"có đủ khả năng (chi trả )"},{"word":"get around","ipa":"/ɡet əˈraʊnd/","pos":"phrasal v","meaning":"di chuyển, đi lại (trong một khu vực)"},{"word":"colonial","ipa":"/kəˈləʊniəl/","pos":"adj","meaning":"(thuộc về) thời thuộc địa"},{"word":"colony","ipa":"/ˈkɒləni/","pos":"n","meaning":"thuộc địa"},{"word":"colonise","ipa":"/ˈkɒlənaɪz/","pos":"v","meaning":"chiếm làm thuộc địa"},{"word":"colonisation","ipa":"/ˌkɒlənaɪˈzeɪʃn/","pos":"n","meaning":"sự thực dân hóa"},{"word":"gradually","ipa":"/ˈɡrædʒuəli/","pos":"adv","meaning":"dần dần, từ từ"},{"word":"gradual","ipa":"/ˈɡrædʒuəl/","pos":"adj","meaning":"dần dần, từng bước"},{"word":"infrastructure","ipa":"/ˈɪnfrəstrʌktʃə(r)/","pos":"n","meaning":"cơ sở hạ tầng"},{"word":"modernise","ipa":"/ˈmɒdənaɪz/","pos":"v","meaning":"hiện đại hóa"},{"word":"modern","ipa":"/ˈmɒdn/","pos":"adj","meaning":"hiện đại"},{"word":"modernisation","ipa":"/ˌmɒdənaɪˈzeɪʃn/","pos":"n","meaning":"sự hiện đại hóa"},{"word":"urbanisation","ipa":"/ˌɜːbənaɪˈzeɪʃn/","pos":"n","meaning":"sự đô thị hóa"},{"word":"urban","ipa":"/ˈɜːbən/","pos":"adj","meaning":"thuộc đô thị"},{"word":"urbanise","ipa":"/ˈɜːbənaɪz/","pos":"v","meaning":"đô thị hóa"},{"word":"concern","ipa":"/kənˈsɜːn/","pos":"n, v","meaning":"mối quan tâm / liên quan đến"}],"mcq":[{"num":1,"question":"The photo ______ shows how the city looked a hundred years ago.","options":["infrastructure","colony","exhibition","craft"],"answerIndex":2,"explanation":"\"a photo exhibition\" (triển lãm ảnh) là nơi trưng bày hình ảnh. \"infrastructure\" (cơ sở hạ tầng), \"colony\" (thuộc địa) và \"craft\" (nghề thủ công) sai nghĩa."},{"num":2,"question":"The old photographs ______ back memories of her childhood in the old quarter.","options":["dated","brought","got","resided"],"answerIndex":1,"explanation":"\"bring back memories\" (gợi lại kỷ niệm) là collocation cố định với \"back\" có sẵn trong câu. \"date back\" nói về mốc thời gian; \"get back\" và \"reside back\" sai nghĩa ở đây."},{"num":3,"question":"About two million people ______ in the old quarter and the districts around it.","options":["reside","resident","residential","residency"],"answerIndex":0,"explanation":"Câu cần động từ chính: \"reside in\" (sinh sống tại). \"resident\" và \"residency\" là danh từ; \"residential\" là tính từ."},{"num":4,"question":"The ______ of the building share a small garden at the back.","options":["reside","residential","residency","residents"],"answerIndex":3,"explanation":"Chủ ngữ số nhiều chỉ người cần danh từ: \"residents\" (cư dân). \"reside\" là động từ; \"residential\" là tính từ; \"residency\" là danh từ trừu tượng."},{"num":5,"question":"This temple ______ back to the fifteenth century.","options":["dates","brings","gets","resides"],"answerIndex":0,"explanation":"\"date back to + mốc thời gian\" (có từ thời…) là cụm cố định. \"bring back\" nghĩa là gợi lại; \"get back\" là quay lại; \"reside back\" không tồn tại."},{"num":6,"question":"The port grew rich on the ______ in silk, tea and spices.","options":["craft","colony","trade","concern"],"answerIndex":2,"explanation":"\"the trade in sth\" (việc buôn bán mặt hàng gì) là cụm chuẩn. \"craft\" (nghề thủ công), \"colony\" (thuộc địa) và \"concern\" (mối lo ngại) không đi với \"in silk, tea and spices\"."},{"num":7,"question":"Traditional ______ such as silk weaving are still practised in these streets.","options":["colonies","crafts","exhibitions","concerns"],"answerIndex":1,"explanation":"Dệt lụa là một nghề thủ công nên cần \"crafts\" (các nghề thủ công). \"colonies\" (thuộc địa), \"exhibitions\" (triển lãm) và \"concerns\" (mối lo ngại) sai nghĩa."},{"num":8,"question":"Few local families can ______ the high rents in the old quarter today.","options":["affordable","affordability","afforded","afford"],"answerIndex":3,"explanation":"Sau \"can\" cần động từ nguyên thể: \"afford the rents\" (đủ tiền trả tiền thuê). \"affordable\" là tính từ; \"affordability\" là danh từ; \"afforded\" sai dạng."},{"num":9,"question":"It is easy to ______ the old quarter on foot or by bicycle.","options":["get around","bring back","date back","reside in"],"answerIndex":0,"explanation":"\"get around a place\" (đi lại trong một khu vực) đúng nghĩa với \"on foot or by bicycle\". \"bring back\" (gợi lại), \"date back\" (có từ thời) và \"reside in\" (sinh sống tại) đều sai nghĩa với \"easy to … on foot\"."},{"num":10,"question":"Many ______ buildings from the French period are still standing today.","options":["colony","colonial","colonise","colonisation"],"answerIndex":1,"explanation":"Trước danh từ \"buildings\" cần tính từ: \"colonial buildings\" (công trình thời thuộc địa). \"colony/colonisation\" là danh từ; \"colonise\" là động từ."},{"num":11,"question":"The ______ of the region began in the middle of the nineteenth century.","options":["colonial","colony","colonisation","colonise"],"answerIndex":2,"explanation":"Chủ ngữ của \"began\" cần danh từ trừu tượng chỉ quá trình: \"the colonisation of sth\" (sự thực dân hóa). \"colonial\" là tính từ; \"colony\" chỉ vùng đất thuộc địa; \"colonise\" là động từ."},{"num":12,"question":"There has been a/an ______ change in the character of the neighbourhood.","options":["colonial","residential","urban","gradual"],"answerIndex":3,"explanation":"Trước danh từ \"change\" cần tính từ chỉ tốc độ: \"a gradual change\" (sự thay đổi dần dần). \"colonial\", \"residential\" và \"urban\" mô tả loại khu vực hoặc thời kỳ, không mô tả tốc độ thay đổi."},{"num":13,"question":"Roads, bridges and water pipes are all part of a city's ______.","options":["exhibition","craft","infrastructure","concern"],"answerIndex":2,"explanation":"\"infrastructure\" (cơ sở hạ tầng) bao gồm đường sá, cầu cống và đường ống nước. \"exhibition\", \"craft\" và \"concern\" sai nghĩa hoàn toàn."},{"num":14,"question":"The city plans to ______ its old and overcrowded bus system.","options":["modern","modernisation","modernised","modernise"],"answerIndex":3,"explanation":"Sau \"plans to\" cần động từ nguyên thể: \"modernise\" (hiện đại hóa). \"modern\" là tính từ; \"modernisation\" là danh từ; \"modernised\" sai dạng sau \"to\"."},{"num":15,"question":"The ______ of the railway will take at least five more years.","options":["modernisation","modernise","modern","modernised"],"answerIndex":0,"explanation":"Chủ ngữ của \"will take\" cần danh từ: \"the modernisation of sth\" (việc hiện đại hóa cái gì). \"modernise\" là động từ; \"modern\" là tính từ; \"modernised\" là phân từ."},{"num":16,"question":"Traffic noise is a growing ______ for people living in the city centre.","options":["craft","concern","colony","exhibition"],"answerIndex":1,"explanation":"\"a growing concern\" (mối lo ngại ngày càng lớn) đúng nghĩa với tiếng ồn giao thông. \"craft\" (nghề thủ công), \"colony\" (thuộc địa) và \"exhibition\" (triển lãm) sai nghĩa."}],"gapfill":[{"num":1,"sentence":"The city is investing heavily in new roads and other ______.","answer":"infrastructure"},{"num":2,"sentence":"Some of the houses in this street ______ to the eighteenth century.","answer":"date back"},{"num":3,"sentence":"The museum is holding an ______ of old maps and photographs.","answer":"exhibition"},{"num":4,"sentence":"Viet Nam was a French ______ for almost a hundred years.","answer":"colony"},{"num":5,"sentence":"Tourists can easily ______ the old town by bicycle or on foot.","answer":"get around"},{"num":6,"sentence":"Rapid ______ has caused a shortage of housing in many large cities.","answer":"urbanisation"},{"num":7,"sentence":"Over fifty years the village has ______ grown into a small town.","answer":"gradually"},{"num":8,"sentence":"Local people are ______ about the loss of green space in the area.","answer":"concerned"},{"num":9,"sentence":"Silk weaving and pottery are traditional ______ of this region.","answer":"crafts"},{"num":10,"sentence":"The old market has been replaced by a ______ shopping centre.","answer":"modern"}]},"4":{"title":"SPEAKING","words":[{"word":"wet market","ipa":"/ˌwet ˈmɑːkɪt/","pos":"n.phr","meaning":"chợ truyền thống"},{"word":"empty road","ipa":"/ˌempti ˈrəʊd/","pos":"n.phr","meaning":"con đường vắng"},{"word":"convenient","ipa":"/kənˈviːniənt/","pos":"adj","meaning":"thuận tiện"},{"word":"convenience","ipa":"/kənˈviːniəns/","pos":"n","meaning":"sự thuận tiện"},{"word":"conveniently","ipa":"/kənˈviːniəntli/","pos":"adv","meaning":"một cách thuận tiện"},{"word":"inconvenience","ipa":"/ˌɪnkənˈviːniəns/","pos":"n","meaning":"sự bất tiện"},{"word":"inconvenient","ipa":"/ˌɪnkənˈviːniənt/","pos":"adj","meaning":"bất tiện"},{"word":"inconveniently","ipa":"/ˌɪnkənˈviːniəntli/","pos":"adv","meaning":"một cách bất tiện"},{"word":"high-rise building","ipa":"/ˌhaɪ raɪz ˈbɪldɪŋ/","pos":"n.phr","meaning":"tòa nhà cao tầng"},{"word":"low-rise building","ipa":"/ˌləʊ raɪz ˈbɪldɪŋ/","pos":"n.phr","meaning":"tòa nhà thấp tầng"}],"mcq":[{"num":1,"question":"Living near the station is very ______ for people who work in the city centre.","options":["convenient","convenience","conveniently","inconvenient"],"answerIndex":0,"explanation":"Sau \"is very\" cần tính từ, và việc ở gần nhà ga là điều thuận lợi cho người làm việc ở trung tâm nên chọn \"convenient\" (tiện lợi). \"inconvenient\" trái nghĩa với ngữ cảnh; \"convenience\" là danh từ; \"conveniently\" là trạng từ."},{"num":2,"question":"The bus stop was moved to a very ______ place, ten minutes' walk from the village.","options":["convenient","inconvenience","inconveniently","inconvenient"],"answerIndex":3,"explanation":"Chi tiết \"ten minutes' walk from the village\" cho thấy bất tiện nên cần tính từ \"inconvenient\". \"convenient\" trái nghĩa; \"inconvenience\" là danh từ; \"inconveniently\" là trạng từ."},{"num":3,"question":"Shoppers value the ______ of having everything under one roof.","options":["convenient","conveniently","convenience","inconvenience"],"answerIndex":2,"explanation":"Sau \"the\" và trước \"of\" cần danh từ mang nghĩa tích cực: \"the convenience of doing sth\" (sự tiện lợi khi làm gì). \"inconvenience\" trái nghĩa với \"value\"; \"convenient\" là tính từ; \"conveniently\" là trạng từ."},{"num":4,"question":"We apologise for the ______ caused by the road works in front of the school.","options":["inconvenient","inconvenience","convenience","convenient"],"answerIndex":1,"explanation":"\"apologise for the inconvenience\" (xin lỗi vì sự bất tiện) là cụm cố định, cần danh từ mang nghĩa tiêu cực. \"convenience\" trái nghĩa; \"inconvenient/convenient\" là tính từ."},{"num":5,"question":"The new school is ______ situated halfway between the two villages.","options":["convenient","convenience","conveniently","inconveniently"],"answerIndex":2,"explanation":"Chỗ trống bổ nghĩa cho phân từ \"situated\" nên cần trạng từ, và vị trí giữa hai làng là thuận tiện: \"conveniently situated\". \"inconveniently\" trái nghĩa; \"convenient\" là tính từ; \"convenience\" là danh từ."},{"num":6,"question":"The car park is ______ placed on the far side of the river.","options":["inconvenient","inconveniently","inconvenience","conveniently"],"answerIndex":1,"explanation":"Chỗ trống bổ nghĩa cho phân từ \"placed\" nên cần trạng từ, và \"on the far side of the river\" cho thấy bất tiện: \"inconveniently placed\". \"conveniently\" trái nghĩa; \"inconvenient\" là tính từ; \"inconvenience\" là danh từ."},{"num":7,"question":"My grandmother still buys fresh fish and vegetables at the ______ every morning.","options":["empty road","high-rise building","low-rise building","wet market"],"answerIndex":3,"explanation":"\"wet market\" (chợ truyền thống) là nơi bán cá và rau tươi. \"empty road\" (con đường vắng), \"high-rise building\" và \"low-rise building\" không phải nơi mua bán thực phẩm."},{"num":8,"question":"Photographs from 1990 show a quiet ______ where the motorway is today.","options":["empty road","wet market","high-rise building","low-rise building"],"answerIndex":0,"explanation":"\"a quiet empty road\" (con đường vắng lặng) đối lập với \"the motorway\" đông đúc ngày nay. Ba cụm còn lại là chợ hoặc tòa nhà, không phải con đường."},{"num":9,"question":"He lives on the twenty-fifth floor of a/an ______ near the river.","options":["low-rise building","wet market","high-rise building","empty road"],"answerIndex":2,"explanation":"Chỉ \"high-rise building\" (tòa nhà cao tầng) mới có tầng thứ hai mươi lăm. \"low-rise building\" chỉ có vài tầng; \"wet market\" và \"empty road\" không phải nơi ở."},{"num":10,"question":"In the old quarter there are only ______ of two or three floors.","options":["high-rise buildings","low-rise buildings","wet markets","empty roads"],"answerIndex":1,"explanation":"\"low-rise buildings\" (nhà thấp tầng) đúng với \"two or three floors\". \"high-rise buildings\" mâu thuẫn với chi tiết này; \"wet markets\" và \"empty roads\" không có tầng."},{"num":11,"question":"Online shopping is much more ______ than going to the market, but far less sociable.","options":["convenient","conveniently","convenience","inconvenience"],"answerIndex":0,"explanation":"Sau \"much more\" trong cấu trúc so sánh cần tính từ: \"more convenient than\" (tiện lợi hơn). \"conveniently\" là trạng từ; \"convenience/inconvenience\" là danh từ."}],"gapfill":[{"num":1,"sentence":"Fresh vegetables and live fish are sold at the local ______ every morning.","answer":"wet market"},{"num":2,"sentence":"Fifty years ago this busy street was a quiet ______ through the rice fields.","answer":"empty road"},{"num":3,"sentence":"Rows of ______ have replaced the old houses along the river.","answer":"high-rise buildings"},{"num":4,"sentence":"The village library is a small ______ with only two floors.","answer":"low-rise building"},{"num":5,"sentence":"Having a bus stop right outside the house is extremely ______.","answer":"convenient"},{"num":6,"sentence":"The chemist's is ______ located right next to the hospital.","answer":"conveniently"},{"num":7,"sentence":"Losing my phone on the first day caused a great deal of ______.","answer":"inconvenience"},{"num":8,"sentence":"Six o'clock in the morning is an ______ time for a class meeting.","answer":"inconvenient"},{"num":9,"sentence":"The new car park is ______ situated on the other side of the river.","answer":"inconveniently"},{"num":10,"sentence":"People often choose supermarkets for their ______ rather than their prices.","answer":"convenience"}]},"5":{"title":"LISTENING","words":[{"word":"urbanisation","ipa":"/ˌɜːbənaɪˈzeɪʃn/","pos":"n.","meaning":"đô thị hóa"},{"word":"urban population","ipa":"/ˈɜːbən ˌpɒpjuˈleɪʃn/","pos":"n. phr.","meaning":"dân số thành thị"},{"word":"rural population","ipa":"/ˈrʊərəl ˌpɒpjuˈleɪʃn/","pos":"n. phr.","meaning":"dân số nông thôn"},{"word":"increase","ipa":"/ɪnˈkriːs/","pos":"v.","meaning":"tăng"},{"word":"decrease","ipa":"/dɪˈkriːs/","pos":"v.","meaning":"giảm"},{"word":"rapidly","ipa":"/ˈræpɪdli/","pos":"adv.","meaning":"nhanh chóng"},{"word":"gradually","ipa":"/ˈɡrædʒuəli/","pos":"adv.","meaning":"dần dần"},{"word":"percentage","ipa":"/pəˈsentɪdʒ/","pos":"n.","meaning":"tỷ lệ, phần trăm"},{"word":"advantage","ipa":"/ədˈvɑːntɪdʒ/","pos":"n.","meaning":"lợi ích, ưu điểm"},{"word":"reliable","ipa":"/rɪˈlaɪəbl/","pos":"adj.","meaning":"đáng tin cậy"},{"word":"public transport","ipa":"/ˌpʌblɪk ˈtrænspɔːt/","pos":"n. phr.","meaning":"phương tiện giao thông công cộng"},{"word":"private vehicle","ipa":"/ˈpraɪvət ˈviːəkl/","pos":"n. phr.","meaning":"phương tiện cá nhân"},{"word":"air pollution","ipa":"/eə pəˈluːʃn/","pos":"n. phr.","meaning":"ô nhiễm không khí"},{"word":"carbon emission","ipa":"/ˈkɑːbən ɪˈmɪʃn/","pos":"n. phr.","meaning":"khí thải carbon"},{"word":"smog","ipa":"/smɒɡ/","pos":"n.","meaning":"khói bụi"},{"word":"housing","ipa":"/ˈhaʊzɪŋ/","pos":"n.","meaning":"nhà ở"},{"word":"afford","ipa":"/əˈfɔːd/","pos":"v.","meaning":"có đủ khả năng chi trả"},{"word":"expect","ipa":"/ɪkˈspekt/","pos":"v.","meaning":"dự đoán; mong đợi"},{"word":"modern hospital","ipa":"/ˈmɒdn ˈhɒspɪtl/","pos":"n. phr.","meaning":"bệnh viện hiện đại"},{"word":"population","ipa":"/ˌpɒpjuˈleɪʃn/","pos":"n.","meaning":"dân số"}],"mcq":[{"num":1,"question":"As more people leave the countryside, the urban population will continue to ______.","options":["decrease","expect","increase","afford"],"answerIndex":2,"explanation":"Người rời nông thôn sẽ làm dân số thành thị tăng lên: \"increase\" (tăng). \"decrease\" (giảm) trái với logic của câu; \"expect\" và \"afford\" sai nghĩa."},{"num":2,"question":"As young people move away to the cities, the rural population continues to ______.","options":["increase","expect","afford","decrease"],"answerIndex":3,"explanation":"Người trẻ rời đi khiến dân số nông thôn giảm: \"decrease\". \"increase\" trái với logic; \"expect\" (dự đoán) và \"afford\" (đủ tiền) sai nghĩa."},{"num":3,"question":"The city grew so ______ that the government could not build houses fast enough.","options":["gradually","rapidly","conveniently","statistically"],"answerIndex":1,"explanation":"Chi tiết \"could not build houses fast enough\" chốt nghĩa \"rapidly\" (nhanh chóng). \"gradually\" (dần dần) trái nghĩa; \"conveniently\" và \"statistically\" không mô tả tốc độ tăng trưởng."},{"num":4,"question":"Change did not happen overnight: the town ______ became a major port over two centuries.","options":["gradually","rapidly","conveniently","statistically"],"answerIndex":0,"explanation":"Chi tiết \"did not happen overnight\" và \"over two centuries\" chốt nghĩa \"gradually\" (dần dần). \"rapidly\" trái nghĩa; hai phương án còn lại sai nghĩa."},{"num":5,"question":"The ______ of people living in cities rose from twenty to thirty-eight in thirty years.","options":["advantage","percentage","smog","vehicle"],"answerIndex":1,"explanation":"Con số đi kèm \"rose from twenty to thirty-eight\" là tỷ lệ phần trăm: \"percentage\". \"advantage\" (lợi ích), \"smog\" (khói bụi) và \"vehicle\" (phương tiện) sai nghĩa."},{"num":6,"question":"One of the main ______ of city life is easy access to hospitals and schools.","options":["percentages","emissions","vehicles","advantages"],"answerIndex":3,"explanation":"Việc dễ tiếp cận bệnh viện và trường học là một lợi ích: \"advantages\". \"percentages\" (tỷ lệ), \"emissions\" (khí thải) và \"vehicles\" (phương tiện) không phải điểm mạnh của đời sống đô thị theo nghĩa này."},{"num":7,"question":"The buses here are cheap but not very ______; they are late almost every day.","options":["reliably","reliability","reliable","relied"],"answerIndex":2,"explanation":"Sau \"not very\" cần tính từ: \"reliable\" (đáng tin cậy), khớp với \"late almost every day\". \"reliably\" là trạng từ; \"reliability\" là danh từ; \"relied\" là động từ."},{"num":8,"question":"Using ______ instead of cars helps to reduce traffic jams in the centre.","options":["public transport","private vehicles","carbon emissions","air pollution"],"answerIndex":0,"explanation":"\"public transport\" (giao thông công cộng) là lựa chọn thay thế ô tô cá nhân. \"private vehicles\" cũng chính là ô tô cá nhân nên mâu thuẫn với \"instead of cars\"; \"carbon emissions\" và \"air pollution\" không phải phương tiện đi lại."},{"num":9,"question":"The number of ______ on the city's roads has doubled in only ten years.","options":["modern hospitals","rural populations","percentages","private vehicles"],"answerIndex":3,"explanation":"Thứ chạy trên đường và tăng gấp đôi là \"private vehicles\" (phương tiện cá nhân). \"modern hospitals\", \"rural populations\" và \"percentages\" không xuất hiện \"on the roads\"."},{"num":10,"question":"______ in the city is made much worse by the huge number of motorbikes.","options":["Public transport","Air pollution","Housing","Percentage"],"answerIndex":1,"explanation":"Xe máy là nguyên nhân gây \"air pollution\" (ô nhiễm không khí). \"Public transport\" (giao thông công cộng), \"housing\" (nhà ở) và \"percentage\" (tỷ lệ) không phải hậu quả của lượng xe máy lớn."},{"num":11,"question":"Cycling to school instead of taking the car helps cut ______.","options":["carbon emissions","modern hospitals","rural populations","wet markets"],"answerIndex":0,"explanation":"Đi xe đạp thay ô tô làm giảm \"carbon emissions\" (khí thải các-bon). Ba cụm còn lại không phải thứ bị cắt giảm khi đạp xe."},{"num":12,"question":"On cold winter mornings a thick ______ covers the whole valley.","options":["housing","advantage","smog","percentage"],"answerIndex":2,"explanation":"\"a thick smog\" (lớp khói bụi dày) là hiện tượng phủ kín thung lũng. \"housing\" (nhà ở), \"advantage\" (lợi ích) và \"percentage\" (tỷ lệ) không phải hiện tượng thời tiết."},{"num":13,"question":"Many young families simply cannot ______ to buy a flat near the centre.","options":["expect","increase","afford","decrease"],"answerIndex":2,"explanation":"\"cannot afford to do sth\" (không đủ tiền để làm gì) là cấu trúc cố định. \"expect to buy\" nghĩa là mong đợi chứ không nói về khả năng tài chính; \"increase\" và \"decrease\" sai nghĩa."},{"num":14,"question":"Experts ______ the city's population to reach ten million by 2050.","options":["afford","expect","increase","decrease"],"answerIndex":1,"explanation":"\"expect sth to do sth\" (dự đoán điều gì sẽ xảy ra) đúng cấu trúc và nghĩa. \"afford\" nói về khả năng chi trả; \"increase/decrease\" không đi với cấu trúc \"… the population to reach\"."},{"num":15,"question":"The city is facing a serious ______ shortage, and rents are rising every month.","options":["smog","advantage","percentage","housing"],"answerIndex":3,"explanation":"\"a housing shortage\" (tình trạng thiếu nhà ở) giải thích được việc giá thuê tăng. \"smog\", \"advantage\" và \"percentage\" không tạo thành cụm hợp nghĩa với \"shortage\" ở đây."},{"num":16,"question":"The ______ of Ho Chi Minh City is now more than nine million people.","options":["population","percentage","advantage","emission"],"answerIndex":0,"explanation":"\"the population of a city\" (dân số của một thành phố) đúng nghĩa với \"nine million people\". \"percentage\" (tỷ lệ), \"advantage\" (lợi ích) và \"emission\" (khí thải) sai nghĩa."}],"gapfill":[{"num":1,"sentence":"The city's ______ system includes buses, trains and a new metro line.","answer":"public transport"},{"num":2,"sentence":"The number of farmers in the district has ______ by almost half since 1990.","answer":"decreased"},{"num":3,"sentence":"A large ______ of city dwellers live in rented flats.","answer":"percentage"},{"num":4,"sentence":"House prices rose so ______ that many families could no longer buy a home.","answer":"rapidly"},{"num":5,"sentence":"Air quality in the capital has ______ improved over the past ten years.","answer":"gradually"},{"num":6,"sentence":"The main ______ of living in the suburbs is the lower cost of housing.","answer":"advantage"},{"num":7,"sentence":"Not many young couples can ______ a house in the city centre.","answer":"afford"},{"num":8,"sentence":"The ______ has fallen as more and more young people move to the cities.","answer":"rural population"},{"num":9,"sentence":"The town now has a ______ with the latest equipment and foreign-trained doctors.","answer":"modern hospital"},{"num":10,"sentence":"Our train service is cheap and very ______; it is almost never late.","answer":"reliable"}]},"6":{"title":"WRITING","words":[{"word":"line graph","ipa":"","pos":"n","meaning":"biểu đồ đường"},{"word":"percentage","ipa":"/pəˈsentɪdʒ/","pos":"n","meaning":"tỉ lệ phần trăm"},{"word":"percent","ipa":"/pəˈsent/","pos":"n","meaning":"phần trăm"},{"word":"a percentage of","ipa":"","pos":"chunk","meaning":"một tỉ lệ phần trăm của"},{"word":"proportion","ipa":"/prəˈpɔːʃn/","pos":"n","meaning":"tỉ lệ; phần"},{"word":"a large proportion of","ipa":"","pos":"chunk","meaning":"một tỉ lệ lớn…"},{"word":"a small proportion of","ipa":"","pos":"chunk","meaning":"một tỉ lệ nhỏ…"},{"word":"stable","ipa":"/ˈsteɪbl/","pos":"adj","meaning":"ổn định; không thay đổi nhiều"},{"word":"stability","ipa":"/stəˈbɪləti/","pos":"n","meaning":"sự ổn định"},{"word":"stabilise","ipa":"/ˈsteɪbəlaɪz/","pos":"v","meaning":"làm ổn định; trở nên ổn định"},{"word":"unstable","ipa":"/ʌnˈsteɪbl/","pos":"adj","meaning":"không ổn định"},{"word":"steadily","ipa":"/ˈstedɪli/","pos":"adv","meaning":"đều đặn; ổn định"},{"word":"steady","ipa":"/ˈstedi/","pos":"adj","meaning":"đều đặn; ổn định"},{"word":"steady","ipa":"/ˈstedi/","pos":"v","meaning":"làm ổn định"},{"word":"steadiness","ipa":"/ˈstedinəs/","pos":"n","meaning":"sự đều đặn; sự ổn định"},{"word":"unsteady","ipa":"/ʌnˈstedi/","pos":"adj","meaning":"không ổn định; không đều"}],"mcq":[{"num":1,"question":"The ______ below shows changes in the urban population between 1990 and 2020.","options":["percentage","proportion","line graph","stability"],"answerIndex":2,"explanation":"\"a line graph\" (biểu đồ đường) là loại biểu đồ thể hiện thay đổi theo thời gian. \"percentage\" và \"proportion\" chỉ tỷ lệ chứ không phải biểu đồ; \"stability\" là sự ổn định."},{"num":2,"question":"The ______ of households with internet access rose from thirty to eighty in ten years.","options":["stability","percentage","steadiness","line graph"],"answerIndex":1,"explanation":"Con số \"from thirty to eighty\" là tỷ lệ phần trăm: \"percentage\". \"stability\" (sự ổn định), \"steadiness\" (sự đều đặn) và \"line graph\" (biểu đồ) không phải con số tỷ lệ."},{"num":3,"question":"Almost sixty ______ of the country's people now live in towns and cities.","options":["percentage","proportion","graph","percent"],"answerIndex":3,"explanation":"Sau một con số cụ thể (\"sixty\") phải dùng \"percent\" (phần trăm). \"percentage\" và \"proportion\" cần cấu trúc \"the percentage/proportion of\" chứ không đứng ngay sau số đếm; \"graph\" sai nghĩa."},{"num":4,"question":"A large ______ of city residents travel to work by motorbike.","options":["proportion","percent","stability","steadiness"],"answerIndex":0,"explanation":"\"a large proportion of\" (một tỷ lệ lớn) là cụm cố định. \"percent\" phải đi sau một con số; \"stability\" và \"steadiness\" sai nghĩa."},{"num":5,"question":"House prices remained ______ between 2015 and 2018 before rising again.","options":["stability","stable","stabilise","unstable"],"answerIndex":1,"explanation":"Sau động từ nối \"remained\" cần tính từ, và \"between 2015 and 2018 before rising again\" cho thấy giá không đổi trong giai đoạn đó: \"stable\" (ổn định). \"unstable\" trái nghĩa; \"stability\" là danh từ; \"stabilise\" là động từ."},{"num":6,"question":"The government's main aim during this period was economic ______.","options":["stable","stabilise","unstable","stability"],"answerIndex":3,"explanation":"Sau tính từ \"economic\" cần danh từ: \"economic stability\" (sự ổn định kinh tế). \"stable/unstable\" là tính từ; \"stabilise\" là động từ."},{"num":7,"question":"Prices began to ______ after thousands of new flats were built.","options":["stability","stable","stabilise","unstable"],"answerIndex":2,"explanation":"Sau \"began to\" cần động từ nguyên thể: \"stabilise\" (trở nên ổn định). \"stability\" là danh từ; \"stable/unstable\" là tính từ."},{"num":8,"question":"The market has been very ______ this year, with prices rising and falling every month.","options":["unstable","stable","stability","stabilise"],"answerIndex":0,"explanation":"Chi tiết \"rising and falling every month\" chốt nghĩa \"unstable\" (không ổn định). \"stable\" trái nghĩa; \"stability\" là danh từ; \"stabilise\" là động từ."},{"num":9,"question":"The urban population of the country has risen ______ since 1990.","options":["steadily","steady","steadiness","unsteady"],"answerIndex":0,"explanation":"Chỗ trống bổ nghĩa cho động từ \"has risen\" nên cần trạng từ: \"risen steadily\" (tăng đều đặn). \"steady/unsteady\" là tính từ; \"steadiness\" là danh từ."},{"num":10,"question":"The graph shows a/an ______ increase in car ownership over the whole period.","options":["steadily","steady","steadiness","unsteady"],"answerIndex":1,"explanation":"Trước danh từ \"increase\" cần tính từ: \"a steady increase\" (sự tăng đều). \"steadily\" là trạng từ; \"steadiness\" là danh từ; \"unsteady\" mang nghĩa chập chờn, không dùng cho xu hướng tăng đều của biểu đồ."},{"num":11,"question":"His hands were ______ as he opened the envelope with his exam results.","options":["steady","steadily","unsteady","steadiness"],"answerIndex":2,"explanation":"Sau \"were\" cần tính từ, và ngữ cảnh hồi hộp chốt nghĩa \"unsteady\" (run rẩy, không vững). \"steady\" trái nghĩa; \"steadily\" là trạng từ; \"steadiness\" là danh từ."},{"num":12,"question":"The ______ of the growth over twenty years surprised the researchers.","options":["steady","steadily","unsteady","steadiness"],"answerIndex":3,"explanation":"Chủ ngữ của \"surprised\" cần danh từ: \"the steadiness of the growth\" (tính đều đặn của sự tăng trưởng). \"steady/unsteady\" là tính từ; \"steadily\" là trạng từ."}],"gapfill":[{"num":1,"sentence":"The ______ below compares car ownership in three different countries.","answer":"line graph"},{"num":2,"sentence":"Only ______ the country's people now live in rural areas.","answer":"a small proportion of"},{"num":3,"sentence":"About forty ______ of city dwellers use public transport every day.","answer":"percent"},{"num":4,"sentence":"The ______ of young people going to university has doubled since 2000.","answer":"percentage"},{"num":5,"sentence":"Prices rose sharply in 2019 but ______ the following year.","answer":"stabilised"},{"num":6,"sentence":"The number of foreign visitors has grown ______ every year since 2010.","answer":"steadily"},{"num":7,"sentence":"The chart shows a ______ rise in the number of high-rise buildings.","answer":"steady"},{"num":8,"sentence":"Political ______ is important for long-term economic development.","answer":"stability"},{"num":9,"sentence":"The exchange rate has been very ______ recently, changing almost every day.","answer":"unstable"},{"num":10,"sentence":"The population figure has remained ______ for the last five years.","answer":"stable"}]},"7":{"title":"COMMUNICATION AND CULTURE/ CILL","words":[{"word":"immigration","ipa":"/ˌɪmɪˈɡreɪʃn/","pos":"n","meaning":"sự nhập cư"},{"word":"immigrate","ipa":"/ˈɪmɪɡreɪt/","pos":"v","meaning":"nhập cư"},{"word":"immigrant","ipa":"/ˈɪmɪɡrənt/","pos":"n","meaning":"người nhập cư"},{"word":"settle","ipa":"/ˈsetl/","pos":"v","meaning":"định cư; ổn định"},{"word":"settlement","ipa":"/ˈsetlmənt/","pos":"n","meaning":"sự định cư; khu định cư"},{"word":"settler","ipa":"/ˈsetlə(r)/","pos":"n","meaning":"người định cư"},{"word":"statistic","ipa":"/stəˈtɪstɪk/","pos":"n","meaning":"số liệu thống kê"},{"word":"statistical","ipa":"/stəˈtɪstɪkl/","pos":"adj","meaning":"thuộc thống kê"},{"word":"statistically","ipa":"/stəˈtɪstɪkli/","pos":"adv","meaning":"về mặt thống kê"},{"word":"statistician","ipa":"/ˌstætɪˈstɪʃn/","pos":"n","meaning":"nhà thống kê học"}],"mcq":[{"num":1,"question":"______ laws in this country have become much stricter in recent years.","options":["Immigration","Immigrate","Immigrant","Immigrants"],"answerIndex":0,"explanation":"Trước danh từ \"laws\", danh từ \"immigration\" đóng vai trò bổ nghĩa: \"immigration laws\" (luật nhập cư). \"immigrate\" là động từ; \"immigrant/immigrants\" chỉ người nhập cư nên không tạo thành cụm chuẩn với \"laws\"."},{"num":2,"question":"Many ______ came to Australia from Europe in the years after the war.","options":["immigration","immigrate","immigrants","immigrated"],"answerIndex":2,"explanation":"Chủ ngữ số nhiều chỉ người cần danh từ: \"immigrants\" (những người nhập cư). \"immigration\" là danh từ trừu tượng; \"immigrate/immigrated\" là động từ."},{"num":3,"question":"His grandparents decided to ______ to Canada in 1975.","options":["immigration","immigrate","immigrant","immigrated"],"answerIndex":1,"explanation":"Sau \"decided to\" cần động từ nguyên thể: \"immigrate to somewhere\" (nhập cư vào nơi nào). \"immigration/immigrant\" là danh từ; \"immigrated\" sai dạng sau \"to\"."},{"num":4,"question":"As a young ______, she worked very hard to learn the language of her new country.","options":["immigration","immigrate","immigrated","immigrant"],"answerIndex":3,"explanation":"\"as a young + danh từ chỉ người\": \"immigrant\" (người nhập cư). \"immigration\" là danh từ trừu tượng; \"immigrate/immigrated\" là động từ."},{"num":5,"question":"After years of travelling, they decided to ______ in a small coastal town.","options":["settlement","settle","settler","settled"],"answerIndex":1,"explanation":"Sau \"decided to\" cần động từ nguyên thể: \"settle in somewhere\" (định cư ở đâu). \"settlement\" và \"settler\" là danh từ; \"settled\" sai dạng sau \"to\"."},{"num":6,"question":"Archaeologists have found an early ______ beside the river.","options":["settlement","settle","settler","settled"],"answerIndex":0,"explanation":"Sau \"an early\" cần danh từ chỉ nơi chốn: \"settlement\" (khu định cư). \"settle/settled\" là động từ; \"settler\" chỉ người."},{"num":7,"question":"The first ______ built their houses out of wood and mud.","options":["settlements","settle","settled","settlers"],"answerIndex":3,"explanation":"Chủ ngữ của \"built their houses\" phải là người: \"settlers\" (những người định cư). \"settlements\" là khu định cư; \"settle/settled\" là động từ."},{"num":8,"question":"The family ______ in Ha Noi more than thirty years ago.","options":["settle","settlement","settled","settler"],"answerIndex":2,"explanation":"Trạng ngữ \"thirty years ago\" đòi hỏi động từ chia quá khứ: \"settled\" (đã định cư). \"settle\" sai thì; \"settlement/settler\" là danh từ."},{"num":9,"question":"The latest ______ show that the city has grown by twenty per cent.","options":["statistical","statistically","statistician","statistics"],"answerIndex":3,"explanation":"Chủ ngữ số nhiều đi với \"show\" cần danh từ số nhiều: \"statistics\" (số liệu thống kê). \"statistical\" là tính từ; \"statistically\" là trạng từ; \"statistician\" chỉ người."},{"num":10,"question":"The report contains a great deal of ______ information about migration.","options":["statistics","statistically","statistical","statistician"],"answerIndex":2,"explanation":"Trước danh từ \"information\" cần tính từ: \"statistical information\" (thông tin thống kê). \"statistics\" và \"statistician\" là danh từ; \"statistically\" là trạng từ."},{"num":11,"question":"______ speaking, people in cities earn more than people in the countryside.","options":["Statistically","Statistical","Statistics","Statistician"],"answerIndex":0,"explanation":"\"Statistically speaking\" (xét về mặt thống kê) là cụm mở đầu câu, cần trạng từ. \"Statistical\" là tính từ; \"Statistics\" và \"Statistician\" là danh từ."},{"num":12,"question":"The company employs a ______ to analyse its sales figures every quarter.","options":["statistics","statistician","statistical","statistically"],"answerIndex":1,"explanation":"Người được thuê để phân tích số liệu là \"statistician\" (nhà thống kê). \"statistics\" là số liệu; \"statistical\" là tính từ; \"statistically\" là trạng từ."}],"gapfill":[{"num":1,"sentence":"The ______ office deals with thousands of applications every month.","answer":"immigration"},{"num":2,"sentence":"Thousands of ______ arrive in the country every year looking for work.","answer":"immigrants"},{"num":3,"sentence":"Her parents ______ to France when she was still a baby.","answer":"immigrated"},{"num":4,"sentence":"After the war, many families ______ in the south of the country.","answer":"settled"},{"num":5,"sentence":"The first European ______ arrived on this coast in the seventeenth century.","answer":"settlers"},{"num":6,"sentence":"The ruins of an ancient ______ were found under the new road.","answer":"settlement"},{"num":7,"sentence":"Official ______ show that the population has grown by a fifth.","answer":"statistics"},{"num":8,"sentence":"______ speaking, city dwellers live several years longer than country people.","answer":"Statistically"},{"num":9,"sentence":"The government employs a ______ to check the census figures.","answer":"statistician"},{"num":10,"sentence":"The article includes a lot of ______ data about internal migration.","answer":"statistical"}]}},"5":{"1":{"title":"GETTING STARTED","words":[{"word":"work in shifts","ipa":"/wɜːk ɪn ʃɪfts/","pos":"phr.v","meaning":"làm việc theo ca"},{"word":"shift","ipa":"/ʃɪft/","pos":"n, v","meaning":"ca làm việc; chuyển đổi"},{"word":"tiring","ipa":"/ˈtaɪərɪŋ/","pos":"adj","meaning":"mệt mỏi, gây mệt"},{"word":"tire","ipa":"/ˈtaɪə(r)/","pos":"v","meaning":"làm mệt"},{"word":"tired","ipa":"/ˈtaɪəd/","pos":"adj","meaning":"mệt"},{"word":"tirelessly","ipa":"/ˈtaɪələsli/","pos":"adv","meaning":"không mệt mỏi"},{"word":"put up (a performance)","ipa":"/pʊt ʌp (ə pəˈfɔːməns)/","pos":"phr.v","meaning":"trình diễn, biểu diễn"},{"word":"go on (a business trip)","ipa":"/ɡəʊ ɒn (ə ˈbɪznəs trɪp)/","pos":"phr.v","meaning":"đi công tác"},{"word":"work overtime","ipa":"/wɜːk ˈəʊvətaɪm/","pos":"phr.v","meaning":"làm thêm giờ"},{"word":"follow one's footsteps","ipa":"/ˈfɒləʊ wʌnz ˈfʊtsteps/","pos":"phr.v","meaning":"nối nghiệp ai, theo bước ai"},{"word":"nine-to-five job","ipa":"/ˌnaɪn tə ˈfaɪv dʒɒb/","pos":"n phr.","meaning":"công việc giờ hành chính"},{"word":"open up opportunities","ipa":"/ˈəʊpən ʌp ˌɒpəˈtjuːnətiz/","pos":"phr.v","meaning":"mở ra cơ hội"}],"mcq":[{"num":1,"question":"Nurses at this hospital work in ______, so there is always someone on duty.","options":["shifts","footsteps","opportunities","trips"],"answerIndex":0,"explanation":"\"work in shifts\" (làm việc theo ca) là cụm cố định, giải thích được \"always someone on duty\". \"footsteps\" (bước chân), \"opportunities\" (cơ hội) và \"trips\" (chuyến đi) không tạo thành cụm này."},{"num":2,"question":"My father starts his night ______ at ten o'clock and finishes at six in the morning.","options":["trip","shift","footstep","opportunity"],"answerIndex":1,"explanation":"\"night shift\" (ca đêm) là cụm chuẩn, khớp với khung giờ mười giờ tối đến sáu giờ sáng. \"trip\", \"footstep\" và \"opportunity\" không kết hợp với \"night\" theo nghĩa ca làm việc."},{"num":3,"question":"Working twelve hours a day in a hot kitchen is extremely ______.","options":["tired","tire","tiring","tirelessly"],"answerIndex":2,"explanation":"Chủ ngữ là công việc gây ra sự mệt mỏi nên cần tính từ chủ động \"tiring\" (gây mệt). \"tired\" dùng cho người cảm thấy mệt; \"tire\" là động từ; \"tirelessly\" là trạng từ."},{"num":4,"question":"After the night shift she felt completely ______ and went straight to bed.","options":["tiring","tire","tirelessly","tired"],"answerIndex":3,"explanation":"Chủ ngữ là người cảm thấy mệt nên cần tính từ bị động \"tired\" (mệt). \"tiring\" mô tả thứ gây mệt; \"tire\" là động từ; \"tirelessly\" là trạng từ."},{"num":5,"question":"She worked ______ for thirty years to improve the lives of poor children.","options":["tirelessly","tired","tiring","tire"],"answerIndex":0,"explanation":"Chỗ trống bổ nghĩa cho động từ \"worked\" nên cần trạng từ: \"tirelessly\" (không biết mệt mỏi). \"tired/tiring\" là tính từ; \"tire\" là động từ."},{"num":6,"question":"Long meetings ______ me far more than physical work does.","options":["tired","tire","tiring","tirelessly"],"answerIndex":1,"explanation":"Câu cần động từ chính ở thì hiện tại đơn với chủ ngữ số nhiều: \"tire me\" (làm tôi mệt). \"tired/tiring\" là tính từ; \"tirelessly\" là trạng từ."},{"num":7,"question":"The drama club will ______ a wonderful performance at the end of term.","options":["go on","work in","open up","put up"],"answerIndex":3,"explanation":"\"put up a performance\" (dàn dựng, trình diễn một tiết mục) là cụm cố định. \"go on\" đi với \"a business trip\"; \"work in\" đi với \"shifts\"; \"open up\" đi với \"opportunities\"."},{"num":8,"question":"My mother has to ______ a business trip to Singapore next week.","options":["put up","work in","go on","follow in"],"answerIndex":2,"explanation":"\"go on a business trip\" (đi công tác) là cụm cố định. \"put up\" đi với một buổi biểu diễn; \"work in\" đi với ca làm việc; \"follow in\" đi với \"someone's footsteps\"."},{"num":9,"question":"Shop staff often have to ______ when the shop is busy just before Tet.","options":["go on","put up","work overtime","follow in"],"answerIndex":2,"explanation":"\"work overtime\" (làm thêm giờ) là cụm hoàn chỉnh, không cần tân ngữ, phù hợp với \"when the shop is busy\". Ba cụm còn lại đều đòi hỏi tân ngữ theo sau nên sai ngữ pháp ở đây."},{"num":10,"question":"He decided to ______ in his father's footsteps and become a doctor.","options":["put","go","open","follow"],"answerIndex":3,"explanation":"\"follow in someone's footsteps\" (nối nghiệp ai) là cụm cố định với \"in … footsteps\" đã có sẵn. \"put/go/open in someone's footsteps\" đều không tồn tại."},{"num":11,"question":"She left her ______ to become a freelance photographer.","options":["nine-to-five job","business trip","night shift","performance"],"answerIndex":0,"explanation":"\"a nine-to-five job\" (công việc giờ hành chính) đối lập với công việc tự do \"freelance\". \"business trip\", \"night shift\" và \"performance\" không phải loại công việc cố định mà người ta từ bỏ theo nghĩa này."},{"num":12,"question":"A good command of English can ______ many opportunities for young people.","options":["put up","open up","go on","work in"],"answerIndex":1,"explanation":"\"open up opportunities\" (mở ra cơ hội) là cụm cố định. \"put up\", \"go on\" và \"work in\" không kết hợp với \"opportunities\"."}],"gapfill":[{"num":1,"sentence":"Factory workers here work in three ______: morning, afternoon and night.","answer":"shifts"},{"num":2,"sentence":"Driving a lorry for ten hours without a break is very ______.","answer":"tiring"},{"num":3,"sentence":"The children were too ______ to finish their homework last night.","answer":"tired"},{"num":4,"sentence":"Doctors and nurses worked ______ during the flu epidemic.","answer":"tirelessly"},{"num":5,"sentence":"My sister has gone on a ______ to Da Nang for three days.","answer":"business trip"},{"num":6,"sentence":"Many employees work ______ at the end of the month to finish their targets.","answer":"overtime"},{"num":7,"sentence":"He followed in his mother's ______ and became a teacher.","answer":"footsteps"},{"num":8,"sentence":"She prefers freelance work to a regular ______ in an office.","answer":"nine-to-five job"},{"num":9,"sentence":"The students will ______ a wonderful performance on Teachers' Day.","answer":"put up"},{"num":10,"sentence":"A good command of English can open up many ______ for young workers.","answer":"opportunities"}]},"2":{"title":"LANGUAGE","words":[{"word":"challenging","ipa":"/ˈtʃælɪndʒɪŋ/","pos":"adj","meaning":"đầy thử thách"},{"word":"challenge","ipa":"/ˈtʃælɪndʒ/","pos":"n, v","meaning":"thử thách; thách thức"},{"word":"relevant","ipa":"/ˈreləvənt/","pos":"adj","meaning":"liên quan, phù hợp"},{"word":"relevance","ipa":"/ˈreləvəns/","pos":"n","meaning":"sự liên quan"},{"word":"relevantly","ipa":"/ˈreləvəntli/","pos":"adv","meaning":"một cách thích hợp"},{"word":"irrelevant","ipa":"/ɪˈreləvənt/","pos":"adj","meaning":"không liên quan"},{"word":"irrelevance","ipa":"/ɪˈreləvəns/","pos":"n","meaning":"sự không liên quan"},{"word":"bonus","ipa":"/ˈbəʊnəs/","pos":"n","meaning":"tiền thưởng"},{"word":"employ","ipa":"/ɪmˈplɔɪ/","pos":"v","meaning":"tuyển dụng"},{"word":"employee","ipa":"/ɪmˈplɔɪiː/","pos":"n","meaning":"nhân viên"},{"word":"employer","ipa":"/ɪmˈplɔɪə(r)/","pos":"n","meaning":"người sử dụng lao động"},{"word":"employment","ipa":"/ɪmˈplɔɪmənt/","pos":"n","meaning":"việc làm; sự tuyển dụng"},{"word":"unemployment","ipa":"/ˌʌnɪmˈplɔɪmənt/","pos":"n","meaning":"thất nghiệp"},{"word":"rewarding","ipa":"/rɪˈwɔːdɪŋ/","pos":"adj","meaning":"đáng làm, mang lại nhiều giá trị"},{"word":"reward","ipa":"/rɪˈwɔːd/","pos":"n, v","meaning":"phần thưởng; thưởng"},{"word":"rewardingly","ipa":"/rɪˈwɔːdɪŋli/","pos":"adv","meaning":"một cách đáng giá"},{"word":"meet targets","ipa":"/miːt ˈtɑːɡɪts/","pos":"phr.v","meaning":"đạt chỉ tiêu"},{"word":"apply for","ipa":"/əˈplaɪ fɔː(r)/","pos":"phr.v","meaning":"nộp đơn xin"},{"word":"apply","ipa":"/əˈplaɪ/","pos":"v","meaning":"nộp đơn; áp dụng"},{"word":"applicant","ipa":"/ˈæplɪkənt/","pos":"n","meaning":"ứng viên"},{"word":"application","ipa":"/ˌæplɪˈkeɪʃn/","pos":"n","meaning":"đơn xin; sự áp dụng"},{"word":"applicable","ipa":"/əˈplɪkəbl/","pos":"adj","meaning":"có thể áp dụng"},{"word":"babysitter","ipa":"/ˈbeɪbiˌsɪtə(r)/","pos":"n","meaning":"người trông trẻ"},{"word":"babysit","ipa":"/ˈbeɪbiˌsɪt/","pos":"v","meaning":"trông trẻ"},{"word":"academic qualification","ipa":"/ˌækəˈdemɪk ˌkwɒlɪfɪˈkeɪʃn/","pos":"n phr.","meaning":"bằng cấp học vấn"}],"mcq":[{"num":1,"question":"Teaching a class of forty young children is a ______ job.","options":["challenging","challenge","challenged","challenges"],"answerIndex":0,"explanation":"Trước danh từ \"job\" cần tính từ: \"a challenging job\" (công việc đầy thử thách). \"challenge/challenges\" là danh từ; \"challenged\" là phân từ, không dùng bổ nghĩa cho \"job\" theo nghĩa này."},{"num":2,"question":"The biggest ______ for young graduates is finding their first job.","options":["challenging","challenge","challenged","challenges"],"answerIndex":1,"explanation":"Sau \"The biggest\" và đi với động từ số ít \"is\" nên cần danh từ số ít: \"challenge\" (thử thách). \"challenges\" là số nhiều; \"challenging/challenged\" là tính từ hoặc phân từ."},{"num":3,"question":"Please give only the information that is
