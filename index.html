,"impatient"],"answerIndex":0,"explanation":"Sau \"an enormous amount of\" cần danh từ không đếm được: \"patience\" (sự kiên nhẫn). \"patient/impatient\" là tính từ; \"patiently\" là trạng từ."},{"num":5,"question":"Customers quickly become ______ if they have to wait too long.","options":["patient","patience","patiently","impatient"],"answerIndex":3,"explanation":"Chi tiết \"wait too long\" chốt nghĩa \"impatient\" (mất kiên nhẫn). \"patient\" trái nghĩa; \"patience\" là danh từ; \"patiently\" là trạng từ."},{"num":6,"question":"Speaking in public every week has given her a lot of ______.","options":["confidence","confident","confidently","confidences"],"answerIndex":0,"explanation":"Sau \"a lot of\" cần danh từ không đếm được: \"confidence\" (sự tự tin). \"confident\" là tính từ; \"confidently\" là trạng từ; \"confidences\" mang nghĩa khác (những điều tâm sự)."},{"num":7,"question":"She answered every question clearly and ______.","options":["confident","confidently","confidence","confidences"],"answerIndex":1,"explanation":"Sau \"clearly and\" cần một trạng từ song song: \"confidently\" (một cách tự tin). \"confident\" là tính từ; hai phương án còn lại là danh từ."},{"num":8,"question":"Air traffic control is one of the most ______ jobs in the world.","options":["stress","stressed","stressful","stressfully"],"answerIndex":2,"explanation":"Trước danh từ \"jobs\" cần tính từ mô tả công việc gây căng thẳng: \"stressful\". \"stressed\" mô tả người cảm thấy căng thẳng; \"stress\" là danh từ; \"stressfully\" là trạng từ."},{"num":9,"question":"The job needs someone who is friendly, patient and ______.","options":["communication","communicate","communicative","communicator"],"answerIndex":2,"explanation":"Sau hai tính từ \"friendly, patient and\" cần tính từ song song: \"communicative\" (giỏi giao tiếp). \"communication\" và \"communicator\" là danh từ; \"communicate\" là động từ."},{"num":10,"question":"Good ______ between doctors and nurses can save lives.","options":["communicate","communicative","communicator","communication"],"answerIndex":3,"explanation":"Sau \"good\" và ở vị trí chủ ngữ cần danh từ trừu tượng: \"communication\" (sự giao tiếp). \"communicator\" chỉ người; \"communicate\" là động từ; \"communicative\" là tính từ."},{"num":11,"question":"The ______ designed the new city library in only three months.","options":["architect","architecture","architectural","architecturally"],"answerIndex":0,"explanation":"Người thiết kế công trình là \"architect\" (kiến trúc sư). \"architecture\" là ngành kiến trúc; \"architectural\" là tính từ; \"architecturally\" là trạng từ."},{"num":12,"question":"He is studying ______ at the university in Hue.","options":["architect","architecture","architectural","architecturally"],"answerIndex":1,"explanation":"Tên ngành học cần danh từ không đếm được: \"architecture\" (kiến trúc). \"architect\" chỉ người; \"architectural\" là tính từ; \"architecturally\" là trạng từ."},{"num":13,"question":"After two years of study she received a/an ______ in hotel management.","options":["apprenticeship","diploma","record","replacement"],"answerIndex":1,"explanation":"Văn bằng nhận được sau khóa học là \"diploma\" (bằng, chứng chỉ). \"apprenticeship\" là thời gian học nghề; \"record\" là hồ sơ; \"replacement\" là sự thay thế."},{"num":14,"question":"Many photographers are ______ and work for several different clients.","options":["unemployed","employee","self-employed","employer"],"answerIndex":2,"explanation":"Người tự làm chủ và nhận việc từ nhiều khách hàng là \"self-employed\" (tự kinh doanh). \"unemployed\" (thất nghiệp) mâu thuẫn với \"work for several clients\"; \"employee\" và \"employer\" là danh từ."},{"num":15,"question":"Machines have ______ many workers in this factory over the last ten years.","options":["replaced","replacement","replaceable","replacing"],"answerIndex":0,"explanation":"Thì hiện tại hoàn thành \"have + V3\" cần \"replaced\" (đã thay thế). \"replacement\" là danh từ; \"replaceable\" là tính từ; \"replacing\" là V-ing."},{"num":16,"question":"List your three main ______ at the end of your CV.","options":["achieve","achievable","achieved","achievements"],"answerIndex":3,"explanation":"Sau \"three main\" cần danh từ số nhiều: \"achievements\" (thành tựu). \"achieve/achieved\" là động từ; \"achievable\" là tính từ."}],"gapfill":[{"num":1,"sentence":"Send your ______ together with an up-to-date CV.","answer":"application letter"},{"num":2,"sentence":"You should update your ______ every time you change jobs.","answer":"CV"},{"num":3,"sentence":"He started as an ______ in his uncle's garage at the age of sixteen.","answer":"apprentice"},{"num":4,"sentence":"The tourists joined a ______ tour of the old citadel.","answer":"guided"},{"num":5,"sentence":"She waited ______ for two hours outside the manager's office.","answer":"patiently"},{"num":6,"sentence":"He felt very ______ the night before his final examination.","answer":"stressed"},{"num":7,"sentence":"The company has an excellent safety ______ over the last ten years.","answer":"record"},{"num":8,"sentence":"The journalist used a small ______ to tape the whole interview.","answer":"recorder"},{"num":9,"sentence":"A ______ for the retiring manager was found within a week.","answer":"replacement"},{"num":10,"sentence":"With hard work and patience you can ______ almost anything.","answer":"achieve"}]},"5":{"title":"LISTENING","words":[{"word":"teaching career","ipa":"/ˈtiːtʃɪŋ kəˈrɪə(r)/","pos":"n phr","meaning":"nghề dạy học"},{"word":"qualification","ipa":"/ˌkwɒlɪfɪˈkeɪʃn/","pos":"n","meaning":"bằng cấp, trình độ"},{"word":"qualify","ipa":"/ˈkwɒlɪfaɪ/","pos":"v","meaning":"đủ điều kiện"},{"word":"qualified","ipa":"/ˈkwɒlɪfaɪd/","pos":"adj","meaning":"có đủ trình độ"},{"word":"certificate","ipa":"/səˈtɪfɪkət/","pos":"n","meaning":"chứng chỉ"},{"word":"certify","ipa":"/ˈsɜːtɪfaɪ/","pos":"v","meaning":"chứng nhận"},{"word":"certification","ipa":"/səˌtɪfɪˈkeɪʃn/","pos":"n","meaning":"sự cấp chứng chỉ"},{"word":"teamwork","ipa":"/ˈtiːmwɜːk/","pos":"n","meaning":"tinh thần làm việc nhóm"},{"word":"teammate","ipa":"/ˈtiːmmeɪt/","pos":"n","meaning":"đồng đội"},{"word":"reference","ipa":"/ˈrefrəns/","pos":"n","meaning":"thư giới thiệu; người tham khảo"},{"word":"refer","ipa":"/rɪˈfɜː(r)/","pos":"v","meaning":"giới thiệu; đề cập"},{"word":"referral","ipa":"/rɪˈfɜːrəl/","pos":"n","meaning":"sự giới thiệu"},{"word":"applicant","ipa":"/ˈæplɪkənt/","pos":"n","meaning":"người nộp đơn"},{"word":"application","ipa":"/ˌæplɪˈkeɪʃn/","pos":"n","meaning":"đơn xin việc"},{"word":"applicable","ipa":"/əˈplɪkəbl/","pos":"adj","meaning":"có thể áp dụng"},{"word":"principal","ipa":"/ˈprɪnsəpl/","pos":"n","meaning":"hiệu trưởng"},{"word":"principal","ipa":"/ˈprɪnsəpl/","pos":"adj","meaning":"chính, chủ yếu"},{"word":"responsible","ipa":"/rɪˈspɒnsəbl/","pos":"adj","meaning":"có trách nhiệm"},{"word":"responsibility","ipa":"/rɪˌspɒnsəˈbɪləti/","pos":"n","meaning":"trách nhiệm"},{"word":"responsibly","ipa":"/rɪˈspɒnsəbli/","pos":"adv","meaning":"một cách có trách nhiệm"}],"mcq":[{"num":1,"question":"She began her ______ in a small village school in the mountains.","options":["teaching career","certificate","teamwork","referral"],"answerIndex":0,"explanation":"\"begin one's teaching career\" (bắt đầu sự nghiệp dạy học) là cụm chuẩn. \"certificate\" (chứng chỉ), \"teamwork\" (tinh thần đồng đội) và \"referral\" (sự giới thiệu) không phải thứ được bắt đầu ở một ngôi trường."},{"num":2,"question":"You must be fully ______ to teach in a state secondary school.","options":["qualify","qualified","qualification","qualifying"],"answerIndex":1,"explanation":"Sau \"be fully\" cần tính từ: \"qualified\" (có đủ trình độ). \"qualify\" là động từ; \"qualification\" là danh từ; \"qualifying\" mang nghĩa \"đang trong quá trình đủ điều kiện\"."},{"num":3,"question":"What ______ do you need for a post in this school?","options":["qualify","qualified","qualifying","qualifications"],"answerIndex":3,"explanation":"Sau từ để hỏi \"What\" và trước \"do you need\" cần danh từ số nhiều: \"qualifications\" (bằng cấp). \"qualify\" là động từ; \"qualified/qualifying\" là tính từ."},{"num":4,"question":"She showed her teaching ______ at the interview yesterday.","options":["certify","certification","certificate","certified"],"answerIndex":2,"explanation":"Vật được đưa ra xem là \"certificate\" (chứng chỉ, văn bằng). \"certify\" là động từ; \"certification\" là quá trình cấp chứng chỉ; \"certified\" là tính từ."},{"num":5,"question":"The training centre will ______ that you have completed the course.","options":["certificate","certification","certified","certify"],"answerIndex":3,"explanation":"Sau \"will\" cần động từ nguyên thể: \"certify that…\" (chứng nhận rằng…). \"certificate/certification\" là danh từ; \"certified\" sai dạng sau \"will\"."},{"num":6,"question":"Good ______ is essential in a busy hospital ward.","options":["teammate","team","teamwork","teams"],"answerIndex":2,"explanation":"Sau \"good\" và đi với \"is\" cần danh từ không đếm được: \"teamwork\" (tinh thần làm việc nhóm). \"teammate/team/teams\" là danh từ đếm được chỉ người hoặc nhóm."},{"num":7,"question":"He thanked all his ______ after the team won the final.","options":["teamwork","teammates","team","teaming"],"answerIndex":1,"explanation":"Sau \"all his\" cần danh từ số nhiều chỉ người: \"teammates\" (các đồng đội). \"teamwork\" là danh từ trừu tượng; \"team\" là cả đội; \"teaming\" là V-ing."},{"num":8,"question":"Please give the name of one person who can write you a ______.","options":["reference","refer","referral","referring"],"answerIndex":0,"explanation":"\"write sb a reference\" (viết thư giới thiệu cho ai) là collocation chuẩn. \"refer/referring\" là động từ; \"referral\" là việc giới thiệu người bệnh hoặc khách hàng sang nơi khác."},{"num":9,"question":"If the problem continues, the doctor may ______ you to a specialist.","options":["reference","referral","refer","referred"],"answerIndex":2,"explanation":"Sau \"may\" cần động từ nguyên thể: \"refer sb to sb\" (giới thiệu ai đến gặp ai). \"reference/referral\" là danh từ; \"referred\" sai dạng sau động từ khuyết thiếu."},{"num":10,"question":"Fifty ______ applied for the position of school librarian.","options":["application","applicable","apply","applicants"],"answerIndex":3,"explanation":"Chủ ngữ số nhiều chỉ người nộp đơn là \"applicants\" (ứng viên). \"application\" là lá đơn; \"applicable\" là tính từ; \"apply\" là động từ."},{"num":11,"question":"The ______ of our school has worked here for more than twenty years.","options":["applicant","principal","teammate","certificate"],"answerIndex":1,"explanation":"Người đứng đầu một trường học là \"principal\" (hiệu trưởng). \"applicant\" (ứng viên), \"teammate\" (đồng đội) và \"certificate\" (chứng chỉ) sai nghĩa."},{"num":12,"question":"The ______ reason for leaving was the long journey to work every day.","options":["principal","responsible","qualified","applicable"],"answerIndex":0,"explanation":"Ở đây \"principal\" là tính từ mang nghĩa \"chính, chủ yếu\": \"the principal reason\" (lý do chính). \"responsible\" (có trách nhiệm), \"qualified\" (đủ trình độ) và \"applicable\" (có thể áp dụng) không mô tả được mức độ quan trọng của lý do."},{"num":13,"question":"Marking the final examinations is the ______ of the class teacher.","options":["responsible","responsibly","responsibility","responsibilities"],"answerIndex":2,"explanation":"Sau \"the\" và đi với \"is\" cần danh từ số ít: \"responsibility\" (trách nhiệm). \"responsible\" là tính từ; \"responsibly\" là trạng từ; \"responsibilities\" số nhiều không hợp với \"is\"."},{"num":14,"question":"The students behaved very ______ during the whole school trip.","options":["responsible","responsibly","responsibility","responsibilities"],"answerIndex":1,"explanation":"Chỗ trống bổ nghĩa cho động từ \"behaved\" nên cần trạng từ: \"behaved responsibly\" (cư xử có trách nhiệm). \"responsible\" là tính từ; hai phương án còn lại là danh từ."}],"gapfill":[{"num":1,"sentence":"Complete the ______ form and attach two recent photographs.","answer":"application"},{"num":2,"sentence":"This rule is not ______ to part-time teachers.","answer":"applicable"},{"num":3,"sentence":"The course leads to full ______ as a primary school teacher.","answer":"certification"},{"num":4,"sentence":"You need two more years of study to ______ as a lawyer.","answer":"qualify"},{"num":5,"sentence":"Her doctor gave her a ______ to the eye hospital in the city.","answer":"referral"},{"num":6,"sentence":"Every teacher is ______ for the safety of the children in class.","answer":"responsible"},{"num":7,"sentence":"Looking after the school library is her main ______ this year.","answer":"responsibility"},{"num":8,"sentence":"He passed the ball to his ______ standing near the goal.","answer":"teammate"},{"num":9,"sentence":"The success of this project depends on good ______.","answer":"teamwork"},{"num":10,"sentence":"Any complaint about a teacher should be sent to the ______.","answer":"principal"}]},"6":{"title":"WRITING","words":[{"word":"curriculum vitae (CV)","ipa":"/kəˌrɪkjələm ˈviːtaɪ/","pos":"n.","meaning":"sơ yếu lý lịch, CV"},{"word":"have a passion for","ipa":"/hæv ə ˈpæʃn fə(r)/","pos":"phr.v","meaning":"có đam mê với"},{"word":"enthusiastic","ipa":"/ɪnˌθjuːziˈæstɪk/","pos":"adj.","meaning":"nhiệt tình, hăng hái"},{"word":"enthusiastically","ipa":"/ɪnˌθjuːziˈæstɪkli/","pos":"adv.","meaning":"một cách nhiệt tình"},{"word":"enthusiasm","ipa":"/ɪnˈθjuːziæzəm/","pos":"n.","meaning":"sự nhiệt tình"},{"word":"enthusiast","ipa":"/ɪnˈθjuːziæst/","pos":"n.","meaning":"người say mê, người nhiệt huyết"},{"word":"graduation","ipa":"/ˌɡrædʒuˈeɪʃn/","pos":"n.","meaning":"sự tốt nghiệp"},{"word":"graduate","ipa":"/ˈɡrædʒuət/","pos":"n.","meaning":"người tốt nghiệp"},{"word":"graduate","ipa":"/ˈɡrædʒueɪt/","pos":"v.","meaning":"tốt nghiệp"},{"word":"passionate about","ipa":"/ˈpæʃənət əˈbaʊt/","pos":"adj. phr.","meaning":"đam mê về"},{"word":"passionately","ipa":"/ˈpæʃənətli/","pos":"adv.","meaning":"một cách say mê"},{"word":"passion","ipa":"/ˈpæʃn/","pos":"n.","meaning":"niềm đam mê"},{"word":"gain","ipa":"/ɡeɪn/","pos":"v.","meaning":"đạt được, thu được"},{"word":"gain","ipa":"/ɡeɪn/","pos":"n.","meaning":"sự gia tăng; lợi ích"},{"word":"volunteer","ipa":"/ˌvɒlənˈtɪə(r)/","pos":"n.","meaning":"tình nguyện viên"},{"word":"volunteer","ipa":"/ˌvɒlənˈtɪə(r)/","pos":"v.","meaning":"tình nguyện"},{"word":"voluntary","ipa":"/ˈvɒləntri/","pos":"adj.","meaning":"tự nguyện"},{"word":"voluntarily","ipa":"/ˌvɒlənˈterəli/","pos":"adv.","meaning":"một cách tự nguyện"},{"word":"orphanage","ipa":"/ˈɔːfənɪdʒ/","pos":"n.","meaning":"trại trẻ mồ côi"}],"mcq":[{"num":1,"question":"The children were extremely ______ about the school trip to Ha Long Bay.","options":["enthusiastic","enthusiasm","enthusiastically","enthusiast"],"answerIndex":0,"explanation":"Sau \"were extremely\" cần tính từ: \"enthusiastic\" (hào hứng). \"enthusiasm\" và \"enthusiast\" là danh từ; \"enthusiastically\" là trạng từ."},{"num":2,"question":"She spoke about her volunteer work with great ______.","options":["enthusiastic","enthusiastically","enthusiast","enthusiasm"],"answerIndex":3,"explanation":"Sau \"with great\" cần danh từ không đếm được: \"enthusiasm\" (sự nhiệt tình). \"enthusiastic\" là tính từ; \"enthusiastically\" là trạng từ; \"enthusiast\" chỉ người."},{"num":3,"question":"The audience clapped ______ at the end of the performance.","options":["enthusiastic","enthusiastically","enthusiasm","enthusiast"],"answerIndex":1,"explanation":"Chỗ trống bổ nghĩa cho động từ \"clapped\" nên cần trạng từ: \"clapped enthusiastically\" (vỗ tay nhiệt liệt)."},{"num":4,"question":"My uncle is a keen football ______ and never misses a match.","options":["enthusiasm","enthusiastic","enthusiast","enthusiastically"],"answerIndex":2,"explanation":"\"a football enthusiast\" (người hâm mộ bóng đá) là danh từ chỉ người. \"enthusiasm\" là danh từ trừu tượng; \"enthusiastic\" là tính từ; \"enthusiastically\" là trạng từ."},{"num":5,"question":"She ______ from university in 2021 with a degree in history.","options":["graduation","graduate","graduated","graduating"],"answerIndex":2,"explanation":"Trạng ngữ \"in 2021\" đòi hỏi động từ chia quá khứ: \"graduated from university\" (tốt nghiệp đại học). \"graduation\" là danh từ; \"graduate\" sai thì; \"graduating\" là V-ing."},{"num":6,"question":"The whole family came to her ______ ceremony last Saturday.","options":["graduate","graduation","graduated","graduating"],"answerIndex":1,"explanation":"Trước danh từ \"ceremony\" cần danh từ bổ nghĩa: \"graduation ceremony\" (lễ tốt nghiệp). \"graduate\" chỉ người; \"graduated/graduating\" là dạng động từ."},{"num":7,"question":"He has always had a real ______ for cooking and food photography.","options":["passionate","passionately","passions","passion"],"answerIndex":3,"explanation":"Sau \"a real\" cần danh từ số ít: \"a passion for sth\" (niềm đam mê với điều gì). \"passionate\" là tính từ; \"passionately\" là trạng từ; \"passions\" số nhiều không đi với \"a\"."},{"num":8,"question":"She is deeply ______ about helping street children in the city.","options":["passionate","passion","passionately","passions"],"answerIndex":0,"explanation":"\"be passionate about sth\" (say mê, tâm huyết với điều gì) là cấu trúc cố định, cần tính từ. \"passion/passions\" là danh từ; \"passionately\" là trạng từ."},{"num":9,"question":"Volunteering is an excellent way to ______ practical experience.","options":["gained","gaining","gains","gain"],"answerIndex":3,"explanation":"Sau \"a way to\" cần động từ nguyên thể: \"gain experience\" (tích lũy kinh nghiệm). \"gained\" là quá khứ; \"gaining\" là V-ing; \"gains\" là dạng chia ngôi thứ ba."},{"num":10,"question":"Every summer she ______ at a local orphanage for two months.","options":["volunteers","volunteer","voluntary","voluntarily"],"answerIndex":0,"explanation":"Câu ở thì hiện tại đơn với chủ ngữ \"she\" nên cần \"volunteers\" (làm tình nguyện). \"volunteer\" sai hòa hợp chủ ngữ; \"voluntary\" là tính từ; \"voluntarily\" là trạng từ."},{"num":11,"question":"All the work at the centre is ______ and completely unpaid.","options":["volunteer","voluntarily","voluntary","volunteered"],"answerIndex":2,"explanation":"Sau \"is\" và song song với tính từ \"unpaid\" cần tính từ: \"voluntary\" (tự nguyện, không lương). \"volunteer\" là danh từ/động từ; \"voluntarily\" là trạng từ; \"volunteered\" là động từ chia quá khứ."},{"num":12,"question":"He ______ gave up his weekends to help build the new school.","options":["voluntary","voluntarily","volunteer","volunteered"],"answerIndex":1,"explanation":"Chỗ trống bổ nghĩa cho động từ \"gave up\" nên cần trạng từ: \"voluntarily\" (một cách tự nguyện). \"voluntary\" là tính từ; \"volunteer/volunteered\" là động từ."},{"num":13,"question":"The charity has built a new ______ for fifty children in the province.","options":["orphanage","graduation","enthusiasm","diploma"],"answerIndex":0,"explanation":"Nơi nuôi dưỡng trẻ mồ côi là \"orphanage\" (trại trẻ mồ côi). \"graduation\" (sự tốt nghiệp), \"enthusiasm\" (sự nhiệt tình) và \"diploma\" (bằng cấp) không phải công trình được xây cho trẻ em."}],"gapfill":[{"num":1,"sentence":"Attach an up-to-date ______ to your application letter.","answer":"CV"},{"num":2,"sentence":"He has a lifelong ______ for classical music and plays the violin.","answer":"passion"},{"num":3,"sentence":"She is ______ about teaching children with special needs.","answer":"passionate"},{"num":4,"sentence":"The volunteers worked with great ______ all through the weekend.","answer":"enthusiasm"},{"num":5,"sentence":"Her teachers described her as bright, hard-working and ______.","answer":"enthusiastic"},{"num":6,"sentence":"He ______ a lot of useful experience during his summer internship.","answer":"gained"},{"num":7,"sentence":"She hopes to ______ from medical school next June.","answer":"graduate"},{"num":8,"sentence":"All the helpers at the centre work on a ______ basis.","answer":"voluntary"},{"num":9,"sentence":"He ______ agreed to work on Saturday morning to finish the project.","answer":"voluntarily"},{"num":10,"sentence":"The club raises money for a small ______ in the countryside.","answer":"orphanage"}]},"7":{"title":"COMMUNICATION AND CULTURE/ CILL","words":[{"word":"process","ipa":"/ˈprəʊses/","pos":"n., v.","meaning":"quá trình; xử lý"},{"word":"processed","ipa":"/ˈprəʊsest/","pos":"adj.","meaning":"đã qua chế biến/xử lý"},{"word":"processing","ipa":"/ˈprəʊsesɪŋ/","pos":"n.","meaning":"sự xử lý"},{"word":"challenging","ipa":"/ˈtʃælɪndʒɪŋ/","pos":"adj.","meaning":"đầy thử thách"},{"word":"challenge","ipa":"/ˈtʃælɪndʒ/","pos":"n., v.","meaning":"thử thách; thách thức"},{"word":"a job vacancy","ipa":"/ə dʒɒb ˈveɪkənsi/","pos":"n.","meaning":"vị trí tuyển dụng"},{"word":"vacancy","ipa":"/ˈveɪkənsi/","pos":"n.","meaning":"chỗ trống, vị trí còn tuyển"},{"word":"recruit","ipa":"/rɪˈkruːt/","pos":"v., n.","meaning":"tuyển dụng; người mới được tuyển"},{"word":"recruitment","ipa":"/rɪˈkruːtmənt/","pos":"n.","meaning":"sự tuyển dụng"},{"word":"recruiter","ipa":"/rɪˈkruːtə(r)/","pos":"n.","meaning":"người tuyển dụng"},{"word":"reference","ipa":"/ˈrefrəns/","pos":"n., v.","meaning":"tài liệu/người tham khảo; tham chiếu"},{"word":"content creator","ipa":"/ˈkɒntent kriˈeɪtə(r)/","pos":"n.","meaning":"nhà sáng tạo nội dung"},{"word":"create","ipa":"/kriˈeɪt/","pos":"v.","meaning":"tạo ra"},{"word":"creator","ipa":"/kriˈeɪtə(r)/","pos":"n.","meaning":"người sáng tạo"},{"word":"creative","ipa":"/kriˈeɪtɪv/","pos":"adj.","meaning":"sáng tạo"},{"word":"creativity","ipa":"/ˌkriːeɪˈtɪvəti/","pos":"n.","meaning":"tính sáng tạo, ốc sáng tạo"},{"word":"creation","ipa":"/kriˈeɪʃn/","pos":"n.","meaning":"sự tạo ra; tác phẩm"},{"word":"offence","ipa":"/əˈfens/","pos":"n.","meaning":"hành vi phạm pháp; sự xúc phạm"},{"word":"offend","ipa":"/əˈfend/","pos":"v.","meaning":"xúc phạm; phạm tội"},{"word":"offender","ipa":"/əˈfendə(r)/","pos":"n.","meaning":"người phạm tội"},{"word":"offensive","ipa":"/əˈfensɪv/","pos":"adj.","meaning":"xúc phạm; tấn công"},{"word":"detective","ipa":"/dɪˈtektɪv/","pos":"n.","meaning":"thám tử"},{"word":"detect","ipa":"/dɪˈtekt/","pos":"v.","meaning":"phát hiện"},{"word":"detection","ipa":"/dɪˈtekʃn/","pos":"n.","meaning":"sự phát hiện"}],"mcq":[{"num":1,"question":"The whole application ______ takes about three weeks.","options":["offence","vacancy","detection","process"],"answerIndex":3,"explanation":"\"the application process\" (quy trình nộp đơn) là cụm chuẩn. \"offence\" (hành vi phạm pháp), \"vacancy\" (vị trí trống) và \"detection\" (sự phát hiện) sai nghĩa."},{"num":2,"question":"Doctors advise us to eat less ______ food and more fresh vegetables.","options":["process","processing","processed","processor"],"answerIndex":2,"explanation":"Trước danh từ \"food\" cần tính từ: \"processed food\" (thực phẩm chế biến sẵn). \"process/processing/processor\" là danh từ hoặc động từ."},{"num":3,"question":"It was the most ______ project our team has ever worked on.","options":["challenge","challenging","challenged","challenges"],"answerIndex":1,"explanation":"Sau \"the most\" và trước danh từ \"project\" cần tính từ: \"challenging\" (đầy thử thách). \"challenge/challenges\" là danh từ; \"challenged\" là phân từ."},{"num":4,"question":"The hotel advertised a/an ______ for a night manager last week.","options":["vacancy","reference","offence","creation"],"answerIndex":0,"explanation":"Vị trí còn trống cần tuyển là \"a vacancy\". \"reference\" (thư giới thiệu), \"offence\" (hành vi phạm pháp) và \"creation\" (sự sáng tạo) sai nghĩa."},{"num":5,"question":"The army plans to ______ two thousand young people this year.","options":["recruitment","recruiter","recruited","recruit"],"answerIndex":3,"explanation":"Sau \"plans to\" cần động từ nguyên thể: \"recruit\" (tuyển dụng). \"recruitment/recruiter\" là danh từ; \"recruited\" sai dạng sau \"to\"."},{"num":6,"question":"The ______ process now includes an online test and two interviews.","options":["recruit","recruitment","recruiter","recruited"],"answerIndex":1,"explanation":"Trước danh từ \"process\" cần danh từ bổ nghĩa: \"the recruitment process\" (quy trình tuyển dụng). \"recruit\" là động từ; \"recruiter\" chỉ người; \"recruited\" là phân từ."},{"num":7,"question":"The ______ asked me why I wanted to change jobs.","options":["recruitment","recruit","recruiter","recruited"],"answerIndex":2,"explanation":"Người đặt câu hỏi phỏng vấn là \"recruiter\" (nhà tuyển dụng). \"recruitment\" là quá trình tuyển dụng; \"recruit/recruited\" là động từ."},{"num":8,"question":"My former manager has agreed to write a/an ______ for me.","options":["reference","vacancy","offence","process"],"answerIndex":0,"explanation":"Thư nhận xét do cấp trên cũ viết là \"a reference\" (thư giới thiệu). \"vacancy\", \"offence\" và \"process\" không phải văn bản được viết cho ứng viên."},{"num":9,"question":"As a/an ______, she posts short videos on social media every day.","options":["content creator","detective","offender","recruiter"],"answerIndex":0,"explanation":"Người làm và đăng video trên mạng xã hội là \"content creator\" (nhà sáng tạo nội dung). \"detective\" (thám tử), \"offender\" (người phạm tội) và \"recruiter\" (nhà tuyển dụng) làm việc khác."},{"num":10,"question":"This kind of work requires imagination and a great deal of ______.","options":["creative","create","creation","creativity"],"answerIndex":3,"explanation":"Sau \"a great deal of\" cần danh từ không đếm được: \"creativity\" (tính sáng tạo). \"creative\" là tính từ; \"create\" là động từ; \"creation\" chỉ một tác phẩm hoặc việc tạo ra cái gì cụ thể."},{"num":11,"question":"The team came up with a very ______ answer to the problem.","options":["creativity","creative","create","creation"],"answerIndex":1,"explanation":"Trước danh từ \"answer\" cần tính từ: \"a creative answer\" (câu trả lời sáng tạo). \"creativity/creation\" là danh từ; \"create\" là động từ."},{"num":12,"question":"Driving without a licence is a serious ______ in this country.","options":["offend","offender","offence","offensive"],"answerIndex":2,"explanation":"Sau \"a serious\" cần danh từ chỉ hành vi phạm pháp: \"offence\". \"offend\" là động từ; \"offender\" chỉ người phạm tội; \"offensive\" là tính từ."},{"num":13,"question":"The company apologised for the ______ advertisement and withdrew it.","options":["offensive","offend","offence","offender"],"answerIndex":0,"explanation":"Trước danh từ \"advertisement\" cần tính từ: \"an offensive advertisement\" (quảng cáo gây xúc phạm). \"offend\" là động từ; \"offence/offender\" là danh từ."},{"num":14,"question":"A ______ was called in to investigate the theft at the museum.","options":["detect","detection","detective","detected"],"answerIndex":2,"explanation":"Người điều tra vụ trộm là \"detective\" (thám tử, điều tra viên). \"detect/detected\" là động từ; \"detection\" là danh từ trừu tượng."},{"num":15,"question":"This modern machine can ______ very small amounts of gas in the air.","options":["detection","detect","detective","detected"],"answerIndex":1,"explanation":"Sau \"can\" cần động từ nguyên thể: \"detect\" (phát hiện). \"detection\" là danh từ; \"detective\" chỉ người; \"detected\" sai dạng sau động từ khuyết thiếu."}],"gapfill":[{"num":1,"sentence":"Learning Japanese in one year was a real ______ for him.","answer":"challenge"},{"num":2,"sentence":"The ______ of the company's new logo took several months.","answer":"creation"},{"num":3,"sentence":"Walt Disney was the ______ of Mickey Mouse.","answer":"creator"},{"num":4,"sentence":"Early ______ of the disease saves thousands of lives every year.","answer":"detection"},{"num":5,"sentence":"She was deeply ______ by his rude comment about her work.","answer":"offended"},{"num":6,"sentence":"The young ______ was given community service instead of prison.","answer":"offender"},{"num":7,"sentence":"Data ______ is now done automatically by the computer.","answer":"processing"},{"num":8,"sentence":"Please send two ______ together with your application form.","answer":"references"},{"num":9,"sentence":"Large companies ______ hundreds of graduates every single year.","answer":"recruit"},{"num":10,"sentence":"Making a documentary film is a long and expensive ______.","answer":"process"}]}},"10":{"1":{"title":"GETTING STARTED","words":[{"word":"lifelong learning","ipa":"/ˌlaɪflɒŋ ˈlɜːnɪŋ/","pos":"n.phr.","meaning":"học tập suốt đời"},{"word":"increase","ipa":"/ɪnˈkriːs/","pos":"v.","meaning":"tăng lên"},{"word":"font size","ipa":"/fɒnt saɪz/","pos":"n.phr.","meaning":"cỡ chữ"},{"word":"rapidly","ipa":"/ˈræpɪdli/","pos":"adv.","meaning":"nhanh chóng"},{"word":"improve","ipa":"/ɪmˈpruːv/","pos":"v.","meaning":"cải thiện"},{"word":"maintain","ipa":"/meɪnˈteɪn/","pos":"v.","meaning":"duy trì"},{"word":"current events","ipa":"/ˈkʌrənt ɪˈvents/","pos":"n.phr.","meaning":"các sự kiện thời sự"},{"word":"summary","ipa":"/ˈsʌməri/","pos":"n.","meaning":"bản tóm tắt"},{"word":"reading club","ipa":"/ˈriːdɪŋ klʌb/","pos":"n.phr.","meaning":"câu lạc bộ đọc sách"},{"word":"book report","ipa":"/bʊk rɪˈpɔːt/","pos":"n.phr.","meaning":"bài giới thiệu/tóm tắt sách"},{"word":"encourage","ipa":"/ɪnˈkʌrɪdʒ/","pos":"v.","meaning":"khuyến khích"},{"word":"attend","ipa":"/əˈtend/","pos":"v.","meaning":"tham dự"},{"word":"attendee","ipa":"/əˌtenˈdiː/","pos":"n.","meaning":"người tham dự"}],"mcq":[{"num":1,"question":"______ means continuing to study and learn throughout your whole life.","options":["Current events","Lifelong learning","Font size","Book report"],"answerIndex":1,"explanation":"Định nghĩa \"continuing to study throughout your whole life\" chính là \"lifelong learning\" (học tập suốt đời). \"current events\" (thời sự), \"font size\" (cỡ chữ) và \"book report\" (bài giới thiệu sách) sai nghĩa."},{"num":2,"question":"You can ______ the font size if the letters on the screen are too small.","options":["increase","attend","encourage","maintain"],"answerIndex":0,"explanation":"\"increase the font size\" (tăng cỡ chữ) là giải pháp cho chữ quá nhỏ. \"attend\" (tham dự), \"encourage\" (khuyến khích) và \"maintain\" (duy trì) không đi với \"the font size\" theo nghĩa này."},{"num":3,"question":"Older readers often make the ______ bigger on their phones and tablets.","options":["book report","reading club","font size","summary"],"answerIndex":2,"explanation":"Thứ có thể làm to nhỏ trên màn hình là \"font size\" (cỡ chữ). \"book report\", \"reading club\" và \"summary\" không phải thuộc tính hiển thị của màn hình."},{"num":4,"question":"Technology is changing so ______ that we must go on learning all our lives.","options":["successfully","broadly","psychologically","rapidly"],"answerIndex":3,"explanation":"\"changing so rapidly\" (thay đổi nhanh đến mức) giải thích được vì sao phải học suốt đời. \"successfully\" (một cách thành công), \"broadly\" (một cách khái quát) và \"psychologically\" (về mặt tâm lý) không diễn tả tốc độ."},{"num":5,"question":"Reading in English every day is the best way to ______ your vocabulary.","options":["attend","maintain","improve","encourage"],"answerIndex":2,"explanation":"\"improve your vocabulary\" (cải thiện, mở rộng vốn từ) đúng với việc đọc mỗi ngày. \"maintain\" chỉ giữ nguyên mức hiện có nên không phải \"the best way\" khi nói về tiến bộ; \"attend\" và \"encourage\" sai nghĩa."},{"num":6,"question":"Regular practice helps you ______ the skills you have already learnt.","options":["maintain","increase","attend","encourage"],"answerIndex":0,"explanation":"Chi tiết \"the skills you have already learnt\" chốt nghĩa \"maintain\" (duy trì những gì đã có). \"increase\" nói về việc tăng thêm; \"attend\" và \"encourage\" sai nghĩa."},{"num":7,"question":"Reading a newspaper every morning keeps you informed about ______.","options":["font size","current events","book reports","reading clubs"],"answerIndex":1,"explanation":"\"be informed about current events\" (nắm được tin tức thời sự) là cụm chuẩn khi nói về việc đọc báo. Ba phương án còn lại không phải nội dung tin tức."},{"num":8,"question":"Write a short ______ of the article in your own words.","options":["attendee","font size","reading club","summary"],"answerIndex":3,"explanation":"\"write a summary of sth\" (viết bản tóm tắt về điều gì) là collocation chuẩn. \"attendee\" chỉ người tham dự; \"font size\" và \"reading club\" sai nghĩa."},{"num":9,"question":"She has joined a ______ that meets every Friday to discuss a novel.","options":["book report","current event","reading club","font size"],"answerIndex":2,"explanation":"Nhóm gặp nhau hằng tuần để bàn về sách là \"reading club\" (câu lạc bộ đọc sách). \"book report\" là bài viết; \"current event\" là sự kiện thời sự; \"font size\" là cỡ chữ."},{"num":10,"question":"Each student must hand in a/an ______ at the end of the month.","options":["reading club","book report","attendee","font size"],"answerIndex":1,"explanation":"Bài viết nộp cho giáo viên là \"book report\" (bài giới thiệu, tóm tắt sách). \"reading club\" là một nhóm; \"attendee\" chỉ người; \"font size\" là cỡ chữ."},{"num":11,"question":"Parents should ______ their children to read for pleasure, not just for exams.","options":["encourage","attend","increase","maintain"],"answerIndex":0,"explanation":"\"encourage sb to do sth\" (khuyến khích ai làm gì) đúng cấu trúc với \"their children to read\". \"attend\", \"increase\" và \"maintain\" không đi với cấu trúc \"sb to do sth\" theo nghĩa này."},{"num":12,"question":"All ______ received a certificate at the end of the workshop.","options":["attend","attended","attending","attendees"],"answerIndex":3,"explanation":"Chủ ngữ số nhiều chỉ người cần danh từ: \"attendees\" (người tham dự). \"attend/attended\" là động từ; \"attending\" là V-ing."}],"gapfill":[{"num":1,"sentence":"She tries to ______ evening classes twice a week after work.","answer":"attend"},{"num":2,"sentence":"More than two hundred ______ came to the seminar on Saturday.","answer":"attendees"},{"num":3,"sentence":"He reads the news every morning in order to follow ______.","answer":"current events"},{"num":4,"sentence":"Good teachers always ______ their students to ask questions.","answer":"encourage"},{"num":5,"sentence":"Listening to podcasts every day can ______ your English quickly.","answer":"improve"},{"num":6,"sentence":"Libraries have seen a big ______ in the number of young readers.","answer":"increase"},{"num":7,"sentence":"______ is now considered essential in almost every profession.","answer":"Lifelong learning"},{"num":8,"sentence":"It is difficult to ______ a foreign language if you never use it.","answer":"maintain"},{"num":9,"sentence":"The number of online courses has grown ______ in the last five years.","answer":"rapidly"},{"num":10,"sentence":"Please write a one-page ______ of the book you have just read.","answer":"summary"}]},"2":{"title":"LANGUAGE","words":[{"word":"night school","ipa":"/naɪt skuːl/","pos":"n.phr.","meaning":"trường học buổi tối"},{"word":"distance learning","ipa":"/ˈdɪstəns ˈlɜːnɪŋ/","pos":"n.phr.","meaning":"học từ xa"},{"word":"well-rounded","ipa":"/ˌwel ˈraʊndɪd/","pos":"adj.","meaning":"toàn diện"},{"word":"learning community","ipa":"/ˈlɜːnɪŋ kəˈmjuːnəti/","pos":"n.phr.","meaning":"cộng đồng học tập"},{"word":"adult education","ipa":"/ˈædʌlt ˌedʒuˈkeɪʃn/","pos":"n.phr.","meaning":"giáo dục người lớn"},{"word":"lifelong learning","ipa":"/ˌlaɪflɒŋ ˈlɜːnɪŋ/","pos":"n.phr.","meaning":"học tập suốt đời"}],"mcq":[{"num":1,"question":"He works in a factory during the day and studies at ______ three evenings a week.","options":["distance learning","night school","adult education","learning community"],"answerIndex":1,"explanation":"\"study at night school\" (học ở trường buổi tối) là cụm chuẩn, khớp với \"three evenings a week\". \"distance learning\" là học từ xa; \"adult education\" là hệ giáo dục cho người lớn nói chung; \"learning community\" là cộng đồng học tập."},{"num":2,"question":"______ allows students in remote villages to follow university courses without leaving home.","options":["Night school","Adult education","Distance learning","Learning community"],"answerIndex":2,"explanation":"Chi tiết \"without leaving home\" chốt nghĩa \"distance learning\" (học từ xa). \"night school\" vẫn phải đến trường; \"adult education\" và \"learning community\" không nói đến khoảng cách địa lý."},{"num":3,"question":"The school aims to give every child a/an ______ education, not just good exam results.","options":["relevant","imprisoned","self-directed","well-rounded"],"answerIndex":3,"explanation":"\"a well-rounded education\" (nền giáo dục toàn diện) đối lập với \"just good exam results\". \"relevant\" (có liên quan), \"imprisoned\" (bị bỏ tù) và \"self-directed\" (tự định hướng) không mô tả được tính toàn diện."},{"num":4,"question":"The online forum has become a real ______ where members help one another every day.","options":["learning community","night school","book report","font size"],"answerIndex":0,"explanation":"Nhóm người cùng học và giúp nhau trực tuyến là \"learning community\" (cộng đồng học tập). \"night school\" là trường lớp cụ thể; \"book report\" và \"font size\" sai nghĩa."},{"num":5,"question":"The centre runs ______ classes for people over forty who left school long ago.","options":["martial arts","current events","adult education","book reports"],"answerIndex":2,"explanation":"Lớp học dành cho người lớn tuổi đã rời ghế nhà trường là \"adult education\" (giáo dục người lớn). \"martial arts\" (võ thuật), \"current events\" (thời sự) và \"book reports\" (bài giới thiệu sách) là nội dung cụ thể, không phải hệ giáo dục."},{"num":6,"question":"The idea behind ______ is that education never really stops at any age.","options":["night school","lifelong learning","adult education","distance learning"],"answerIndex":1,"explanation":"Định nghĩa \"education never really stops at any age\" chính là \"lifelong learning\" (học tập suốt đời). Ba phương án còn lại chỉ một hình thức hoặc một giai đoạn học tập cụ thể."},{"num":7,"question":"Evening classes can help adults ______ their chances of promotion at work.","options":["improve","attend","encourage","maintain"],"answerIndex":0,"explanation":"\"improve your chances\" (cải thiện cơ hội) là collocation chuẩn. \"attend\" (tham dự), \"encourage\" (khuyến khích) và \"maintain\" (duy trì) không đi với \"chances of promotion\" theo nghĩa nâng cao."},{"num":8,"question":"More than fifty adults ______ the computer class every Tuesday evening.","options":["improve","encourage","increase","attend"],"answerIndex":3,"explanation":"\"attend a class\" (tham dự một lớp học) là collocation chuẩn. \"improve\", \"encourage\" và \"increase\" không đi với \"the computer class\"."},{"num":9,"question":"The company will ______ all its staff to take at least one online course.","options":["encourage","attend","improve","increase"],"answerIndex":0,"explanation":"\"encourage sb to do sth\" (khuyến khích ai làm gì) đúng cấu trúc với \"all its staff to take\". Ba động từ còn lại không đi với cấu trúc này."},{"num":10,"question":"At the end of each unit there is a short ______ of the main points.","options":["learning community","summary","night school","font size"],"answerIndex":1,"explanation":"Phần tóm tắt các ý chính cuối bài là \"summary\" (bản tóm tắt). \"learning community\", \"night school\" và \"font size\" sai nghĩa."}],"gapfill":[{"num":1,"sentence":"He goes to ______ after work to study accounting.","answer":"night school"},{"num":2,"sentence":"______ suits students who live a long way from any university.","answer":"Distance learning"},{"num":3,"sentence":"Sport, music and science all form part of a ______ education.","answer":"well-rounded"},{"num":4,"sentence":"Our online forum has grown into a friendly ______.","answer":"learning community"},{"num":5,"sentence":"The town centre runs ______ classes for people over forty.","answer":"adult education"},{"num":6,"sentence":"______ is a habit that keeps the mind active in old age.","answer":"Lifelong learning"},{"num":7,"sentence":"Write a short ______ of the chapter you have just read.","answer":"summary"},{"num":8,"sentence":"Free evening classes ______ many adults to return to study.","answer":"encourage"},{"num":9,"sentence":"She hopes the course will ______ her chances of promotion.","answer":"improve"},{"num":10,"sentence":"About thirty people ______ the workshop last Saturday morning.","answer":"attend"}]},"3":{"title":"READING","words":[{"word":"vocational school","ipa":"/vəʊˈkeɪʃənl skuːl/","pos":"n.phr.","meaning":"trường dạy nghề"},{"word":"professional development","ipa":"/prəˈfeʃənl dɪˈveləpmənt/","pos":"n.phr.","meaning":"phát triển nghề nghiệp"},{"word":"relevant","ipa":"/ˈreləvənt/","pos":"adj.","meaning":"phù hợp, có liên quan"},{"word":"workplace","ipa":"/ˈwɜːkpleɪs/","pos":"n.","meaning":"nơi làm việc"},{"word":"widen","ipa":"/ˈwaɪdn/","pos":"v.","meaning":"mở rộng"},{"word":"employment opportunities","ipa":"/ɪmˈplɔɪmənt ˌɒpəˈtjuːnətiz/","pos":"n.phr.","meaning":"cơ hội việc làm"},{"word":"informed decision","ipa":"/ɪnˈfɔːmd dɪˈsɪʒn/","pos":"n.phr.","meaning":"quyết định sáng suốt"},{"word":"participate","ipa":"/pɑːˈtɪsɪpeɪt/","pos":"v.","meaning":"tham gia"},{"word":"distance learning course","ipa":"/ˈdɪstəns ˈlɜːnɪŋ kɔːs/","pos":"n.phr.","meaning":"khóa học từ xa"},{"word":"hardship","ipa":"/ˈhɑːdʃɪp/","pos":"n.","meaning":"khó khăn, gian khổ"},{"word":"imprisoned","ipa":"/ɪmˈprɪznd/","pos":"adj.","meaning":"bị bỏ tù"},{"word":"martial arts","ipa":"/ˌmɑːʃl ˈɑːts/","pos":"n.phr.","meaning":"võ thuật"},{"word":"lifelong journey","ipa":"/ˌlaɪflɒŋ ˈdʒɜːni/","pos":"n.phr.","meaning":"hành trình suốt đời"}],"mcq":[{"num":1,"question":"After secondary school he went to a ______ to train as an electrician.","options":["reading club","vocational school","workplace","learning community"],"answerIndex":1,"explanation":"Nơi đào tạo nghề cụ thể như thợ điện là \"vocational school\" (trường dạy nghề). \"reading club\" (câu lạc bộ đọc sách), \"workplace\" (nơi làm việc) và \"learning community\" (cộng đồng học tập) không cấp bằng nghề."},{"num":2,"question":"The company pays for courses as part of its staff ______ programme.","options":["martial arts","lifelong journey","professional development","informed decision"],"answerIndex":2,"explanation":"\"professional development\" (phát triển nghề nghiệp) là tên chương trình đào tạo nhân viên. \"martial arts\", \"lifelong journey\" và \"informed decision\" không phải chương trình do công ty chi trả cho nhân viên."},{"num":3,"question":"Choose a course that is ______ to the job you really want to do.","options":["relevant","imprisoned","well-rounded","self-directed"],"answerIndex":0,"explanation":"\"be relevant to sth\" (có liên quan, phù hợp với điều gì) là cấu trúc cố định. \"imprisoned\" (bị bỏ tù), \"well-rounded\" (toàn diện) và \"self-directed\" (tự định hướng) không đi với \"to the job\" theo nghĩa này."},{"num":4,"question":"Many practical skills are learnt in the ______ rather than in the classroom.","options":["hardship","summary","attendee","workplace"],"answerIndex":3,"explanation":"Nơi đối lập với lớp học khi nói về kỹ năng thực tế là \"the workplace\" (nơi làm việc). \"hardship\" (khó khăn), \"summary\" (bản tóm tắt) và \"attendee\" (người tham dự) không phải địa điểm."},{"num":5,"question":"Learning a second language can greatly ______ your job opportunities.","options":["widen","participate","imprison","summarise"],"answerIndex":0,"explanation":"\"widen your opportunities\" (mở rộng cơ hội) là collocation chuẩn. \"participate\" (tham gia), \"imprison\" (bỏ tù) và \"summarise\" (tóm tắt) sai nghĩa."},{"num":6,"question":"A degree in computing opens up many ______ both at home and abroad.","options":["martial arts","current events","employment opportunities","book reports"],"answerIndex":2,"explanation":"\"open up employment opportunities\" (mở ra cơ hội việc làm) là cụm chuẩn khi nói về bằng cấp. Ba cụm còn lại không phải cơ hội nghề nghiệp."},{"num":7,"question":"Read about several universities so that you can make a/an ______.","options":["lifelong journey","distance learning course","vocational school","informed decision"],"answerIndex":3,"explanation":"\"make an informed decision\" (đưa ra quyết định sáng suốt dựa trên hiểu biết) là cụm cố định, khớp với \"read about several universities\". Ba cụm còn lại không đi với động từ \"make\" theo nghĩa này."},{"num":8,"question":"All students are expected to ______ actively in class discussions.","options":["widen","participate","maintain","imprison"],"answerIndex":1,"explanation":"\"participate in sth\" (tham gia vào điều gì) đúng nghĩa với \"class discussions\". \"widen\" (mở rộng), \"maintain\" (duy trì) và \"imprison\" (bỏ tù) sai nghĩa."},{"num":9,"question":"She is taking a ______ run by a university in Australia.","options":["vocational school","reading club","book report","distance learning course"],"answerIndex":3,"explanation":"Khóa học do trường nước ngoài tổ chức mà người học không cần đến tận nơi là \"distance learning course\" (khóa học từ xa). \"vocational school\" là một trường; \"reading club\" và \"book report\" sai nghĩa."},{"num":10,"question":"He overcame great ______ to become the first doctor in his village.","options":["hardship","summary","workplace","attendee"],"answerIndex":0,"explanation":"\"overcome hardship\" (vượt qua khó khăn, gian khổ) là collocation chuẩn. \"summary\", \"workplace\" và \"attendee\" không phải điều được vượt qua."},{"num":11,"question":"Nelson Mandela was ______ for twenty-seven years before becoming president.","options":["imprison","imprisonment","imprisoned","imprisoning"],"answerIndex":2,"explanation":"Câu bị động \"was + V3\": \"was imprisoned\" (bị cầm tù). \"imprison\" là nguyên thể; \"imprisonment\" là danh từ; \"imprisoning\" là V-ing."},{"num":12,"question":"She has practised ______ such as karate and judo since the age of six.","options":["current events","martial arts","book reports","employment opportunities"],"answerIndex":1,"explanation":"Karate và judo là \"martial arts\" (võ thuật). \"current events\" (thời sự), \"book reports\" (bài giới thiệu sách) và \"employment opportunities\" (cơ hội việc làm) sai nghĩa."},{"num":13,"question":"Learning is a/an ______, not something that ends when you leave school.","options":["informed decision","lifelong journey","vocational school","workplace"],"answerIndex":1,"explanation":"\"a lifelong journey\" (hành trình suốt đời) đối lập với \"something that ends\". \"informed decision\" là một quyết định; \"vocational school\" và \"workplace\" là nơi chốn."}],"gapfill":[{"num":1,"sentence":"Reading widely helps to ______ your knowledge of the world.","answer":"widen"},{"num":2,"sentence":"Everyone must wear a safety helmet in the ______.","answer":"workplace"},{"num":3,"sentence":"Only ______ work experience will be considered by the interviewers.","answer":"relevant"},{"num":4,"sentence":"He learned his trade at a ______ in Da Nang.","answer":"vocational school"},{"num":5,"sentence":"Teachers attend short courses every summer for their ______.","answer":"professional development"},{"num":6,"sentence":"Students who ______ actively in class usually learn much faster.","answer":"participate"},{"num":7,"sentence":"The whole family suffered great ______ during the war years.","answer":"hardship"},{"num":8,"sentence":"He was wrongly ______ for a crime he had not committed.","answer":"imprisoned"},{"num":9,"sentence":"Compare several options before making an ______ choice.","answer":"informed"},{"num":10,"sentence":"Judo and karate are two of the best-known ______.","answer":"martial arts"}]},"4":{"title":"SPEAKING","words":[{"word":"lifelong learner","ipa":"/ˈlaɪflɒŋ/ + /ˈlɜːnə(r)/","pos":"n","meaning":"người học suốt đời"},{"word":"lifelong","ipa":"/ˈlaɪflɒŋ/","pos":"adj","meaning":"suốt đời"},{"word":"learner","ipa":"/ˈlɜːnə(r)/","pos":"n","meaning":"người học"},{"word":"register","ipa":"/ˈredʒɪstə(r)/","pos":"v","meaning":"đăng ký"},{"word":"registration","ipa":"/ˌredʒɪˈstreɪʃn/","pos":"n","meaning":"sự đăng ký"},{"word":"martial arts","ipa":"/ˌmɑːʃl ˈɑːts/","pos":"n","meaning":"võ thuật"},{"word":"martial","ipa":"/ˈmɑːʃl/","pos":"adj","meaning":"thuộc quân sự"},{"word":"self-directed","ipa":"/ˌself dɪˈrektɪd/","pos":"adj","meaning":"tự định hướng"},{"word":"self-direction","ipa":"/ˌself dɪˈrekʃn/","pos":"n","meaning":"sự tự định hướng"},{"word":"highlight","ipa":"/ˈhaɪlaɪt/","pos":"v/n","meaning":"nhấn mạnh; điểm nổi bật"},{"word":"highlighted","ipa":"/ˈhaɪlaɪtɪd/","pos":"adj","meaning":"được nhấn mạnh"},{"word":"take up","ipa":"/teɪk/ + /ʌp/","pos":"v (phrasal verb)","meaning":"bắt đầu (một sở thích)"},{"word":"summary","ipa":"/ˈsʌməri/","pos":"n","meaning":"bản tóm tắt"},{"word":"summarize","ipa":"/ˈsʌməraɪz/","pos":"v","meaning":"tóm tắt"},{"word":"summarization","ipa":"/ˌsʌməraɪˈzeɪʃn/","pos":"n","meaning":"sự tóm tắt"}],"mcq":[{"num":1,"question":"My grandmother is a true ______: she started learning Spanish at seventy.","options":["lifelong learner","registration","summary","highlight"],"answerIndex":0,"explanation":"Người tiếp tục học ở mọi lứa tuổi là \"lifelong learner\" (người học suốt đời). \"registration\" (sự đăng ký), \"summary\" (bản tóm tắt) và \"highlight\" (điểm nổi bật) không chỉ người."},{"num":2,"question":"Adult ______ often study in the evening after a full day at work.","options":["registrations","learners","summaries","highlights"],"answerIndex":1,"explanation":"Người đi học là \"learners\" (người học). \"registrations\", \"summaries\" và \"highlights\" là sự vật, không thể \"study in the evening\"."},{"num":3,"question":"You must ______ for the course before the end of August.","options":["registration","registered","register","registering"],"answerIndex":2,"explanation":"Sau \"must\" cần động từ nguyên thể: \"register for a course\" (đăng ký một khóa học). \"registration\" là danh từ; \"registered/registering\" sai dạng sau động từ khuyết thiếu."},{"num":4,"question":"______ for the new term opens on Monday morning.","options":["Register","Registered","Registering","Registration"],"answerIndex":3,"explanation":"Chủ ngữ của \"opens\" cần danh từ: \"registration\" (việc đăng ký). \"Register\" là động từ; \"Registered\" là phân từ; \"Registering\" là V-ing."},{"num":5,"question":"Online study requires ______ learning and very good time management.","options":["self-directed","martial","highlighted","lifelong"],"answerIndex":0,"explanation":"\"self-directed learning\" (học tập tự định hướng) là cụm chuẩn cho việc tự học trực tuyến. \"martial\" (thuộc quân sự), \"highlighted\" (được nhấn mạnh) và \"lifelong\" (suốt đời) không mô tả được cách học này."},{"num":6,"question":"The course is designed to develop independence and ______.","options":["registration","summarization","highlight","self-direction"],"answerIndex":3,"explanation":"Song song với danh từ trừu tượng \"independence\" cần \"self-direction\" (khả năng tự định hướng). \"registration\", \"summarization\" và \"highlight\" không phải phẩm chất cá nhân."},{"num":7,"question":"The teacher asked us to ______ the key words in the text.","options":["highlighted","highlighting","highlight","highlights"],"answerIndex":2,"explanation":"Sau \"asked us to\" cần động từ nguyên thể: \"highlight\" (đánh dấu, làm nổi bật). Ba phương án còn lại sai dạng sau \"to\"."},{"num":8,"question":"The ______ of the whole trip was a visit to the National Museum.","options":["summary","highlight","registration","learner"],"answerIndex":1,"explanation":"Ở đây \"highlight\" là danh từ chỉ phần thú vị nhất: \"the highlight of the trip\" (điểm nhấn của chuyến đi). \"summary\", \"registration\" và \"learner\" sai nghĩa."},{"num":9,"question":"He decided to ______ photography soon after he retired.","options":["take up","put up","look up","give up"],"answerIndex":0,"explanation":"\"take up a hobby\" (bắt đầu một sở thích mới) đúng nghĩa sau khi nghỉ hưu. \"put up\" (dựng lên), \"look up\" (tra cứu) và \"give up\" (từ bỏ) sai nghĩa, vì ông ấy bắt đầu chứ không từ bỏ."},{"num":10,"question":"In one or two sentences, ______ the main idea of the paragraph.","options":["summary","summarize","summarization","summarized"],"answerIndex":1,"explanation":"Câu mệnh lệnh cần động từ nguyên thể: \"summarize the main idea\" (tóm tắt ý chính). \"summary/summarization\" là danh từ; \"summarized\" là phân từ."},{"num":11,"question":"Read the ______ at the end of the chapter before you start.","options":["summarize","summarization","summary","summarized"],"answerIndex":2,"explanation":"Thứ được đọc ở cuối chương là \"summary\" (bản tóm tắt). \"summarize/summarized\" là động từ; \"summarization\" chỉ quá trình tóm tắt chứ không phải phần văn bản trong sách."},{"num":12,"question":"He has taught ______ to children in this town for fifteen years.","options":["registrations","highlights","summaries","martial arts"],"answerIndex":3,"explanation":"Môn được dạy cho trẻ em ở đây là \"martial arts\" (võ thuật). \"registrations\", \"highlights\" và \"summaries\" không phải môn học."},{"num":13,"question":"Reading has been a ______ habit for her since childhood.","options":["self-directed","martial","lifelong","highlighted"],"answerIndex":2,"explanation":"\"a lifelong habit\" (thói quen suốt đời) khớp với \"since childhood\". \"self-directed\" (tự định hướng), \"martial\" (thuộc quân sự) và \"highlighted\" (được tô sáng) không mô tả được thói quen kéo dài cả đời."}],"gapfill":[{"num":1,"sentence":"Please ______ online before the first of September.","answer":"register"},{"num":2,"sentence":"______ closes at midnight this Friday.","answer":"Registration"},{"num":3,"sentence":"She is a slow but extremely careful ______.","answer":"learner"},{"num":4,"sentence":"Curiosity about the world has been a ______ quality of his.","answer":"lifelong"},{"num":5,"sentence":"He practises ______ in the park every morning before work.","answer":"martial arts"},{"num":6,"sentence":"Successful online students are ______ and well organised.","answer":"self-directed"},{"num":7,"sentence":"The most important sentences are ______ in yellow.","answer":"highlighted"},{"num":8,"sentence":"Could you ______ the article in three short sentences?","answer":"summarize"},{"num":9,"sentence":"Her ______ of the meeting was clear and very short.","answer":"summary"},{"num":10,"sentence":"Many adults ______ a new hobby soon after they retire.","answer":"take up"}]},"5":{"title":"LISTENING","words":[{"word":"determinate","ipa":"/dɪˈtɜːmɪnət/","pos":"adj","meaning":"xác định, rõ ràng"},{"word":"determination","ipa":"/dɪˌtɜːmɪˈneɪʃn/","pos":"n","meaning":"sự quyết tâm"},{"word":"determine","ipa":"/dɪˈtɜːmɪn/","pos":"v","meaning":"xác định, quyết định"},{"word":"support","ipa":"/səˈpɔːt/","pos":"v/n","meaning":"hỗ trợ; sự hỗ trợ"},{"word":"supportive","ipa":"/səˈpɔːtɪv/","pos":"adj","meaning":"mang tính hỗ trợ"},{"word":"supporter","ipa":"/səˈpɔːtə(r)/","pos":"n","meaning":"người ủng hộ"},{"word":"obstacle","ipa":"/ˈɒbstəkl/","pos":"n","meaning":"trở ngại"},{"word":"distraction","ipa":"/dɪˈstrækʃn/","pos":"n","meaning":"sự xao nhãng"},{"word":"distract","ipa":"/dɪˈstrækt/","pos":"v","meaning":"làm phân tâm"},{"word":"distracting","ipa":"/dɪˈstræktɪŋ/","pos":"adj","meaning":"gây xao nhãng"},{"word":"acquire","ipa":"/əˈkwaɪə(r)/","pos":"v","meaning":"đạt được, thu được"},{"word":"acquisition","ipa":"/ˌækwɪˈzɪʃn/","pos":"n","meaning":"sự đạt được"},{"word":"succeed","ipa":"/səkˈsiːd/","pos":"v","meaning":"thành công"},{"word":"success","ipa":"/səkˈses/","pos":"n","meaning":"sự thành công"},{"word":"successful","ipa":"/səkˈsesfl/","pos":"adj","meaning":"thành công"},{"word":"successfully","ipa":"/səkˈsesfəli/","pos":"adv","meaning":"một cách thành công"},{"word":"pursuit","ipa":"/pəˈsjuːt/","pos":"n","meaning":"sự th ess\" là danh từ; \"successful\" là tính từ; \"successfully\" là trạng từ."},{"num":11,"question":"She ______ completed the two-year programme while working full time.","options":["successful","success","successfully","succeed"],"answerIndex":2,"explanation":"Chỗ trống bổ nghĩa cho động từ \"completed\" nên cần trạng từ: \"successfully completed\" (hoàn thành thành công)."},{"num":12,"question":"He decided to ______ his interest in astronomy at university.","options":["pursuit","pursue","pursued","pursuing"],"answerIndex":1,"explanation":"Sau \"decided to\" cần động từ nguyên thể: \"pursue an interest\" (theo đuổi một mối quan tâm). \"pursuit\" là danh từ; \"pursued/pursuing\" sai dạng sau \"to\"."},{"num":13,"question":"Without strong ______, it is very hard to study on your own.","options":["motivate","motivation","motivational","motivated"],"answerIndex":1,"explanation":"Sau tính từ \"strong\" cần danh từ: \"motivation\" (động lực). \"motivate\" là động từ; \"motivational/motivated\" là tính từ."},{"num":14,"question":"Good teachers know exactly how to ______ their students.","options":["motivation","motivational","motivated","motivate"],"answerIndex":3,"explanation":"Sau \"how to\" cần động từ nguyên thể: \"motivate sb\" (truyền động lực cho ai). \"motivation\" là danh từ; \"motivational/motivated\" là tính từ."},{"num":15,"question":"The manager sent an ______ email about tomorrow morning's meeting.","options":["urgency","urge","urgent","urgently"],"answerIndex":2,"explanation":"Trước danh từ \"email\" cần tính từ: \"an urgent email\" (email khẩn). \"urgency\" là danh từ; \"urge\" là động từ/danh từ; \"urgently\" là trạng từ."},{"num":16,"question":"Everyone is welcome to join the club ______ age or experience.","options":["regardless of","instead of","because of","thanks to"],"answerIndex":0,"explanation":"\"regardless of sth\" (bất kể điều gì) đúng nghĩa với lời mời mở rộng cho mọi người. \"instead of\" (thay vì), \"because of\" (bởi vì) và \"thanks to\" (nhờ ely ______ even when the work became very difficult.","options":["focus","focused","focusing","focuses"],"answerIndex":1,"explanation":"Sau động từ nối \"stayed\" cần tính từ: \"stay focused\" (giữ được sự tập trung). \"focus/focuses\" là động từ/danh từ; \"focusing\" là V-ing."},{"num":8,"question":"Teaching is a ______ that requires constant learning and patience.","options":["professional","professionally","profession","professions"],"answerIndex":2,"explanation":"Sau mạo từ \"a\" cần danh từ số ít chỉ nghề: \"profession\" (nghề nghiệp). \"professional\" chỉ người chuyên nghiệp và không hợp với \"Teaching is a …\"; \"professionally\" là trạng từ; \"professions\" số nhiều không đi với \"a\"."},{"num":9,"question":"He is a ______ photographer with more than twenty years' experience.","options":["profession","professionally","professional","professions"],"answerIndex":2,"explanation":"Trước danh từ \"photographer\" cần tính từ: \"a professional photographer\" (nhiếp ảnh gia chuyên nghiệp). \"profession/professions\" là danh từ; \"professionally\" là trạng từ."},{"num":10,"question":"The report was written clearly and very ______.","options":["professional","professionally","profession","professions"],"answerIndex":1,"explanation":"Sau \"clearly and very\" cần trạng từ song song: \"professionally\" (một cách chuyên nghiệp). \"professional\" là tính từ; hai phương án còn lại là danh từ."}],"gapfill":[{"num":1,"sentence":"Daily exercise is ______ to both the body and the mind.","answer":"beneficial"},{"num":2,"sentence":"The course offers many practical ______ for working adults.","answer":"benefits"},{"num":3,"sentence":"Learning Chinese was the biggest ______ of her whole life.","answer":"challenge"},{"num":4,"sentence":"The exercises in this book are ______ but not impossible.","answer":"challenging"},{"num":5,"sentence":"Please ______ on the task and stop chatting with your friends.","answer":"focus"},{"num":6,"sentence":"He remained ______ throughout the three-hou y hài lòng"},{"word":"satisfying","ipa":"/ˈsætɪsfaɪɪŋ/","pos":"adj","meaning":"đem lại sự hài lòng"},{"word":"satisfaction","ipa":"/ˌsætɪsˈfækʃn/","pos":"n","meaning":"sự hài lòng"},{"word":"dissatisfied","ipa":"/ˌdɪsˈsætɪsfaɪd/","pos":"adj","meaning":"không hài lòng"},{"word":"molecular biology","ipa":"","pos":"n","meaning":"sinh học phân tử"},{"word":"molecule","ipa":"/ˈmɒlɪkjuːl/","pos":"n","meaning":"phân tử"},{"word":"molecular","ipa":"/məˈlekjələ(r)/","pos":"adj","meaning":"thuộc phân tử"},{"word":"biology","ipa":"/baɪˈɒlədʒi/","pos":"n","meaning":"sinh học"},{"word":"biological","ipa":"/ˌbaɪəˈlɒdʒɪkl/","pos":"adj","meaning":"thuộc sinh học"},{"word":"biologist","ipa":"/baɪˈɒlədʒɪst/","pos":"n","meaning":"nhà sinh vật học"},{"word":"psychology","ipa":"/saɪˈkɒlədʒi/","pos":"n","meaning":"tâm lý học"},{"word":"psychological","ipa":"/ˌsaɪkəˈlɒdʒɪkl/","pos":"adj","meaning":"thuộc tâm lý"},{"word":"psychologically","ipa":"/ˌsaɪkəˈlɒdʒɪkli/","pos":"adv","meaning":"về mặt tâm lý"},{"word":"psychologist","ipa":"/saɪˈkɒlədʒɪst/","pos":"n","meaning":"nhà tâm lý học"},{"word":"retire","ipa":"/rɪˈtaɪə(r)/","pos":"v","meaning":"nghỉ hưu"},{"word":"retirement","ipa":"/rɪˈtaɪəmənt/","pos":"n","meaning":"sự nghỉ hưu, thời gian nghỉ hưu"}],"mcq":[{"num":1,"question":"______ stands for Bachelor of Arts, the first university degree in many countries.","options":["MA","BA","Biology","Psychology"],"answerIndex":1,"explanation":"\"BA\" là viết tắt của \"Bachelor of Arts\" (cử nhân khối xã hội và nhân văn). \"MA\" là \"Master of Arts\" (thạc sĩ); \"Biology\" và \"Psychology\" là tên ngành học, không phải viết tắt của học vị."},{"num":2,"question":"After her BA she went on to take a ______ in linguistics.","options":["reading club","vocational school","learning community","master's degree"],"answerIndex":3,"explanation":"Bằng cấp học tiếp sau bậc cử nhân là \"master's degree\" (bằng thạc sĩ). \"reading club\", \"vocational school\" và \"learning community\" không phải học vị."},{"num":3,"question":"Travelling and reading can greatly ______ your understanding of other cultures.","options":["broaden","broad","broadly","breadth"],"answerIndex":0,"explanation":"Sau \"can greatly\" cần động từ nguyên thể: \"broaden your understanding\" (mở rộng hiểu biết). \"broad\" là tính từ; \"broadly\" là trạng từ; \"breadth\" là danh từ."},{"num":4,"question":"The programme gives students a ______ knowledge of world history.","options":["broaden","broadly","broad","breadth"],"answerIndex":2,"explanation":"Trước danh từ \"knowledge\" cần tính từ: \"a broad knowledge\" (kiến thức rộng). \"broaden\" là động từ; \"broadly\" là trạng từ; \"breadth\" là danh từ."},{"num":5,"question":"The ______ of his reading impressed all his teachers.","options":["broad","breadth","broaden","broadly"],"answerIndex":1,"explanation":"Chủ ngữ của \"impressed\" cần danh từ: \"the breadth of sth\" (phạm vi rộng của điều gì). \"broad\" là tính từ; \"broaden\" là động từ; \"broadly\" là trạng từ."},{"num":6,"question":"The two education systems are ______ similar, although the exams differ.","options":["broad","broaden","broadly","breadth"],"answerIndex":2,"explanation":"Chỗ trống bổ nghĩa cho tính từ \"similar\" nên cần trạng từ: \"broadly similar\" (về cơ bản là giống nhau)."},{"num":7,"question":"Some scientists believe that ______ can be developed throughout life.","options":["intelligence","intelligent","intelligently","unintelligent"],"answerIndex":0,"explanation":"Chủ ngữ của \"can be developed\" cần danh từ: \"intelligence\" (trí thông minh). \"intelligent/unintelligent\" là tính từ; \"intelligently\" là trạng từ."},{"num":8,"question":"It is quite wrong to call someone ______ just because they learn slowly.","options":["intelligent","intelligence","intelligently","unintelligent"],"answerIndex":3,"explanation":"Ngữ cảnh \"quite wrong to call someone …\" chốt nghĩa tiêu cực \"unintelligent\" (kém thông minh). \"intelligent\" mang nghĩa tích cực nên không phải điều sai trái khi nói ra; \"intelligence\" là danh từ; \"intelligently\" là trạng từ."},{"num":9,"question":"Do not just ______ at home; join a class and learn something new.","options":["take up","sit around","focus on","register for"],"answerIndex":1,"explanation":"\"sit around\" (ngồi không, không làm gì hữu ích) đối lập với lời khuyên \"join a class\". \"take up\" (bắt đầu một sở thích), \"focus on\" (tập trung vào) và \"register for\" (đăng ký) đều cần tân ngữ và mang nghĩa tích cực."},{"num":10,"question":"Studying abroad is a wonderful way to broaden your ______.","options":["horizons","degrees","decisions","obstacles"],"answerIndex":0,"explanation":"\"broaden your horizons\" (mở mang tầm nhìn) là thành ngữ cố định. \"degrees\", \"decisions\" và \"obstacles\" không đi với \"broaden your\" theo nghĩa này."},{"num":11,"question":"After many years she finally found a ______ job in a small publishing house.","options":["satisfied","satisfaction","satisfy","satisfying"],"answerIndex":3,"explanation":"Trước danh từ \"job\" cần tính từ chủ động: \"a satisfying job\" (công việc đem lại sự hài lòng). \"satisfied\" mô tả người cảm thấy hài lòng; \"satisfaction\" là danh từ; \"satisfy\" là động từ."},{"num":12,"question":"Most graduates say that they are ______ with the training they received.","options":["satisfying","satisfaction","satisfied","satisfy"],"answerIndex":2,"explanation":"\"be satisfied with sth\" (hài lòng với điều gì) là cấu trúc cố định dùng cho người. \"satisfying\" mô tả thứ gây hài lòng và không đi với \"with\"; \"satisfaction\" là danh từ; \"satisfy\" là động từ."},{"num":13,"question":"Teaching adults to read gives her enormous ______.","options":["satisfaction","satisfy","satisfied","satisfying"],"answerIndex":0,"explanation":"Sau \"enormous\" cần danh từ không đếm được: \"satisfaction\" (sự hài lòng, mãn nguyện). \"satisfy\" là động từ; \"satisfied/satisfying\" là tính từ."},{"num":14,"question":"He is now doing research in ______ at a laboratory in Tokyo.","options":["martial arts","adult education","distance learning","molecular biology"],"answerIndex":3,"explanation":"Lĩnh vực nghiên cứu trong phòng thí nghiệm là \"molecular biology\" (sinh học phân tử). \"martial arts\" (võ thuật), \"adult education\" (giáo dục người lớn) và \"distance learning\" (học từ xa) không phải ngành nghiên cứu trong phòng thí nghiệm."},{"num":15,"question":"A ______ studies the way the human mind works and why people behave as they do.","options":["psychology","psychological","psychologist","psychologically"],"answerIndex":2,"explanation":"Người nghiên cứu tâm lý con người là \"psychologist\" (nhà tâm lý học). \"psychology\" là ngành học; \"psychological\" là tính từ; \"psychologically\" là trạng từ."},{"num":16,"question":"Many people begin completely new studies after ______.","options":["retire","retirement","retired","retiring"],"answerIndex":1,"explanation":"Sau giới từ \"after\" cần danh từ: \"retirement\" (sự nghỉ hưu). \"retire\" là động từ; \"retired\" là tính từ/phân từ; \"retiring\" là V-ing."}],"gapfill":[{"num":1,"sentence":"A water ______ contains two atoms of hydrogen and one of oxygen.","answer":"molecule"},{"num":2,"sentence":"She works as a marine ______ studying coral reefs.","answer":"biologist"},{"num":3,"sentence":"He plans to ______ at the age of sixty and then study history.","answer":"retire"},{"num":4,"sentence":"Many students choose ______ because they want to understand people better.","answer":"psychology"},{"num":5,"sentence":"Long-term stress can cause both physical and ______ problems.","answer":"psychological"},{"num":6,"sentence":"She answered all the difficult questions calmly and ______.","answer":"intelligently"},{"num":7,"sentence":"Reading widely will ______ your vocabulary and your ideas.","answer":"broaden"},{"num":8,"sentence":"Customers who are ______ with the service can ask for their money back.","answer":"dissatisfied"},{"num":9,"sentence":"He gained great ______ from teaching older people to read.","answer":"satisfaction"},{"num":10,"sentence":"After her first degree she took a ______ in education.","answer":"master's degree"}]}}};
