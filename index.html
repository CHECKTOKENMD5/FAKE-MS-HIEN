creen","ipa":"/ˈtʌtʃ skriːn/","pos":"N. / Adj.","meaning":"màn hình cảm ứng / thuộc về màn hình cảm ứng"},{"word":"cutting-edge","ipa":"/ˌkʌtɪŋ ˈedʒ/","pos":"Adj.","meaning":"tiên tiến, hiện đại nhất, hàng đầu"},{"word":"stylish","ipa":"/ˈstaɪlɪʃ/","pos":"Adj.","meaning":"đặc sắc, hợp thời trang, có phong cách"},{"word":"style","ipa":"/staɪl/","pos":"N. / V.","meaning":"phong cách, kiểu dáng / thiết kế, tạo phong cách"},{"word":"computer animation","ipa":"kəmˈpjuːtə(r) ˌænɪˈmeɪʃn/","pos":"N. phr.","meaning":"đồ họa hoạt hình máy tính, phim hoạt hình máy tính"},{"word":"computer-animated","ipa":"/kəmˈpjuːtər ˈænɪmeɪtɪd/","pos":"Adj.","meaning":"được làm bằng hoạt hình máy tính"},{"word":"animate","ipa":"/ˈænɪmeɪt/","pos":"V.","meaning":"làm cho sống động, làm phim hoạt hình"},{"word":"blockbuster","ipa":"/ˈblɒkbʌstə(r)/","pos":"N.","meaning":"phim bom tấn, sách bom tấn (thành công vang dội)"},{"word":"diagnose","ipa":"/ˌdaɪəɡˈnəʊz/","pos":"V.","meaning":"chẩn đoán (bệnh)"},{"word":"diagnosis","ipa":"/ˌdaɪəɡˈnəʊsɪs/","pos":"N.","meaning":"sự chẩn đoán"},{"word":"pancreatic","ipa":"/ˌpæŋkriˈætɪk/","pos":"Adj.","meaning":"thuộc tuyến tụy"},{"word":"pancreas","ipa":"/ˈpæŋkriəs/","pos":"N.","meaning":"tuyến tụy"},{"word":"pass away","ipa":"/pɑːs əˈweɪ/","pos":"Phr. v.","meaning":"qua đời, mất (nói giảm nói tránh)"},{"word":"visionary","ipa":"/ˈvɪʒənri/","pos":"N. / Adj.","meaning":"người có tầm nhìn chiến lược / có tầm nhìn xa trông rộng"},{"word":"vision","ipa":"/ˈvɪʒn/","pos":"N.","meaning":"tầm nhìn, thị lực"}],"mcq":[{"num":1,"question":"Everyone agrees that Mozart was a musical ______ who composed his first pieces at the age of five.","options":["genius","dropout","vision","access"],"answerIndex":0,"explanation":"\"a musical genius\" (thiên tài âm nhạc) khớp với chi tiết sáng tác từ năm tuổi. \"dropout\" (người bỏ học), \"vision\" (tầm nhìn) và \"access\" (quyền tiếp cận) đều không chỉ người tài năng xuất chúng."},{"num":2,"question":"After thirty years, she finally traced her ______ mother through a DNA test.","options":["biology","biological","biologically","biologist"],"answerIndex":1,"explanation":"Trước danh từ \"mother\" cần tính từ: \"biological mother\" (mẹ ruột), khớp với \"a DNA test\". \"biology/biologist\" là danh từ; \"biologically\" là trạng từ."},{"num":3,"question":"Unable to care for the baby herself, the young mother ______ him up for adoption.","options":["passed","dropped","gave","returned"],"answerIndex":2,"explanation":"Cụm \"give somebody up for adoption\" (cho ai làm con nuôi) đã giữ nguyên phần \"up for adoption\" nên chỗ trống cần \"gave\". \"passed him up\", \"dropped him up\" và \"returned him up\" đều sai cụm động từ."},{"num":4,"question":"The number of children waiting for ______ has fallen in recent years.","options":["adopt","adopted","adopting","adoption"],"answerIndex":3,"explanation":"Sau giới từ \"for\" cần danh từ: \"waiting for adoption\" (chờ được nhận nuôi). \"adopt/adopted\" là động từ; \"adopting\" là V-ing, không dùng làm danh từ chỉ thủ tục ở đây."},{"num":5,"question":"The couple hope to ______ a second child next year.","options":["adoption","adopt","adopted","adopting"],"answerIndex":1,"explanation":"Sau \"hope to\" cần động từ nguyên thể: \"adopt a child\" (nhận nuôi một đứa trẻ). \"adoption\" là danh từ; \"adopted/adopting\" sai dạng sau \"to\"."},{"num":6,"question":"The two boys ______ over their shared love of computer games.","options":["passed","dropped","bonded","returned"],"answerIndex":2,"explanation":"\"bond over sth\" (gắn kết nhờ điểm chung nào đó) đúng nghĩa và giới từ. \"pass over\", \"drop over\" và \"return over\" đều không mang nghĩa trở nên thân thiết."},{"num":7,"question":"He was a college ______ who later built one of the world's biggest companies.","options":["dropout","blockbuster","pancreas","vision"],"answerIndex":0,"explanation":"\"a college dropout\" (người bỏ học đại học) là danh từ chỉ người, phù hợp với đại từ quan hệ \"who\". \"blockbuster\" (phim bom tấn), \"pancreas\" (tuyến tụy) và \"vision\" (tầm nhìn) không chỉ người."},{"num":8,"question":"Financial difficulties force many students to ______ of university every year.","options":["pass away","bond over","give up","drop out"],"answerIndex":3,"explanation":"Chỉ \"drop out of university\" (bỏ học đại học) là cụm đúng với giới từ \"of\" có sẵn trong câu. \"pass away of\", \"bond over of\" và \"give up of\" đều sai cấu trúc."},{"num":9,"question":"The designers worked hard to make the new website ______ to people with poor eyesight.","options":["access","accessibility","accessible","inaccessible"],"answerIndex":2,"explanation":"\"make sth accessible to sb\" (làm cho ai có thể tiếp cận) cần tính từ, và \"worked hard\" cho thấy ý nghĩa tích cực. \"inaccessible\" trái nghĩa với nỗ lực của nhà thiết kế; \"access/accessibility\" là danh từ."},{"num":10,"question":"Students in the village now have free ______ to the internet.","options":["accessible","access","accessibility","accessibly"],"answerIndex":1,"explanation":"\"have access to sth\" (được tiếp cận điều gì) là cụm cố định, cần danh từ sau \"free\". \"accessible\" là tính từ; \"accessibility\" chỉ khả năng tiếp cận nói chung và không đi trong cụm \"have free ... to\"; \"accessibly\" là trạng từ."},{"num":11,"question":"The studio uses ______ software to create characters that look completely real.","options":["cutting-edge","computer-animated","pancreatic","stylish"],"answerIndex":0,"explanation":"\"cutting-edge software\" (phần mềm tiên tiến nhất) khớp với kết quả \"look completely real\". \"computer-animated\" mô tả sản phẩm hoạt hình chứ không mô tả phần mềm; \"pancreatic\" và \"stylish\" sai nghĩa hoàn toàn."},{"num":12,"question":"Frozen is a ______ film that has earned more than a billion dollars.","options":["touch-screen","pancreatic","biological","computer-animated"],"answerIndex":3,"explanation":"\"a computer-animated film\" (phim hoạt hình máy tính) đúng nghĩa. \"touch-screen\" (màn hình cảm ứng), \"pancreatic\" (thuộc tuyến tụy) và \"biological\" (thuộc sinh học) không mô tả được thể loại phim."},{"num":13,"question":"The film became a huge ______, breaking box-office records all over the world.","options":["diagnosis","dropout","blockbuster","pancreas"],"answerIndex":2,"explanation":"\"a huge blockbuster\" (phim bom tấn) khớp với \"breaking box-office records\". \"diagnosis\" (chẩn đoán), \"dropout\" (người bỏ học) và \"pancreas\" (tuyến tụy) sai nghĩa."},{"num":14,"question":"The illness was ______ far too late for the treatment to succeed.","options":["diagnosed","diagnosis","diagnose","diagnosing"],"answerIndex":0,"explanation":"Câu ở thể bị động \"was + V3\": \"was diagnosed\" (được chẩn đoán). \"diagnosis\" là danh từ; \"diagnose\" là nguyên thể; \"diagnosing\" là V-ing."},{"num":15,"question":"The company grew quickly thanks to its founder's clear ______ of the future.","options":["access","vision","style","adoption"],"answerIndex":1,"explanation":"\"a clear vision of the future\" (tầm nhìn rõ ràng về tương lai) là collocation chuẩn. \"access\" (quyền tiếp cận), \"style\" (phong cách) và \"adoption\" (việc nhận nuôi/áp dụng) không đi với \"of the future\" theo nghĩa này."},{"num":16,"question":"She always looks ______ even when she is wearing very simple clothes.","options":["accessible","pancreatic","biological","stylish"],"answerIndex":3,"explanation":"Sau động từ nối \"looks\" cần tính từ mô tả vẻ ngoài: \"stylish\" (có phong cách). \"accessible\", \"pancreatic\" và \"biological\" đều không mô tả được cách ăn mặc."}],"gapfill":[{"num":1,"sentence":"Doctors use special scans to reach an accurate ______.","answer":"diagnosis"},{"num":2,"sentence":"The ______ produces hormones that control the level of sugar in the blood.","answer":"pancreas"},{"num":3,"sentence":"He was treated for ______ cancer for almost a year.","answer":"pancreatic"},{"num":4,"sentence":"Her grandfather ______ last month at the age of ninety-two.","answer":"passed away"},{"num":5,"sentence":"After a long illness, he ______ his old job at the university.","answer":"returned to"},{"num":6,"sentence":"Modern cameras have a large ______ that you control with your finger.","answer":"touch-screen"},{"num":7,"sentence":"Special software is used to ______ the drawings so that the characters seem alive.","answer":"animate"},{"num":8,"sentence":"Steve Jobs is remembered as a ______ who changed several industries at once.","answer":"visionary"},{"num":9,"sentence":"Her writing ______ is simple, clear and easy to follow.","answer":"style"},{"num":10,"sentence":"Only a ______ could have solved such a difficult problem in ten minutes.","answer":"genius"}]},"4":{"title":"SPEAKING","words":[{"word":"General","ipa":"/ˈdʒenrəl/","pos":"N. / Adj.","meaning":"Đại tướng, tướng quân / chung, tổng quát"},{"word":"generally","ipa":"/ˈdʒenrəli/","pos":"Adv.","meaning":"nói chung, thông thường"},{"word":"military","ipa":"/ˈmɪlətri/","pos":"Adj. / N.","meaning":"thuộc về quân sự, binh nghiệp / quân đội, lực lượng vũ trang"},{"word":"Communist Party","ipa":"/ˈkɒmjənɪst ˈpɑːti/","pos":"N. phr.","meaning":"Đảng Cộng sản"},{"word":"communism","ipa":"/ˈkɒmjənɪzəm/","pos":"N.","meaning":"chủ nghĩa cộng sản"},{"word":"communist","ipa":"/ˈkɒmjənɪst/","pos":"N. / Adj.","meaning":"người cộng sản / thuộc về cộng sản"},{"word":"lead","ipa":"/liːd/","pos":"V.","meaning":"dẫn dắt, lãnh đạo, dẫn đầu (quá khứ: led /led/)"},{"word":"leader","ipa":"/ˈliːdə(r)/","pos":"N.","meaning":"nhà lãnh đạo, người dẫn đầu"},{"word":"leadership","ipa":"/ˈliːdəʃɪp/","pos":"N.","meaning":"khả năng lãnh đạo, ban lãnh đạo"},{"word":"battle","ipa":"/ˈbætl/","pos":"N. / V.","meaning":"trận chiến, chiến dịch / chiến đấu, tranh đấu"},{"word":"attack","ipa":"/əˈtæk/","pos":"V. / N.","meaning":"tấn công, công kích / cuộc tấn công"},{"word":"attacker","ipa":"/əˈtækə(r)/","pos":"N.","meaning":"kẻ tấn công"},{"word":"best-told","ipa":"/best təʊld/","pos":"Adj.","meaning":"được kể tốt nhất, được truyền tụng hay nhất"},{"word":"catch","ipa":"/kætʃ/","pos":"V.","meaning":"bắt lấy, tóm lấy, kịp xe (quá khứ: caught /kɔːt/)"},{"word":"hold","ipa":"/həʊld/","pos":"V. / N.","meaning":"cầm, nắm, giữ, tổ chức (quá khứ: held /held/) / sự cầm nắm"}],"mcq":[{"num":1,"question":"______ Vo Nguyen Giap is one of the most respected military leaders in Vietnamese history.","options":["Leader","Attacker","General","Soldier"],"answerIndex":2,"explanation":"\"General\" (Đại tướng) là quân hàm dùng làm chức danh đứng trước tên riêng. \"Leader\", \"Attacker\" và \"Soldier\" là danh từ chung, không dùng làm chức danh trước họ tên theo cách này."},{"num":2,"question":"Vietnamese people ______ eat rice at least twice a day.","options":["attractively","generally","deliciously","particularly"],"answerIndex":1,"explanation":"\"generally\" (nói chung, thông thường) diễn tả thói quen phổ biến, phù hợp với \"at least twice a day\". \"attractively\" (một cách hấp dẫn), \"deliciously\" (một cách ngon lành) và \"particularly\" (đặc biệt là) không diễn tả tần suất hay thói quen chung."},{"num":3,"question":"After finishing school, he began his ______ career in the army.","options":["spicy","stylish","basic","military"],"answerIndex":3,"explanation":"\"a military career\" (binh nghiệp) khớp với \"in the army\". \"spicy\" (cay), \"stylish\" (hợp thời trang) và \"basic\" (cơ bản) đều không mô tả được sự nghiệp trong quân đội."},{"num":4,"question":"He spent years studying the ideas of ______ before joining the movement.","options":["communism","communist","leadership","battle"],"answerIndex":0,"explanation":"\"the ideas of communism\" (những tư tưởng của chủ nghĩa cộng sản) cần danh từ trừu tượng chỉ học thuyết. \"communist\" chỉ người; \"leadership\" (khả năng lãnh đạo) và \"battle\" (trận chiến) sai nghĩa."},{"num":5,"question":"The ______ of Viet Nam was founded in 1930 by Ho Chi Minh.","options":["battle","leadership","Communist Party","attacker"],"answerIndex":2,"explanation":"Chỉ một tổ chức mới có thể \"was founded in 1930\": \"the Communist Party of Viet Nam\" (Đảng Cộng sản Việt Nam). \"battle\" (trận chiến), \"leadership\" (ban lãnh đạo) và \"attacker\" (kẻ tấn công) không phù hợp với \"of Viet Nam\" và động từ \"founded\"."},{"num":6,"question":"He believed in ______ ideas such as the common ownership of land and factories.","options":["military","spicy","stylish","communist"],"answerIndex":3,"explanation":"Chi tiết \"common ownership of land and factories\" chốt nghĩa \"communist ideas\" (tư tưởng cộng sản). \"military\" (thuộc quân sự), \"spicy\" và \"stylish\" đều không mô tả được loại tư tưởng này."},{"num":7,"question":"General Giap ______ the Vietnamese forces to victory at Dien Bien Phu.","options":["led","lead","leader","leadership"],"answerIndex":0,"explanation":"Câu ở thì quá khứ nên cần dạng quá khứ của \"lead\": \"led\" (dẫn dắt). \"lead\" sai thì; \"leader\" và \"leadership\" là danh từ."},{"num":8,"question":"A good ______ listens to other people before making an important decision.","options":["leadership","leader","lead","led"],"answerIndex":1,"explanation":"Chủ ngữ chỉ người thực hiện hành động \"listens\": \"leader\" (nhà lãnh đạo). \"leadership\" chỉ khả năng/ban lãnh đạo; \"lead/led\" là động từ."},{"num":9,"question":"Under her ______, the company doubled its profits in only two years.","options":["leader","lead","led","leadership"],"answerIndex":3,"explanation":"\"under someone's leadership\" (dưới sự lãnh đạo của ai) là cụm cố định, cần danh từ trừu tượng. \"leader\" chỉ người nên không dùng sau \"under her\"; \"lead/led\" là động từ."},{"num":10,"question":"The ______ of Dien Bien Phu brought the French war in Indochina to an end.","options":["battle","attack","attacker","leadership"],"answerIndex":0,"explanation":"\"the Battle of + địa danh\" (trận đánh tại…) là cách nói chuẩn cho một trận chiến lịch sử. \"the attack of Dien Bien Phu\" không phải cách nói tự nhiên; \"attacker\" chỉ người; \"leadership\" sai nghĩa."},{"num":11,"question":"The enemy ______ the village at dawn without any warning.","options":["caught","held","attacked","led"],"answerIndex":2,"explanation":"\"attack a village\" (tấn công một ngôi làng) đúng nghĩa với \"the enemy\" và \"without any warning\". \"caught\", \"held\" và \"led\" đều sai nghĩa trong ngữ cảnh chiến sự này."},{"num":12,"question":"The police are still looking for the ______ who injured two people last night.","options":["leader","attacker","general","battle"],"answerIndex":1,"explanation":"Người gây thương tích và bị cảnh sát truy tìm là \"attacker\" (kẻ tấn công). \"leader\" (nhà lãnh đạo), \"general\" (đại tướng) và \"battle\" (trận chiến) sai nghĩa."},{"num":13,"question":"The festival is ______ every year on the fifteenth day of the first lunar month.","options":["caught","led","held","attacked"],"answerIndex":2,"explanation":"\"hold a festival\" (tổ chức lễ hội) ở thể bị động là \"is held\". \"caught\", \"led\" và \"attacked\" đều không mang nghĩa tổ chức một sự kiện."},{"num":14,"question":"He ran all the way to the station and just ______ the last train home.","options":["caught","held","led","attacked"],"answerIndex":0,"explanation":"\"catch a train\" (kịp chuyến tàu) là collocation chuẩn, khớp với \"ran all the way\". \"held\", \"led\" và \"attacked\" sai nghĩa với \"the last train\"."},{"num":15,"question":"The Tale of Kieu is one of the ______ stories in Vietnamese literature.","options":["spicy","grilled","basic","best-told"],"answerIndex":3,"explanation":"\"best-told\" (được kể hay nhất) là tính từ ghép phù hợp với \"stories\". \"spicy\" (cay), \"grilled\" (nướng) và \"basic\" (cơ bản) không mô tả được chất lượng kể chuyện."}],"gapfill":[{"num":1,"sentence":"The famous ______ of Bach Dang took place in the year 938.","answer":"battle"},{"num":2,"sentence":"Soldiers are trained to obey ______ orders without question.","answer":"military"},{"num":3,"sentence":"______ Vo Nguyen Giap directed the campaign at Dien Bien Phu.","answer":"General"},{"num":4,"sentence":"People ______ think that learning a language takes many years.","answer":"generally"},{"num":5,"sentence":"The village was destroyed in a surprise ______ at midnight.","answer":"attack"},{"num":6,"sentence":"Witnesses described the ______ as a tall man in a long black coat.","answer":"attacker"},{"num":7,"sentence":"Ho Chi Minh was the ______ of the Vietnamese revolution.","answer":"leader"},{"num":8,"sentence":"Her calm ______ during the crisis impressed the whole team.","answer":"leadership"},{"num":9,"sentence":"The opening ceremony will be ______ at the National Stadium.","answer":"held"},{"num":10,"sentence":"She ______ the ball with one hand and threw it straight back.","answer":"caught"}]},"5":{"title":"LISTENING","words":[{"word":"celebrate","ipa":"/ˈselɪbreɪt/","pos":"v","meaning":"kỷ niệm, ăn mừng"},{"word":"celebration","ipa":"/ˌselɪˈbreɪʃn/","pos":"n","meaning":"lễ kỷ niệm"},{"word":"haunted house","ipa":"/ˌhɔːntɪd ˈhaʊs/","pos":"n phr","meaning":"nhà ma"},{"word":"haunted","ipa":"/ˈhɔːntɪd/","pos":"adj","meaning":"bị ma ám"},{"word":"pumpkin lantern","ipa":"/ˈpʌmpkɪn ˈlæntən/","pos":"n phr","meaning":"đèn lồng bí ngô"},{"word":"trick or treat","ipa":"/ˌtrɪk ɔː ˈtriːt/","pos":"n phr","meaning":"trò xin kẹo trong lễ hội halloween"},{"word":"scary costume","ipa":"/ˌskeəri ˈkɒstjuːm/","pos":"n phr","meaning":"trang phục đáng sợ"},{"word":"scary","ipa":"/ˈskeəri/","pos":"adj","meaning":"đáng sợ"},{"word":"annual event","ipa":"/ˌænjuəl ɪˈvent/","pos":"n phr","meaning":"sự kiện hằng năm"},{"word":"annual","ipa":"/ˈænjuəl/","pos":"adj","meaning":"hằng năm"},{"word":"origin","ipa":"/ˈɒrɪdʒɪn/","pos":"n","meaning":"nguồn gốc"},{"word":"ancient festival","ipa":"/ˌeɪnʃənt ˈfestɪvl/","pos":"n phr","meaning":"lễ hội cổ xưa"},{"word":"ancient","ipa":"/ˈeɪnʃənt/","pos":"adj","meaning":"cổ xưa"},{"word":"celtic new year","ipa":"/ˌkeltɪk njuː ˈjɪə(r)/","pos":"n phr","meaning":"năm mới của người celt (Người Celt là tập hợp các bộ lạc cổ đại từng sinh sống trên phần lớn Châu Âu từ Trung Âu đến quần đảo Anh. Ngày nay, di sản và hậu duệ của họ chủ yếu tập trung tại sáu \"quốc gia Celt\": Ireland, Scotland, xứ Wales, Đảo Man, Cornwall (Anh), và Brittany (Pháp). (theo Wikipedia))"},{"word":"international festivals","ipa":"/ˌɪntəˈnæʃnəl ˈfestɪvlz/","pos":"n phr","meaning":"các lễ hội quốc tế"},{"word":"cause for alarm","ipa":"/ˌkɔːz fər əˈlɑːm/","pos":"n phr","meaning":"nguyên nhân đáng lo ngại"}],"mcq":[{"num":1,"question":"Every year millions of people ______ Halloween on the last day of October.","options":["celebration","celebrate","celebrated","celebrating"],"answerIndex":1,"explanation":"Câu ở thì hiện tại đơn với \"Every year\" và chủ ngữ số nhiều nên cần \"celebrate\" (kỷ niệm, ăn mừng). \"celebration\" là danh từ; \"celebrated\" sai thì; \"celebrating\" không đứng một mình làm động từ chính."},{"num":2,"question":"The ______ lasted until midnight, with music, food and fireworks.","options":["celebrate","celebrated","celebration","celebrating"],"answerIndex":2,"explanation":"Chủ ngữ của \"lasted\" cần danh từ: \"celebration\" (lễ kỷ niệm). Ba phương án còn lại đều là dạng động từ."},{"num":3,"question":"Local people believe the empty house is ______ by the ghost of a young girl.","options":["haunted","scary","annual","ancient"],"answerIndex":0,"explanation":"\"be haunted by a ghost\" (bị ma ám) là collocation cố định. \"scary\" (đáng sợ), \"annual\" (hằng năm) và \"ancient\" (cổ xưa) không đi với \"by the ghost\" theo nghĩa này."},{"num":4,"question":"The children put on ______ costumes and knocked on their neighbours' doors.","options":["annual","ancient","grilled","scary"],"answerIndex":3,"explanation":"\"scary costumes\" (trang phục đáng sợ) là cụm chuẩn trong lễ Halloween. \"annual\" (hằng năm), \"ancient\" (cổ xưa) và \"grilled\" (nướng) không mô tả được trang phục hóa trang."},{"num":5,"question":"The flower show is a/an ______ event, held in the same week every February.","options":["annual","ancient","haunted","scary"],"answerIndex":0,"explanation":"\"an annual event\" (sự kiện thường niên) khớp với \"every February\". \"ancient\" (cổ xưa), \"haunted\" (bị ma ám) và \"scary\" (đáng sợ) không diễn tả tính chất lặp lại hằng năm."},{"num":6,"question":"Historians are still arguing about the ______ of this strange custom.","options":["celebration","lantern","origin","costume"],"answerIndex":2,"explanation":"\"the origin of a custom\" (nguồn gốc của một phong tục) là collocation chuẩn. \"celebration\" (lễ kỷ niệm), \"lantern\" (đèn lồng) và \"costume\" (trang phục) không đi với \"arguing about … of this custom\" theo nghĩa nguồn gốc."},{"num":7,"question":"Halloween has its roots in ______ Celtic traditions.","options":["annual","haunted","scary","ancient"],"answerIndex":3,"explanation":"\"ancient traditions\" (truyền thống cổ xưa) khớp với \"has its roots in\". \"annual\", \"haunted\" và \"scary\" không diễn tả được chiều dài lịch sử của một truyền thống."},{"num":8,"question":"Children make ______ by cutting faces into large orange vegetables.","options":["scary costumes","pumpkin lanterns","haunted houses","annual events"],"answerIndex":1,"explanation":"\"pumpkin lanterns\" (đèn lồng bí ngô) chính là thứ được tạo ra bằng cách khắc mặt lên quả bí. Ba cụm danh từ còn lại không phải sản phẩm của việc khắc quả bí."},{"num":9,"question":"Visitors screamed as they walked through the ______ at the fair.","options":["pumpkin lantern","haunted house","scary costume","annual event"],"answerIndex":1,"explanation":"\"walk through the haunted house\" (đi qua nhà ma) giải thích được phản ứng \"screamed\". \"pumpkin lantern\" và \"scary costume\" là vật nhỏ không thể đi xuyên qua; \"annual event\" không phải địa điểm."},{"num":10,"question":"The doctor examined the small mark on his arm and said it was no ______.","options":["annual event","ancient festival","pumpkin lantern","cause for alarm"],"answerIndex":3,"explanation":"\"no cause for alarm\" (không có gì đáng lo ngại) là cụm cố định sau lời trấn an của bác sĩ. Ba cụm danh từ còn lại sai nghĩa hoàn toàn trong ngữ cảnh y tế."},{"num":11,"question":"Many young people now travel abroad to take part in ______ such as Tomorrowland.","options":["international festivals","pumpkin lanterns","scary costumes","haunted houses"],"answerIndex":0,"explanation":"\"international festivals\" (các lễ hội quốc tế) là thứ người ta \"take part in\" khi ra nước ngoài. Ba cụm còn lại là đồ vật hoặc địa điểm trong lễ Halloween, không phải sự kiện quốc tế."},{"num":12,"question":"Tet is ______ in Viet Nam at the end of January or in February.","options":["celebration","celebrate","celebrated","celebrating"],"answerIndex":2,"explanation":"Câu ở thể bị động \"is + V3\": \"is celebrated\" (được tổ chức). \"celebration\" là danh từ; \"celebrate\" là nguyên thể; \"celebrating\" là V-ing."}],"gapfill":[{"num":1,"sentence":"Families gather to ______ the Mid-Autumn Festival with mooncakes and lanterns.","answer":"celebrate"},{"num":2,"sentence":"The wedding ______ went on for three whole days.","answer":"celebration"},{"num":3,"sentence":"Nobody knows the exact ______ of this unusual custom.","answer":"origin"},{"num":4,"sentence":"The film was so ______ that I could not sleep afterwards.","answer":"scary"},{"num":5,"sentence":"The marathon has become an ______ event, held every April.","answer":"annual"},{"num":6,"sentence":"Samhain was the ______ new year, marked at the end of the harvest.","answer":"Celtic"},{"num":7,"sentence":"Children carve ______ and put burning candles inside them.","answer":"pumpkin lanterns"},{"num":8,"sentence":"Tourists pay to walk through the ______ house at the theme park.","answer":"haunted"},{"num":9,"sentence":"On Halloween night, children knock on doors and shout \"______!\"","answer":"Trick or treat"},{"num":10,"sentence":"Archaeologists have found the remains of an ______ temple under the city.","answer":"ancient"}]},"6":{"title":"WRITING","words":[{"word":"world festivals","ipa":"/ˌwɜːld ˈfestɪvlz/","pos":"n phr","meaning":"các lễ hội trên thế giới"},{"word":"celebrate","ipa":"/ˈselɪbreɪt/","pos":"v","meaning":"kỷ niệm, ăn mừng"},{"word":"celebration","ipa":"/ˌselɪˈbreɪʃn/","pos":"n","meaning":"lễ kỷ niệm"},{"word":"impact","ipa":"/ˈɪmpækt/","pos":"n,v","meaning":"tác động, ảnh hưởng"},{"word":"positive","ipa":"/ˈpɒzətɪv/","pos":"adj","meaning":"tích cực"},{"word":"negative","ipa":"/ˈneɡətɪv/","pos":"adj","meaning":"tiêu cực"},{"word":"encourage","ipa":"/ɪnˈkʌrɪdʒ/","pos":"v","meaning":"khuyến khích"},{"word":"encouragement","ipa":"/ɪnˈkʌrɪdʒmənt/","pos":"n","meaning":"sự khuyến khích"},{"word":"extracurricular activities","ipa":"/ˌekstrə kəˈrɪkjələ(r) ækˈtɪvətiz/","pos":"n phr","meaning":"hoạt động ngoại khóa"},{"word":"extracurricular","ipa":"/ˌekstrə kəˈrɪkjələ(r)/","pos":"adj","meaning":"ngoại khóa"},{"word":"sense of identity","ipa":"/ˌsens əv aɪˈdentəti/","pos":"n phr","meaning":"ý thức về bản sắc"},{"word":"identity","ipa":"/aɪˈdentəti/","pos":"n","meaning":"bản sắc, danh tính"},{"word":"happiness","ipa":"/ˈhæpinəs/","pos":"n","meaning":"hạnh phúc"},{"word":"local festivals","ipa":"/ˌləʊkl ˈfestɪvlz/","pos":"n phr","meaning":"lễ hội địa phương"},{"word":"opinion essay","ipa":"/əˈpɪnjən ˈeseɪ/","pos":"n phr","meaning":"bài luận nêu ý kiến"},{"word":"opinion","ipa":"/əˈpɪnjən/","pos":"n","meaning":"ý kiến"},{"word":"influence","ipa":"/ˈɪnfluəns/","pos":"n, v","meaning":"ảnh hưởng; ảnh hưởng đến"}],"mcq":[{"num":1,"question":"Traditional festivals can have a positive ______ on the local economy.","options":["opinion","identity","impact","happiness"],"answerIndex":2,"explanation":"\"have an impact on sth\" (có tác động đến điều gì) là cụm cố định. \"opinion\" (ý kiến), \"identity\" (bản sắc) và \"happiness\" (hạnh phúc) không đi với \"have a positive … on the local economy\"."},{"num":2,"question":"Volunteering has many ______ effects: it builds confidence and teaches teamwork.","options":["positive","negative","extracurricular","local"],"answerIndex":0,"explanation":"Hai kết quả \"builds confidence\" và \"teaches teamwork\" đều tốt nên cần \"positive\" (tích cực). \"negative\" trái nghĩa; \"extracurricular\" (ngoại khóa) và \"local\" (địa phương) không mô tả được tính chất tốt/xấu của tác động."},{"num":3,"question":"Too much screen time can have a/an ______ effect on children's sleep.","options":["positive","negative","extracurricular","local"],"answerIndex":1,"explanation":"\"Too much screen time\" báo hiệu tác hại nên cần \"negative\" (tiêu cực). \"positive\" trái nghĩa; hai phương án còn lại không diễn tả được chiều hướng tốt/xấu."},{"num":4,"question":"Parents should ______ their children to take part in after-school clubs.","options":["encouragement","encouraged","encouraging","encourage"],"answerIndex":3,"explanation":"Sau động từ khuyết thiếu \"should\" cần động từ nguyên thể: \"encourage sb to do sth\" (khuyến khích ai làm gì). \"encouragement\" là danh từ; \"encouraged/encouraging\" sai dạng sau \"should\"."},{"num":5,"question":"With a little ______ from her teacher, she entered the writing competition.","options":["encourage","encouraged","encouragement","encouraging"],"answerIndex":2,"explanation":"Sau \"a little\" cần danh từ không đếm được: \"encouragement\" (sự động viên). Ba phương án còn lại là dạng động từ hoặc tính từ."},{"num":6,"question":"Football, chess and drama are popular ______ activities offered after school hours.","options":["extracurricular","negative","positive","ancient"],"answerIndex":0,"explanation":"\"extracurricular activities\" (hoạt động ngoại khóa) khớp chính xác với \"offered after school hours\". \"negative\", \"positive\" và \"ancient\" không mô tả được loại hoạt động này."},{"num":7,"question":"Traditional festivals help young people keep a strong sense of ______.","options":["happiness","identity","opinion","impact"],"answerIndex":1,"explanation":"\"a sense of identity\" (ý thức về bản sắc) là cụm cố định. \"a sense of happiness\" tuy tồn tại nhưng không đi với \"keep a strong … \" trong ngữ cảnh lễ hội truyền thống gắn với cội nguồn; \"opinion\" và \"impact\" không đứng trong cụm \"a sense of\" theo nghĩa này."},{"num":8,"question":"Studies show that money alone cannot buy ______.","options":["identity","opinion","impact","happiness"],"answerIndex":3,"explanation":"\"money cannot buy happiness\" (tiền không mua được hạnh phúc) là cách nói quen thuộc. \"identity\", \"opinion\" và \"impact\" không phải thứ được nói đến trong câu thành ngữ này."},{"num":9,"question":"In my ______, local festivals should receive more support from the government.","options":["identity","impact","happiness","opinion"],"answerIndex":3,"explanation":"\"in my opinion\" (theo ý kiến của tôi) là cụm cố định mở đầu câu nêu quan điểm. Ba danh từ còn lại không dùng trong cụm này."},{"num":10,"question":"Her parents had a strong ______ on her choice of career.","options":["celebration","encouragement","influence","identity"],"answerIndex":2,"explanation":"\"have an influence on sth\" (có ảnh hưởng đến điều gì) là cụm cố định. \"celebration\", \"encouragement\" và \"identity\" không đi với \"have a strong … on her choice of career\"."},{"num":11,"question":"Tet is ______ with special food, flowers and family gatherings.","options":["celebrated","celebration","celebrate","celebrating"],"answerIndex":0,"explanation":"Câu ở thể bị động \"is + V3\": \"is celebrated\" (được tổ chức). \"celebration\" là danh từ; \"celebrate\" là nguyên thể; \"celebrating\" là V-ing."},{"num":12,"question":"The ______ of the school's fiftieth anniversary attracted hundreds of former pupils.","options":["celebrate","celebration","celebrated","celebrating"],"answerIndex":1,"explanation":"Chủ ngữ của \"attracted\" cần danh từ: \"the celebration of sth\" (lễ kỷ niệm điều gì). Ba phương án còn lại là dạng động từ."},{"num":13,"question":"The first results of the project are very ______.","options":["encouragement","encourage","encouraged","encouraging"],"answerIndex":3,"explanation":"Chủ ngữ là sự vật (\"results\") nên cần tính từ chủ động \"encouraging\" (đáng khích lệ). \"encouraged\" mang nghĩa bị động, dùng cho người được động viên; \"encouragement\" là danh từ; \"encourage\" là động từ."}],"gapfill":[{"num":1,"sentence":"Write an ______ of about two hundred words giving your view on this topic.","answer":"opinion essay"},{"num":2,"sentence":"Teachers should ______ students to ask questions in class.","answer":"encourage"},{"num":3,"sentence":"A few words of ______ can make a big difference to a nervous student.","answer":"encouragement"},{"num":4,"sentence":"Joining clubs and other ______ activities helps students make new friends.","answer":"extracurricular"},{"num":5,"sentence":"Fast food can have a ______ effect on your health if you eat it every day.","answer":"negative"},{"num":6,"sentence":"Learning a musical instrument has a ______ effect on memory and concentration.","answer":"positive"},{"num":7,"sentence":"Traditional clothes give people a strong sense of ______.","answer":"identity"},{"num":8,"sentence":"Many studies show that money does not always bring ______.","answer":"happiness"},{"num":9,"sentence":"The new factory has had a serious ______ on the environment.","answer":"impact"},{"num":10,"sentence":"Every spring, villagers ______ the rice harvest with songs and games.","answer":"celebrate"}]},"7":{"title":"COMMUNICATION AND CULTURE/ CILL","words":[{"word":"culture shock","ipa":"/ˈkʌltʃə ʃɒk/","pos":"n phr","meaning":"sốc văn hóa"},{"word":"confusion","ipa":"/kənˈfjuːʒn/","pos":"n","meaning":"sự bối rối"},{"word":"confuse","ipa":"/kənˈfjuːz/","pos":"v","meaning":"làm bối rối"},{"word":"anxiety","ipa":"/æŋˈzaɪəti/","pos":"n","meaning":"sự lo lắng"},{"word":"anxious","ipa":"/ˈæŋkʃəs/","pos":"adj","meaning":"lo lắng"},{"word":"different culture","ipa":"/ˌdɪfrənt ˈkʌltʃə(r)/","pos":"n phr","meaning":"nền văn hóa khác"},{"word":"language barriers","ipa":"/ˈlæŋɡwɪdʒ bæriəz/","pos":"n phr","meaning":"rào cản ngôn ngữ"},{"word":"barrier","ipa":"/ˈbæriə(r)/","pos":"n","meaning":"rào cản"},{"word":"unfamiliar lifestyles","ipa":"/ˌʌnfəˈmɪliə(r) ˈlaɪfstaɪlz/","pos":"n phr","meaning":"lối sống xa lạ"},{"word":"unfamiliar","ipa":"/ˌʌnfəˈmɪliə(r)/","pos":"adj","meaning":"không quen thuộc,xa lạ"},{"word":"local tipping culture","ipa":"/ˌləʊkl ˈtɪpɪŋ ˈkʌltʃə(r)/","pos":"n phr","meaning":"văn hóa tiền boa, tiền tip địa phương"},{"word":"rude","ipa":"/ruːd/","pos":"adj","meaning":"thô lỗ"},{"word":"rudeness","ipa":"/ˈruːdnəs/","pos":"n","meaning":"sự thô lỗ"},{"word":"insult","ipa":"/ɪnˈsʌlt/","pos":"v","meaning":"xúc phạm"},{"word":"open-minded","ipa":"/ˌəʊpən ˈmaɪndɪd/","pos":"adj","meaning":"cởi mở"},{"word":"cultural diversity","ipa":"/ˌkʌltʃərəl daɪˈvɜːsəti/","pos":"n phr","meaning":"sự đa dạng văn hóa"},{"word":"diverse","ipa":"/daɪˈvɜːs/","pos":"adj","meaning":"đa dạng"},{"word":"knowledge","ipa":"/ˈnɒlɪdʒ/","pos":"n","meaning":"kiến thức"},{"word":"experience","ipa":"/ɪkˈspɪəriəns/","pos":"n, v","meaning":"kinh nghiệm; trải nghiệm"},{"word":"illegal","ipa":"/ɪˈliːɡl/","pos":"adj","meaning":"bất hợp pháp"},{"word":"illegally","ipa":"/ɪˈliːɡəli/","pos":"adv","meaning":"một cách bất hợp pháp"},{"word":"journey","ipa":"/ˈdʒɜːni/","pos":"n","meaning":"chuyến đi, hành trình"}],"mcq":[{"num":1,"question":"Many students suffer from ______ during their first weeks abroad, feeling lost and confused by everything around them.","options":["language barriers","cultural diversity","culture shock","local tipping culture"],"answerIndex":2,"explanation":"\"culture shock\" (sốc văn hóa) đúng với cảm giác \"lost and confused\" khi mới sang nước khác. \"language barriers\" chỉ riêng rào cản ngôn ngữ; \"cultural diversity\" (sự đa dạng văn hóa) và \"local tipping culture\" (văn hóa tiền boa) không phải trạng thái tâm lý mà người ta \"suffer from\" theo nghĩa này."},{"num":2,"question":"There was some ______ about the time of the meeting, so half the group arrived late.","options":["confuse","confusion","confused","confusing"],"answerIndex":1,"explanation":"Sau \"some\" cần danh từ không đếm được: \"confusion\" (sự nhầm lẫn). \"confuse\" là động từ; \"confused/confusing\" là tính từ."},{"num":3,"question":"The instructions were so ______ that nobody knew what to do.","options":["confused","confusion","confuse","confusing"],"answerIndex":3,"explanation":"Chủ ngữ là sự vật (\"the instructions\") gây ra sự bối rối nên cần tính từ chủ động \"confusing\" (gây khó hiểu). \"confused\" dùng cho người cảm thấy bối rối; \"confusion\" là danh từ; \"confuse\" là động từ."},{"num":4,"question":"Speaking in front of a large audience causes her great ______.","options":["anxiety","anxious","anxiously","anxieties"],"answerIndex":0,"explanation":"Sau \"great\" cần danh từ không đếm được: \"anxiety\" (sự lo lắng). \"anxious\" là tính từ; \"anxiously\" là trạng từ; \"anxieties\" số nhiều không đi với \"great\" theo cách này."},{"num":5,"question":"She felt very ______ about meeting her host family for the first time.","options":["anxiety","anxiously","anxieties","anxious"],"answerIndex":3,"explanation":"Sau động từ nối \"felt\" cần tính từ: \"be anxious about sth\" (lo lắng về điều gì). \"anxiety/anxieties\" là danh từ; \"anxiously\" là trạng từ."},{"num":6,"question":"Language ______ can make it difficult to make friends in a new country.","options":["journeys","cultures","barriers","opinions"],"answerIndex":2,"explanation":"\"language barriers\" (rào cản ngôn ngữ) giải thích được vì sao khó kết bạn. \"language journeys\", \"language cultures\" và \"language opinions\" đều không phải cụm danh từ chuẩn theo nghĩa này."},{"num":7,"question":"At first, everything felt strange and ______ to the exchange students.","options":["unfamiliar","open-minded","rude","illegal"],"answerIndex":0,"explanation":"\"unfamiliar\" (xa lạ, không quen thuộc) song hành với \"strange\". \"open-minded\" (cởi mở) dùng cho người; \"rude\" (thô lỗ) và \"illegal\" (bất hợp pháp) sai nghĩa."},{"num":8,"question":"In many cultures it is considered ______ to point at people with your finger.","options":["open-minded","rude","unfamiliar","diverse"],"answerIndex":1,"explanation":"Chỉ tay vào người khác bị xem là \"rude\" (thô lỗ). \"open-minded\" mang nghĩa tích cực; \"unfamiliar\" (xa lạ) và \"diverse\" (đa dạng) không mô tả được hành vi mất lịch sự."},{"num":9,"question":"His ______ to the waiter shocked everyone else at the table.","options":["rude","rudely","rudeness","ruder"],"answerIndex":2,"explanation":"Chủ ngữ của \"shocked\" cần danh từ: \"rudeness\" (sự thô lỗ). \"rude/ruder\" là tính từ; \"rudely\" là trạng từ."},{"num":10,"question":"Do not ______ your hosts by refusing the food they offer you.","options":["confuse","experience","encourage","insult"],"answerIndex":3,"explanation":"\"insult sb\" (xúc phạm ai) đúng nghĩa với hành động từ chối món ăn chủ nhà mời. \"confuse\" (làm bối rối), \"experience\" (trải nghiệm) và \"encourage\" (khuyến khích) sai nghĩa trong lời cảnh báo này."},{"num":11,"question":"Travelling makes people more ______ and more tolerant of difference.","options":["open-minded","illegal","anxious","rude"],"answerIndex":0,"explanation":"\"open-minded\" (cởi mở) song hành với \"tolerant of difference\". \"illegal\" (bất hợp pháp), \"anxious\" (lo lắng) và \"rude\" (thô lỗ) đều trái với ý nghĩa tích cực của câu."},{"num":12,"question":"Our city is proud of its cultural ______, with people from more than fifty countries.","options":["diverse","diversity","diversify","diversely"],"answerIndex":1,"explanation":"Sau \"its cultural\" cần danh từ: \"diversity\" (sự đa dạng). \"diverse\" là tính từ; \"diversify\" là động từ; \"diversely\" là trạng từ."},{"num":13,"question":"A good ______ of local customs will help you avoid embarrassing mistakes.","options":["journey","knowledge","rudeness","anxiety"],"answerIndex":1,"explanation":"\"a good knowledge of sth\" (hiểu biết tốt về điều gì) là cụm cố định. \"journey\" (hành trình), \"rudeness\" (sự thô lỗ) và \"anxiety\" (sự lo lắng) không đi với \"of local customs\" theo nghĩa này."},{"num":14,"question":"In some countries it is ______ to take photographs of government buildings.","options":["illegal","illegally","legally","legal"],"answerIndex":0,"explanation":"Sau \"it is\" cần tính từ, và ngữ cảnh \"government buildings\" ở một số nước là điều bị cấm nên chọn \"illegal\" (bất hợp pháp); \"legal\" sẽ khiến câu mất ý nghĩa cảnh báo với \"In some countries\". \"illegally/legally\" là trạng từ nên sai từ loại."},{"num":15,"question":"He was fined for parking ______ outside the hospital gate.","options":["illegal","legal","legally","illegally"],"answerIndex":3,"explanation":"Chỗ trống bổ nghĩa cho động từ \"parking\" nên cần trạng từ, và việc bị phạt chốt nghĩa \"illegally\" (một cách trái phép). \"legally\" mâu thuẫn với \"was fined\"; \"illegal/legal\" là tính từ."},{"num":16,"question":"The ______ from Ha Noi to Sa Pa takes about six hours by car.","options":["barrier","knowledge","journey","confusion"],"answerIndex":2,"explanation":"\"the journey from A to B takes …\" (chuyến đi từ A đến B mất…) là cách nói chuẩn. \"barrier\" (rào cản), \"knowledge\" (kiến thức) và \"confusion\" (sự bối rối) không đi với \"from Ha Noi to Sa Pa\"."}],"gapfill":[{"num":1,"sentence":"Living in another country is an ______ that changes the way you see the world.","answer":"experience"},{"num":2,"sentence":"Newly arrived students often feel lost and ______ by everyday situations.","answer":"confused"},{"num":3,"sentence":"She felt very ______ the night before her first day at the new school.","answer":"anxious"},{"num":4,"sentence":"Studying abroad taught him to be more ______ about other people's beliefs.","answer":"open-minded"},{"num":5,"sentence":"In the United States, ______ in restaurants is expected, but in Japan it can seem rude.","answer":"tipping"},{"num":6,"sentence":"He was deeply ______ by the joke and left the room without a word.","answer":"insulted"},{"num":7,"sentence":"Her ______ to the shop assistant shocked the other customers.","answer":"rudeness"},{"num":8,"sentence":"Singapore has a very ______ population, with Chinese, Malay and Indian communities.","answer":"diverse"},{"num":9,"sentence":"Many travellers experience ______ when they first move to a very different country.","answer":"culture shock"},{"num":10,"sentence":"Downloading films ______ can lead to a heavy fine.","answer":"illegally"}]}},"3":{"1":{"title":"GETTING STARTED","words":[{"word":"ecotour","ipa":"/ˈiːkəʊtʊə(r)/","pos":"n","meaning":"chuyến du lịch sinh thái"},{"word":"ecotourism","ipa":"/ˈiːkəʊtʊərɪzəm/","pos":"n","meaning":"du lịch sinh thái"},{"word":"ecotourist","ipa":"/ˈiːkəʊtʊərɪst/","pos":"n","meaning":"khách du lịch sinh thái"},{"word":"judge","ipa":"/dʒʌdʒ/","pos":"n, v","meaning":"giám khảo; đánh giá, phán xét"},{"word":"judgement","ipa":"/ˈdʒʌdʒmənt/","pos":"n","meaning":"sự phán đoán; nhận định"},{"word":"judgable","ipa":"/ˈdʒʌdʒəbl/","pos":"adj","meaning":"có thể đánh giá"},{"word":"judging","ipa":"/ˈdʒʌdʒɪŋ/","pos":"n","meaning":"việc chấm, đánh giá"},{"word":"eco-friendly","ipa":"/ˌiːkəʊ ˈfrendli/","pos":"adj","meaning":"thân thiện với môi trường"},{"word":"throw away","ipa":"/θrəʊ əˈweɪ/","pos":"phr.v","meaning":"vứt bỏ"},{"word":"decompose","ipa":"/ˌdiːkəmˈpəʊz/","pos":"v","meaning":"phân hủy"},{"word":"decomposition","ipa":"/ˌdiːkɒmpəˈzɪʃn/","pos":"n","meaning":"sự phân hủy"},{"word":"decomposable","ipa":"/ˌdiːkəmˈpəʊzəbl/","pos":"adj","meaning":"có thể phân hủy"},{"word":"jug","ipa":"/dʒʌɡ/","pos":"n","meaning":"bình, ca có quai"},{"word":"refill","ipa":"/ˌriːˈfɪl/ (v), /ˈriːfɪl/ (n)","pos":"v, n","meaning":"đổ đầy lại; lần đổ đầy lại"},{"word":"refillable","ipa":"/ˌriːˈfɪləbl/","pos":"adj","meaning":"có thể nạp/đổ đầy lại"},{"word":"reminder","ipa":"/rɪˈmaɪndə(r)/","pos":"n","meaning":"lời nhắc"},{"word":"remind","ipa":"/rɪˈmaɪnd/","pos":"v","meaning":"nhắc nhở"},{"word":"gradual","ipa":"/ˈɡrædʒuəl/","pos":"adj","meaning":"dần dần, từ từ"},{"word":"gradually","ipa":"/ˈɡrædʒuəli/","pos":"adv","meaning":"một cách dần dần"},{"word":"gradualness","ipa":"/ˈɡrædʒuəlnəs/","pos":"n","meaning":"tính dần dần"},{"word":"rush out","ipa":"/rʌʃ aʊt/","pos":"phr.v","meaning":"lao vội ra ngoài"}],"mcq":[{"num":1,"question":"______ helps local people earn a living while the forest is kept safe.","options":["Ecotour","Ecotourist","Ecotourists","Ecotourism"],"answerIndex":3,"explanation":"Chủ ngữ cần danh từ không đếm được chỉ ngành/loại hình du lịch: \"ecotourism\" (du lịch sinh thái). \"ecotour\" là một chuyến đi cụ thể; \"ecotourist/ecotourists\" chỉ người đi du lịch."},{"num":2,"question":"As an ______, she always chooses hotels that recycle their waste.","options":["ecotourist","ecotourism","ecotour","ecotours"],"answerIndex":0,"explanation":"\"as an + danh từ chỉ người\": \"ecotourist\" (khách du lịch sinh thái) mới có thể \"choose hotels\". \"ecotourism\" là ngành du lịch; \"ecotour/ecotours\" là chuyến đi."},{"num":3,"question":"We booked a three-day ______ of the mangrove forest last summer.","options":["ecotourism","ecotour","ecotourist","ecotouring"],"answerIndex":1,"explanation":"\"book a three-day ecotour\" (đặt một chuyến du lịch sinh thái ba ngày) — cần danh từ đếm được chỉ chuyến đi. \"ecotourism\" không đếm được; \"ecotourist\" chỉ người; \"ecotouring\" là V-ing."},{"num":4,"question":"Many hotels now advertise themselves as ______, using solar power and banning plastic straws.","options":["gradual","judgable","eco-friendly","refillable"],"answerIndex":2,"explanation":"\"eco-friendly\" (thân thiện với môi trường) khớp với \"solar power\" và \"banning plastic straws\". \"gradual\" (dần dần), \"judgable\" (có thể đánh giá) và \"refillable\" (có thể đổ đầy lại) không mô tả được một khách sạn."},{"num":5,"question":"Please do not ______ plastic bottles; put them in the blue bin instead.","options":["throw away","rinse out","rush out","turn off"],"answerIndex":0,"explanation":"\"throw away sth\" (vứt bỏ) là hành động trái ngược với \"put them in the blue bin\". \"rinse out\" (tráng sạch), \"rush out\" (lao vội ra ngoài) và \"turn off\" (tắt) đều sai nghĩa với \"plastic bottles\" ở đây."},{"num":6,"question":"Banana skins ______ quickly, but plastic bags can last for hundreds of years.","options":["decomposition","decomposable","decompose","decomposed"],"answerIndex":2,"explanation":"Câu ở thì hiện tại đơn với chủ ngữ số nhiều nên cần động từ \"decompose\" (phân hủy). \"decomposition\" là danh từ; \"decomposable\" là tính từ; \"decomposed\" sai thì với \"but plastic bags can last\"."},{"num":7,"question":"The ______ of food waste in landfills produces a gas that can be used as fuel.","options":["decompose","decomposition","decomposable","decomposed"],"answerIndex":1,"explanation":"Chủ ngữ của \"produces\" cần danh từ: \"the decomposition of sth\" (sự phân hủy của cái gì). Ba phương án còn lại là động từ hoặc tính từ."},{"num":8,"question":"Paper bags are ______, so they break down naturally in the soil.","options":["decomposition","decompose","decomposed","decomposable"],"answerIndex":3,"explanation":"Sau \"are\" cần tính từ: \"decomposable\" (có thể phân hủy), khớp với \"break down naturally\". \"decomposition\" là danh từ; \"decompose\" là động từ nguyên thể; \"decomposed\" mang nghĩa đã phân hủy rồi nên mâu thuẫn với \"so they break down\"."},{"num":9,"question":"Bring your own bottle to school and ______ it at the water station.","options":["refillable","refilled","refilling","refill"],"answerIndex":3,"explanation":"Câu mệnh lệnh nối bằng \"and\" nên cần động từ nguyên thể: \"refill it\" (đổ đầy lại). \"refillable\" là tính từ; \"refilled/refilling\" sai dạng trong câu mệnh lệnh này."},{"num":10,"question":"The school gave every student a ______ water bottle at the beginning of term.","options":["refill","refilled","refillable","refilling"],"answerIndex":2,"explanation":"Trước cụm danh từ \"water bottle\" cần tính từ: \"refillable\" (có thể đổ đầy lại). \"refill\" là danh từ/động từ; \"refilled\" mang nghĩa đã được đổ đầy; \"refilling\" là V-ing."},{"num":11,"question":"The poster on the wall is a daily ______ to switch off the lights.","options":["reminder","remind","reminded","reminding"],"answerIndex":0,"explanation":"Sau \"a daily\" cần danh từ: \"a reminder to do sth\" (lời nhắc làm gì). Ba phương án còn lại đều là dạng động từ."},{"num":12,"question":"Please ______ me to take the recycling out tomorrow morning.","options":["reminder","remind","reminded","reminding"],"answerIndex":1,"explanation":"Câu mệnh lệnh với \"Please\" cần động từ nguyên thể: \"remind sb to do sth\" (nhắc ai làm gì). \"reminder\" là danh từ; \"reminded/reminding\" sai dạng."},{"num":13,"question":"People are ______ getting used to sorting their rubbish at home.","options":["gradually","conveniently","habitually","automatically"],"answerIndex":0,"explanation":"\"gradually\" (dần dần) diễn tả một quá trình thay đổi từ từ, phù hợp với \"getting used to\". \"conveniently\" (một cách thuận tiện), \"habitually\" (theo thói quen) và \"automatically\" (một cách tự động) không diễn tả được tiến trình thay đổi này."},{"num":14,"question":"There has been a ______ increase in the number of people using public transport.","options":["judgable","refillable","gradual","decomposable"],"answerIndex":2,"explanation":"Trước danh từ \"increase\" cần tính từ chỉ tốc độ thay đổi: \"a gradual increase\" (sự tăng dần). \"judgable\", \"refillable\" và \"decomposable\" không mô tả được mức tăng."},{"num":15,"question":"When the fire alarm rang, everyone ______ of the building in less than a minute.","options":["threw away","rushed out","rinsed out","turned off"],"answerIndex":1,"explanation":"\"rush out of somewhere\" (lao vội ra khỏi nơi nào) đúng cả nghĩa lẫn giới từ \"of\" có sẵn. \"throw away of\", \"rinse out of\" và \"turn off of\" đều sai cấu trúc hoặc sai nghĩa."},{"num":16,"question":"In my ______, the new recycling scheme is working very well.","options":["judge","judging","judgable","judgement"],"answerIndex":3,"explanation":"\"in my judgement\" (theo đánh giá của tôi) là cụm cố định, cần danh từ. \"judge\" là danh từ chỉ người/động từ; \"judging\" là V-ing; \"judgable\" là tính từ."}],"gapfill":[{"num":1,"sentence":"Millions of plastic bags are ______ after being used only once.","answer":"thrown away"},{"num":2,"sentence":"A glass ______ of cold water was placed in the middle of the table.","answer":"jug"},{"num":3,"sentence":"Food waste ______ in a few weeks, but plastic takes centuries.","answer":"decomposes"},{"num":4,"sentence":"The hotel has won a prize for its ______ practices, such as using solar energy.","answer":"eco-friendly"},{"num":5,"sentence":"______ brings tourists to national parks without damaging them.","answer":"Ecotourism"},{"num":6,"sentence":"Each guest receives a ______ bottle that can be filled at any water station.","answer":"refillable"},{"num":7,"sentence":"Set an alarm on your phone as a ______ to water the plants every morning.","answer":"reminder"},{"num":8,"sentence":"You should never ______ people by the clothes they wear.","answer":"judge"},{"num":9,"sentence":"The amount of rubbish in the river has ______ decreased since the clean-up began.","answer":"gradually"},{"num":10,"sentence":"As soon as the bell rang, the children ______ of the classroom.","answer":"rushed out"}]},"2":{"title":"LANGUAGE","words":[{"word":"negative","ipa":"/ˈneɡətɪv/","pos":"adj","meaning":"tiêu cực"},{"word":"negatively","ipa":"/ˈneɡətɪvli/","pos":"adv","meaning":"một cách tiêu cực"},{"word":"negativity","ipa":"/ˌneɡəˈtɪvəti/","pos":"n","meaning":"tính tiêu cực"},{"word":"landfill","ipa":"/ˈlændfɪl/","pos":"n","meaning":"bãi chôn lấp rác"},{"word":"reuse","ipa":"/ˌriːˈjuːz/ (v), /ˌriːˈjuːs/ (n)","pos":"v, n","meaning":"tái sử dụng; sự tái sử dụng"},{"word":"reusable","ipa":"/ˌriːˈjuːzəbl/","pos":"adj","meaning":"có thể tái sử dụng"},{"word":"reusability","ipa":"/ˌriːˌjuːzəˈbɪləti/","pos":"n","meaning":"khả năng tái sử dụng"},{"word":"packaging","ipa":"/ˈpækɪdʒɪŋ/","pos":"n","meaning":"bao bì"},{"word":"package","ipa":"/ˈpækɪdʒ/","pos":"n, v","meaning":"gói hàng; đóng gói"},{"word":"packaged","ipa":"/ˈpækɪdʒd/","pos":"adj","meaning":"được đóng gói"},{"word":"container","ipa":"/kənˈteɪnə(r)/","pos":"n","meaning":"vật chứa, hộp đựng"},{"word":"contain","ipa":"/kənˈteɪn/","pos":"v","meaning":"chứa, đựng"},{"word":"contained","ipa":"/kənˈteɪnd/","pos":"adj","meaning":"được chứa; kiềm chế"},{"word":"containment","ipa":"/kənˈteɪnmənt/","pos":"n","meaning":"sự ngăn chặn; sự chứa đựng"},{"word":"material","ipa":"/məˈtɪəriəl/","pos":"n, adj","meaning":"vật liệu; thuộc vật chất"},{"word":"materially","ipa":"/məˈtɪəriəli/","pos":"adv","meaning":"về mặt vật chất; đáng kể"},{"word":"materialism","ipa":"/məˈtɪəriəlɪzəm/","pos":"n","meaning":"chủ nghĩa vật chất"},{"word":"materialistic","ipa":"/məˌtɪəriəˈlɪstɪk/","pos":"adj","meaning":"thực dụng, vật chất"},{"word":"bury","ipa":"/ˈberi/","pos":"v","meaning":"chôn, chôn cất"},{"word":"burial","ipa":"/ˈberiəl/","pos":"n","meaning":"sự chôn cất"},{"word":"buried","ipa":"/ˈberid/","pos":"adj","meaning":"bị chôn vùi"},{"word":"wrap","ipa":"/ræp/","pos":"v, n","meaning":"gói, bọc; giấy bọc"},{"word":"wrapper","ipa":"/ˈræpə(r)/","pos":"n","meaning":"giấy bọc, vỏ bọc"},{"word":"wrapping","ipa":"/ˈræpɪŋ/","pos":"n","meaning":"giấy gói; việc gói"},{"word":"leak","ipa":"/liːk/","pos":"v, n","meaning":"rò rỉ; sự rò rỉ"},{"word":"leakage","ipa":"/ˈliːkɪdʒ/","pos":"n","meaning":"sự rò rỉ"},{"word":"leaky","ipa":"/ˈliːki/","pos":"adj","meaning":"bị rò rỉ"},{"word":"bookmark","ipa":"/ˈbʊkmɑːk/","pos":"n, v","meaning":"dấu trang; đánh dấu trang"},{"word":"release ... into ...","ipa":"/rɪˈliːs ... ˈɪntuː/","pos":"v.phr","meaning":"thải/đưa... vào..."},{"word":"release","ipa":"/rɪˈliːs/","pos":"v, n","meaning":"thả, phát hành; sự phát hành"},{"word":"releasable","ipa":"/rɪˈliːsəbl/","pos":"adj","meaning":"có thể được thả/phát hành"},{"word":"pollute","ipa":"/pəˈluːt/","pos":"v","meaning":"gây ô nhiễm"},{"word":"pollution","ipa":"/pəˈluːʃn/","pos":"n","meaning":"sự ô nhiễm"},{"word":"pollutant","ipa":"/pəˈluːtənt/","pos":"n","meaning":"chất gây ô nhiễm"},{"word":"polluted","ipa":"/pəˈluːtɪd/","pos":"adj","meaning":"bị ô nhiễm"},{"word":"polluting","ipa":"/pəˈluːtɪŋ/","pos":"adj","meaning":"gây ô nhiễm"},{"word":"private","ipa":"/ˈpraɪvət/","pos":"adj","meaning":"riêng tư; tư nhân"},{"word":"privately","ipa":"/ˈpraɪvətli/","pos":"adv","meaning":"một cách riêng tư"},{"word":"privacy","ipa":"/ˈprɪvəsi/","pos":"n","meaning":"quyền riêng tư"},{"word":"privatize","ipa":"/ˈpraɪvətaɪz/","pos":"v","meaning":"tư nhân hóa"},{"word":"privatization","ipa":"/ˌpraɪvətaɪˈzeɪʃn/","pos":"n","meaning":"sự tư nhân hóa"}],"mcq":[{"num":1,"question":"Air pollution affects children's health ______, especially in large cities.","options":["negatively","negative","negativity","negatives"],"answerIndex":0,"explanation":"Chỗ trống bổ nghĩa cho động từ \"affects\" nên cần trạng từ: \"negatively\" (một cách tiêu cực). \"negative\" là tính từ; \"negativity/negatives\" là danh từ."},{"num":2,"question":"The constant ______ in the news makes some young people feel hopeless.","options":["negative","negativity","negatively","negatives"],"answerIndex":1,"explanation":"Sau \"The constant\" cần danh từ không đếm được: \"negativity\" (tính tiêu cực). \"negative\" là tính từ; \"negatively\" là trạng từ; \"negatives\" số nhiều không đi với \"constant\" theo nghĩa này."},{"num":3,"question":"Most of our household rubbish still ends up in a ______ outside the city.","options":["container","wrapper","landfill","pollutant"],"answerIndex":2,"explanation":"\"a landfill\" (bãi chôn lấp rác) là nơi rác được đưa đến. \"container\" (hộp đựng), \"wrapper\" (vỏ bọc) và \"pollutant\" (chất gây ô nhiễm) không phải địa điểm."},{"num":4,"question":"Shoppers are encouraged to bring ______ bags instead of taking plastic ones.","options":["reuse","reusability","reused","reusable"],"answerIndex":3,"explanation":"Trước danh từ \"bags\" cần tính từ: \"reusable bags\" (túi dùng lại được). \"reuse\" là động từ/danh từ; \"reusability\" là danh từ; \"reused\" mang nghĩa đã được dùng lại nên không phải đặc điểm của túi mới mang đi."},{"num":5,"question":"We should ______ glass jars instead of throwing them away.","options":["reusable","reuse","reusability","reused"],"answerIndex":1,"explanation":"Sau \"should\" cần động từ nguyên thể: \"reuse\" (tái sử dụng). \"reusable\" là tính từ; \"reusability\" là danh từ; \"reused\" sai dạng sau \"should\"."},{"num":6,"question":"Far too much plastic ______ is used for fruit and vegetables in supermarkets.","options":["packaging","package","packaged","packages"],"answerIndex":0,"explanation":"Sau \"too much\" cần danh từ không đếm được: \"packaging\" (bao bì nói chung). \"package/packages\" là danh từ đếm được chỉ gói hàng; \"packaged\" là tính từ."},{"num":7,"question":"Keep the leftovers in a plastic ______ in the fridge.","options":["containment","contain","container","contained"],"answerIndex":2,"explanation":"Sau \"a plastic\" cần danh từ chỉ vật đựng: \"container\" (hộp đựng). \"containment\" là danh từ trừu tượng (sự ngăn chặn); \"contain/contained\" là động từ."},{"num":8,"question":"Glass, paper and metal are all recyclable ______.","options":["materialism","materially","materialistic","materials"],"answerIndex":3,"explanation":"Sau \"recyclable\" cần danh từ số nhiều: \"materials\" (vật liệu). \"materialism\" là chủ nghĩa vật chất; \"materially\" là trạng từ; \"materialistic\" là tính từ."},{"num":9,"question":"He criticised the ______ lifestyle of people who always want to own more things.","options":["materialism","materialistic","materially","materials"],"answerIndex":1,"explanation":"Trước danh từ \"lifestyle\" cần tính từ: \"materialistic\" (thực dụng, chuộng vật chất). \"materialism/materials\" là danh từ; \"materially\" là trạng từ."},{"num":10,"question":"For years, chemical waste was ______ in the ground near the river.","options":["bury","burial","burying","buried"],"answerIndex":3,"explanation":"Câu ở thể bị động \"was + V3\": \"was buried\" (bị chôn). \"bury\" là nguyên thể; \"burial\" là danh từ; \"burying\" là V-ing."},{"num":11,"question":"He dropped the chocolate ______ on the pavement instead of using the bin.","options":["wrapper","container","pollutant","leakage"],"answerIndex":0,"explanation":"\"a chocolate wrapper\" (giấy bọc kẹo sô-cô-la) là vật nhỏ bị vứt xuống vỉa hè. \"container\" (hộp đựng), \"pollutant\" (chất gây ô nhiễm) và \"leakage\" (sự rò rỉ) sai nghĩa."},{"num":12,"question":"The pipe has been ______ for weeks, and the kitchen floor is always wet.","options":["leak","leakage","leaking","leaky"],"answerIndex":2,"explanation":"Sau \"has been\" trong thì hiện tại hoàn thành tiếp diễn cần V-ing: \"has been leaking\" (đã rò rỉ suốt). \"leak\" là nguyên thể; \"leakage\" là danh từ; \"leaky\" là tính từ nhưng không đi với \"for weeks\" theo cấu trúc tiếp diễn này."},{"num":13,"question":"A ______ tap can waste more than twenty litres of water a day.","options":["leak","leakage","leaky","leaking"],"answerIndex":2,"explanation":"Trước danh từ \"tap\" cần tính từ: \"a leaky tap\" (vòi nước bị rò). \"leak/leakage\" là danh từ; \"leaking\" tuy có thể bổ nghĩa nhưng ở đây tính từ chuẩn của cụm là \"leaky\", và ba phương án còn lại đều không phải tính từ."},{"num":14,"question":"For many years the factory ______ dangerous chemicals into the river.","options":["buried","wrapped","contained","released"],"answerIndex":3,"explanation":"\"release sth into sth\" (thải cái gì vào đâu) đúng với giới từ \"into\" có sẵn. \"bury into\", \"wrap into\" và \"contain into\" đều sai cấu trúc và sai nghĩa."},{"num":15,"question":"Air ______ in big cities is getting worse every year.","options":["pollution","pollute","pollutant","polluted"],"answerIndex":0,"explanation":"Chủ ngữ cần danh từ không đếm được: \"air pollution\" (ô nhiễm không khí). \"pollute\" là động từ; \"pollutant\" là danh từ đếm được chỉ chất gây ô nhiễm; \"polluted\" là tính từ."},{"num":16,"question":"Many people worry about their ______ when they use social media.","options":["private","privacy","privately","privatize"],"answerIndex":1,"explanation":"Sau tính từ sở hữu \"their\" cần danh từ: \"privacy\" (quyền riêng tư). \"private\" là tính từ; \"privately\" là trạng từ; \"privatize\" là động từ."}],"gapfill":[{"num":1,"sentence":"Cars and factories release harmful ______ into the air every day.","answer":"pollutants"},{"num":2,"sentence":"The postman delivered a heavy ______ to our house this morning.","answer":"package"},{"num":3,"sentence":"Old batteries should never be ______ in the garden.","answer":"buried"},{"num":4,"sentence":"She uses a paper ______ to mark the page she has reached.","answer":"bookmark"},{"num":5,"sentence":"Plastic waste has a ______ effect on sea animals such as turtles.","answer":"negative"},{"num":6,"sentence":"Engineers found a ______ in the water pipe under the road.","answer":"leakage"},{"num":7,"sentence":"We store rice and sugar in glass ______ with tight lids.","answer":"containers"},{"num":8,"sentence":"The government ______ several state companies in the 1990s.","answer":"privatized"},{"num":9,"sentence":"Christmas ______ paper can usually be recycled with other paper.","answer":"wrapping"},{"num":10,"sentence":"The ______ of these boxes is high: each one can be used at least twenty times.","answer":"reusability"}]},"3":{"title":"READING","words":[{"word":"decompose","ipa":"/ˌdiːkəmˈpəʊz/","pos":"v.","meaning":"phân hủy"},{"word":"decomposition","ipa":"/ˌdiːkɒmpəˈzɪʃn/","pos":"n.","meaning":"sự phân hủy"},{"word":"landfill","ipa":"/ˈlændfɪl/","pos":"n.","meaning":"bãi chôn lấp rác"},{"word":"convenience","ipa":"/kənˈviːniəns/","pos":"n.","meaning":"sự tiện lợi"},{"word":"convenient","ipa":"/kənˈviːniənt/","pos":"adj.","meaning":"thuận tiện"},{"word":"conveniently","ipa":"/kənˈviːniəntli/","pos":"adv.","meaning":"một cách thuận tiện"},{"word":"reusable","ipa":"/ˌriːˈjuːzəbl/","pos":"adj.","meaning":"có thể tái sử dụng"},{"word":"reuse","ipa":"/ˌriːˈjuːz/","pos":"v.","meaning":"tái sử dụng"},{"word":"recycle","ipa":"/ˌriːˈsaɪkl/","pos":"v.","meaning":"tái chế"},{"word":"recycling","ipa":"/ˌriːˈsaɪklɪŋ/","pos":"n.","meaning":"việc tái chế"},{"word":"recyclable","ipa":"/ˌriːˈsaɪkləbl/","pos":"adj.","meaning":"có thể tái chế"},{"word":"packaging","ipa":"/ˈpækɪdʒɪŋ/","pos":"n.","meaning":"bao bì"},{"word":"package","ipa":"/ˈpækɪdʒ/","pos":"n., v.","meaning":"gói hàng; đóng gói"},{"word":"cardboard","ipa":"/ˈkɑːdbɔːd/","pos":"n.","meaning":"bìa cứng"},{"word":"leftover","ipa":"/ˈleftəʊvə(r)/","pos":"n.","meaning":"thức ăn thừa"},{"word":"leftovers","ipa":"/ˈleftəʊvəz/","pos":"n.pl.","meaning":"đồ ăn thừa"},{"word":"contaminate","ipa":"/kənˈtæmɪneɪt/","pos":"v.","meaning":"làm ô nhiễm"},{"word":"contamination","ipa":"/kənˌtæmɪˈneɪʃn/","pos":"n.","meaning":"sự ô nhiễm"},{"word":"contaminated","ipa":"/kənˈtæmɪneɪtɪd/","pos":"adj.","meaning":"bị ô nhiễm"},{"word":"rinse out","ipa":"/rɪns aʊt/","pos":"v. phr.","meaning":"tráng sạch"},{"word":"rinse","ipa":"/rɪns/","pos":"v., n.","meaning":"rửa, tráng"},{"word":"single-use","ipa":"/ˌsɪŋɡl ˈjuːs/","pos":"adj.","meaning":"dùng một lần"},{"word":"plastic","ipa":"/ˈplæstɪk/","pos":"n., adj.","meaning":"nhựa; bằng nhựa"},{"word":"bottle","ipa":"/ˈbɒtl/","pos":"n.","meaning":"chai, lọ"},{"word":"symbol","ipa":"/ˈsɪmbl/","pos":"n.","meaning":"ký hiệu, biểu tượng"},{"word":"symbolic","ipa":"/sɪmˈbɒlɪk/","pos":"adj.","meaning":"mang tính biểu tượng"},{"word":"reduce","ipa":"/rɪˈdjuːs/","pos":"v.","meaning":"giảm, cắt giảm"},{"word":"reduction","ipa":"/rɪˈdʌkʃn/","pos":"n.","meaning":"sự giảm"},{"word":"reduced","ipa":"/rɪˈdjuːst/","pos":"adj.","meaning":"được giảm"}],"mcq":[{"num":1,"question":"Many people still choose plastic bags simply for their ______.","options":["convenient","conveniently","convenience","conveniences"],"answerIndex":2,"explanation":"Sau tính từ sở hữu \"their\" cần danh từ không đếm được: \"convenience\" (sự tiện lợi). \"convenient\" là tính từ; \"conveniently\" là trạng từ; \"conveniences\" số nhiều mang nghĩa khác (các tiện nghi)."},{"num":2,"question":"The supermarket is very ______ because it is only five minutes from my house.","options":["convenient","convenience","conveniently","conveniences"],"answerIndex":0,"explanation":"Sau \"is very\" cần tính từ: \"convenient\" (thuận tiện). \"convenience/conveniences\" là danh từ; \"conveniently\" là trạng từ."},{"num":3,"question":"The recycling bins are ______ placed just inside the school gate.","options":["convenient","conveniently","convenience","conveniences"],"answerIndex":1,"explanation":"Chỗ trống bổ nghĩa cho phân từ \"placed\" nên cần trạng từ: \"conveniently placed\" (được đặt ở nơi thuận tiện)."},{"num":4,"question":"Every family should ______ paper, glass and metal instead of mixing them with food waste.","options":["recycling","recyclable","recycled","recycle"],"answerIndex":3,"explanation":"Sau \"should\" cần động từ nguyên thể: \"recycle\" (tái chế). \"recycling\" là danh từ/V-ing; \"recyclable\" là tính từ; \"recycled\" sai dạng sau \"should\"."},{"num":5,"question":"The town's ______ programme has cut its waste by half in three years.","options":["recycle","recyclable","recycled","recycling"],"answerIndex":3,"explanation":"Trước danh từ \"programme\", danh từ \"recycling\" đóng vai trò bổ nghĩa: \"a recycling programme\" (chương trình tái chế). \"recycle\" là động từ; \"recyclable\" và \"recycled\" là tính từ mô tả vật liệu, không mô tả chương trình."},{"num":6,"question":"Look for the triangle symbol to see whether the box is ______.","options":["recycling","recycle","recyclable","recycled"],"answerIndex":2,"explanation":"Sau \"is\" cần tính từ chỉ khả năng: \"recyclable\" (có thể tái chế). \"recycled\" nghĩa là đã được tái chế rồi nên không khớp với việc tra ký hiệu để biết khả năng tái chế; \"recycling/recycle\" sai từ loại."},{"num":7,"question":"The books arrived safely in a large ______ box.","options":["leftover","cardboard","symbol","bottle"],"answerIndex":1,"explanation":"\"a cardboard box\" (thùng bìa cứng) là cụm chuẩn. \"leftover\" (đồ ăn thừa), \"symbol\" (ký hiệu) và \"bottle\" (chai) không tạo thành loại hộp đựng sách."},{"num":8,"question":"We put the ______ from dinner in the fridge and ate them the next day.","options":["leftovers","bottles","symbols","packages"],"answerIndex":0,"explanation":"\"leftovers\" (thức ăn thừa) là thứ được cất tủ lạnh rồi ăn hôm sau. \"bottles\", \"symbols\" và \"packages\" đều sai nghĩa với \"from dinner … ate them\"."},{"num":9,"question":"The water in the well was ______ by chemicals from the factory.","options":["contaminated","contaminate","contamination","contaminating"],"answerIndex":0,"explanation":"Câu ở thể bị động \"was + V3\": \"was contaminated by\" (bị làm ô nhiễm bởi). \"contaminate\" là nguyên thể; \"contamination\" là danh từ; \"contaminating\" là V-ing."},{"num":10,"question":"Washing your hands carefully helps prevent the ______ of food.","options":["contaminate","contaminated","contaminating","contamination"],"answerIndex":3,"explanation":"Sau \"prevent the\" cần danh từ: \"the contamination of food\" (sự nhiễm bẩn thực phẩm). Ba phương án còn lại là động từ hoặc tính từ."},{"num":11,"question":"Please ______ the yoghurt pots before putting them in the recycling bin.","options":["throw away","turn off","rinse out","rush out"],"answerIndex":2,"explanation":"\"rinse out sth\" (tráng sạch cái gì) là việc cần làm trước khi bỏ vào thùng tái chế. \"throw away\" mâu thuẫn với việc đem đi tái chế; \"turn off\" (tắt) và \"rush out\" (lao ra ngoài) sai nghĩa."},{"num":12,"question":"Many countries have now banned ______ plastic straws and cups.","options":["recyclable","single-use","convenient","symbolic"],"answerIndex":1,"explanation":"\"single-use plastic\" (nhựa dùng một lần) chính là loại sản phẩm bị cấm. \"recyclable\" (có thể tái chế) mâu thuẫn với việc bị cấm; \"convenient\" và \"symbolic\" không mô tả được loại nhựa."},{"num":13,"question":"The three arrows form a ______ meaning that the product can be recycled.","options":["symbolic","symbol","symbols","symbolically"],"answerIndex":1,"explanation":"Sau mạo từ \"a\" cần danh từ số ít: \"a symbol\" (một ký hiệu). \"symbolic\" là tính từ; \"symbols\" số nhiều không đi với \"a\"; \"symbolically\" là trạng từ."},{"num":14,"question":"The easiest way to help the planet is to ______ the amount of waste you produce.","options":["reduce","reduction","reduced","reducing"],"answerIndex":0,"explanation":"Sau \"to\" trong cấu trúc \"the way … is to do sth\" cần động từ nguyên thể: \"reduce\" (giảm). \"reduction\" là danh từ; \"reduced/reducing\" sai dạng sau \"to\"."},{"num":15,"question":"There has been a sharp ______ in the use of plastic bags since the new law.","options":["reduce","reduced","reducing","reduction"],"answerIndex":3,"explanation":"Sau \"a sharp\" cần danh từ: \"a sharp reduction in sth\" (sự giảm mạnh về điều gì). Ba phương án còn lại là động từ hoặc phân từ."},{"num":16,"question":"The ______ of organic waste in landfills produces large amounts of methane.","options":["decompose","decomposable","decomposition","decomposed"],"answerIndex":2,"explanation":"Chủ ngữ của \"produces\" cần danh từ: \"the decomposition of sth\" (sự phân hủy của cái gì). \"decompose\" là động từ; \"decomposable\" là tính từ; \"decomposed\" là phân từ."}],"gapfill":[{"num":1,"sentence":"Most household rubbish in our province is taken to a ______ outside the city.","answer":"landfill"},{"num":2,"sentence":"Chemicals from old batteries can ______ the soil for many years.","answer":"contaminate"},{"num":3,"sentence":"Glass ______ can be washed and used again and again.","answer":"bottles"},{"num":4,"sentence":"Fruit and vegetables are often sold in unnecessary plastic ______.","answer":"packaging"},{"num":5,"sentence":"Please ______ the tins under the ":"phản hồi, cách ứng phó"},{"word":"respond","ipa":"/rɪˈspɒnd/","pos":"v.","meaning":"phản hồi"},{"word":"responsive","ipa":"/rɪˈspɒnsɪv/","pos":"adj.","meaning":"phản hồi nhanh"},{"word":"promote","ipa":"/prəˈməʊt/","pos":"v.","meaning":"thúc đẩy, khuyến khích"},{"word":"promotion","ipa":"/prəˈməʊʃn/","pos":"n.","meaning":"sự thúc đẩy"},{"word":"promotional","ipa":"/prəˈməʊʃənl/","pos":"adj.","meaning":"mang tính quảng bá"},{"word":"resource","ipa":"/rɪˈzɔːs/","pos":"n.","meaning":"tài nguyên"},{"word":"resourceful","ipa":"/rɪˈzɔːsfl/","pos":"adj.","meaning":"tháo vát"},{"word":"develop","ipa":"/dɪˈveləp/","pos":"v.","meaning":"phát triển"},{"word":"development","ipa":"/dɪˈveləpmənt/","pos":"n.","meaning":"sự phát triển"},{"word":"developed","ipa":"/dɪˈveləpt/","pos":"adj.","meaning":"phát triển"},{"word":"habit","ipa":"/ˈhæbɪt/","pos":"n.","meaning":"thói quen"},{"word":"habitual","ipa":"/həˈbɪtʃuəl/","pos":"adj.","meaning":"theo thói quen"},{"word":"habitually","ipa":"/həˈbɪtʃuəli/","pos":"adv.","meaning":"theo thói quen"}],"mcq":[{"num":1,"question":"Buying food grown near your home is a good ______ for the environment.","options":["choose","choice","chosen","choosing"],"answerIndex":1,"explanation":"Sau \"a good\" cần danh từ: \"choice\" (sự lựa chọn). \"choose\" là động từ; \"chosen\" là phân từ/tính từ; \"choosing\" là V-ing."},{"num":2,"question":"Students can ______ between three different environmental projects this term.","options":["choice","chosen","choose","choosing"],"answerIndex":2,"explanation":"Sau \"can\" cần động từ nguyên thể: \"choose between\" (chọn giữa). \"choice\" là danh từ; \"chosen/choosing\" sai dạng sau động từ khuyết thiếu."},{"num":3,"question":"______ your rubbish into different bins takes only a few seconds.","options":["Sort","Sorted","Sorts","Sorting"],"answerIndex":3,"explanation":"Chủ ngữ của \"takes\" cần danh động từ: \"Sorting your rubbish\" (việc phân loại rác). \"Sort/Sorts/Sorted\" là các dạng động từ, không làm chủ ngữ của câu này."},{"num":4,"question":"Vegetable peel and dead leaves can be turned into ______ for the school garden.","options":["compost","leaflet","device","printer"],"answerIndex":0,"explanation":"\"compost\" (phân hữu cơ) chính là thứ tạo ra từ vỏ rau và lá khô. \"leaflet\" (tờ rơi), \"device\" (thiết bị) và \"printer\" (máy in) sai nghĩa hoàn toàn."},{"num":5,"question":"This small ______ measures the amount of electricity your home uses.","options":["leaflet","club","habit","device"],"answerIndex":3,"explanation":"\"a device\" (thiết bị) là vật có thể đo lượng điện. \"leaflet\" (tờ rơi), \"club\" (câu lạc bộ) và \"habit\" (thói quen) không phải máy móc."},{"num":6,"question":"Our school has bought a new ______ that uses much less ink.","options":["printing","printer","print","printed"],"answerIndex":1,"explanation":"Sau \"a new\" cần danh từ chỉ máy móc: \"printer\" (máy in). \"printing\" là việc in ấn; \"print/printed\" là động từ."},{"num":7,"question":"Double-sided ______ saves a great deal of paper every year.","options":["printer","print","printing","printed"],"answerIndex":2,"explanation":"Chủ ngữ của \"saves\" cần danh từ chỉ hoạt động: \"printing\" (việc in ấn). \"printer\" chỉ máy in; \"print/printed\" là động từ."},{"num":8,"question":"Members of the club handed out ______ about saving water at home.","options":["leaflets","devices","habits","responses"],"answerIndex":0,"explanation":"\"hand out leaflets\" (phát tờ rơi) là collocation chuẩn cho hoạt động tuyên truyền. \"devices\" (thiết bị), \"habits\" (thói quen) và \"responses\" (phản hồi) không phải thứ được phát cho người qua đường."},{"num":9,"question":"Always use ______ printing to cut the amount of paper you waste.","options":["resourceful","promotional","double-sided","habitual"],"answerIndex":2,"explanation":"\"double-sided printing\" (in hai mặt) là cách giảm giấy. \"resourceful\" (tháo vát) dùng cho người; \"promotional\" (mang tính quảng bá) và \"habitual\" (theo thói quen) không mô tả đư g đi với mạo từ \"a\"."},{"num":16,"question":"Sustainable ______ means meeting today's needs without harming future generations.","options":["develop","developed","developing","development"],"answerIndex":3,"explanation":"Sau tính từ \"Sustainable\" và ở vị trí chủ ngữ cần danh từ: \"sustainable development\" (phát triển bền vững). \"develop\" là động từ; \"developed/developing\" là tính từ hoặc phân từ."}],"gapfill":[{"num":1,"sentence":"The waste is ______ into paper, glass and metal before it is recycled.","answer":"sorted"},{"num":2,"sentence":"Our environment ______ meets every Friday afternoon in room 12.","answer":"club"},{"num":3,"sentence":"She will ______ her ideas to the whole school next Monday.","answer":"present"},{"num":4,"sentence":"He is very ______ and can fix almost anything with a few simple tools.","answer":"resourceful"},{"num":5,"sentence":"The company has ______ a machine that turns food waste into fertiliser.","answer":"developed"},{"num":6,"sentence":"The ______ of green transport is one of the city's main goals this year.","answer":"promotion"},{"num":7,"sentence":"In this ______, the best thing to do is to ask your teacher for help.","answer":"situation"},{"num":8,"sentence":"He ______ leaves the lights on when he goes out of the room.","answer":"habitually"},{"num":9,"sentence":"The three ______ students will represent our class in the national contest.","answer":"chosen"},{"num":10,"sentence":"The company is very ______ to customer complaints and replies within a day.","answer":"responsive"}]},"5":{"title":"LISTENING","words":[{"word":"compost","ipa":"/ˈkɒmpɒst/","pos":"n.","meaning":"phân hữu cơ"},{"word":"compost","ipa":"/kəmˈpɒst/","pos":"v.","meaning":"ủ làm phân hữu cơ"},{"word":"compostable","ipa":"/kəmˈpɒstəbl/","pos":"adj.","meaning":"có thể ủ thành phân"},{"word":"decompose","ipa":"/ˌdiːkəmˈpəʊz/","pos":"v.","meaning":"phân hủy"},{"word":"decomposition","ipa":"/ˌdiːkɒmpəˈzɪʃn/","pos":"n.","meaning":"sự phân hủy"},{"word":"deco g"},{"word":"pile","ipa":"/paɪl/","pos":"v.","meaning":"chất đống"}],"mcq":[{"num":1,"question":"These paper plates are ______, so you can put them straight on the garden heap.","options":["compost","composted","compostable","composting"],"answerIndex":2,"explanation":"Sau \"are\" cần tính từ chỉ khả năng: \"compostable\" (có thể ủ thành phân). \"compost\" là danh từ/động từ; \"composted\" nghĩa là đã được ủ; \"composting\" là V-ing."},{"num":2,"question":"Leaves and grass are ______ and turn into soil within a few months.","options":["decompose","decomposition","decomposed","decomposable"],"answerIndex":3,"explanation":"Sau \"are\" cần tính từ: \"decomposable\" (có thể phân hủy), song hành với \"turn into soil\". \"decompose\" là động từ nguyên thể; \"decomposition\" là danh từ; \"decomposed\" nghĩa là đã phân hủy xong."},{"num":3,"question":"Cover the food waste with a thin ______ of dry leaves.","options":["layer","pile","mixture","peel"],"answerIndex":0,"explanation":"\"a thin layer of sth\" (một lớp mỏng) là cụm chuẩn khi phủ lên bề mặt. \"pile\" là một đống cao; \"mixture\" là hỗn hợp; \"peel\" là vỏ quả — đều không đi với \"thin … of dry leaves\" theo nghĩa phủ lên."},{"num":4,"question":"Build the compost heap in ______, putting dry and wet material in turn.","options":["piles","layers","mixtures","peels"],"answerIndex":1,"explanation":"\"in layers\" (thành từng lớp) khớp với \"putting dry and wet material in turn\". \"in piles\" nghĩa là thành nhiều đống riêng, mâu thuẫn với \"the compost heap\" số ít; \"mixtures\" và \"peels\" sai nghĩa."},{"num":5,"question":"About half of all ______ waste in Viet Nam could be composted at home.","options":["wasteful","household","additional","layered"],"answerIndex":1,"explanation":"\"household waste\" (rác sinh hoạt) là cụm cố định. \"wasteful\" (lãng phí), \"additional\" (bổ sung) và \"layered\" (có nhiều lớp) không tạo thành loại rác này."},{"num":6,"question":"Printing every email you receive is a ______ habit.","options":["waste","wasted","wasteful","wasting"],"answerIndex":2,"explanation":"Trước danh từ \"habit\" cần tính từ: \"a wasteful habit\" (thói quen lãng phí). \"waste\" là danh từ/động từ; \"wasted\" nghĩa là bị lãng phí; \"wasting\" là V-ing."},{"num":7,"question":"Please do not ______ water while you are washing the dishes.","options":["waste","wasteful","wasted","wasting"],"answerIndex":0,"explanation":"Sau \"do not\" cần động từ nguyên thể: \"waste water\" (lãng phí nước). \"wasteful\" là tính từ; \"wasted/wasting\" sai dạng sau \"do not\"."},{"num":8,"question":"Compost is a ______ of food scraps, dry leaves and a little soil.","options":["mix","mixed","mixing","mixture"],"answerIndex":3,"explanation":"Sau mạo từ \"a\" cần danh từ: \"a mixture of\" (một hỗn hợp gồm). \"mix\" thường dùng làm động từ; \"mixed\" là tính từ; \"mixing\" là V-ing."},{"num":9,"question":"______ the materials well before you cover the heap with soil.","options":["Mixture","Mix","Mixed","Mixing"],"answerIndex":1,"explanation":"Câu mệnh lệnh cần động từ nguyên thể đứng đầu: \"Mix the materials\" (trộn đều nguyên liệu). \"Mixture\" là danh từ; \"Mixed\" và \"Mixing\" sai dạng trong câu mệnh lệnh."},{"num":10,"question":"______ a little water if the compost pile becomes too dry.","options":["Addition","Additional","Additionally","Add"],"answerIndex":3,"explanation":"Câu mệnh lệnh cần động từ nguyên thể: \"Add a little water\" (thêm một chút nước). \"Addition\" là danh từ; \"Additional\" là tính từ; \"Additionally\" là trạng từ."},{"num":11,"question":"The school needs ______ bins so that food waste can be collected separately.","options":["additional","addition","additionally","add"],"answerIndex":0,"explanation":"Trước danh từ \"bins\" cần tính từ: \"additional bins\" (thùng rác bổ sung). \"addition\" là danh từ; \"additionally\" là trạng từ; \"add\" là động từ."},{"num":12,"question":"Composting saves money. ______, it reduces the amount of rubbish sent to landfill.","options":["Additional","Addition","Additionally","Add"],"answerIndex":2,"explanation":"Đầu câu, trước dấu phẩy và nối ý bổ sung, cần trạng từ liên kết: \"Additionally\" (ngoài ra). \"Additional\" là tính từ; \"Addition\" là danh từ; \"Add\" là động từ."},{"num":13,"question":"Compost makes the ______ richer, so vegetables grow much better.","options":["pile","peel","soil","layer"],"answerIndex":2,"explanation":"\"make the soil richer\" (làm đất màu mỡ hơn) giải thích được \"vegetables grow much better\". \"pile\" (đống), \"peel\" (vỏ quả) và \"layer\" (lớp) không phải thứ nuôi cây."},{"num":14,"question":"Compost encourages the healthy ______ of vegetables and flowers.","options":["grow","growth","growing","grown"],"answerIndex":1,"explanation":"Sau \"the healthy\" cần danh từ: \"the growth of sth\" (sự phát triển của cái gì). \"grow/grown\" là động từ; \"growing\" là V-ing."},{"num":15,"question":"Banana skins and orange ______ break down very quickly in a compost heap.","options":["soil","layer","pile","peel"],"answerIndex":3,"explanation":"\"orange peel\" (vỏ cam) là cụm chuẩn chỉ vỏ trái cây. \"soil\" (đất), \"layer\" (lớp) và \"pile\" (đống) không kết hợp với \"orange\" theo nghĩa này."},{"num":16,"question":"The compost ______ at the end of our garden is nearly a metre high.","options":["pile","soil","peel","mixture"],"answerIndex":0,"explanation":"\"a compost pile\" (đống ủ phân) là vật có chiều cao \"nearly a metre high\". \"soil\", \"peel\" và \"mixture\" không tạo thành cụm chỉ đống ủ có chiều cao."}],"gapfill":[{"num":1,"sentence":"Nearly a third of ______ could be composted instead of being buried.","answer":"household waste"},{"num":2,"sentence":"Food waste ______ far more quickly than plastic does.","answer":"decomposes"},{"num":3,"sentence":"Put the leaves and food scraps in thin ______, one on top of the other.","answer":"layers"},{"num":4,"sentence":"Farmers spread ______ on the fields to make the earth richer.","answer":"compost"},{"num":5,"sentence":"All the ______ us
