rformed","perform"],"answerIndex":3,"explanation":"Sau \"can\" cần động từ nguyên thể: \"perform a task\" (thực hiện một nhiệm vụ). \"performance/performer\" là danh từ; \"performed\" sai dạng sau động từ khuyết thiếu."},{"num":10,"question":"The most popular ______ at the show was a dancing robot.","options":["performance","performer","perform","performed"],"answerIndex":1,"explanation":"Ở đây cần danh từ chỉ chủ thể biểu diễn để nối với \"a dancing robot\": \"performer\" (người/vật biểu diễn). \"performance\" là màn trình diễn chứ không phải chủ thể; \"perform/performed\" là động từ."}],"gapfill":[{"num":1,"sentence":"The two brothers ______ over their shared love of football.","answer":"bond"},{"num":2,"sentence":"Family ______ is much easier when everyone eats dinner together.","answer":"bonding"},{"num":3,"sentence":"Answering the same question all day long is very ______ work.","answer":"repetitive"},{"num":4,"sentence":"Learning only by ______ is not always the best method.","answer":"repetition"},{"num":5,"sentence":"Please ______ your name slowly so that I can write it down.","answer":"repeat"},{"num":6,"sentence":"The company car needs ______ every six months.","answer":"maintenance"},{"num":7,"sentence":"It is difficult to ______ a green garden in such dry weather.","answer":"maintain"},{"num":8,"sentence":"Robots can ______ dangerous tasks that people cannot do safely.","answer":"perform"},{"num":9,"sentence":"The team's ______ improved a lot after the new software was installed.","answer":"performance"},{"num":10,"sentence":"The best ______ of the evening was a ten-year-old violinist.","answer":"performer"}]},"7":{"title":"COMMUNICATION AND CULTURE/ CILL","words":[{"word":"get attention","ipa":"/ɡet əˈtenʃn/","pos":"phr.","meaning":"thu hút sự chú ý"},{"word":"interrupt","ipa":"/ˌɪntəˈrʌpt/","pos":"v.","meaning":"ngắt lời"},{"word":"application","ipa":"/ˌæplɪˈkeɪʃn/","pos":"n.","meaning":"ứng dụng"},{"word":"audience","ipa":"/ˈɔːdiəns/","pos":"n.","meaning":"khán giả"},{"word":"exhibition","ipa":"/ˌeksɪˈbɪʃn/","pos":"n.","meaning":"triển lãm"},{"word":"scientist","ipa":"/ˈsaɪəntɪst/","pos":"n.","meaning":"nhà khoa học"},{"word":"artificial intelligence (AI)","ipa":"/ˌɑːtɪfɪʃl ɪnˈtelɪdʒəns/","pos":"n.","meaning":"trí tuệ nhân tạo"},{"word":"robot","ipa":"/ˈrəʊbɒt/","pos":"n.","meaning":"rô-bốt"},{"word":"forced labour","ipa":"/fɔːst ˈleɪbə(r)/","pos":"n.phr.","meaning":"lao động cưỡng bức"},{"word":"introduce","ipa":"/ˌɪntrəˈdjuːs/","pos":"v.","meaning":"giới thiệu, đưa vào"},{"word":"industrial robotic arm","ipa":"/ɪnˈdʌstriəl rəʊˈbɒtɪk ɑːm/","pos":"n.phr.","meaning":"cánh tay rô-bốt công nghiệp"},{"word":"observe","ipa":"/əbˈzɜːv/","pos":"v.","meaning":"quan sát"},{"word":"surroundings","ipa":"/səˈraʊndɪŋz/","pos":"n.","meaning":"môi trường xung quanh"},{"word":"self-driving car","ipa":"/ˌself ˈdraɪvɪŋ kɑː(r)/","pos":"n.phr.","meaning":"xe tự lái"},{"word":"gesture","ipa":"/ˈdʒestʃə(r)/","pos":"n.","meaning":"cử chỉ"},{"word":"facial expression","ipa":"/ˈfeɪʃl ɪkˈspreʃn/","pos":"n.phr.","meaning":"nét mặt"}],"mcq":[{"num":1,"question":"She raised her hand to ______ the teacher's attention.","options":["interrupt","observe","introduce","get"],"answerIndex":3,"explanation":"\"get someone's attention\" (thu hút sự chú ý của ai) là collocation cố định. \"interrupt\", \"observe\" và \"introduce\" không đi với \"the teacher's attention\"."},{"num":2,"question":"Please do not ______ me while I am explaining the exercise.","options":["observe","introduce","interrupt","repeat"],"answerIndex":2,"explanation":"\"interrupt sb\" (ngắt lời ai) đúng nghĩa với \"while I am explaining\". \"observe\" (quan sát), \"introduce\" (giới thiệu) và \"repeat\" (lặp lại) sai nghĩa."},{"num":3,"question":"The ______ clapped for almost five minutes at the end of the talk.","options":["scientist","audience","exhibition","gesture"],"answerIndex":1,"explanation":"Người vỗ tay sau buổi nói chuyện là \"the audience\" (khán giả). \"scientist\" chỉ một người; \"exhibition\" (triển lãm) và \"gesture\" (cử chỉ) không thể vỗ tay."},{"num":4,"question":"The robot ______ attracted more than ten thousand visitors last month.","options":["exhibition","audience","surroundings","gesture"],"answerIndex":0,"explanation":"\"a robot exhibition\" (triển lãm rô-bốt) là sự kiện thu hút khách tham quan. \"audience\" chính là người xem nên không thể \"attract visitors\"; \"surroundings\" và \"gesture\" sai nghĩa."},{"num":5,"question":"A team of ______ has built a robot that can climb stairs on its own.","options":["audiences","gestures","surroundings","scientists"],"answerIndex":3,"explanation":"Người chế tạo rô-bốt là \"scientists\" (các nhà khoa học). \"audiences\" (khán giả), \"gestures\" (cử chỉ) và \"surroundings\" (môi trường xung quanh) không thể chế tạo máy móc."},{"num":6,"question":"The word \"robot\" comes from a Czech word meaning \"______\".","options":["facial expression","forced labour","self-driving car","industrial robotic arm"],"answerIndex":1,"explanation":"Từ \"robot\" bắt nguồn từ tiếng Séc \"robota\", nghĩa là \"forced labour\" (lao động cưỡng bức). Ba cụm còn lại đều là thuật ngữ công nghệ hiện đại, không phải nghĩa gốc của từ này."},{"num":7,"question":"The company plans to ______ a new model of vacuum robot next year.","options":["introduce","observe","interrupt","get"],"answerIndex":0,"explanation":"\"introduce a new model\" (đưa ra, giới thiệu một mẫu mới) là collocation chuẩn. \"observe\" (quan sát), \"interrupt\" (ngắt lời) và \"get\" (lấy) sai nghĩa trong ngữ cảnh ra mắt sản phẩm."},{"num":8,"question":"A/an ______ can weld car parts together all day without a break.","options":["facial expression","self-driving car","industrial robotic arm","forced labour"],"answerIndex":2,"explanation":"Thiết bị hàn các bộ phận ô tô trong nhà máy là \"industrial robotic arm\" (cánh tay rô-bốt công nghiệp). \"facial expression\" (nét mặt), \"self-driving car\" (xe tự lái) và \"forced labour\" (lao động cưỡng bức) không thực hiện được công việc hàn."},{"num":9,"question":"Scientists carefully ______ how the robot reacts to sudden loud noises.","options":["interrupt","introduce","observe","get"],"answerIndex":2,"explanation":"\"observe how sth reacts\" (quan sát cách thứ gì phản ứng) đúng nghĩa nghiên cứu. \"interrupt\", \"introduce\" và \"get\" không đi với mệnh đề \"how the robot reacts\" theo nghĩa này."},{"num":10,"question":"Cameras and sensors help the machine understand its ______.","options":["surroundings","gestures","audiences","applications"],"answerIndex":0,"explanation":"\"understand its surroundings\" (nhận biết môi trường xung quanh) là điều camera và cảm biến giúp máy làm được. \"gestures\" (cử chỉ), \"audiences\" (khán giả) và \"applications\" (ứng dụng) sai nghĩa."},{"num":11,"question":"A/An ______ uses cameras and computers instead of a human driver.","options":["facial expression","self-driving car","forced labour","exhibition"],"answerIndex":1,"explanation":"Phương tiện chạy không cần tài xế là \"self-driving car\" (xe tự lái). \"facial expression\", \"forced labour\" và \"exhibition\" không phải phương tiện giao thông."},{"num":12,"question":"The new robot can understand simple hand ______ such as pointing and waving.","options":["surroundings","audiences","scientists","gestures"],"answerIndex":3,"explanation":"\"hand gestures\" (cử chỉ tay) như chỉ trỏ và vẫy tay là cụm chuẩn. \"surroundings\", \"audiences\" và \"scientists\" không kết hợp với \"hand\" theo nghĩa này."},{"num":13,"question":"Human ______ show emotions such as anger, surprise and joy.","options":["facial expressions","self-driving cars","robotic arms","exhibitions"],"answerIndex":0,"explanation":"\"facial expressions\" (nét mặt) là thứ biểu lộ cảm xúc. \"self-driving cars\", \"robotic arms\" và \"exhibitions\" không thể hiện cảm xúc của con người."},{"num":14,"question":"Artificial intelligence now has practical ______ in medicine, farming and education.","options":["audiences","gestures","surroundings","applications"],"answerIndex":3,"explanation":"\"applications in a field\" (ứng dụng trong một lĩnh vực) là cụm chuẩn. \"audiences\" (khán giả), \"gestures\" (cử chỉ) và \"surroundings\" (môi trường xung quanh) sai nghĩa."}],"gapfill":[{"num":1,"sentence":"The speaker was ______ twice by questions from the back of the hall.","answer":"interrupted"},{"num":2,"sentence":"A large ______ gathered in the square to watch the demonstration.","answer":"audience"},{"num":3,"sentence":"The science ______ opens on Saturday and runs for a whole month.","answer":"exhibition"},{"num":4,"sentence":"Deaf people use hand ______ to communicate with one another.","answer":"gestures"},{"num":5,"sentence":"Actors use ______ to show what their character is feeling.","answer":"facial expressions"},{"num":6,"sentence":"This small ______ can vacuum the whole house by itself.","answer":"robot"},{"num":7,"sentence":"Biologists ______ animals for months before writing their reports.","answer":"observe"},{"num":8,"sentence":"Insects use their antennae to sense their ______.","answer":"surroundings"},{"num":9,"sentence":"May I ______ my colleague, Dr Nam, who designed this machine?","answer":"introduce"},{"num":10,"sentence":"The software already has many practical ______ in farming.","answer":"applications"}]}},"7":{"1":{"title":"GETTING STARTED","words":[{"word":"charity event","ipa":"/ˈtʃærəti ɪˈvent/","pos":"n.phr.","meaning":"sự kiện từ thiện"},{"word":"publicity","ipa":"/pʌbˈlɪsəti/","pos":"n.","meaning":"hoạt động quảng bá, tuyên truyền"},{"word":"attract people's attention","ipa":"/əˈtrækt ˈpiːplz əˈtenʃn/","pos":"phr.","meaning":"thu hút sự chú ý của mọi người"},{"word":"advert","ipa":"/ˈædvɜːt/","pos":"n.","meaning":"quảng cáo"},{"word":"local newspaper","ipa":"/ˈləʊkl ˈnjuːzpeɪpə(r)/","pos":"n.phr.","meaning":"báo địa phương"},{"word":"afford","ipa":"/əˈfɔːd/","pos":"v.","meaning":"có khả năng chi trả"},{"word":"profit-making","ipa":"/ˈprɒfɪt ˌmeɪkɪŋ/","pos":"adj.","meaning":"vì mục đích lợi nhuận"},{"word":"poster","ipa":"/ˈpəʊstə(r)/","pos":"n.","meaning":"áp phích"},{"word":"viewer","ipa":"/ˈvjuːə(r)/","pos":"n.","meaning":"người xem"},{"word":"commercial","ipa":"/kəˈmɜːʃl/","pos":"n.","meaning":"quảng cáo (trên TV, radio, Internet)"},{"word":"social media site","ipa":"/ˌsəʊʃl ˈmiːdiə saɪt/","pos":"n.phr.","meaning":"trang mạng xã hội"},{"word":"social media presence","ipa":"/ˌsəʊʃl ˈmiːdiə ˈprezəns/","pos":"n.phr.","meaning":"sự hiện diện trên mạng xã hội"},{"word":"promote","ipa":"/prəˈməʊt/","pos":"v.","meaning":"quảng bá, quảng cáo"},{"word":"communication tool","ipa":"/kəˌmjuːnɪˈkeɪʃn tuːl/","pos":"n.phr.","meaning":"công cụ giao tiếp"},{"word":"design","ipa":"/dɪˈzaɪn/","pos":"v.","meaning":"thiết kế"},{"word":"connect with","ipa":"/kəˈnekt wɪð/","pos":"phr.v","meaning":"kết nối với"}],"mcq":[{"num":1,"question":"Our school is organising a ______ to raise money for the flood victims.","options":["communication tool","local newspaper","charity event","social media site"],"answerIndex":2,"explanation":"\"a charity event\" (sự kiện từ thiện) là hoạt động được tổ chức để gây quỹ. \"communication tool\" (công cụ giao tiếp), \"local newspaper\" (báo địa phương) và \"social media site\" (trang mạng xã hội) không phải sự kiện được tổ chức."},{"num":2,"question":"The concert received a great deal of ______ in the national press.","options":["poster","viewer","advert","publicity"],"answerIndex":3,"explanation":"\"receive publicity\" (được truyền thông chú ý, được quảng bá) là collocation chuẩn với \"in the national press\". \"poster\" (áp phích), \"viewer\" (người xem) và \"advert\" (mẩu quảng cáo) là những vật/người cụ thể, không phải sự chú ý của báo chí."},{"num":3,"question":"A brightly coloured poster is a cheap way to ______ people's attention.","options":["attract","afford","promote","design"],"answerIndex":0,"explanation":"\"attract people's attention\" (thu hút sự chú ý của mọi người) là cụm cố định. \"afford\" (đủ tiền), \"promote\" (quảng bá) và \"design\" (thiết kế) không đi với \"people's attention\"."},{"num":4,"question":"I saw a/an ______ for a part-time job in the local newspaper yesterday.","options":["poster","advert","viewer","commercial"],"answerIndex":1,"explanation":"Mẩu tin tuyển dụng đăng trên báo là \"advert\" (quảng cáo trên báo). \"poster\" được dán trên tường; \"viewer\" chỉ người xem; \"commercial\" là quảng cáo trên truyền hình hoặc radio."},{"num":5,"question":"A small sports club cannot ______ to advertise on national television.","options":["afford","promote","design","connect"],"answerIndex":0,"explanation":"\"cannot afford to do sth\" (không đủ tiền để làm gì) là cấu trúc cố định. \"promote\", \"design\" và \"connect\" không đi với \"to advertise\" theo nghĩa khả năng tài chính."},{"num":6,"question":"This is not a ______ organisation; every dong we raise goes to the patients.","options":["charitable","stressful","mutual","profit-making"],"answerIndex":3,"explanation":"Chi tiết \"every dong we raise goes to the patients\" phủ định mục tiêu lợi nhuận nên cần \"profit-making\" (vì lợi nhuận). \"charitable\" (từ thiện) sẽ mâu thuẫn với từ phủ định \"not\"; \"stressful\" và \"mutual\" không mô tả được mục đích hoạt động của tổ chức."},{"num":7,"question":"Volunteers put up ______ all over the town to advertise the event.","options":["viewers","commercials","posters","newspapers"],"answerIndex":2,"explanation":"\"put up posters\" (dán áp phích) là collocation chuẩn cho hành động dán khắp thị trấn. \"viewers\" chỉ người xem; \"commercials\" phát trên truyền hình; \"newspapers\" được bán chứ không được dán lên tường."},{"num":8,"question":"The programme attracted more than eight million ______ last Sunday evening.","options":["posters","viewers","commercials","newspapers"],"answerIndex":1,"explanation":"Người xem một chương trình truyền hình là \"viewers\". \"posters\", \"commercials\" và \"newspapers\" là vật, không phải khán giả."},{"num":9,"question":"During the match there was a two-minute ______ for a Japanese car company.","options":["poster","commercial","viewer","publicity"],"answerIndex":1,"explanation":"Đoạn quảng cáo phát trong trận đấu, tính bằng phút, là \"commercial\" (quảng cáo truyền hình). \"poster\" là bản in; \"viewer\" chỉ người xem; \"publicity\" là sự quảng bá nói chung, không đo bằng phút."},{"num":10,"question":"Facebook is still the most popular ______ among adults in this country.","options":["local newspaper","charity event","digital billboard","social media site"],"answerIndex":3,"explanation":"Facebook là một \"social media site\" (trang mạng xã hội). \"local newspaper\", \"charity event\" và \"digital billboard\" là những thứ hoàn toàn khác."},{"num":11,"question":"Every small business today needs a strong ______ to reach young customers.","options":["local newspaper","charity event","social media presence","communication tool"],"answerIndex":2,"explanation":"\"social media presence\" (sự hiện diện trên mạng xã hội) là thứ doanh nghiệp cần xây dựng để tiếp cận khách hàng trẻ. Ba cụm còn lại không diễn tả được sự hiện diện trực tuyến."},{"num":12,"question":"The club uses short videos on TikTok to ______ its weekly activities.","options":["promote","afford","connect","attract"],"answerIndex":0,"explanation":"\"promote its activities\" (quảng bá các hoạt động) là collocation chuẩn. \"afford\" nói về khả năng chi trả; \"connect\" cần giới từ \"with\"; \"attract\" thường đi với \"attention\" hoặc \"visitors\", không đi với \"activities\"."},{"num":13,"question":"A graphic artist will ______ the poster for our charity concert.","options":["afford","promote","design","connect"],"answerIndex":2,"explanation":"\"design a poster\" (thiết kế áp phích) là công việc của họa sĩ đồ họa. \"afford\", \"promote\" và \"connect\" không đi với \"the poster\" theo nghĩa tạo ra bản thiết kế."},{"num":14,"question":"Social media allows charities to connect ______ young people all over the world.","options":["to","for","at","with"],"answerIndex":3,"explanation":"\"connect with sb\" (kết nối với ai) là cụm cố định. \"connect to\" dùng cho thiết bị hoặc mạng lưới; \"connect for\" và \"connect at\" không phải cụm chuẩn."},{"num":15,"question":"Before the internet, the telephone was the most important ______ in business.","options":["communication tool","charity event","social media presence","local newspaper"],"answerIndex":0,"explanation":"Điện thoại là một \"communication tool\" (công cụ giao tiếp). \"charity event\", \"social media presence\" và \"local newspaper\" không phải công cụ liên lạc trực tiếp giữa hai người."}],"gapfill":[{"num":1,"sentence":"The film star's wedding received enormous ______ in the newspapers.","answer":"publicity"},{"num":2,"sentence":"Our club cannot ______ to print colour leaflets this year.","answer":"afford"},{"num":3,"sentence":"She helped ______ the poster for the school music festival.","answer":"design"},{"num":4,"sentence":"Children see hundreds of television ______ every single week.","answer":"commercials"},{"num":5,"sentence":"Class 12A is organising a ______ to help the children's hospital.","answer":"charity event"},{"num":6,"sentence":"Bright colours and large letters help ______ people's attention.","answer":"attract"},{"num":7,"sentence":"Students put ______ on every noticeboard in the school.","answer":"posters"},{"num":8,"sentence":"He read the job ______ twice before sending his application.","answer":"advert"},{"num":9,"sentence":"This app helps you ______ with old school friends.","answer":"connect"},{"num":10,"sentence":"The council uses social media to ______ local events and festivals.","answer":"promote"}]},"2":{"title":"LANGUAGE","words":[{"word":"profit‑making","ipa":"/ˈprɒfɪt ˌmeɪkɪŋ/","pos":"adj","meaning":"sinh lợi"},{"word":"profit","ipa":"/ˈprɒfɪt/","pos":"n","meaning":"lợi nhuận"},{"word":"profitable","ipa":"/ˈprɒfɪtəbl/","pos":"adj","meaning":"có lợi nhuận"},{"word":"profitability","ipa":"/ˌprɒfɪtəˈbɪləti/","pos":"n","meaning":"khả năng sinh lợi"},{"word":"permission","ipa":"/pəˈmɪʃn/","pos":"n","meaning":"sự cho phép"},{"word":"permit","ipa":"/pəˈmɪt/","pos":"v","meaning":"cho phép"},{"word":"permissible","ipa":"/pəˈmɪsəbl/","pos":"adj","meaning":"được cho phép"},{"word":"reliable","ipa":"/rɪˈlaɪəbl/","pos":"adj","meaning":"đáng tin cậy"},{"word":"reliability","ipa":"/rɪˌlaɪəˈbɪləti/","pos":"n","meaning":"độ tin cậy"},{"word":"rely (on)","ipa":"/rɪˈlaɪ/","pos":"v","meaning":"dựa vào"},{"word":"bias","ipa":"/ˈbaɪəs/","pos":"n","meaning":"sự thiên vị"},{"word":"biased","ipa":"/ˈbaɪəst/","pos":"adj","meaning":"thiên vị"},{"word":"unbiased","ipa":"/ʌnˈbaɪəst/","pos":"adj","meaning":"không thiên vị"},{"word":"fake news","ipa":"/ˌfeɪk ˈnjuːz/","pos":"n","meaning":"tin giả"},{"word":"fake","ipa":"/feɪk/","pos":"adj","meaning":"giả"},{"word":"the press","ipa":"/ðə pres/","pos":"n","meaning":"báo chí"},{"word":"press (verb)","ipa":"/pres/","pos":"v","meaning":"nhấn; ép"},{"word":"injure","ipa":"/ˈɪndʒə(r)/","pos":"v","meaning":"làm bị thương"},{"word":"injury","ipa":"/ˈɪndʒəri/","pos":"n","meaning":"chấn thương"},{"word":"injured","ipa":"/ˈɪndʒəd/","pos":"adj","meaning":"bị thương"},{"word":"subordinating","ipa":"/səˈbɔːdɪneɪtɪŋ/","pos":"adj","meaning":"phụ thuộc; liên kết phụ (liên từ phụ thuộc)"},{"word":"subordinate","ipa":"/səˈbɔːdɪnət/","pos":"adj","meaning":"cấp dưới"},{"word":"subordinate","ipa":"/səˈbɔːdɪneɪt/","pos":"v","meaning":"làm phụ thuộc"},{"word":"guilty","ipa":"/ˈɡɪlti/","pos":"adj","meaning":"có tội"},{"word":"guilt","ipa":"/ɡɪlt/","pos":"n","meaning":"tội lỗi"},{"word":"guiltless","ipa":"/ˈɡɪltləs/","pos":"adj","meaning":"vô tội"},{"word":"stay up‑to‑date","ipa":"/steɪ ʌp tə ˈdeɪt/","pos":"phr v","meaning":"cập nhật"},{"word":"up‑to‑date","ipa":"/ˌʌp tə ˈdeɪt/","pos":"adj","meaning":"hiện đại; cập nhật"},{"word":"a vast range of sth","ipa":"/ə vɑːst reɪndʒ əv/","pos":"phr","meaning":"nhiều loại; phạm vi rộng lớn"},{"word":"vast","ipa":"/vɑːst/","pos":"adj","meaning":"rộng lớn"}],"mcq":[{"num":1,"question":"The company became ______ for the first time in its history last year.","options":["profit","profitability","profitably","profitable"],"answerIndex":3,"explanation":"Sau động từ nối \"became\" cần tính từ: \"profitable\" (có lãi). \"profit/profitability\" là danh từ; \"profitably\" là trạng từ."},{"num":2,"question":"The shop made a small ______ of two million dong last month.","options":["profit","profitable","profitability","profitably"],"answerIndex":0,"explanation":"Sau \"a small\" cần danh từ đếm được: \"a profit\" (khoản lợi nhuận). \"profitable\" là tính từ; \"profitability\" là danh từ trừu tượng không đếm được; \"profitably\" là trạng từ."},{"num":3,"question":"You need written ______ to film inside the museum.","options":["permit","permission","permissible","permitted"],"answerIndex":1,"explanation":"Sau \"written\" cần danh từ không đếm được: \"permission\" (sự cho phép). \"permit\" là động từ (hoặc giấy phép, nhưng không đi với \"written\" theo cách này); \"permissible\" là tính từ; \"permitted\" là phân từ."},{"num":4,"question":"School rules do not ______ students to use phones during lessons.","options":["permission","permissible","permit","permitted"],"answerIndex":2,"explanation":"Sau \"do not\" cần động từ nguyên thể: \"permit sb to do sth\" (cho phép ai làm gì). \"permission\" là danh từ; \"permissible\" là tính từ; \"permitted\" sai dạng sau \"do not\"."},{"num":5,"question":"Always check that the website is a ______ source of information.","options":["reliability","reliable","rely","reliably"],"answerIndex":1,"explanation":"Trước cụm danh từ \"source of information\" cần tính từ: \"a reliable source\" (nguồn đáng tin cậy). \"reliability\" là danh từ; \"rely\" là động từ; \"reliably\" là trạng từ."},{"num":6,"question":"Readers judge a newspaper by the ______ of its reporting.","options":["reliable","rely","reliably","reliability"],"answerIndex":3,"explanation":"Sau \"the\" và trước \"of\" cần danh từ: \"the reliability of sth\" (độ tin cậy của cái gì). \"reliable\" là tính từ; \"rely\" là động từ; \"reliably\" là trạng từ."},{"num":7,"question":"You should never rely ______ social media alone for accurate news.","options":["in","at","on","for"],"answerIndex":2,"explanation":"\"rely on sth\" (dựa vào cái gì) là cụm cố định. \"rely in\", \"rely at\" và \"rely for\" đều sai giới từ."},{"num":8,"question":"The article was clearly ______ in favour of the government.","options":["biased","bias","unbiased","biasing"],"answerIndex":0,"explanation":"Sau \"was clearly\" cần tính từ, và \"in favour of the government\" cho thấy sự thiên vị: \"biased\" (thiên vị). \"unbiased\" trái nghĩa; \"bias\" là danh từ; \"biasing\" là V-ing."},{"num":9,"question":"A good reporter always tries to give a/an ______ account of events.","options":["biased","bias","unbiased","biasing"],"answerIndex":2,"explanation":"Một phóng viên giỏi phải khách quan nên cần \"unbiased\" (không thiên vị). \"biased\" trái nghĩa với \"a good reporter\"; \"bias\" là danh từ; \"biasing\" là V-ing."},{"num":10,"question":"The study found a clear ______ against female candidates.","options":["bias","biased","unbiased","biasing"],"answerIndex":0,"explanation":"Sau \"a clear\" cần danh từ: \"a bias against sb\" (sự thiên vị chống lại ai). \"biased/unbiased\" là tính từ; \"biasing\" là V-ing."},{"num":11,"question":"______ spreads much faster online than true stories do.","options":["The press","Permission","Profitability","Fake news"],"answerIndex":3,"explanation":"\"Fake news\" (tin giả) là thứ được đặt đối lập với \"true stories\". \"The press\" (giới báo chí), \"Permission\" (sự cho phép) và \"Profitability\" (khả năng sinh lợi) không đối lập với tin thật."},{"num":12,"question":"Members of ______ were not allowed into the courtroom during the trial.","options":["the profit","the press","the bias","the injury"],"answerIndex":1,"explanation":"\"members of the press\" (các nhà báo) là cụm cố định. \"the profit\", \"the bias\" và \"the injury\" không phải nhóm người có thể là \"members\"."},{"num":13,"question":"Three people were seriously ______ in the accident on the motorway.","options":["injure","injured","injury","injuring"],"answerIndex":1,"explanation":"Câu bị động \"were + V3\": \"were injured\" (bị thương). \"injure\" là nguyên thể; \"injury\" là danh từ; \"injuring\" là V-ing."},{"num":14,"question":"He missed the whole season because of a serious knee ______.","options":["injure","injured","injuring","injury"],"answerIndex":3,"explanation":"Sau \"a serious knee\" cần danh từ: \"a knee injury\" (chấn thương đầu gối). \"injure/injuring\" là động từ; \"injured\" là tính từ."},{"num":15,"question":"The court found him ______ of spreading false information about the company.","options":["guilty","guilt","guiltless","guiltily"],"answerIndex":0,"explanation":"\"find sb guilty of sth\" (kết luận ai có tội) là cấu trúc cố định. \"guiltless\" (vô tội) mâu thuẫn với việc bị tòa kết luận là đã lan truyền tin sai; \"guilt\" là danh từ; \"guiltily\" là trạng từ."},{"num":16,"question":"The city library holds a/an ______ range of newspapers and magazines.","options":["up-to-date","guilty","vast","permissible"],"answerIndex":2,"explanation":"\"a vast range of sth\" (rất nhiều loại) là cụm cố định. \"up-to-date\" (cập nhật), \"guilty\" (có tội) và \"permissible\" (được phép) không đi với \"range of\" theo nghĩa số lượng lớn."}],"gapfill":[{"num":1,"sentence":"The report examines the ______ of the new bus route in detail.","answer":"profitability"},{"num":2,"sentence":"Careless driving can easily ______ innocent people.","answer":"injure"},{"num":3,"sentence":"It is not ______ to take photographs inside the temple.","answer":"permissible"},{"num":4,"sentence":"Journalists must ______ on facts, not on rumours from the internet.","answer":"rely"},{"num":5,"sentence":"She reads the news every morning to ______ with world events.","answer":"stay up-to-date"},{"num":6,"sentence":"A good news report should be clear, accurate and ______.","answer":"unbiased"},{"num":7,"sentence":"He felt terrible ______ after telling such an obvious lie.","answer":"guilt"},{"num":8,"sentence":"Just ______ the red button to stop the machine immediately.","answer":"press"},{"num":9,"sentence":"The desert covers a ______ area in the north of the country.","answer":"vast"},{"num":10,"sentence":"In \"because it was raining\", the word \"because\" is a ______ conjunction.","answer":"subordinating"}]},"5":{"title":"LISTENING","words":[{"word":"fake","ipa":"/feɪk/","pos":"adj","meaning":"giả, không có thật"},{"word":"genuine","ipa":"/ˈdʒenjuɪn/","pos":"adj","meaning":"thật, chính hãng"},{"word":"spread fake news","ipa":"","pos":"","meaning":"lan truyền tin giả"},{"word":"credible","ipa":"/ˈkredəbl/","pos":"adj","meaning":"đáng tin cậy"},{"word":"credibility","ipa":"/ˌkredəˈbɪləti/","pos":"n","meaning":"độ tin cậy"},{"word":"credibly","ipa":"/ˈkredəbli/","pos":"adv","meaning":"một cách đáng tin cậy"},{"word":"be concerned about","ipa":"","pos":"","meaning":"lo lắng, quan tâm về"},{"word":"concern","ipa":"/kənˈsɜːn/","pos":"n","meaning":"sự lo lắng, mối quan tâm"},{"word":"concern","ipa":"/kənˈsɜːn/","pos":"v","meaning":"làm lo lắng; liên quan đến"},{"word":"concerned","ipa":"/kənˈsɜːnd/","pos":"adj","meaning":"lo lắng, quan tâm"},{"word":"embarrassing","ipa":"/ɪmˈbærəsɪŋ/","pos":"adj","meaning":"gây xấu hổ, ngượng ngùng"},{"word":"embarrass","ipa":"/ɪmˈbærəs/","pos":"v","meaning":"làm ai xấu hổ"},{"word":"embarrassed","ipa":"/ɪmˈbærəst/","pos":"adj","meaning":"cảm thấy xấu hổ"},{"word":"embarrassment","ipa":"/ɪmˈbærəsmənt/","pos":"n","meaning":"sự xấu hổ, ngượng ngùng"},{"word":"bias","ipa":"/ˈbaɪəs/","pos":"n","meaning":"sự thiên vị, thành kiến"},{"word":"biased","ipa":"/ˈbaɪəst/","pos":"adj","meaning":"thiên vị, thiếu khách quan"},{"word":"unbiased","ipa":"/ˌʌnˈbaɪəst/","pos":"adj","meaning":"không thiên vị, khách quan"},{"word":"account for","ipa":"","pos":"phr.v","meaning":"chiếm; giải thích cho"},{"word":"evaluate","ipa":"/ɪˈvæljueɪt/","pos":"v","meaning":"đánh giá"},{"word":"evaluation","ipa":"/ɪˌvæljuˈeɪʃn/","pos":"n","meaning":"sự đánh giá"},{"word":"false","ipa":"/fɔːls/","pos":"adj","meaning":"sai, không đúng sự thật"},{"word":"falsely","ipa":"/ˈfɔːlsli/","pos":"adv","meaning":"một cách sai sự thật"}],"mcq":[{"num":1,"question":"Is this a ______ photograph, or has it been changed on a computer?","options":["fake","genuine","false","concerned"],"answerIndex":1,"explanation":"Vế sau \"or has it been changed on a computer\" đối lập với ảnh thật nên chỗ trống cần \"genuine\" (thật, nguyên bản). \"fake\" và \"false\" cùng nghĩa với vế bị chỉnh sửa nên phá vỡ thế đối lập của \"or\"; \"concerned\" (lo lắng) sai nghĩa."},{"num":2,"question":"That website sells ______ designer handbags at unbelievably low prices.","options":["genuine","credible","fake","concerned"],"answerIndex":2,"explanation":"Chi tiết \"unbelievably low prices\" chốt nghĩa \"fake\" (giả). \"genuine\" trái nghĩa; \"credible\" (đáng tin) và \"concerned\" (lo lắng) không mô tả được hàng nhái."},{"num":3,"question":"Some people ______ fake news simply because they think it is funny.","options":["evaluate","embarrass","account","spread"],"answerIndex":3,"explanation":"\"spread fake news\" (lan truyền tin giả) là collocation cố định. \"evaluate\" (đánh giá), \"embarrass\" (làm xấu hổ) và \"account\" (giải thích, cần giới từ \"for\") đều sai."},{"num":4,"question":"The story is simply not ______: nobody else saw the accident.","options":["credible","credibility","credibly","incredibly"],"answerIndex":0,"explanation":"Sau \"not\" và động từ \"is\" cần tính từ: \"credible\" (đáng tin). \"credibility\" là danh từ; \"credibly\" và \"incredibly\" là trạng từ."},{"num":5,"question":"The newspaper lost all its ______ after printing that false story.","options":["credible","credibly","incredibly","credibility"],"answerIndex":3,"explanation":"Sau tính từ sở hữu \"its\" cần danh từ: \"credibility\" (uy tín, độ tin cậy). \"credible\" là tính từ; hai phương án còn lại là trạng từ."},{"num":6,"question":"Parents are increasingly ______ about what their children see online.","options":["concern","concerned","concerning","concernedly"],"answerIndex":1,"explanation":"\"be concerned about sth\" (lo lắng về điều gì) là cấu trúc cố định, cần tính từ. \"concern\" là danh từ/động từ; \"concerning\" mang nghĩa \"đáng lo ngại\" và không đi với \"about\"; \"concernedly\" là trạng từ."},{"num":7,"question":"Online safety has become a major ______ for schools all over the country.","options":["concern","concerned","concerning","concernedly"],"answerIndex":0,"explanation":"Sau \"a major\" cần danh từ: \"a concern\" (mối lo ngại). \"concerned/concerning\" là tính từ; \"concernedly\" là trạng từ."},{"num":8,"question":"Someone posted an ______ photograph of him at the party.","options":["embarrassed","embarrassment","embarrassing","embarrass"],"answerIndex":2,"explanation":"Bức ảnh là vật gây ra cảm giác xấu hổ nên cần tính từ chủ động \"embarrassing\". \"embarrassed\" mô tả người cảm thấy xấu hổ; \"embarrassment\" là danh từ; \"embarrass\" là động từ."},{"num":9,"question":"She felt extremely ______ when the teacher read her message aloud.","options":["embarrassed","embarrassing","embarrassment","embarrass"],"answerIndex":0,"explanation":"Chủ ngữ là người cảm thấy xấu hổ nên cần tính từ bị động \"embarrassed\". \"embarrassing\" mô tả thứ gây xấu hổ; \"embarrassment\" là danh từ; \"embarrass\" là động từ."},{"num":10,"question":"To avoid ______, always check a story carefully before you share it.","options":["embarrass","embarrassment","embarrassed","embarrassing"],"answerIndex":1,"explanation":"Sau \"avoid\" cần danh từ (hoặc V-ing) và ở đây nghĩa là tránh sự xấu hổ: \"embarrassment\". \"embarrass\" là động từ nguyên thể; \"embarrassed/embarrassing\" là tính từ."},{"num":11,"question":"The report was clearly ______ because it quoted only one side of the story.","options":["bias","unbiased","biased","biasing"],"answerIndex":2,"explanation":"Chi tiết \"quoted only one side\" chốt nghĩa \"biased\" (thiên vị). \"unbiased\" trái nghĩa; \"bias\" là danh từ; \"biasing\" là V-ing."},{"num":12,"question":"Young people ______ for more than half of the users of this website.","options":["evaluate","concern","spread","account"],"answerIndex":3,"explanation":"\"account for\" (chiếm bao nhiêu phần) đúng với giới từ \"for\" có sẵn và với con số \"more than half\". \"evaluate for\", \"concern for\" và \"spread for\" đều sai cấu trúc hoặc sai nghĩa."},{"num":13,"question":"Students must learn to ______ the information they find on the internet.","options":["evaluation","evaluated","evaluate","evaluating"],"answerIndex":2,"explanation":"Sau \"learn to\" cần động từ nguyên thể: \"evaluate information\" (đánh giá thông tin). \"evaluation\" là danh từ; hai phương án còn lại sai dạng sau \"to\"."},{"num":14,"question":"The teacher's ______ of the group project was very positive.","options":["evaluate","evaluated","evaluating","evaluation"],"answerIndex":3,"explanation":"Sau sở hữu cách \"the teacher's\" cần danh từ: \"evaluation\" (sự đánh giá). Ba phương án còn lại đều là dạng động từ."},{"num":15,"question":"The article contained several ______ statements about the singer.","options":["falsely","false","falseness","falsify"],"answerIndex":1,"explanation":"Trước danh từ \"statements\" cần tính từ: \"false statements\" (những phát biểu sai sự thật). \"falsely\" là trạng từ; \"falseness\" là danh từ; \"falsify\" là động từ."},{"num":16,"question":"He was ______ accused of stealing money from the charity box.","options":["falsely","false","falseness","falsify"],"answerIndex":0,"explanation":"Chỗ trống bổ nghĩa cho phân từ \"accused\" nên cần trạng từ: \"falsely accused\" (bị buộc tội oan). \"false\" là tính từ; \"falseness\" là danh từ; \"falsify\" là động từ."}],"gapfill":[{"num":1,"sentence":"This painting is not a copy; experts have confirmed that it is ______.","answer":"genuine"},{"num":2,"sentence":"Rumours ______ very quickly on social media these days.","answer":"spread"},{"num":3,"sentence":"The witness answered every question calmly and ______.","answer":"credibly"},{"num":4,"sentence":"Many teachers are ______ about the time pupils spend on their phones.","answer":"concerned"},{"num":5,"sentence":"Never ______ your friends by sharing their private photographs.","answer":"embarrass"},{"num":6,"sentence":"The committee's ______ of the plan will be published next week.","answer":"evaluation"},{"num":7,"sentence":"He was arrested for selling ______ passports to foreign visitors.","answer":"fake"},{"num":8,"sentence":"The newspaper printed a ______ report and had to apologise the next day.","answer":"false"},{"num":9,"sentence":"A reporter should describe events in a fair and ______ way.","answer":"unbiased"},{"num":10,"sentence":"The judge showed no ______ towards either side in the case.","answer":"bias"}]},"6":{"title":"WRITING","words":[{"word":"news source","ipa":"","pos":"coll","meaning":"nguồn tin tức"},{"word":"as opposed to","ipa":"","pos":"chunk","meaning":"trái với; thay vì"},{"word":"oppose","ipa":"/əˈpəʊz/","pos":"v","meaning":"phản đối"},{"word":"opposed","ipa":"/əˈpəʊzd/","pos":"adj","meaning":"phản đối; trái ngược"},{"word":"opposition","ipa":"/ˌɒpəˈzɪʃn/","pos":"n","meaning":"sự phản đối"},{"word":"as compared with","ipa":"","pos":"chunk","meaning":"so với"},{"word":"compare","ipa":"/kəmˈpeə(r)/","pos":"v","meaning":"so sánh"},{"word":"comparison","ipa":"/kəmˈpærɪsn/","pos":"n","meaning":"sự so sánh"},{"word":"comparative","ipa":"/kəmˈpærətɪv/","pos":"adj","meaning":"mang tính so sánh"},{"word":"comparatively","ipa":"/kəmˈpærətɪvli/","pos":"adv","meaning":"tương đối; khi so sánh"},{"word":"meanwhile","ipa":"/ˈmiːnwaɪl/","pos":"adv","meaning":"trong khi đó"},{"word":"a quarter","ipa":"","pos":"chunk","meaning":"một phần tư, 25%"},{"word":"pie chart","ipa":"","pos":"n","meaning":"biểu đồ tròn"}],"mcq":[{"num":1,"question":"Television is still the main ______ for people over sixty.","options":["pie chart","comparison","news source","opposition"],"answerIndex":2,"explanation":"\"a news source\" (nguồn tin tức) là nơi người ta lấy tin. \"pie chart\" (biểu đồ tròn), \"comparison\" (sự so sánh) và \"opposition\" (sự phản đối) sai nghĩa."},{"num":2,"question":"Many readers strongly ______ the plan to close the local newspaper.","options":["opposed","opposition","opposing","oppose"],"answerIndex":3,"explanation":"Câu ở thì hiện tại đơn với chủ ngữ số nhiều cần động từ: \"oppose a plan\" (phản đối một kế hoạch). \"opposed\" sai thì với \"strongly\" trong ngữ cảnh hiện tại; \"opposition\" là danh từ; \"opposing\" là V-ing."},{"num":3,"question":"There was strong ______ to the new rules on advertising.","options":["oppose","opposition","opposed","opposing"],"answerIndex":1,"explanation":"Sau \"strong\" cần danh từ: \"opposition to sth\" (sự phản đối điều gì). \"oppose\" là động từ; \"opposed/opposing\" là tính từ hoặc phân từ."},{"num":4,"question":"Most young people now read the news online, ______ in printed newspapers.","options":["as opposed to","as compared with","meanwhile","a quarter"],"answerIndex":0,"explanation":"\"as opposed to\" (thay vì, trái với) dùng để nêu lựa chọn bị thay thế. \"as compared with\" dùng khi so sánh số liệu; \"meanwhile\" là trạng từ nối câu; \"a quarter\" là danh từ chỉ tỷ lệ."},{"num":5,"question":"The chart allows us to ______ the two years very easily.","options":["comparison","compare","comparative","comparatively"],"answerIndex":1,"explanation":"Sau \"to\" cần động từ nguyên thể: \"compare\" (so sánh). \"comparison\" là danh từ; \"comparative\" là tính từ; \"comparatively\" là trạng từ."},{"num":6,"question":"A careful ______ of the two charts shows a very clear change.","options":["comparison","compare","comparative","comparatively"],"answerIndex":0,"explanation":"Sau \"a careful\" cần danh từ: \"a comparison of sth\" (sự so sánh giữa các thứ). \"compare\" là động từ; \"comparative\" là tính từ; \"comparatively\" là trạng từ."},{"num":7,"question":"Radio is ______ unpopular among teenagers in this survey.","options":["comparative","comparison","comparatively","compare"],"answerIndex":2,"explanation":"Chỗ trống bổ nghĩa cho tính từ \"unpopular\" nên cần trạng từ: \"comparatively unpopular\" (tương đối ít được ưa chuộng)."},{"num":8,"question":"The table gives a ______ view of media use in five different countries.","options":["comparatively","comparison","compare","comparative"],"answerIndex":3,"explanation":"Trước danh từ \"view\" cần tính từ: \"a comparative view\" (cái nhìn so sánh). \"comparatively\" là trạng từ; \"comparison\" là danh từ; \"compare\" là động từ."},{"num":9,"question":"Newspaper sales fell sharply. ______, online readership almost doubled.","options":["Compared","Opposed","Meanwhile","Quarter"],"answerIndex":2,"explanation":"Đầu câu, trước dấu phẩy và nối hai xu hướng diễn ra cùng lúc, cần trạng từ liên kết \"Meanwhile\" (trong khi đó). \"Compared\" và \"Opposed\" là phân từ cần cụm theo sau; \"Quarter\" là danh từ."},{"num":10,"question":"Exactly ______ of the students said they never read printed newspapers.","options":["a pie chart","a quarter","a comparison","an opposition"],"answerIndex":1,"explanation":"\"a quarter of\" (một phần tư) là cụm chỉ tỷ lệ, phù hợp với \"Exactly … of the students\". \"a pie chart\", \"a comparison\" và \"an opposition\" không phải cách diễn đạt tỷ lệ."},{"num":11,"question":"The ______ shows what percentage of people use each kind of media.","options":["pie chart","news source","comparison","opposition"],"answerIndex":0,"explanation":"Biểu đồ thể hiện tỷ lệ phần trăm của từng phần là \"pie chart\" (biểu đồ tròn). \"news source\", \"comparison\" và \"opposition\" không phải loại biểu đồ."},{"num":12,"question":"Sales this July rose by five per cent ______ the same month last year.","options":["as opposed to","meanwhile","a quarter","as compared with"],"answerIndex":3,"explanation":"\"as compared with\" (so với) dùng khi đối chiếu số liệu giữa hai mốc thời gian. \"as opposed to\" nêu lựa chọn thay thế chứ không so sánh con số; \"meanwhile\" là trạng từ nối câu; \"a quarter\" là danh từ."}],"gapfill":[{"num":1,"sentence":"The ______ below shows how different age groups get their news.","answer":"pie chart"},{"num":2,"sentence":"About ______ of the population still buys a printed newspaper every day.","answer":"a quarter"},{"num":3,"sentence":"Television and the internet are the two main ______ in this country.","answer":"news sources"},{"num":4,"sentence":"Online readership rose steadily. ______, magazine sales continued to fall.","answer":"Meanwhile"},{"num":5,"sentence":"Most teenagers watch short videos, ______ reading long articles.","answer":"as opposed to"},{"num":6,"sentence":"Road accidents fell by eight per cent ______ the same period last year.","answer":"as compared with"},{"num":7,"sentence":"Local radio is ______ cheap to advertise on.","answer":"comparatively"},{"num":8,"sentence":"The government faced strong ______ to the new media law.","answer":"opposition"},{"num":9,"sentence":"Hundreds of journalists ______ the closure of the newspaper last year.","answer":"opposed"},{"num":10,"sentence":"A careful ______ of the two reports reveals several differences.","answer":"comparison"}]},"7":{"title":"COMMUNICATION AND CULTURE/ CILL","words":[{"word":"promote a charity event","ipa":"","pos":"coll","meaning":"quảng bá một sự kiện từ thiện"},{"word":"promote","ipa":"/prəˈməʊt/","pos":"v","meaning":"quảng bá, thúc đẩy"},{"word":"promotion","ipa":"/prəˈməʊʃn/","pos":"n","meaning":"sự quảng bá, khuyến mãi"},{"word":"promotional","ipa":"/prəˈməʊʃənl/","pos":"adj","meaning":"dùng để quảng bá"},{"word":"charity","ipa":"/ˈtʃærəti/","pos":"n","meaning":"tổ chức hoặc hoạt động từ thiện"},{"word":"charitable","ipa":"/ˈtʃærətəbl/","pos":"adj","meaning":"thuộc từ thiện, hay làm từ thiện"},{"word":"stressful","ipa":"/ˈstresfl/","pos":"adj","meaning":"gây căng thẳng"},{"word":"stress","ipa":"/stres/","pos":"n","meaning":"sự căng thẳng"},{"word":"stress","ipa":"/stres/","pos":"v","meaning":"làm căng thẳng; nhấn mạnh"},{"word":"stressed","ipa":"/strest/","pos":"adj","meaning":"cảm thấy căng thẳng"},{"word":"stress-free","ipa":"/ˌstres ˈfriː/","pos":"adj","meaning":"không căng thẳng"},{"word":"a mutual friend","ipa":"","pos":"coll","meaning":"một người bạn chung"},{"word":"mutual","ipa":"/ˈmjuːtʃuəl/","pos":"adj","meaning":"chung, lẫn nhau"},{"word":"mutually","ipa":"/ˈmjuːtʃuəli/","pos":"adv","meaning":"lẫn nhau, cùng nhau"},{"word":"announcement","ipa":"/əˈnaʊnsmənt/","pos":"n","meaning":"thông báo"},{"word":"announce","ipa":"/əˈnaʊns/","pos":"v","meaning":"thông báo"},{"word":"announcer","ipa":"/əˈnaʊnsə(r)/","pos":"n","meaning":"phát thanh viên, người thông báo"},{"word":"celebrity","ipa":"/səˈlebrəti/","pos":"n","meaning":"người nổi tiếng"},{"word":"mass media","ipa":"","pos":"n","meaning":"phương tiện truyền thông đại chúng"},{"word":"emit","ipa":"/iˈmɪt/","pos":"v","meaning":"phát ra, thải ra"},{"word":"emission","ipa":"/iˈmɪʃn/","pos":"n","meaning":"sự phát ra, khí thải"},{"word":"air attack","ipa":"","pos":"n","meaning":"cuộc tấn công bằng đường không"},{"word":"digital billboard","ipa":"","pos":"n","meaning":"bảng quảng cáo điện tử"},{"word":"loudspeaker","ipa":"/ˌlaʊdˈspiːkə(r)/","pos":"n","meaning":"loa phóng thanh"}],"mcq":[{"num":1,"question":"The club used posters and short videos to ______ its charity event.","options":["promote","promotion","promotional","promoted"],"answerIndex":0,"explanation":"Sau \"to\" chỉ mục đích cần động từ nguyên thể: \"promote an event\" (quảng bá một sự kiện). \"promotion\" là danh từ; \"promotional\" là tính từ; \"promoted\" sai dạng sau \"to\"."},{"num":2,"question":"The ______ of the concert cost almost twenty million dong.","options":["promote","promotion","promotional","promoted"],"answerIndex":1,"explanation":"Chủ ngữ của \"cost\" cần danh từ: \"the promotion of sth\" (việc quảng bá cái gì). \"promote/promoted\" là động từ; \"promotional\" là tính từ."},{"num":3,"question":"The company printed a thousand ______ T-shirts for the festival.","options":["promotion","promote","promoted","promotional"],"answerIndex":3,"explanation":"Trước danh từ \"T-shirts\" cần tính từ: \"promotional T-shirts\" (áo phông quảng bá). \"promotion\" là danh từ; \"promote/promoted\" là động từ."},{"num":4,"question":"All the money raised on Saturday will go to a children's ______.","options":["celebrity","announcement","charity","loudspeaker"],"answerIndex":2,"explanation":"Tiền quyên góp được chuyển cho \"a children's charity\" (quỹ từ thiện cho trẻ em). \"celebrity\" (người nổi tiếng), \"announcement\" (thông báo) và \"loudspeaker\" (loa phóng thanh) không nhận tiền từ thiện."},{"num":5,"question":"She is well known for her ______ work with homeless families.","options":["charity","charitably","charitable","charities"],"answerIndex":2,"explanation":"Trước danh từ \"work\" cần tính từ: \"charitable work\" (công việc từ thiện). \"charity/charities\" là danh từ; \"charitably\" là trạng từ."},{"num":6,"question":"Organising an event for two thousand people can be extremely ______.","options":["stressful","stress","stressed","stress-free"],"answerIndex":0,"explanation":"Chủ ngữ là công việc gây căng thẳng nên cần tính từ chủ động \"stressful\". \"stressed\" mô tả người cảm thấy căng thẳng; \"stress\" là danh từ/động từ; \"stress-free\" trái nghĩa với \"extremely\"."},{"num":7,"question":"He felt very ______ just before making his first speech in public.","options":["stressful","stressed","stress","stress-free"],"answerIndex":1,"explanation":"Chủ ngữ là người cảm thấy căng thẳng nên cần \"stressed\". \"stressful\" mô tả thứ gây căng thẳng; \"stress\" là danh từ; \"stress-free\" trái nghĩa với ngữ cảnh."},{"num":8,"question":"The holiday was completely ______: we did nothing but read and swim.","options":["stressful","stressed","stress","stress-free"],"answerIndex":3,"explanation":"Chi tiết \"did nothing but read and swim\" chốt nghĩa \"stress-free\" (không căng thẳng). \"stressful\" và \"stressed\" trái nghĩa; \"stress\" là danh từ."},{"num":9,"question":"We were introduced to each other by a ______ friend last summer.","options":["mutual","charitable","promotional","stressful"],"answerIndex":0,"explanation":"\"a mutual friend\" (một người bạn chung) là cụm cố định. \"charitable\" (từ thiện), \"promotional\" (dùng để quảng bá) và \"stressful\" (gây căng thẳng) không mô tả được mối quan hệ bạn bè chung."},{"num":10,"question":"The head teacher made an important ______ at the morning assembly.","options":["announce","announcer","announced","announcement"],"answerIndex":3,"explanation":"\"make an announcement\" (đưa ra một thông báo) là collocation cố định. \"announce/announced\" là động từ; \"announcer\" chỉ người phát thanh."},{"num":11,"question":"The radio ______ read the traffic news very clearly.","options":["announcement","announcer","announce","announced"],"answerIndex":1,"explanation":"Người đọc bản tin trên đài là \"announcer\" (phát thanh viên). \"announcement\" là bản thông báo; \"announce/announced\" là động từ."},{"num":12,"question":"They invited a well-known ______ to open the charity fair.","options":["loudspeaker","billboard","celebrity","emission"],"answerIndex":2,"explanation":"Người nổi tiếng được mời cắt băng khai mạc là \"celebrity\". \"loudspeaker\" (loa), \"billboard\" (bảng quảng cáo) và \"emission\" (khí thải) không phải người."},{"num":13,"question":"The ______ have an enormous influence on public opinion today.","options":["air attack","digital billboard","mass media","loudspeaker"],"answerIndex":2,"explanation":"\"the mass media\" (các phương tiện truyền thông đại chúng) là thứ định hình dư luận. \"air attack\" (cuộc tấn công đường không), \"digital billboard\" và \"loudspeaker\" chỉ là một phương tiện hoặc sự kiện đơn lẻ, không ảnh hưởng đến dư luận theo nghĩa này."},{"num":14,"question":"Factories in the area must reduce their carbon ______ by 2030.","options":["announcements","loudspeakers","billboards","emissions"],"answerIndex":3,"explanation":"\"carbon emissions\" (khí thải các-bon) là cụm cố định. \"announcements\", \"loudspeakers\" và \"billboards\" không phải thứ nhà máy thải ra."},{"num":15,"question":"The message was repeated over the ______ at the railway station.","options":["loudspeaker","billboard","celebrity","charity"],"answerIndex":0,"explanation":"Thông báo được phát \"over the loudspeaker\" (qua loa phóng thanh). \"billboard\" là bảng quảng cáo im lặng; \"celebrity\" và \"charity\" sai nghĩa."},{"num":16,"question":"A huge ______ in the city centre shows moving advertisements all night.","options":["loudspeaker","digital billboard","announcement","mutual friend"],"answerIndex":1,"explanation":"Màn hình lớn chiếu quảng cáo động là \"digital billboard\" (bảng quảng cáo điện tử). \"loudspeaker\" phát âm thanh; \"announcement\" và \"mutual friend\" sai nghĩa."}],"gapfill":[{"num":1,"sentence":"Old lorries ______ large amounts of black smoke into the air.","answer":"emit"},{"num":2,"sentence":"Much of the old town was destroyed by an ______ during the war.","answer":"air attack"},{"num":3,"sentence":"After long talks, the two sides found a ______ acceptable solution.","answer":"mutually"},{"num":4,"sentence":"The station will ______ the new timetable tomorrow morning.","answer":"announce"},{"num":5,"sentence":"Thousands of fans waited at the airport to see the young ______ arrive.","answer":"celebrity"},{"num":6,"sentence":"He gives ten per cent of his salary to ______ every month.","answer":"charity"},{"num":7,"sentence":"Too much ______ over a long period can seriously damage your health.","answer":"stress"},{"num":8,"sentence":"Announcements were made over the ______ every ten minutes.","answer":"loudspeaker"},{"num":9,"sentence":"The ______ play an important role in modern political life.","answer":"mass media"},{"num":10,"sentence":"The band spent a whole month on the ______ of their new album.","answer":"promotion"}]}},"8":{"1":{"title":"GETTING STARTED","words":[{"word":"primate","ipa":"/ˈpraɪmeɪt/","pos":"n","meaning":"động vật linh trưởng"},{"word":"enclosure","ipa":"/ɪnˈkləʊʒə(r)/","pos":"n","meaning":"khu nuôi nhốt; chuồng"},{"word":"mammal","ipa":"/ˈmæml/","pos":"n","meaning":"động vật có vú"},{"word":"ape","ipa":"/eɪp/","pos":"n","meaning":"loài vượn lớn"},{"word":"gibbon","ipa":"/ˈɡɪbən/","pos":"n","meaning":"vượn tay dài"},{"word":"critically endangered","ipa":"/ˌkrɪtɪkli ɪnˈdeɪndʒəd/","pos":"adj","meaning":"cực kỳ nguy cấp"},{"word":"deforestation","ipa":"/ˌdiːˌfɒrɪˈsteɪʃn/","pos":"n","meaning":"nạn phá rừng"},{"word":"deforest","ipa":"/ˌdiːˈfɒrɪst/","pos":"v","meaning":"phá rừng"},{"word":"poacher","ipa":"/ˈpəʊtʃə(r)/","pos":"n","meaning":"kẻ săn trộm"},{"word":"poach","ipa":"/pəʊtʃ/","pos":"v","meaning":"săn trộm"},{"word":"poaching","ipa":"/ˈpəʊtʃɪŋ/","pos":"n","meaning":"nạn săn trộm"},{"word":"make a profit out of sth","ipa":"/meɪk ə ˈprɒfɪt aʊt əv ˈsʌmθɪŋ/","pos":"phr.v","meaning":"kiếm lời từ việc gì"},{"word":"veterinarian","ipa":"/ˌvetrɪˈneəriən/","pos":"n","meaning":"bác sĩ thú y"},{"word":"monitor","ipa":"/ˈmɒnɪtə(r)/","pos":"v, n","meaning":"theo dõi; giám sát"},{"word":"release","ipa":"/rɪˈliːs/","pos":"v, n","meaning":"thả; phóng thích; sự phát hành"}],"mcq":[{"num":1,"question":"Gibbons and gorillas are ______, the group of animals that also includes humans.","options":["poachers","primates","enclosures","veterinarians"],"answerIndex":1,"explanation":"Nhóm động vật gồm vượn, khỉ đột và con người là \"primates\" (động vật linh trưởng). \"poachers\" (kẻ săn trộm) và \"veterinarians\" (bác sĩ thú y) chỉ người; \"enclosures\" (chuồng nuôi) là nơi chốn."},{"num":2,"question":"The tigers are kept in a large ______ with tall trees and a swimming pool.","options":["enclosure","gibbon","poacher","primate"],"answerIndex":0,"explanation":"\"an enclosure\" (khu nuôi nhốt) là nơi có cây và bể bơi dành cho thú. \"gibbon\" và \"primate\" là con vật; \"poacher\" là kẻ săn trộm."},{"num":3,"question":"Whales and bats are both ______, because they feed their young with milk.","options":["poachers","enclosures","mammals","veterinarians"],"answerIndex":2,"explanation":"Định nghĩa \"feed their young with milk\" chốt nghĩa \"mammals\" (động vật có vú). Ba phương án còn lại chỉ người hoặc nơi chốn."},{"num":4,"question":"Gorillas and chimpanzees are ______; unlike monkeys, they have no tails.","options":["poachers","enclosures","veterinarians","apes"],"answerIndex":3,"explanation":"Chi tiết \"unlike monkeys, they have no tails\" chốt nghĩa \"apes\" (loài vượn lớn). Ba phương án còn lại không phải nhóm động vật."},{"num":5,"question":"The ______ is a small ape with very long arms that swings through the trees.","options":["gibbon","poacher","veterinarian","enclosure"],"answerIndex":0,"explanation":"\"gibbon\" (vượn tay dài) đúng với mô tả \"a small ape with very long arms\". \"poacher\" và \"veterinarian\" chỉ người; \"enclosure\" là chuồng nuôi."},{"num":6,"question":"Fewer than a hundred of these animals are left, so the species is now ______.","options":["marine","annual","critically endangered","suitable"],"answerIndex":2,"explanation":"Con số \"fewer than a hundred\" chốt nghĩa \"critically endangered\" (cực kỳ nguy cấp). \"marine\" (thuộc biển), \"annual\" (hằng năm) và \"suitable\" (phù hợp) không mô tả được mức độ nguy cấp."},{"num":7,"question":"______ has destroyed much of the natural home of these gibbons.","options":["Enclosure","Deforestation","Veterinarian","Release"],"answerIndex":1,"explanation":"Việc phá rừng, tức \"deforestation\", là nguyên nhân phá hủy môi trường sống tự nhiên. \"Enclosure\" (chuồng nuôi), \"Veterinarian\" (bác sĩ thú y) và \"Release\" (việc thả về tự nhiên) không phá hủy rừng."},{"num":8,"question":"______ killed more than fifty rhinos in this park last year.","options":["Veterinarians","Primates","Enclosures","Poachers"],"answerIndex":3,"explanation":"Người săn bắn trái phép là \"poachers\" (kẻ săn trộm). \"Veterinarians\" chữa bệnh cho thú; \"Primates\" là linh trưởng; \"Enclosures\" là chuồng nuôi."},{"num":9,"question":"The new laws have greatly reduced ______ inside the national park.","options":["poacher","poach","poaching","poached"],"answerIndex":2,"explanation":"Sau \"reduced\" cần danh từ không đếm được chỉ hiện tượng: \"poaching\" (nạn săn trộm). \"poacher\" chỉ người; \"poach/poached\" là động từ."},{"num":10,"question":"Criminal gangs try to ______ a profit out of selling rare animals.","options":["take","do","get","make"],"answerIndex":3,"explanation":"\"make a profit out of sth\" (kiếm lời từ việc gì) là cụm cố định. \"take/do/get a profit out of\" đều sai collocation."},{"num":11,"question":"A ______ examines every animal carefully before it is set free.","options":["poacher","veterinarian","gibbon","primate"],"answerIndex":1,"explanation":"Người khám sức khỏe cho động vật là \"veterinarian\" (bác sĩ thú y). \"poacher\" là kẻ săn trộm; \"gibbon\" và \"primate\" là con vật."},{"num":12,"question":"Scientists use radio collars to ______ the movements of the elephants.","options":["monitor","release","poach","deforest"],"answerIndex":0,"explanation":"\"monitor the movements\" (theo dõi sự di chuyển) đúng với việc dùng vòng cổ định vị. \"release\" (thả), \"poach\" (săn trộm) và \"deforest\" (phá rừng) sai nghĩa."},{"num":13,"question":"After six months of care, the young bear was ______ back into the forest.","options":["release","releasing","releases","released"],"answerIndex":3,"explanation":"Câu bị động \"was + V3\": \"was released\" (được thả về). \"release\" là nguyên thể; \"releasing\" là V-ing; \"releases\" là dạng chia ngôi thứ ba."}],"gapfill":[{"num":1,"sentence":"The zoo has built a new ______ for its two young elephants.","answer":"enclosure"},{"num":2,"sentence":"Dolphins are not fish; they are ______ that breathe air.","answer":"mammals"},{"num":3,"sentence":"Chimpanzees and gorillas are the best-known ______.","answer":"apes"},{"num":4,"sentence":"______ sing loudly every morning to mark their territory.","answer":"Gibbons"},{"num":5,"sentence":"______ has destroyed thousands of hectares of forest in this province.","answer":"Deforestation"},{"num":6,"sentence":"Armed ______ still hunt rhinos for their horns.","answer":"poachers"},{"num":7,"sentence":"The rescue centre employs a full-time ______ to treat sick animals.","answer":"veterinarian"},{"num":8,"sentence":"Rangers use hidden cameras to ______ the tigers day and night.","answer":"monitor"},{"num":9,"sentence":"The rescued turtles were ______ into the sea last Sunday morning.","answer":"released"},{"num":10,"sentence":"With only sixty animals left in the wild, the species is now ______.","answer":"critically endangered"}]},"2":{"title":"LANGUAGE","words":[{"word":"assimilation","ipa":"/əˌsɪməˈleɪʃn/","pos":"n","meaning":"sự đồng hóa"},{"word":"assimilate","ipa":"/əˈsɪməleɪt/","pos":"v","meaning":"đồng hóa; hòa nhập"},{"word":"extinct","ipa":"/ɪkˈstɪŋkt/","pos":"adj","meaning":"tuyệt chủng"},{"word":"extinction","ipa":"/ɪkˈstɪŋkʃn/","pos":"n","meaning":"sự tuyệt chủng"},{"word":"survive","ipa":"/səˈvaɪv/","pos":"v","meaning":"sống sót; tồn tại"},{"word":"survival","ipa":"/səˈvaɪvl/","pos":"n","meaning":"sự sống sót"},{"word":"survivor","ipa":"/səˈvaɪvə(r)/","pos":"n","meaning":"người sống sót"},{"word":"captivity","ipa":"/kæpˈtɪvəti/","pos":"n","meaning":"tình trạng bị nuôi nhốt; bị giam cầm"},{"word":"captive","ipa":"/ˈkæptɪv/","pos":"n, adj","meaning":"tù nhân; bị giam giữ"},{"word":"conserve","ipa":"/kənˈsɜːv/","pos":"v","meaning":"bảo tồn"},{"word":"conservation","ipa":"/ˌkɒnsəˈveɪʃn/","pos":"n","meaning":"sự bảo tồn"},{"word":"conservationist","ipa":"/ˌkɒnsəˈveɪʃənɪst/","pos":"n","meaning":"nhà bảo tồn"},{"word":"estimate","ipa":"/ˈestɪmeɪt/","pos":"v, n","meaning":"ước tính; sự ước tính"},{"word":"estimated","ipa":"/ˈestɪmeɪtɪd/","pos":"adj","meaning":"được ước tính"},{"word":"estimation","ipa":"/ˌestɪˈmeɪʃn/","pos":"n","meaning":"sự ước tính"},{"word":"preserve","ipa":"/prɪˈzɜːv/","pos":"v","meaning":"bảo vệ; gìn giữ"},{"word":"preservation","ipa":"/ˌprezəˈveɪʃn/","pos":"n","meaning":"sự bảo tồn, gìn giữ"},{"word":"preservative","ipa":"/prɪˈzɜːvətɪv/","pos":"n, adj","meaning":"chất bảo quản; có tính bảo quản"},{"word":"impose","ipa":"/ɪmˈpəʊz/","pos":"v","meaning":"áp đặt; thi hành"},{"word":"imposed","ipa":"/ɪmˈpəʊzd/","pos":"adj","meaning":"bị áp đặt"},{"word":"imposition","ipa":"/ˌɪmpəˈzɪʃn/","pos":"n","meaning":"sự áp đặt"},{"word":"otherwise","ipa":"/ˈʌðəwaɪz/","pos":"adv","meaning":"nếu không thì; mặt khác"},{"word":"harsh","ipa":"/hɑːʃ/","pos":"adj","meaning":"khắc nghiệt; nghiêm khắc"},{"word":"harshly","ipa":"/ˈhɑːʃli/","pos":"adv","meaning":"một cách nghiêm khắc"},{"word":"harshness","ipa":"/ˈhɑːʃnəs/","pos":"n","meaning":"sự khắc nghiệt"},{"word":"punishment","ipa":"/ˈpʌnɪʃmənt/","pos":"n","meaning":"hình phạt"},{"word":"punish","ipa":"/ˈpʌnɪʃ/","pos":"v","meaning":"trừng phạt"}],"mcq":[{"num":1,"question":"The dodo became ______ more than three hundred years ago.","options":["captive","harsh","extinct","imposed"],"answerIndex":2,"explanation":"Sau động từ nối \"became\" cần tính từ, và loài dodo đã biến mất hoàn toàn: \"extinct\" (tuyệt chủng). \"captive\" (bị nuôi nhốt), \"harsh\" (khắc nghiệt) và \"imposed\" (bị áp đặt) sai nghĩa."},{"num":2,"question":"Years of hunting drove the animal to the edge of ______.","options":["extinct","extinction","survival","captivity"],"answerIndex":1,"explanation":"\"on/to the edge of extinction\" (bên bờ tuyệt chủng) là cụm cố định, cần danh từ. \"extinct\" là tính từ; \"survival\" (sự sống sót) trái nghĩa với hậu quả của việc săn bắn; \"captivity\" là tình trạng bị nuôi nhốt."},{"num":3,"question":"Only a few of these plants can ______ in such cold, dry conditions.","options":["survival","survivor","surviving","survive"],"answerIndex":3,"explanation":"Sau \"can\" cần động từ nguyên thể: \"survive\" (sống sót). \"survival/survivor\" là danh từ; \"surviving\" sai dạng sau động từ khuyết thiếu."},{"num":4,"question":"Clean water is essential for the ______ of the whole species.","options":["survival","survive","survivor","surviving"],"answerIndex":0,"explanation":"Sau \"the\" và trước \"of\" cần danh từ trừu tượng: \"the survival of sth\" (sự tồn tại của cái gì). \"survivor\" chỉ cá thể sống sót; \"survive/surviving\" là động từ."},{"num":5,"question":"Rescue teams found three ______ under the fallen trees.","options":["survival","survive","survivors","surviving"],"answerIndex":2,"explanation":"Sau số đếm \"three\" cần danh từ đếm được chỉ người: \"survivors\" (những người sống sót). \"survival\" là danh từ trừu tượng; hai phương án còn lại là động từ."},{"num":6,"question":"Many pandas are now bred in ______ and later released into the wild.","options":["captive","captives","captivate","captivity"],"answerIndex":3,"explanation":"\"breed in captivity\" (nhân giống trong điều kiện nuôi nhốt) là cụm cố định, cần danh từ không đếm được. \"captive/captives\" là tính từ hoặc danh từ đếm được; \"captivate\" là động từ mang nghĩa khác."},{"num":7,"question":"The ______ animals are fed twice a day by trained keepers.","options":["captivity","captive","captives","captivate"],"answerIndex":1,"explanation":"Trước danh từ \"animals\" cần tính từ: \"captive animals\" (động vật bị nuôi nhốt). \"captivity/captives\" là danh từ; \"captivate\" là động từ."},{"num":8,"question":"Wildlife ______ has become a major political issue in this country.","options":["conservation","conserve","conservationist","conserving"],"answerIndex":0,"explanation":"\"wildlife conservation\" (bảo tồn động vật hoang dã) là cụm danh từ cố định. \"conserve\" là động từ; \"conservationist\" chỉ người; \"conserving\" là V-ing."},{"num":9,"question":"The famous ______ has spent forty years studying mountain gorillas.","options":["conservation","conservationist","conserve","conserving"],"answerIndex":1,"explanation":"Chủ ngữ chỉ người dành bốn mươi năm nghiên cứu là \"conservationist\" (nhà bảo tồn). \"conservation\" là danh từ trừu tượng; \"conserve/conserving\" là động từ."},{"num":10,"question":"Scientists have ______ that fewer than a thousand tigers remain in the wild.","options":["estimated","estimate","estimation","estimating"],"answerIndex":0,"explanation":"Thì hiện tại hoàn thành \"have + V3\" cần \"estimated\" (đã ước tính). \"estimate\" là nguyên thể; \"estimation\" là danh từ; \"estimating\" là V-ing."},{"num":11,"question":"These new measures aim to ______ the last areas of old forest.","options":["preservation","preservative","preserve","preserved"],"answerIndex":2,"explanation":"Sau \"aim to\" cần động từ nguyên thể: \"preserve\" (gìn giữ, bảo vệ). \"preservation\" là danh từ; \"preservative\" là chất bảo quản; \"preserved\" sai dạng sau \"to\"."},{"num":12,"question":"The ______ of the coral reef depends on much cleaner sea water.","options":["preserve","preservative","preserved","preservation"],"answerIndex":3,"explanation":"Chủ ngữ của \"depends\" cần danh từ trừu tượng: \"the preservation of sth\" (việc bảo tồn cái gì). \"preserve/preserved\" là động từ; \"preservative\" là chất bảo quản."},{"num":13,"question":"The government plans to ______ much heavier fines on poachers.","options":["imposition","imposed","impose","imposing"],"answerIndex":2,"explanation":"Sau \"plans to\" cần động từ nguyên thể: \"impose fines on sb\" (áp mức phạt lên ai). \"imposition\" là danh từ; \"imposed/imposing\" sai dạng sau \"to\"."},{"num":14,"question":"We must act now; ______, the species will disappear for ever.","options":["otherwise","annually","harshly","significantly"],"answerIndex":0,"explanation":"\"otherwise\" (nếu không thì) nối hai vế điều kiện – hậu quả, đúng với \"We must act now\". \"annually\" (hằng năm), \"harshly\" (một cách nghiêm khắc) và \"significantly\" (một cách đáng kể) không nối được hai ý này."},{"num":15,"question":"The ______ for killing a rhino is now ten years in prison.","options":["punish","punished","punishing","punishment"],"answerIndex":3,"explanation":"Chủ ngữ của \"is\" cần danh từ: \"the punishment for sth\" (hình phạt cho hành vi gì). \"punish/punished/punishing\" đều là dạng động từ."},{"num":16,"question":"Many people think that the new law is far too ______.","options":["harshly","harsh","harshness","harsher"],"answerIndex":1,"explanation":"Sau \"far too\" cần tính từ nguyên cấp: \"harsh\" (khắc nghiệt, nghiêm khắc). \"harshly\" là trạng từ; \"harshness\" là danh từ; \"harsher\" là dạng so sánh hơn nên không đi với \"too\"."}],"gapfill":[{"num":1,"sentence":"Immigrants often need many years to ______ into a new society.","answer":"assimilate"},{"num":2,"sentence":"Everyone must ______ water carefully during the dry season.","answer":"conserve"},{"num":3,"sentence":"In my ______, the whole project will take at least two years.","answer":"estimation"},{"num":4,"sentence":"The judge spoke ______ to the men who had killed the elephants.","answer":"harshly"},{"num":5,"sentence":"Local farmers saw the new tax as an unfair ______.","answer":"imposition"},{"num":6,"sentence":"Write your name clearly; ______, your form cannot be processed.","answer":"otherwise"},{"num":7,"sentence":"This jam contains no artificial colouring and no ______.","answer":"preservative"},{"num":8,"sentence":"The law must ______ those who trade in the skins of wild animals.","answer":"punish"},{"num":9,"sentence":"He was the only ______ of the shipwreck off this coast.","answer":"survivor"},{"num":10,"sentence":"The Javan tiger has been ______ since the 1970s.","answer":"extinct"}]},"3":{"title":"READING","words":[{"word":"Conservation","ipa":"/ˌkɒnsəˈveɪʃn/","pos":"n","meaning":"sự bảo tồn"},{"word":"Conserve","ipa":"/kənˈsɜːv/","pos":"v","meaning":"bảo tồn"},{"word":"Conservationist","ipa":"/ˌkɒnsəˈveɪʃənɪst/","pos":"n","meani
