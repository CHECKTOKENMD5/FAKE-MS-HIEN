<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b3a5c">
<meta name="description" content="English with Ms Hien — Vocab 12 Dictionary, Flashcards, Quiz & Review">
<title>English with Ms Hien — Vocab 12 Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN SYSTEM ============ */
:root{
  --navy:#173a5e;--navy-2:#0e2740;--navy-3:#24507d;--navy-4:#3a6ea5;
  --gold:#c9a227;--gold-2:#e8c766;--gold-3:#a07f18;--gold-4:#f5dc95;
  --bg:#f6f4ee;--bg-2:#efece2;
  --surface:#ffffff;--surface-2:#faf8f3;--surface-3:#f2eee1;
  --text:#0f172a;--text-2:#475569;--muted:#94a3b8;
  --border:rgba(23,58,94,.08);--border-2:rgba(23,58,94,.14);
  --green:#0f9d58;--green-2:#1cb46a;--green-bg:rgba(15,157,88,.10);
  --red:#dc3545;--red-2:#e55565;--red-bg:rgba(220,53,69,.10);
  --blue:#3b82f6;--blue-bg:rgba(59,130,246,.10);
  --purple:#8b5cf6;--purple-bg:rgba(139,92,246,.10);
  --orange:#f59e0b;--orange-bg:rgba(245,158,11,.10);
  --cyan:#06b6d4;--pink:#ec4899;
  --radius:20px;--radius-sm:14px;--radius-xs:10px;
  --shadow-xs:0 1px 2px rgba(15,23,42,.05);
  --shadow-sm:0 1px 3px rgba(15,23,42,.07),0 1px 2px rgba(15,23,42,.04);
  --shadow:0 6px 20px rgba(15,23,42,.08),0 2px 6px rgba(15,23,42,.05);
  --shadow-lg:0 16px 40px rgba(15,23,42,.14),0 6px 14px rgba(15,23,42,.06);
  --shadow-xl:0 24px 60px rgba(15,23,42,.18);
  --shadow-gold:0 8px 24px rgba(201,162,39,.28);
  --shadow-navy:0 8px 24px rgba(23,58,94,.28);
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --header-h:64px;--nav-h:68px;
  --ff-sans:"Inter","Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ff-mono:"JetBrains Mono","SF Mono",Monaco,monospace;
}
[data-theme="dark"]{
  --navy:#7ea8dd;--navy-2:#0a1520;--navy-3:#a8c5e8;--navy-4:#c9dbf0;
  --gold:#e8c766;--gold-2:#f5dc95;--gold-3:#c9a227;--gold-4:#fdf0c4;
  --bg:#080f18;--bg-2:#050a12;
  --surface:#121c2b;--surface-2:#182535;--surface-3:#1e2c40;
  --text:#eef2f9;--text-2:#b8c4d6;--muted:#6d7c92;
  --border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.13);
  --green:#2ecc71;--green-2:#4ae089;--green-bg:rgba(46,204,113,.14);
  --red:#ff6b6b;--red-2:#ff8585;--red-bg:rgba(255,107,107,.14);
  --blue:#60a5fa;--blue-bg:rgba(96,165,250,.14);
  --purple:#a78bfa;--purple-bg:rgba(167,139,250,.14);
  --orange:#fbbf24;--orange-bg:rgba(251,191,36,.14);
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow-sm:0 1px 3px rgba(0,0,0,.35);
  --shadow:0 6px 20px rgba(0,0,0,.42);
  --shadow-lg:0 16px 40px rgba(0,0,0,.58);
  --shadow-xl:0 24px 60px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--ff-sans);
  background:var(--bg);color:var(--text);
  font-size:16px;line-height:1.5;min-width:360px;
  padding-bottom:env(safe-area-inset-bottom);
  transition:background-color .3s var(--ease),color .3s var(--ease);
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 100% -10%,rgba(201,162,39,.10),transparent 60%),
    radial-gradient(700px 500px at -10% 100%,rgba(59,130,246,.08),transparent 60%),
    radial-gradient(600px 400px at 50% 50%,rgba(139,92,246,.04),transparent 60%);
}
[data-theme="dark"] body::before{
  background:
    radial-gradient(900px 500px at 100% -10%,rgba(232,199,102,.12),transparent 60%),
    radial-gradient(700px 500px at -10% 100%,rgba(96,165,250,.12),transparent 60%);
}
#app{max-width:760px;margin:0 auto;min-height:100vh;position:relative;display:flex;flex-direction:column;z-index:1;}
#watermark{
  position:fixed;right:8px;bottom:82px;width:100px;opacity:.13;
  pointer-events:none;z-index:0;filter:grayscale(15%);
}
[data-theme="dark"] #watermark{opacity:.09;}

/* ============ HEADER ============ */
header.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,rgba(23,58,94,.94),rgba(14,39,64,.94));
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  color:#fff;padding:10px 12px;
  padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 24px rgba(14,39,64,.20);
  border-bottom:1px solid rgba(255,255,255,.06);
  transition:box-shadow .3s var(--ease);
}
header.topbar.scrolled{box-shadow:0 6px 32px rgba(14,39,64,.35);}
header.topbar .backbtn{
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.08);
  color:#fff;border-radius:12px;min-width:44px;min-height:44px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;font-size:18px;
  transition:all .22s var(--ease);
}
header.topbar .backbtn:hover{background:rgba(255,255,255,.2);transform:translateX(-2px);}
header.topbar .backbtn:active{transform:scale(.94);}
header.topbar .crumb{flex:1;min-width:0;}
header.topbar .crumb .brand-line{
  font-size:10px;letter-spacing:.14em;color:var(--gold-2);
  text-transform:uppercase;font-weight:800;
  display:flex;align-items:center;gap:6px;
}
header.topbar .crumb .brand-line::before{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 8px var(--gold-2);animation:pulseDot 2.4s ease-in-out infinite;
}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.6}}
header.topbar .crumb .loc-line{
  font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:1px;letter-spacing:-.015em;
}
header.topbar .logo-badge{
  width:38px;height:38px;border-radius:50%;flex:none;
  background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px rgba(201,162,39,.5),0 4px 12px rgba(0,0,0,.2);
  transition:transform .3s var(--ease-bounce);
}
header.topbar .logo-badge:hover{transform:rotate(8deg) scale(1.05);}
header.topbar .logo-badge img{width:100%;height:100%;object-fit:cover;}
.theme-btn,.hdr-btn{
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.08);
  color:#fff;width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;font-size:17px;
  transition:all .25s var(--ease);position:relative;
}
.theme-btn:hover,.hdr-btn:hover{background:rgba(255,255,255,.2);transform:translateY(-1px);}
.theme-btn:active,.hdr-btn:active{transform:scale(.92);}
.hdr-btn .badge-dot{
  position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;
  background:var(--red);box-shadow:0 0 0 2px rgba(14,39,64,.9);
  animation:pulseDot 1.6s ease-in-out infinite;
}

/* ============ MAIN ============ */
main{flex:1;padding:16px 14px calc(var(--nav-h) + 28px);position:relative;z-index:2;}
main.no-nav{padding-bottom:32px;}
.screen{animation:slideUp .42s var(--ease);}
@keyframes slideUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeOut{to{opacity:0;transform:translateY(-8px);}}
main.leaving .screen{animation:fadeOut .18s var(--ease-in-out) forwards;}

/* ============ HERO ============ */
.home-hero{
  background:linear-gradient(135deg,var(--navy),var(--navy-2));
  border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-lg);
  margin-bottom:16px;color:#fff;position:relative;overflow:hidden;
  display:flex;align-items:center;gap:14px;
  animation:heroIn .5s var(--ease-bounce);
}
@keyframes heroIn{from{opacity:0;transform:translateY(20px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.home-hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(500px 300px at 90% -20%,rgba(201,162,39,.38),transparent 60%);
  pointer-events:none;
}
.home-hero::after{
  content:"";position:absolute;top:-40%;right:-10%;width:220px;height:220px;
  border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.18),transparent 70%);
  animation:floatGlow 6s ease-in-out infinite;
}
@keyframes floatGlow{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,14px)}}
.home-hero img.avatar{
  width:66px;height:66px;border-radius:50%;object-fit:cover;
  border:3px solid var(--gold-2);flex:none;position:relative;z-index:1;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.home-hero .hero-body{flex:1;min-width:0;position:relative;z-index:1;}
.home-hero h1{font-size:19px;margin:0 0 4px;color:#fff;font-weight:800;letter-spacing:-.02em;}
.home-hero p{margin:0;color:rgba(255,255,255,.75);font-size:13px;}
.streak-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(135deg,rgba(201,162,39,.25),rgba(232,199,102,.15));
  border:1px solid rgba(232,199,102,.4);
  color:var(--gold-2);font-weight:800;font-size:11.5px;
  padding:4px 10px;border-radius:100px;margin-top:6px;
}
.streak-pill .flame{font-size:13px;animation:flicker 1.6s ease-in-out infinite;}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg);filter:brightness(1);}50%{transform:scale(1.12) rotate(2deg);filter:brightness(1.3);}}

/* ============ RING ============ */
.ring-wrap{
  display:flex;align-items:center;gap:16px;background:var(--surface);
  border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  margin-bottom:16px;border:1px solid var(--border);
  animation:slideUp .5s var(--ease) both;
}
.ring{position:relative;width:82px;height:82px;flex:none;}
.ring svg{transform:rotate(-90deg);}
.ring .bg{fill:none;stroke:var(--surface-3);stroke-width:8;}
.ring .fg{fill:none;stroke:url(#ringGrad);stroke-width:8;stroke-linecap:round;
  stroke-dasharray:220;stroke-dashoffset:220;
  transition:stroke-dashoffset 1.2s var(--ease);}
.ring .ring-label{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:900;color:var(--navy);font-size:15px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
[data-theme="dark"] .ring .ring-label{color:var(--gold-2);}
.ring-info{flex:1;min-width:0;}
.ring-info .ri-title{font-weight:800;color:var(--text);font-size:15px;margin-bottom:2px;}
.ring-info .ri-sub{color:var(--muted);font-size:12.5px;}

/* ============ WOTD ============ */
.wotd{
  background:linear-gradient(135deg,var(--surface),var(--surface-2));
  border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  border:1px solid var(--border);margin-bottom:16px;position:relative;overflow:hidden;
  animation:slideUp .55s var(--ease) both;
}
.wotd::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--gold),var(--gold-2));border-radius:4px;
}
.wotd-label{
  display:flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold-3);margin-bottom:6px;
}
[data-theme="dark"] .wotd-label{color:var(--gold-2);}
.wotd-word{
  font-size:22px;font-weight:900;color:var(--navy);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:-.02em;
}
[data-theme="dark"] .wotd-word{color:var(--gold-2);}
.wotd-ipa{color:var(--gold-3);font-size:14px;font-style:italic;font-weight:500;font-family:var(--ff-mono);}
[data-theme="dark"] .wotd-ipa{color:var(--gold);}
.wotd-meaning{color:var(--text-2);font-size:14.5px;margin-top:3px;}
.wotd-loc{color:var(--muted);font-size:11.5px;margin-top:5px;}

/* ============ SECTION TITLE ============ */
.section-title{
  font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);font-weight:800;margin:22px 4px 10px;
  display:flex;align-items:center;gap:8px;
}
.section-title::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--border-2),transparent);
}

/* ============ GRID ============ */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.unit-card{
  background:var(--surface);border-radius:var(--radius);padding:16px 14px;
  box-shadow:var(--shadow-sm);text-align:left;border:1px solid var(--border);
  cursor:pointer;min-height:100px;display:flex;flex-direction:column;
  justify-content:center;gap:4px;position:relative;overflow:hidden;
  transition:all .28s var(--ease);
  animation:cardIn .5s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms);
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.unit-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--navy),var(--gold));
  transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease);
}
.unit-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--border-2);}
.unit-card:hover::before{transform:scaleX(1);}
.unit-card:active{transform:translateY(-1px) scale(.98);}
.unit-card .u-num{
  color:var(--gold-3);font-weight:900;font-size:11px;letter-spacing:.1em;
  display:flex;align-items:center;gap:6px;
}
[data-theme="dark"] .unit-card .u-num{color:var(--gold-2);}
.unit-card .u-name{
  color:var(--navy);font-weight:800;font-size:15px;letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px;
}
[data-theme="dark"] .unit-card .u-name{color:var(--gold-2);}
.unit-card .u-sub{color:var(--muted);font-size:11.5px;}
.unit-card .u-prog{margin-top:8px;height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden;}
.unit-card .u-prog > div{height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--gold),var(--gold-2));
  transition:width .8s var(--ease);}

/* ============ LESSON ROWS ============ */
.list{display:flex;flex-direction:column;gap:10px;}
.lesson-row{
  background:var(--surface);border-radius:var(--radius-sm);padding:14px;
  box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px;
  border:1px solid var(--border);text-align:left;cursor:pointer;width:100%;
  min-height:64px;position:relative;overflow:hidden;
  transition:all .25s var(--ease);
  animation:cardIn .42s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms);
}
.lesson-row:hover{transform:translateX(3px);border-color:var(--gold);box-shadow:var(--shadow);}
.lesson-row:active{transform:translateX(1px) scale(.99);}
.lesson-row .l-badge{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,var(--navy),var(--navy-3));
  color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;
  flex:none;font-size:14px;box-shadow:0 4px 12px rgba(23,58,94,.25);
  transition:transform .3s var(--ease-bounce);
}
.lesson-row:hover .l-badge{transform:scale(1.08) rotate(-3deg);}
.lesson-row .l-info{flex:1;min-width:0;}
.lesson-row .l-title{font-weight:800;color:var(--navy);font-size:14.5px;letter-spacing:-.01em;}
[data-theme="dark"] .lesson-row .l-title{color:var(--gold-2);}
.lesson-row .l-sub{color:var(--muted);font-size:11.5px;margin-top:2px;}
.lesson-row.disabled{opacity:.42;pointer-events:none;}
.lesson-row .chev{color:var(--muted);font-size:20px;flex:none;transition:transform .3s var(--ease);}
.lesson-row:hover .chev{transform:translateX(4px);color:var(--gold);}

/* ============ ACTIVITY CARDS ============ */
.activity-card{
  background:var(--surface);border-radius:var(--radius-sm);padding:15px;
  box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px;
  border:1px solid var(--border);text-align:left;cursor:pointer;width:100%;
  min-height:70px;position:relative;overflow:hidden;
  transition:all .28s var(--ease);
  animation:cardIn .42s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms);
  margin-bottom:10px;
}
.activity-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--navy),var(--navy-3));
  transition:width .3s var(--ease);
}
.activity-card.group-dict::before{background:linear-gradient(180deg,var(--gold),var(--gold-2));}
.activity-card.group-review::before{background:linear-gradient(180deg,var(--blue),var(--cyan));}
.activity-card.group-pro::before{background:linear-gradient(180deg,var(--purple),var(--pink));}
.activity-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--border-2);}
.activity-card:hover::before{width:6px;}
.activity-card:active{transform:translateY(0) scale(.985);}
.activity-card .a-icon{
  font-size:24px;flex:none;width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-3);border-radius:12px;
  transition:transform .35s var(--ease-bounce);
}
.activity-card:hover .a-icon{transform:scale(1.1) rotate(-6deg);}
.activity-card .a-name{font-weight:800;color:var(--navy);font-size:15px;letter-spacing:-.01em;}
[data-theme="dark"] .activity-card .a-name{color:var(--gold-2);}
.activity-card .a-desc{color:var(--muted);font-size:12px;margin-top:2px;}
.activity-card .a-badge{
  margin-left:auto;flex:none;font-size:10.5px;font-weight:800;
  letter-spacing:.04em;color:var(--green);text-transform:uppercase;
  background:var(--green-bg);padding:3px 8px;border-radius:8px;
}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,var(--navy),var(--navy-2));
  color:#fff;border:none;border-radius:14px;padding:13px 20px;
  font-size:15px;font-weight:800;cursor:pointer;min-height:48px;
  letter-spacing:-.01em;position:relative;overflow:hidden;
  transition:all .22s var(--ease);
  box-shadow:0 4px 14px rgba(23,58,94,.25);font-family:inherit;
}
.btn::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.3),transparent 40%);
  opacity:0;transition:opacity .4s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(23,58,94,.32);}
.btn:hover::after{opacity:1;}
.btn:active{transform:translateY(0) scale(.98);}
.btn:disabled{opacity:.4;pointer-events:none;}
.btn.secondary{background:var(--surface);color:var(--navy);border:2px solid var(--navy);box-shadow:var(--shadow-sm);}
[data-theme="dark"] .btn.secondary{color:var(--gold-2);border-color:var(--gold);}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#3a2c00;box-shadow:var(--shadow-gold);}
.btn.gold:hover{box-shadow:0 8px 26px rgba(201,162,39,.4);}
.btn.ghost{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border-2);box-shadow:var(--shadow-xs);}
.btn.block{width:100%;}
.btn-row{display:flex;gap:10px;margin-top:14px;}
.btn-row .btn{flex:1;}

/* ============ SEARCH ============ */
.search-bar{
  position:sticky;top:calc(var(--header-h) + env(safe-area-inset-top));z-index:30;
  background:var(--bg);padding:10px 0 12px;margin:0 -14px;padding-left:14px;padding-right:14px;
  transition:box-shadow .3s;
}
.search-input{
  width:100%;padding:13px 16px;border-radius:14px;
  border:1.5px solid var(--border-2);font-size:16px;
  background:var(--surface);color:var(--text);outline:none;font-family:inherit;
  transition:all .25s var(--ease);box-shadow:var(--shadow-xs);
}
.search-input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.15),var(--shadow-sm);}
.scope-tabs{display:flex;gap:6px;margin-top:8px;}
.scope-tab{
  flex:1;text-align:center;padding:9px 4px;border-radius:11px;
  background:var(--surface);border:1.5px solid var(--border-2);
  font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer;
  min-height:38px;transition:all .25s var(--ease);font-family:inherit;
}
.scope-tab:hover{color:var(--navy);}
[data-theme="dark"] .scope-tab:hover{color:var(--gold-2);}
.scope-tab.active{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(23,58,94,.22);}

.word-card{
  background:var(--surface);border-radius:var(--radius-sm);padding:14px;
  box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px;
  margin-bottom:10px;border:1px solid var(--border);
  transition:all .25s var(--ease);
  animation:cardIn .4s var(--ease) both;animation-delay:calc(var(--i,0) * 25ms);
}
.word-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--gold);}
.word-card .w-main{flex:1;min-width:0;}
.word-card .w-en{font-weight:900;color:var(--navy);font-size:16px;letter-spacing:-.01em;}
[data-theme="dark"] .word-card .w-en{color:var(--gold-2);}
.word-card .w-pos{
  display:inline-block;background:var(--green-bg);color:var(--green);
  font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px;
  margin-left:7px;text-transform:lowercase;vertical-align:middle;
}
.word-card .w-ipa{color:var(--gold-3);font-size:13.5px;font-style:italic;margin-top:2px;font-family:var(--ff-mono);}
[data-theme="dark"] .word-card .w-ipa{color:var(--gold);}
.word-card .w-vi{color:var(--text-2);font-size:14.5px;margin-top:3px;}
.word-card .w-loc{color:var(--muted);font-size:10.5px;margin-top:4px;display:flex;align-items:center;gap:4px;}
.word-card .w-loc::before{content:"📍";}
.spk-btn{
  flex:none;width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--navy),var(--navy-3));
  color:#fff;border:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px;box-shadow:0 4px 12px rgba(23,58,94,.24);
  transition:all .25s var(--ease-bounce);
}
.spk-btn:hover{transform:scale(1.1) rotate(-8deg);box-shadow:0 6px 18px rgba(23,58,94,.32);}
.spk-btn:active{transform:scale(.94);}
.spk-btn.playing{animation:spkPulse 1s ease-in-out infinite;}
@keyframes spkPulse{0%,100%{box-shadow:0 4px 12px rgba(201,162,39,.3);}50%{box-shadow:0 4px 24px rgba(201,162,39,.6);}}
.bookmark-btn{
  flex:none;width:38px;height:38px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .25s var(--ease-bounce);font-size:16px;
}
.bookmark-btn:hover{transform:scale(1.1);color:var(--gold);}
.bookmark-btn.active{background:var(--gold);color:#fff;border-color:var(--gold);}
.bookmark-btn:active{transform:scale(.9);}
.note-btn{
  flex:none;width:38px;height:38px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .25s var(--ease-bounce);font-size:15px;
}
.note-btn:hover{transform:scale(1.1);color:var(--blue);}
.note-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* ============ EMPTY ============ */
.empty-msg{text-align:center;color:var(--muted);padding:44px 20px;font-size:14.5px;animation:slideUp .4s var(--ease);}
.empty-msg .em-icon{font-size:52px;display:block;margin-bottom:12px;opacity:.6;}

/* ============ FLASHCARD ============ */
.progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.progress-bar{flex:1;height:8px;background:var(--surface-3);border-radius:6px;overflow:hidden;position:relative;}
.progress-bar > div{
  height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold-2));
  transition:width .5s var(--ease);position:relative;overflow:hidden;
}
.progress-bar > div::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  animation:shimmer 2s ease-in-out infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.progress-label{font-size:12.5px;color:var(--muted);font-weight:800;white-space:nowrap;min-width:52px;text-align:right;font-variant-numeric:tabular-nums;}

.card-stage{perspective:1400px;margin-bottom:12px;}
.flip-card-inner{
  position:relative;width:100%;min-height:250px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,.2,.2,1);
}
.flip-card-inner.flipped{transform:rotateY(180deg);}
.flip-face{
  position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;
  min-height:250px;border-radius:22px;
  background:linear-gradient(160deg,var(--surface),var(--surface-2));
  box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;
  text-align:center;padding:30px 22px;border:1.5px solid var(--border-2);overflow:hidden;
}
.flip-face::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(400px 220px at 50% 0%,rgba(201,162,39,.10),transparent 60%);
  pointer-events:none;
}
.flip-face.flip-back{
  transform:rotateY(180deg);
  background:linear-gradient(160deg,var(--navy),var(--navy-2));
  border-color:rgba(201,162,39,.3);color:#fff;
}
.flip-face .fc-word{font-size:28px;font-weight:900;color:var(--navy);letter-spacing:-.02em;animation:fadeUp .5s var(--ease) .12s both;}
[data-theme="dark"] .flip-face .fc-word{color:var(--gold-2);}
.flip-face.flip-back .fc-word{color:#fff;}
.flip-face .fc-ipa{font-size:15px;color:var(--gold-3);margin-top:8px;font-style:italic;font-family:var(--ff-mono);animation:fadeUp .5s var(--ease) .18s both;}
[data-theme="dark"] .flip-face .fc-ipa{color:var(--gold-2);}
.flip-face.flip-back .fc-ipa{color:var(--gold-2);}
.flip-face .fc-pos{
  display:inline-block;background:var(--green-bg);color:var(--green);
  font-size:12px;font-weight:800;border-radius:7px;padding:3px 10px;margin-top:12px;
  animation:fadeUp .5s var(--ease) .22s both;
}
.flip-face.flip-back .fc-pos{background:rgba(255,255,255,.15);color:#fff;}
.flip-face .fc-vi{font-size:20px;color:var(--text);margin-top:12px;font-weight:700;animation:fadeUp .5s var(--ease) .16s both;}
.flip-face.flip-back .fc-vi{color:#fff;}
.flip-face .fc-spk{position:absolute;top:14px;right:14px;}
.flip-face.flip-back .fc-spk{background:rgba(255,255,255,.16);}
.fc-hint{
  text-align:center;font-size:11.5px;color:var(--muted);margin-top:10px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.fc-hint::before{content:"👆";animation:tap 1.6s ease-in-out infinite;}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.know-row{display:flex;gap:10px;}
.know-row .btn{flex:1;}
.btn.know{background:linear-gradient(135deg,#0f9d58,#1cb46a);box-shadow:0 4px 14px rgba(15,157,88,.28);}
.btn.know:hover{box-shadow:0 8px 22px rgba(15,157,88,.36);}
.btn.review{background:linear-gradient(135deg,#dc3545,#e55565);box-shadow:0 4px 14px rgba(220,53,69,.28);}
.btn.review:hover{box-shadow:0 8px 22px rgba(220,53,69,.36);}

.opts-row{display:flex;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap;}
.icon-toggle{
  background:var(--surface);border:1.5px solid var(--border-2);border-radius:11px;
  padding:9px 14px;font-size:12.5px;font-weight:800;color:var(--navy);
  cursor:pointer;min-height:40px;transition:all .22s var(--ease);
  font-family:inherit;display:inline-flex;align-items:center;gap:6px;
}
[data-theme="dark"] .icon-toggle{color:var(--gold-2);}
.icon-toggle:hover{transform:translateY(-1px);border-color:var(--gold);}
.icon-toggle.active{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(23,58,94,.22);}
[data-theme="dark"] .icon-toggle.active{color:#fff;}

/* ============ QUIZ ============ */
.quiz-q{
  background:var(--surface);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--border);
  animation:slideUp .4s var(--ease);
}
.quiz-q .q-text{font-size:16.5px;font-weight:800;color:var(--navy);line-height:1.45;letter-spacing:-.01em;}
[data-theme="dark"] .quiz-q .q-text{color:var(--gold-2);}
.opt-btn{
  display:block;width:100%;text-align:left;background:var(--surface);
  border:2px solid var(--surface-3);border-radius:14px;padding:13px 15px;
  margin-bottom:10px;font-size:15px;cursor:pointer;min-height:50px;
  color:var(--text);font-family:inherit;line-height:1.4;
  transition:all .22s var(--ease);position:relative;overflow:hidden;
}
.opt-btn:hover:not(:disabled){border-color:var(--gold);background:var(--surface-2);transform:translateX(3px);}
.opt-btn:active:not(:disabled){transform:translateX(1px) scale(.99);}
.opt-btn .opt-letter{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;background:var(--surface-3);
  color:var(--navy);font-weight:900;font-size:12.5px;margin-right:10px;vertical-align:middle;
  transition:all .22s var(--ease);
}
[data-theme="dark"] .opt-btn .opt-letter{color:var(--gold-2);}
.opt-btn.correct{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:700;}
.opt-btn.correct .opt-letter{background:var(--green);color:#fff;}
.opt-btn.incorrect{background:var(--red-bg);border-color:var(--red);color:var(--red);font-weight:700;}
.opt-btn.incorrect .opt-letter{background:var(--red);color:#fff;}
.opt-btn:disabled{cursor:default;}
.opt-btn.correct::after{
  content:"✓";position:absolute;right:16px;top:50%;transform:translateY(-50%);
  font-size:18px;font-weight:900;color:var(--green);
}
.opt-btn.incorrect::after{
  content:"✕";position:absolute;right:16px;top:50%;transform:translateY(-50%);
  font-size:18px;font-weight:900;color:var(--red);
}
.pos-tag{font-size:11px;font-weight:800;color:var(--muted);font-style:italic;}
.opt-btn.correct .pos-tag,.opt-btn.incorrect .pos-tag{color:inherit;opacity:.75;}
.explain-box{
  background:linear-gradient(135deg,rgba(201,162,39,.08),rgba(201,162,39,.03));
  border-left:4px solid var(--gold);padding:12px 14px;border-radius:10px;
  font-size:13.5px;color:var(--text-2);margin-top:10px;line-height:1.55;
  animation:slideUp .4s var(--ease);
}

/* ============ RESULT ============ */
.result-card{
  background:var(--surface);border-radius:var(--radius);padding:26px 20px;
  box-shadow:var(--shadow);text-align:center;border:1px solid var(--border);
  animation:resultIn .55s var(--ease-bounce);
}
@keyframes resultIn{from{opacity:0;transform:scale(.9) translateY(16px);}to{opacity:1;transform:scale(1) translateY(0);}}
.result-card .score-big{
  font-size:48px;font-weight:900;color:var(--navy);letter-spacing:-.03em;line-height:1;
  background:linear-gradient(135deg,var(--navy),var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:countUp .8s var(--ease-bounce);font-variant-numeric:tabular-nums;
}
@keyframes countUp{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.result-card .score-sub{color:var(--muted);font-size:14px;margin-bottom:16px;margin-top:8px;font-weight:600;}
.result-card .score-emoji{font-size:52px;margin-bottom:6px;display:block;animation:pop 1s var(--ease-bounce);}
@keyframes pop{0%{transform:scale(0) rotate(-30deg);}60%{transform:scale(1.2) rotate(10deg);}100%{transform:scale(1) rotate(0);}}
.wrong-list{text-align:left;margin-top:14px;}
.wrong-item{display:flex;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border);font-size:13.5px;}
.wrong-item:last-child{border-bottom:none;}
.wrong-item b{color:var(--navy);font-weight:800;}
[data-theme="dark"] .wrong-item b{color:var(--gold-2);}

/* ============ GAP FILL ============ */
.gf-sentence{
  background:var(--surface);border-radius:var(--radius-sm);padding:15px;
  box-shadow:var(--shadow-sm);margin-bottom:10px;border:1px solid var(--border);
  animation:cardIn .42s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms);
}
.gf-sentence .gf-num{color:var(--gold-3);font-weight:900;font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
[data-theme="dark"] .gf-sentence .gf-num{color:var(--gold-2);}
.gf-sentence .gf-text{font-size:15px;margin-top:6px;line-height:1.8;}
.gf-blank{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:100px;min-height:36px;border-bottom:2.5px solid var(--navy);
  background:var(--surface-3);border-radius:8px 8px 0 0;padding:3px 12px;
  font-weight:800;color:var(--navy);vertical-align:middle;margin:0 3px;
  cursor:pointer;transition:all .22s var(--ease);font-family:inherit;
}
[data-theme="dark"] .gf-blank{color:var(--gold-2);border-color:var(--gold);}
.gf-blank.empty{color:transparent;position:relative;}
.gf-blank.empty::after{
  content:"tap";position:absolute;color:var(--muted);font-size:10.5px;
  font-weight:700;text-transform:uppercase;letter-spacing:.06em;
}
.gf-blank.filled{background:linear-gradient(135deg,rgba(201,162,39,.14),rgba(201,162,39,.06));}
.gf-blank.correct{background:var(--green-bg);border-color:var(--green);color:var(--green);}
.gf-blank.incorrect{background:var(--red-bg);border-color:var(--red);color:var(--red);}
.gf-blank:not(.correct):not(.incorrect):hover{transform:translateY(-2px);}

.wordbank{
  position:sticky;bottom:0;background:var(--surface);
  border-top:1.5px solid var(--border-2);padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  margin:16px -14px calc(-1 * (var(--nav-h) + 28px));
  box-shadow:0 -6px 20px rgba(0,0,0,.06);z-index:35;backdrop-filter:blur(12px);
}
.wordbank-label{
  font-size:11px;color:var(--muted);font-weight:800;margin-bottom:10px;
  text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;gap:6px;
}
.wordbank-tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;margin-bottom:10px;}
.tile{
  background:linear-gradient(135deg,var(--navy),var(--navy-3));
  color:#fff;border-radius:11px;padding:10px 16px;font-weight:800;font-size:14px;
  cursor:pointer;user-select:none;min-height:42px;display:flex;align-items:center;
  box-shadow:0 4px 12px rgba(23,58,94,.22);
  transition:all .22s var(--ease-bounce);border:none;font-family:inherit;
}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(23,58,94,.3);}
.tile:active{transform:translateY(0) scale(.96);}
.tile.selected{outline:3px solid var(--gold);outline-offset:2px;animation:tilePulse 1.2s ease-in-out infinite;}
@keyframes tilePulse{0%,100%{box-shadow:0 4px 12px rgba(201,162,39,.3);}50%{box-shadow:0 4px 20px rgba(201,162,39,.55);}}
.tile.ghost{opacity:.35;}

/* ============ LOGIN ============ */
.login-form{
  background:var(--surface);border-radius:var(--radius);padding:22px 20px;
  box-shadow:var(--shadow);border:1px solid var(--border);
  animation:slideUp .5s var(--ease) .1s both;
}
.form-label{
  font-size:11.5px;font-weight:800;color:var(--navy);
  text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px;
}
[data-theme="dark"] .form-label{color:var(--gold-2);}
.login-error{
  background:var(--red-bg);color:var(--red);border-radius:11px;
  padding:12px 14px;font-size:13.5px;font-weight:700;margin-top:14px;
  border-left:4px solid var(--red);animation:shake .4s;
}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.link-btn{
  background:none;border:none;color:var(--navy);font-weight:800;
  font-size:12.5px;text-decoration:underline;text-underline-offset:2px;
  padding:6px 0;cursor:pointer;min-height:auto;font-family:inherit;
  transition:color .2s;
}
[data-theme="dark"] .link-btn{color:var(--gold-2);}
.link-btn:hover{color:var(--gold);}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(255,255,255,.85);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid var(--border-2);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;align-items:center;
  transform:translateY(0);transition:transform .35s var(--ease);
  max-width:760px;margin:0 auto;box-shadow:0 -4px 20px rgba(15,23,42,.06);
}
[data-theme="dark"] .bottom-nav{background:rgba(18,28,43,.88);box-shadow:0 -4px 20px rgba(0,0,0,.35);}
.bottom-nav.hidden{transform:translateY(120%);}
.nav-item{
  flex:1;background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px;border-radius:12px;color:var(--muted);
  font-family:inherit;transition:all .25s var(--ease);
  position:relative;min-height:52px;
}
.nav-item:hover{color:var(--navy);}
[data-theme="dark"] .nav-item:hover{color:var(--gold-2);}
.nav-item.active{color:var(--navy);}
[data-theme="dark"] .nav-item.active{color:var(--gold-2);}
.nav-item.active::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:3px;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,var(--gold),var(--gold-2));
  animation:navPop .4s var(--ease-bounce);
}
@keyframes navPop{from{width:0;opacity:0;}to{width:26px;opacity:1;}}
.nav-item .ni-icon{font-size:20px;line-height:1;transition:transform .3s var(--ease-bounce);}
.nav-item.active .ni-icon{transform:scale(1.15) translateY(-1px);}
.nav-item .ni-label{font-size:10.5px;font-weight:800;letter-spacing:.02em;}

/* ============ STATS ============ */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;}
.stat-card{
  background:var(--surface);border-radius:var(--radius-sm);padding:16px;
  box-shadow:var(--shadow-sm);border:1px solid var(--border);
  position:relative;overflow:hidden;
  animation:cardIn .45s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms);
}
.stat-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold-2));
}
.stat-card.blue::before{background:linear-gradient(90deg,var(--blue),#60a5fa);}
.stat-card.green::before{background:linear-gradient(90deg,var(--green),#2ecc71);}
.stat-card.purple::before{background:linear-gradient(90deg,var(--purple),#a78bfa);}
.stat-card.orange::before{background:linear-gradient(90deg,var(--orange),#fbbf24);}
.stat-card.cyan::before{background:linear-gradient(90deg,var(--cyan),#22d3ee);}
.stat-card.pink::before{background:linear-gradient(90deg,var(--pink),#f472b6);}
.stat-card .sc-label{
  font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.stat-card .sc-value{
  font-size:26px;font-weight:900;color:var(--navy);margin-top:4px;
  letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;
}
[data-theme="dark"] .stat-card .sc-value{color:var(--gold-2);}
.stat-card .sc-sub{font-size:11.5px;color:var(--muted);margin-top:6px;}

.unit-bar{
  background:var(--surface);border-radius:var(--radius-sm);padding:12px 14px;
  box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:10px;
  animation:cardIn .42s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms);
}
.unit-bar .ub-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.unit-bar .ub-name{font-weight:800;color:var(--navy);font-size:14px;}
[data-theme="dark"] .unit-bar .ub-name{color:var(--gold-2);}
.unit-bar .ub-pct{font-weight:900;color:var(--gold-3);font-size:13.5px;font-variant-numeric:tabular-nums;}
[data-theme="dark"] .unit-bar .ub-pct{color:var(--gold-2);}
.unit-bar .ub-track{height:8px;background:var(--surface-3);border-radius:6px;overflow:hidden;}
.unit-bar .ub-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--navy),var(--gold));transition:width 1s var(--ease);}

/* ============ WORDLIST ============ */
.wl-item{
  background:var(--surface);border-radius:var(--radius-sm);padding:14px;
  box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:8px;
  animation:cardIn .4s var(--ease) both;animation-delay:calc(var(--i,0) * 20ms);
}
.wl-item .wl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.wl-item .wl-word{font-weight:900;color:var(--navy);font-size:16px;letter-spacing:-.01em;}
[data-theme="dark"] .wl-item .wl-word{color:var(--gold-2);}
.wl-item .wl-ipa{color:var(--gold-3);font-size:13.5px;font-style:italic;font-family:var(--ff-mono);}
[data-theme="dark"] .wl-item .wl-ipa{color:var(--gold);}
.wl-item .wl-mean{color:var(--text-2);font-size:14.5px;margin-top:4px;}

/* ============ SPELLING ============ */
.spell-input{
  width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--border-2);
  font-size:18px;background:var(--surface);color:var(--text);
  outline:none;font-family:inherit;font-weight:700;text-align:center;
  letter-spacing:.02em;transition:all .25s var(--ease);margin-top:14px;
}
.spell-input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.15);}
.spell-input.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);}
.spell-input.incorrect{border-color:var(--red);background:var(--red-bg);color:var(--red);}

/* ============ MODAL ============ */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(6px);
  z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .2s var(--ease);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{
  background:var(--surface);border-radius:var(--radius);padding:22px;
  max-width:480px;width:100%;max-height:82vh;overflow-y:auto;
  box-shadow:var(--shadow-xl);animation:modalIn .35s var(--ease-bounce);
  border:1px solid var(--border);
}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(16px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-card h3{margin:0 0 12px;color:var(--navy);font-size:18px;font-weight:900;}
[data-theme="dark"] .modal-card h3{color:var(--gold-2);}
.modal-card textarea{
  width:100%;min-height:120px;padding:12px;border-radius:12px;
  border:1.5px solid var(--border-2);background:var(--surface-2);
  color:var(--text);font-family:inherit;font-size:14px;resize:vertical;outline:none;
}
.modal-card textarea:focus{border-color:var(--gold);}

/* ============ ACHIEVEMENTS ============ */
.ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.ach-badge{
  background:var(--surface);border-radius:var(--radius-xs);padding:12px 8px;
  box-shadow:var(--shadow-sm);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  text-align:center;transition:all .3s var(--ease);
  animation:cardIn .4s var(--ease) both;animation-delay:calc(var(--i,0) * 30ms);
}
.ach-badge:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.ach-badge.locked{opacity:.42;filter:grayscale(.8);}
.ach-badge .ab-icon{font-size:28px;}
.ach-badge .ab-name{font-size:10.5px;font-weight:800;color:var(--navy);line-height:1.2;}
[data-theme="dark"] .ach-badge .ab-name{color:var(--gold-2);}
.ach-badge .ab-desc{font-size:9.5px;color:var(--muted);line-height:1.2;}

/* ============ DAILY CHALLENGE ============ */
.challenge-card{
  background:linear-gradient(135deg,var(--purple),var(--pink));
  border-radius:var(--radius);padding:18px;color:#fff;
  box-shadow:0 12px 32px rgba(139,92,246,.32);
  margin-bottom:16px;position:relative;overflow:hidden;
  animation:slideUp .55s var(--ease) .05s both;
}
.challenge-card::before{
  content:"";position:absolute;top:-50%;right:-20%;width:220px;height:220px;
  background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);
  animation:floatGlow 8s ease-in-out infinite;
}
.challenge-card .cc-label{
  font-size:10.5px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;opacity:.85;margin-bottom:6px;
}
.challenge-card .cc-title{font-size:19px;font-weight:900;letter-spacing:-.02em;line-height:1.25;}
.challenge-card .cc-sub{font-size:12.5px;opacity:.85;margin-top:4px;}
.challenge-card .cc-btn{
  margin-top:14px;background:rgba(255,255,255,.2);color:#fff;
  border:1.5px solid rgba(255,255,255,.3);border-radius:12px;
  padding:10px 18px;font-weight:800;font-size:13.5px;
  cursor:pointer;font-family:inherit;backdrop-filter:blur(8px);
  transition:all .22s var(--ease);position:relative;z-index:1;
}
.challenge-card .cc-btn:hover{background:rgba(255,255,255,.32);transform:translateY(-2px);}

/* ============ TIMER ============ */
.timer-ring{position:relative;width:120px;height:120px;margin:0 auto 14px;}
.timer-ring svg{transform:rotate(-90deg);}
.timer-ring .tr-bg{fill:none;stroke:var(--surface-3);stroke-width:8;}
.timer-ring .tr-fg{fill:none;stroke:url(#timerGrad);stroke-width:8;stroke-linecap:round;
  stroke-dasharray:326;transition:stroke-dashoffset 1s linear;}
.timer-ring .tr-label{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:var(--navy);font-family:var(--ff-mono);
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;
}
[data-theme="dark"] .timer-ring .tr-label{color:var(--gold-2);}

/* ============ VOCAB NOTE ============ */
.vocab-note{
  background:linear-gradient(135deg,rgba(59,130,246,.06),rgba(59,130,246,.02));
  border-left:4px solid var(--blue);padding:10px 12px;border-radius:8px;
  font-size:13px;color:var(--text-2);margin-top:8px;line-height:1.5;
  font-style:italic;white-space:pre-wrap;word-break:break-word;
}
.vocab-note::before{content:"📝 ";font-style:normal;}

/* ============ TOAST ============ */
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px);
  transform:translateX(-50%) translateY(20px);
  background:rgba(15,23,42,.92);color:#fff;
  padding:12px 20px;border-radius:14px;font-weight:700;font-size:13.5px;
  box-shadow:var(--shadow-lg);z-index:300;
  opacity:0;transition:all .35s var(--ease-bounce);
  backdrop-filter:blur(10px);max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* utility */
.hidden{display:none!important;}
.center-msg{text-align:center;color:var(--muted);padding:40px 20px;}
.small-note{font-size:12px;color:var(--muted);margin-top:8px;text-align:center;}
.pill{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--surface-3);border-radius:100px;
  padding:3px 10px;font-size:11px;font-weight:800;color:var(--text-2);
}
.pill.green{background:var(--green-bg);color:var(--green);}
.pill.blue{background:var(--blue-bg);color:var(--blue);}
.pill.gold{background:rgba(201,162,39,.14);color:var(--gold-3);}
.pill.red{background:var(--red-bg);color:var(--red);}
.pill.purple{background:var(--purple-bg);color:var(--purple);}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;}}
</style>
</head>

<script>

window.__DATA__ = {"1":{"1":{"title":"GETTING STARTED","words":[{"word":"diary","ipa":"/ˈdaɪəri/","pos":"n","meaning":"nhật ký"},{"word":"volunteer","ipa":"/ˌvɒlənˈtɪə(r)/","pos":"v/ n","meaning":"tình nguyện, tình nguyện viên"},{"word":"voluntary","ipa":"/ˈvɒləntri/","pos":"adj","meaning":"tự nguyện"},{"word":"voluntarily","ipa":"/ˌvɒlənˈterəli/","pos":"adv","meaning":"một cách tự nguyện"},{"word":"volunteer to do sth","ipa":"","pos":"chunk","meaning":"tình nguyện làm việc gì"},{"word":"join","ipa":"/dʒɔɪn/","pos":"v","meaning":"tham gia; gia nhập"},{"word":"join the army","ipa":"","pos":"coll","meaning":"nhập ngũ"},{"word":"army","ipa":"/ˈɑːmi/","pos":"n","meaning":"quân đội"},{"word":"surgeon","ipa":"/ˈsɜːdʒən/","pos":"n","meaning":"bác sĩ phẫu thuật"},{"word":"surgery","ipa":"/ˈsɜːdʒəri/","pos":"n","meaning":"phẫu thuật; ngành phẫu thuật"},{"word":"surgical","ipa":"/ˈsɜːdʒɪkl/","pos":"adj","meaning":"thuộc phẫu thuật"},{"word":"resistance","ipa":"/rɪˈzɪstəns/","pos":"n","meaning":"sự kháng cự; sự kháng chiến"},{"word":"resist","ipa":"/rɪˈzɪst/","pos":"v","meaning":"chống lại; kháng cự"},{"word":"resistant","ipa":"/rɪˈzɪstənt/","pos":"adj","meaning":"có khả năng chống lại"},{"word":"resistance war","ipa":"","pos":"coll","meaning":"cuộc kháng chiến"},{"word":"the resistance war against the US","ipa":"","pos":"phr","meaning":"cuộc kháng chiến chống Mỹ"},{"word":"a field hospital","ipa":"","pos":"coll","meaning":"bệnh viện dã chiến"},{"word":"personal","ipa":"/ˈpɜːsənl/","pos":"adj","meaning":"thuộc cá nhân; riêng tư"},{"word":"personally","ipa":"/ˈpɜːsənəli/","pos":"adv","meaning":"về mặt cá nhân; đích thân"},{"word":"account","ipa":"/əˈkaʊnt/","pos":"n","meaning":"lời kể; câu chuyện"},{"word":"experience","ipa":"/ɪkˈspɪəriəns/","pos":"n","meaning":"trải nghiệm; kinh nghiệm"},{"word":"experience","ipa":"/ɪkˈspɪəriəns/","pos":"v","meaning":"trải qua"},{"word":"experienced","ipa":"/ɪkˈspɪəriənst/","pos":"adj","meaning":"có kinh nghiệm"},{"word":"inexperienced","ipa":"/ˌɪnɪkˈspɪəriənst/","pos":"adj","meaning":"thiếu kinh nghiệm"},{"word":"enemy","ipa":"/ˈenəmi/","pos":"n","meaning":"kẻ thù; quân địch"},{"word":"duty","ipa":"/ˈdjuːti/","pos":"n","meaning":"nhiệm vụ; bổn phận"},{"word":"do one’s duty","ipa":"","pos":"coll","meaning":"làm tròn nhiệm vụ"},{"word":"soldier","ipa":"/ˈsəʊldʒə(r)/","pos":"n","meaning":"người lính"},{"word":"save","ipa":"/seɪv/","pos":"v","meaning":"cứu; bảo vệ"},{"word":"save somebody from (doing) something","ipa":"","pos":"chunk","meaning":"ngăn hoặc cứu ai khỏi làm việc gì"},{"word":"hero","ipa":"/ˈhɪərəʊ/","pos":"n","meaning":"anh hùng"},{"word":"heroine","ipa":"/ˈherəʊɪn/","pos":"n","meaning":"nữ anh hùng"},{"word":"heroic","ipa":"/həˈrəʊɪk/","pos":"adj","meaning":"anh hùng; quả cảm"},{"word":"heroically","ipa":"/həˈrəʊɪkli/","pos":"adv","meaning":"một cách anh dũng"},{"word":"devote","ipa":"/dɪˈvəʊt/","pos":"v","meaning":"dành; cống hiến"},{"word":"devotion","ipa":"/dɪˈvəʊʃn/","pos":"n","meaning":"sự tận tâm; sự cống hiến"},{"word":"devote sth. to sth.","ipa":"","pos":"","meaning":"dành hoặc cống hiến điều gì cho điều gì"},{"word":"devote oneself to sth.","ipa":"","pos":"","meaning":"cống hiến hết mình cho điều gì"},{"word":"would like to do something","ipa":"","pos":"","meaning":"muốn làm việc gì"},{"word":"I’d like to read it myself.","ipa":"","pos":"phr","meaning":"tôi muốn tự mình đọc nó"},{"word":"death","ipa":"/deθ/","pos":"n","meaning":"cái chết"},{"word":"die","ipa":"/daɪ/","pos":"v","meaning":"chết"},{"word":"dead","ipa":"/ded/","pos":"adj","meaning":"đã chết"},{"word":"youth","ipa":"/juːθ/","pos":"n","meaning":"tuổi trẻ; thanh niên"},{"word":"young","ipa":"/jʌŋ/","pos":"adj","meaning":"trẻ"},{"word":"youngster","ipa":"/ˈjʌŋstə(r)/","pos":"n","meaning":"người trẻ; thiếu niên"}],"mcq":[{"num":1,"question":"After finishing secondary school, she ______ to work as a nurse in a field hospital.","options":["volunteer","volunteered","voluntary","voluntarily"],"answerIndex":1,"explanation":"\"volunteer to do sth\" (tình nguyện làm việc gì) là cấu trúc cần dùng, và chủ ngữ \"she\" ở thì quá khứ nên phải chia \"volunteered\". \"volunteer\" sai hòa hợp chủ ngữ và sai thì; \"voluntary\" là tính từ; \"voluntarily\" là trạng từ — cả hai không thể làm động từ chính."},{"num":2,"question":"Blood donation is completely ______; nobody is ever forced to give blood.","options":["voluntary","voluntarily","volunteer","volunteered"],"answerIndex":0,"explanation":"Sau động từ \"is\" cần tính từ làm bổ ngữ cho chủ ngữ: \"voluntary\" (tự nguyện), khớp với \"nobody is ever forced\". \"voluntarily\" là trạng từ; \"volunteer\" là động từ/danh từ; \"volunteered\" là động từ chia quá khứ — đều sai từ loại."},{"num":3,"question":"She ______ gave up her summer holiday to teach children in a remote village.","options":["voluntary","volunteer","voluntarily","volunteered"],"answerIndex":2,"explanation":"Chỗ trống bổ nghĩa cho động từ \"gave up\" nên cần trạng từ: \"voluntarily\" (một cách tự nguyện). \"voluntary\" là tính từ; \"volunteer/volunteered\" là động từ, không thể đứng ngay trước động từ chính \"gave up\"."},{"num":4,"question":"The ______ who operated on my grandfather has more than twenty years of experience.","options":["soldier","enemy","youngster","surgeon"],"answerIndex":3,"explanation":"Người thực hiện ca mổ (\"operated on\") là \"surgeon\" (bác sĩ phẫu thuật). \"soldier\" (người lính), \"enemy\" (kẻ thù) và \"youngster\" (người trẻ tuổi) đều không phù hợp với hành động phẫu thuật."},{"num":5,"question":"My uncle is going to have heart ______ next Monday.","options":["surgeon","surgical","surgery","surgically"],"answerIndex":2,"explanation":"\"have heart surgery\" (phẫu thuật tim) cần danh từ chỉ ca phẫu thuật. \"surgeon\" là người phẫu thuật nên sai nghĩa; \"surgical\" là tính từ; \"surgically\" là trạng từ."},{"num":6,"question":"All ______ instruments must be sterilised before an operation.","options":["surgical","surgery","surgeon","surgically"],"answerIndex":0,"explanation":"Trước danh từ \"instruments\" cần tính từ: \"surgical instruments\" (dụng cụ phẫu thuật). \"surgery/surgeon\" là danh từ; \"surgically\" là trạng từ."},{"num":7,"question":"Thousands of young people joined the ______ against the foreign invaders.","options":["devotion","resistance","account","youth"],"answerIndex":1,"explanation":"\"the resistance against sb\" (cuộc kháng chiến chống lại ai) là cách nói chuẩn. \"devotion\" (sự tận tâm), \"account\" (lời kể) và \"youth\" (tuổi trẻ) không kết hợp được với \"against the foreign invaders\"."},{"num":8,"question":"These new rice varieties are highly ______ to pests and diseases.","options":["personal","inexperienced","heroic","resistant"],"answerIndex":3,"explanation":"\"be resistant to sth\" (có khả năng chống lại điều gì) là cấu trúc cố định, đúng nghĩa với \"pests and diseases\". \"personal\" (riêng tư), \"inexperienced\" (thiếu kinh nghiệm) và \"heroic\" (quả cảm) đều không đi với \"to\" theo nghĩa này và vô nghĩa khi nói về giống lúa."},{"num":9,"question":"Although he is only thirty, he is a very ______ doctor who has treated thousands of patients.","options":["inexperienced","experience","experienced","experiencing"],"answerIndex":2,"explanation":"Trước danh từ \"doctor\" cần tính từ, và chi tiết \"has treated thousands of patients\" chốt nghĩa \"experienced\" (có kinh nghiệm). \"inexperienced\" trái nghĩa với ngữ cảnh; \"experience\" là danh từ; \"experiencing\" là V-ing, không dùng làm tính từ ở đây."},{"num":10,"question":"The young soldier was so ______ that he did not even know how to load his rifle.","options":["experienced","inexperienced","experience","experiencing"],"answerIndex":1,"explanation":"Chi tiết \"did not even know how to load his rifle\" chốt nghĩa \"inexperienced\" (thiếu kinh nghiệm). \"experienced\" trái nghĩa; \"experience\" (danh từ) và \"experiencing\" (V-ing) sai từ loại sau \"was so\"."},{"num":11,"question":"In his personal ______ of the war, he described daily life in a field hospital.","options":["account","duty","army","death"],"answerIndex":0,"explanation":"\"a personal account of sth\" (lời kể cá nhân về điều gì) là cụm cố định, khớp với \"he described\". \"duty\" (nhiệm vụ), \"army\" (quân đội) và \"death\" (cái chết) không kết hợp với \"of the war\" theo nghĩa kể lại."},{"num":12,"question":"As a doctor, he believed it was his ______ to treat every wounded soldier, even an enemy one.","options":["diary","youth","account","duty"],"answerIndex":3,"explanation":"\"it is one's duty to do sth\" (nhiệm vụ, bổn phận của ai là làm gì) đúng cả cấu trúc lẫn nghĩa. \"diary\" (nhật ký), \"youth\" (tuổi trẻ) và \"account\" (lời kể) không đi với \"to treat\" theo nghĩa bổn phận."},{"num":13,"question":"The nurse was praised for her ______ efforts to save the wounded soldiers.","options":["hero","heroine","heroically","heroic"],"answerIndex":3,"explanation":"Trước danh từ \"efforts\" cần tính từ: \"heroic efforts\" (những nỗ lực quả cảm). \"hero/heroine\" là danh từ; \"heroically\" là trạng từ."},{"num":14,"question":"She ______ carried three children out of the burning house.","options":["heroic","hero","heroically","heroine"],"answerIndex":2,"explanation":"Chỗ trống bổ nghĩa cho động từ \"carried\" nên cần trạng từ: \"heroically\" (một cách anh dũng). \"heroic\" là tính từ; \"hero/heroine\" là danh từ."},{"num":15,"question":"Dr Dang Thuy Tram ______ her short life to caring for wounded soldiers.","options":["devoted","devotion","devote","devoting"],"answerIndex":0,"explanation":"Câu cần động từ chính ở thì quá khứ với cấu trúc \"devote sth to sth\": \"devoted her short life to caring for…\". \"devotion\" là danh từ; \"devote\" sai thì và sai hòa hợp chủ ngữ; \"devoting\" không thể đứng một mình làm động từ chính."},{"num":16,"question":"Her ______ to her patients impressed everyone who worked with her.","options":["devote","devotion","devoted","devoting"],"answerIndex":1,"explanation":"Sau tính từ sở hữu \"Her\" và ở vị trí chủ ngữ cần danh từ: \"devotion to sb\" (sự tận tâm với ai). \"devote\" là động từ nguyên thể; \"devoted\" là động từ chia quá khứ/phân từ; \"devoting\" là V-ing — đều không làm chủ ngữ ở đây."}],"gapfill":[{"num":1,"sentence":"During the war she kept a ______ in which she wrote about her daily life at the front.","answer":"diary"},{"num":2,"sentence":"At the age of eighteen, he decided to join the ______ and fight for his country.","answer":"army"},{"num":3,"sentence":"The wounded were carried to a ______ that had been set up in the forest.","answer":"field hospital"},{"num":4,"sentence":"The general ______ visited every wounded man in the ward.","answer":"personally"},{"num":5,"sentence":"Thousands of ______ in green uniforms marched past the presidential palace.","answer":"soldiers"},{"num":6,"sentence":"The young nurse helped ______ dozens of lives during the bombing.","answer":"save"},{"num":7,"sentence":"He ______ in 1975, only two months before the war ended.","answer":"died"},{"num":8,"sentence":"Her grandfather has been ______ for more than twenty years.","answer":"dead"},{"num":9,"sentence":"The club runs free English classes for local ______ aged twelve to sixteen.","answer":"youngsters"},{"num":10,"sentence":"Their village was occupied by ______ troops for almost three years.","answer":"enemy"}]},"2":{"title":"LANGUAGE","words":[{"word":"achievement","ipa":"/əˈtʃiːvmənt/","pos":"n","meaning":"thành tựu, thành tích"},{"word":"achieve","ipa":"/əˈtʃiːv/","pos":"v","meaning":"đạt được"},{"word":"achievable","ipa":"/əˈtʃiːvəbl/","pos":"adj","meaning":"có thể đạt được"},{"word":"admire","ipa":"/ədˈmaɪə(r)/","pos":"v","meaning":"ngưỡng mộ"},{"word":"admiration","ipa":"/ˌædməˈreɪʃn/","pos":"n","meaning":"sự ngưỡng mộ"},{"word":"admirable","ipa":"/ˈædmərəbl/","pos":"adj","meaning":"đáng ngưỡng mộ"},{"word":"admirably","ipa":"/ˈædmərəbli/","pos":"adv","meaning":"một cách đáng ngưỡng mộ"},{"word":"attend","ipa":"/əˈtend/","pos":"v","meaning":"theo học, tham dự"},{"word":"attendanc coll","meaning":"nhóm lửa"},{"word":"fireplace","ipa":"/ˈfaɪəpleɪs/","pos":"n","meaning":"lò sưởi"},{"word":"apply","ipa":"/əˈplaɪ/","pos":"v","meaning":"nộp đơn, đăng ký"},{"word":"application","ipa":"/ˌæplɪˈkeɪʃn/","pos":"n","meaning":"đơn đăng ký, sự nộp đơn"},{"word":"applicant","ipa":"/ˈæplɪkənt/","pos":"n","meaning":"người nộp đơn"},{"word":"apply to college","ipa":"","pos":"coll","meaning":"nộp đơn vào đại học"}],"mcq":[{"num":1,"question":"Winning a gold medal at the Olympic Games was the greatest ______ of her career.","options":["achieve","achievement","achievable","achieved"],"answerIndex":1,"explanation":"Sau \"the greatest\" cần danh từ: \"achievement\" (thành tựu). \"achieve/achieved\" là động từ; \"achievable\" là tính từ."},{"num":2,"question":"If you divide the work into small steps, your goal will become much more ______.","options":["achievement","achieve","achievable","achieved"],"answerIndex":2,"explanation":"Sau \"become much more\" cần tính từ: \"achievable\" (có thể đạt được). \"achievement\" là danh từ; \"achieve/achieved\" là động từ."},{"num":3,"question":"The whole village looked at the young surgeon with great ______.","options":["admire","admirable","admirably","admiration"],"answerIndex":3,"explanation":"Sau \"with great\" cần danh từ: \"admiration\" (sự ngưỡng mộ). \"admire\" là động từ; \"admirable\" là tính từ; \"admirably\" là trạng từ."},{"num":4,"question":"Her decision to teach in a mountainous area for ten years is truly ______.","options":["admirable","admiration","admire","admirably"],"answerIndex":0,"explanation":"Sau \"is truly\" cần tính từ làm bổ ngữ cho chủ ngữ \"decision\": \"admirable\" (đáng ngưỡng mộ). \"admirably\" là trạng từ nên không bổ nghĩa cho danh từ chủ ngữ; \"admiration\" là danh từ; \"admire\" là động từ."},{"num":5,"question":"The teacher takes ______ at the beginning of every lesson.","options":["attend","attended","attendance","attending"],"answerIndex":2,"explanation":"\"take attendance\" (điểm danh) là cụm cố định, cần danh từ. Ba phương án còn lại đều là dạng động từ nên không thể làm tân ngữ của \"takes\"."},{"num":6,"question":"He spent his ______ in a small fishing village near Da Nang.","options":["child","childhood","childish","childlike"],"answerIndex":1,"explanation":"\"spend one's childhood\" (trải qua thời thơ ấu) là cụm cố định, cần danh từ chỉ giai đoạn. \"child\" chỉ một đứa trẻ nên không đi với \"spend\"; \"childish/childlike\" là tính từ."},{"num":7,"question":"Stop shouting like that — it is such ______ behaviour for a boy of eighteen.","options":["childish","childlike","childhood","child"],"answerIndex":0,"explanation":"\"childish\" mang nghĩa chê trách \"trẻ con, thiếu chín chắn\", khớp với lời nhắc nhở \"Stop shouting…\". \"childlike\" mang nghĩa tích cực (hồn nhiên như trẻ thơ) nên không dùng để chê; \"childhood/child\" là danh từ, không bổ nghĩa cho \"behaviour\"."},{"num":8,"question":"He never found a partner and remained ______ all his life.","options":["married","marriage","marry","unmarried"],"answerIndex":3,"explanation":"\"never found a partner\" chốt nghĩa \"unmarried\" (chưa kết hôn). \"married\" trái nghĩa với ngữ cảnh; \"marriage\" là danh từ; \"marry\" là động từ nguyên thể — cả hai không đứng được sau \"remained\" ở đây."},{"num":9,"question":"Their ______ lasted for more than fifty happy years.","options":["marriage","marry","married","unmarried"],"answerIndex":0,"explanation":"Chủ ngữ của \"lasted\" cần danh từ: \"marriage\" (cuộc hôn nhân). \"marry\" là động từ; \"married/unmarried\" là tính từ."},{"num":10,"question":"She works as a ______ for a large publishing house in Ha Noi.","options":["translation","translator","translate","translated"],"answerIndex":1,"explanation":"\"work as a + danh từ chỉ nghề nghiệp\": \"translator\" (biên dịch viên). \"translation\" là bản dịch (sự vật) nên không phải nghề của một người; \"translate/translated\" là động từ."},{"num":11,"question":"His most famous novel has been ______ into more than thirty languages.","options":["applied","attended","impressed","translated"],"answerIndex":3,"explanation":"\"be translated into + ngôn ngữ\" (được dịch sang) là cụm cố định. \"applied\", \"attended\" và \"impressed\" không đi với \"into more than thirty languages\"."},{"num":12,"question":"His first ______ of the new teacher was very positive.","options":["impressive","impress","impression","impressively"],"answerIndex":2,"explanation":"Sau \"His first\" và ở vị trí chủ ngữ cần danh từ: \"first impression of sb\" (ấn tượng đầu tiên về ai). \"impressive\" là tính từ; \"impress\" là động từ; \"impressively\" là trạng từ."},{"num":13,"question":"The cast was excellent, but the story itself was rather ______.","options":["impressive","impression","impressively","unimpressive"],"answerIndex":3,"explanation":"Từ nối \"but\" báo hiệu ý trái ngược với \"excellent\" nên cần \"unimpressive\" (không ấn tượng). \"impressive\" cùng chiều với \"excellent\" nên mâu thuẫn với \"but\"; \"impression\" là danh từ; \"impressively\" là trạng từ."},{"num":14,"question":"Only one ______ out of fifty was offered the scholarship.","options":["applicant","application","apply","applied"],"answerIndex":0,"explanation":"Người được trao học bổng phải là danh từ chỉ người: \"applicant\" (người nộp đơn). \"application\" là lá đơn nên không thể \"was offered the scholarship\"; \"apply/applied\" là động từ."},{"num":15,"question":"You must send your ______ to the university before 30 June.","options":["applicant","apply","application","applied"],"answerIndex":2,"explanation":"\"send your application\" (gửi đơn đăng ký) cần danh từ chỉ lá đơn. \"applicant\" chỉ người nên sai nghĩa; \"apply/applied\" là động từ."},{"num":16,"question":"The film is ______ on the diary of a young doctor.","options":["impressed","based","translated","admired"],"answerIndex":1,"explanation":"\"be based on sth\" (được dựa trên) là cụm cố định. \"be impressed on\", \"be translated on\", \"be admired on\" đều sai giới từ và sai nghĩa."}],"gapfill":[{"num":1,"sentence":"Thomas Edison invented the ______, the first machine that could record and play back sound.","answer":"phonograph"},{"num":2,"sentence":"An ______ wind blew across the lake and froze our hands within minutes.","answer":"icy"},{"num":3,"sentence":"He ______ a fire to keep the small room warm.","answer":"lit"},{"num":4,"sentence":"The family sat around the ______, listening to Grandma's stories.","answer":"fireplace"},{"num":5,"sentence":"The English ______ of this Vietnamese novel came out last year.","answer":"translation"},{"num":6,"sentence":"Students who do not ______ classes regularly may not take the final exam.","answer":"attend"},{"num":7,"sentence":"The judges were deeply ______ by the young pianist's performance.","answer":"impressed"},{"num":8,"sentence":"Her parents ______ in 1975 and later had four children.","answer":"married"},{"num":9,"sentence":"He had a happy ______ in the countryside, playing in the rice fields with his friends.","answer":"childhood"},{"num":10,"sentence":"By the age of thirty, she had ______ everything she had dreamed of as a student.","answer":"achieved"}]},"3":{"title":"READING","words":[{"word":"biological parent","ipa":"","pos":"coll","meaning":"cha hoặc mẹ ruột"},{"word":"biology","ipa":"/baɪˈɒlədʒi/","pos":"n","meaning":"sinh học"},{"word":"biological","ipa":"/ˌbaɪəˈlɒdʒɪkl/","pos":"adj","meaning":"thuộc sinh học; ruột thịt"},{"word":"biologically","ipa":"/ˌbaɪəˈlɒdʒɪkli/","pos":"adv","meaning":"về mặt sinh học"},{"word":"give sb. up for adoption","ipa":"","pos":"chunk","meaning":"cho ai làm con nuôi"},{"word":"adopt","ipa":"/əˈdɒpt/","pos":"v","meaning":"nhận làm con nuôi; áp dụng"},{"word":"adopted","ipa":"/əˈdɒptɪd/","pos":"adj","meaning":"được nhận làm con nuôi"},{"word":"adoptive","ipa":"/əˈdɒptɪv/","pos":"adj","meaning":"nuôi; nhận nuôi"},{"word":"adoptive parent","ipa":"","pos":"coll","meaning":"cha hoặc mẹ nuôi"},{"word":"adoption","ipa":"/əˈdɒpʃn/","pos":"n","meanin
