reef","seabed","nursery","debris"],"answerIndex":0,"explanation":"Điểm đến để lặn ngắm là \"the coral reef\" (rạn san hô). \"seabed\" (đáy biển), \"nursery\" (khu nuôi dưỡng sinh vật non) và \"debris\" (mảnh vụn, rác) không phải cảnh quan khách du lịch tới xem."},{"num":2,"question":"Sea turtles have a hard ______ shell that keeps them safe from many enemies.","options":["protect","protection","protectively","protective"],"answerIndex":3,"explanation":"Trước danh từ \"shell\" cần tính từ: \"a protective shell\" (lớp mai bảo vệ). \"protect\" là động từ; \"protection\" là danh từ; \"protectively\" là trạng từ."},{"num":3,"question":"Fifty ______ helped to clean the beach last Sunday morning.","options":["voluntary","volunteering","volunteers","volunteered"],"answerIndex":2,"explanation":"Sau số đếm \"fifty\" cần danh từ đếm được chỉ người: \"volunteers\" (tình nguyện viên). \"voluntary\" là tính từ; \"volunteering/volunteered\" là dạng động từ."},{"num":4,"question":"Experienced ______ removed the old fishing nets from the reef.","options":["nurseries","divers","authorities","threats"],"answerIndex":1,"explanation":"Người xuống nước gỡ lưới là \"divers\" (thợ lặn). \"nurseries\", \"authorities\" và \"threats\" không lặn xuống rạn san hô để gỡ lưới."},{"num":5,"question":"The campaign aims to ______ awareness of marine pollution among young people.","options":["bury","remove","restore","raise"],"answerIndex":3,"explanation":"\"raise awareness\" (nâng cao nhận thức) là collocation cố định. \"bury\" (chôn), \"remove\" (loại bỏ) và \"restore\" (khôi phục) không đi với \"awareness\"."},{"num":6,"question":"Very few people are ______ of how fast this reef is dying.","options":["aware","vulnerable","marine","annual"],"answerIndex":0,"explanation":"\"be aware of sth\" (nhận thức được điều gì) là cấu trúc cố định. \"vulnerable\" đi với \"to\"; \"marine\" và \"annual\" không đi với \"of\" theo nghĩa này."},{"num":7,"question":"The project lost its ______ last year and had to stop completely.","options":["fund","funding","funded","funds"],"answerIndex":1,"explanation":"Sau \"its\" cần danh từ không đếm được chỉ nguồn tài trợ: \"funding\". \"fund/funds\" chỉ các quỹ cụ thể và thường không dùng với \"lost its\" theo cách này; \"funded\" là phân từ."},{"num":8,"question":"Young corals are extremely ______ to even small changes in temperature.","options":["vulnerability","vulnerably","vulnerable","aware"],"answerIndex":2,"explanation":"\"be vulnerable to sth\" (dễ bị tổn thương trước điều gì) là cấu trúc cố định, cần tính từ. \"vulnerability\" là danh từ; \"vulnerably\" là trạng từ; \"aware\" đi với \"of\" chứ không đi với \"to\"."},{"num":9,"question":"This bay is one of the most important ______ for the fish of this region.","options":["spawning grounds","coral reefs","authorities","measures"],"answerIndex":0,"explanation":"Nơi cá đến đẻ trứng là \"spawning grounds\" (bãi đẻ). \"coral reefs\" là rạn san hô nói chung; \"authorities\" (cơ quan chức năng) và \"measures\" (biện pháp) sai nghĩa."},{"num":10,"question":"Rising sea temperatures have ______ the whole ecosystem of the bay.","options":["threat","threatened","threatening","threaten"],"answerIndex":1,"explanation":"Thì hiện tại hoàn thành \"have + V3\" cần \"threatened\" (đã đe dọa). \"threat\" là danh từ; \"threatening\" là V-ing/tính từ; \"threaten\" sai dạng sau \"have\"."},{"num":11,"question":"The number of fish in this area has fallen ______ over the last twenty years.","options":["dramatic","drama","dramatics","dramatically"],"answerIndex":3,"explanation":"Chỗ trống bổ nghĩa cho động từ \"has fallen\" nên cần trạng từ: \"fallen dramatically\" (giảm mạnh). \"dramatic\" là tính từ; \"drama/dramatics\" là danh từ."},{"num":12,"question":"The centre releases about two thousand young turtles ______.","options":["dramatically","significantly","annually","precisely"],"answerIndex":2,"explanation":"\"annually\" (hằng năm) chỉ tần suất thả rùa mỗi năm. \"dramatically\" (một cách mạnh mẽ), \"significantly\" (một cách đáng kể) và \"precisely\" (một cách chính xác) không diễn tả tần suất."},{"num":13,"question":"Local ______ have banned all fishing in this part of the bay.","options":["nurseries","habitats","authorities","measures"],"answerIndex":2,"explanation":"Cơ quan có quyền ban hành lệnh cấm là \"authorities\" (chính quyền, cơ quan chức năng). \"nurseries\", \"habitats\" và \"measures\" không ban hành lệnh cấm."},{"num":14,"question":"The government must ______ measures to protect the reef before it is too late.","options":["make","take","do","raise"],"answerIndex":1,"explanation":"\"take measures\" (thực hiện các biện pháp) là collocation cố định. \"make/do/raise measures\" đều sai collocation."},{"num":15,"question":"Volunteer divers are working hard to ______ the damaged parts of the reef.","options":["restore","restoration","restored","restoring"],"answerIndex":0,"explanation":"Sau \"to\" cần động từ nguyên thể: \"restore\" (khôi phục). \"restoration\" là danh từ; \"restored/restoring\" sai dạng sau \"to\"."},{"num":16,"question":"This national park is famous for its extremely rich ______.","options":["removal","entitlement","precision","biodiversity"],"answerIndex":3,"explanation":"\"rich biodiversity\" (đa dạng sinh học phong phú) là collocation chuẩn khi nói về vườn quốc gia. \"removal\" (sự loại bỏ), \"entitlement\" (quyền được hưởng) và \"precision\" (độ chính xác) sai nghĩa."}],"gapfill":[{"num":1,"sentence":"Plastic ______ now covers large areas of the ocean floor.","answer":"debris"},{"num":2,"sentence":"The divers found an old anchor lying on the ______.","answer":"seabed"},{"num":3,"sentence":"The turtle's eggs are ______ in the warm sand above the tide line.","answer":"buried"},{"num":4,"sentence":"A coral reef is a complex ______ containing thousands of species.","answer":"ecosystem"},{"num":5,"sentence":"This forest is the natural ______ of several rare monkeys.","answer":"habitat"},{"num":6,"sentence":"Whales, dolphins and seals are all ______ mammals.","answer":"marine"},{"num":7,"sentence":"Scientists ______ the water temperature of the bay every single day.","answer":"monitor"},{"num":8,"sentence":"The ______ of the old fishing nets took the team several weeks.","answer":"removal"},{"num":9,"sentence":"The ______ of the mangrove forest cost almost two million dollars.","answer":"restoration"},{"num":10,"sentence":"There has been a ______ increase in the number of turtles since 2015.","answer":"significant"}]},"4":{"title":"SPEAKING","words":[{"word":"Photography","ipa":"/fəˈtɒɡrəfi/","pos":"n","meaning":"nhiếp ảnh"},{"word":"Photograph","ipa":"/ˈfəʊtəɡrɑːf/","pos":"n","meaning":"bức ảnh"},{"word":"Photograph","ipa":"/ˈfəʊtəɡrɑːf/","pos":"v","meaning":"chụp ảnh"},{"word":"Photographer","ipa":"/fəˈtɒɡrəfə(r)/","pos":"n","meaning":"nhiếp ảnh gia"},{"word":"Photographic","ipa":"/ˌfəʊtəˈɡræfɪk/","pos":"adj","meaning":"thuộc nhiếp ảnh"},{"word":"Documentary","ipa":"/ˌdɒkjuˈmentri/","pos":"n","meaning":"phim tài liệu"},{"word":"Endangered","ipa":"/ɪnˈdeɪndʒəd/","pos":"adj","meaning":"có nguy cơ tuyệt chủng"},{"word":"Endanger","ipa":"/ɪnˈdeɪndʒə(r)/","pos":"v","meaning":"gây nguy hiểm"},{"word":"Debate","ipa":"/dɪˈbeɪt/","pos":"n, v","meaning":"cuộc tranh luận; tranh luận"},{"word":"Debatable","ipa":"/dɪˈbeɪtəbl/","pos":"adj","meaning":"còn gây tranh cãi"},{"word":"Seek","ipa":"/siːk/","pos":"v","meaning":"tìm kiếm"},{"word":"Sought","ipa":"/sɔːt/","pos":"v (V2, V3)","meaning":"đã tìm kiếm"},{"word":"Suitable","ipa":"/ˈsuːtəbl/","pos":"adj","meaning":"phù hợp"},{"word":"Suit","ipa":"/suːt/","pos":"v","meaning":"phù hợp"},{"word":"Suitability","ipa":"/ˌsuːtəˈbɪləti/","pos":"n","meaning":"sự phù hợp"},{"word":"Suitably","ipa":"/ˈsuːtəbli/","pos":"adv","meaning":"một cách phù hợp"}],"mcq":[{"num":1,"question":"Wildlife ______ requires a great deal of patience and good equipment.","options":["photograph","photographer","photography","photographic"],"answerIndex":2,"explanation":"Tên một lĩnh vực hoạt động cần danh từ không đếm được: \"photography\" (nhiếp ảnh). \"photograph\" là bức ảnh; \"photographer\" chỉ người; \"photographic\" là tính từ."},{"num":2,"question":"The ______ waited six hours in the forest to get this single picture.","options":["photography","photographer","photograph","photographic"],"answerIndex":1,"explanation":"Chủ ngữ chỉ người chờ đợi để chụp ảnh là \"photographer\" (nhiếp ảnh gia). \"photography\" là lĩnh vực; \"photograph\" là bức ảnh; \"photographic\" là tính từ."},{"num":3,"question":"It is extremely difficult to ______ wild animals at night.","options":["photography","photographer","photographic","photograph"],"answerIndex":3,"explanation":"Sau \"to\" cần động từ nguyên thể: \"photograph sth\" (chụp ảnh cái gì). \"photography/photographer\" là danh từ; \"photographic\" là tính từ."},{"num":4,"question":"The magazine is holding a ______ competition for secondary school students.","options":["photographic","photograph","photography","photographer"],"answerIndex":0,"explanation":"Trước danh từ \"competition\" cần tính từ: \"a photographic competition\" (cuộc thi ảnh). Ba phương án còn lại đều là danh từ."},{"num":5,"question":"Last night we watched a/an ______ about elephants in southern Africa.","options":["debate","documentary","photograph","enclosure"],"answerIndex":1,"explanation":"Phim về đời sống động vật là \"documentary\" (phim tài liệu). \"debate\" (cuộc tranh luận), \"photograph\" (bức ảnh) và \"enclosure\" (chuồng nuôi) không phải thứ được xem trên truyền hình theo nghĩa này."},{"num":6,"question":"Pangolins are among the most ______ animals in Asia today.","options":["endanger","endangering","endangered","endangerment"],"answerIndex":2,"explanation":"Trước danh từ \"animals\" cần tính từ: \"endangered animals\" (động vật có nguy cơ tuyệt chủng). \"endanger\" là động từ; \"endangering\" là V-ing; \"endangerment\" là danh từ."},{"num":7,"question":"Illegal hunting continues to ______ these rare forest birds.","options":["endanger","endangered","endangering","endangerment"],"answerIndex":0,"explanation":"Sau \"continues to\" cần động từ nguyên thể: \"endanger sth\" (gây nguy hiểm cho cái gì). \"endangered\" là tính từ; \"endangering\" là V-ing; \"endangerment\" là danh từ."},{"num":8,"question":"There is a lively ______ about whether zoos really help conservation.","options":["documentary","photograph","suitability","debate"],"answerIndex":3,"explanation":"\"a lively debate about sth\" (cuộc tranh luận sôi nổi về điều gì) là cụm chuẩn. \"documentary\" là phim; \"photograph\" là bức ảnh; \"suitability\" là sự phù hợp."},{"num":9,"question":"Whether zoos really help wild species is still ______.","options":["debate","debated","debating","debatable"],"answerIndex":3,"explanation":"Sau \"is still\" cần tính từ: \"debatable\" (còn gây tranh cãi). \"debate\" là danh từ/động từ; \"debated/debating\" là dạng động từ."},{"num":10,"question":"During the dry season many animals ______ shelter in caves and river valleys.","options":["sought","seeking","seek","seeks"],"answerIndex":2,"explanation":"Câu ở thì hiện tại đơn với chủ ngữ số nhiều \"many animals\" nên cần \"seek\" (tìm kiếm). \"sought\" là quá khứ; \"seeking\" là V-ing; \"seeks\" sai hòa hợp chủ ngữ."},{"num":11,"question":"Scientists have long ______ an explanation for this strange behaviour.","options":["sought","seek","seeking","seeks"],"answerIndex":0,"explanation":"Thì hiện tại hoàn thành \"have + V3\" cần \"sought\" (đã tìm kiếm). \"seek/seeks\" là hiện tại; \"seeking\" là V-ing."},{"num":12,"question":"This forest is no longer ______ for gibbons because the trees are too young.","options":["suit","suitable","suitability","suitably"],"answerIndex":1,"explanation":"Sau \"is no longer\" cần tính từ: \"be suitable for sb/sth\" (phù hợp với ai/cái gì). \"suit\" là động từ; \"suitability\" là danh từ; \"suitably\" là trạng từ."},{"num":13,"question":"Experts checked the ______ of the island before releasing the birds there.","options":["suitable","suit","suitably","suitability"],"answerIndex":3,"explanation":"Sau \"the\" và trước \"of\" cần danh từ: \"the suitability of sth\" (sự phù hợp của cái gì). \"suitable\" là tính từ; \"suit\" là động từ; \"suitably\" là trạng từ."}],"gapfill":[{"num":1,"sentence":"She has loved ______ ever since her father gave her an old camera.","answer":"photography"},{"num":2,"sentence":"The ______ spent three nights in a hide waiting for the tiger to appear.","answer":"photographer"},{"num":3,"sentence":"Our class watched a ______ about life in the Amazon rainforest.","answer":"documentary"},{"num":4,"sentence":"Tigers, rhinos and pangolins are all ______ species.","answer":"endangered"},{"num":5,"sentence":"Everyone joined the ______ about building a road through the park.","answer":"debate"},{"num":6,"sentence":"Whether the new plan will really work is still ______.","answer":"debatable"},{"num":7,"sentence":"Rescue teams ______ the missing climbers for three days.","answer":"sought"},{"num":8,"sentence":"The volunteers were ______ dressed for the cold, wet weather.","answer":"suitably"},{"num":9,"sentence":"Scientists studied the ______ of the area before releasing the animals.","answer":"suitability"},{"num":10,"sentence":"The exhibition shows the ______ work of ten young artists.","answer":"photographic"}]},"5":{"title":"LISTENING","words":[{"word":"Degrade","ipa":"/dɪˈɡreɪd/","pos":"v","meaning":"làm suy thoái"},{"word":"Degradation","ipa":"/ˌdeɡrəˈdeɪʃn/","pos":"n","meaning":"sự suy thoái"},{"word":"Clearance","ipa":"/ˈklɪərəns/","pos":"n","meaning":"sự dọn sạch, phát quang"},{"word":"Destroy","ipa":"/dɪˈstrɔɪ/","pos":"v","meaning":"phá hủy"},{"word":"Destruction","ipa":"/dɪˈstrʌkʃn/","pos":"n","meaning":"sự phá hủy"},{"word":"Destructive","ipa":"/dɪˈstrʌktɪv/","pos":"adj","meaning":"có tính hủy diệt"},{"word":"Cut down","ipa":"/ˌkʌt ˈdaʊn/","pos":"phr v","meaning":"chặt hạ; cắt giảm"},{"word":"Reduce","ipa":"/rɪˈdjuːs/","pos":"v","meaning":"giảm"},{"word":"Reduction","ipa":"/rɪˈdʌkʃn/","pos":"n","meaning":"sự giảm"},{"word":"Poach","ipa":"/pəʊtʃ/","pos":"v","meaning":"săn bắt trái phép"},{"word":"Poacher","ipa":"/ˈpəʊtʃə(r)/","pos":"n","meaning":"kẻ săn bắt trái phép"},{"word":"Poaching","ipa":"/ˈpəʊtʃɪŋ/","pos":"n","meaning":"nạn săn bắt trái phép"},{"word":"Desire","ipa":"/dɪˈzaɪə(r)/","pos":"n, v","meaning":"mong muốn; khao khát"},{"word":"Desirable","ipa":"/dɪˈzaɪərəbl/","pos":"adj","meaning":"đáng mong muốn"},{"word":"Particular","ipa":"/pəˈtɪkjələ(r)/","pos":"adj","meaning":"cụ thể; đặc biệt"},{"word":"Particularly","ipa":"/pəˈtɪkjələli/","pos":"adv","meaning":"đặc biệt"},{"word":"Particularity","ipa":"/pəˌtɪkjuˈlærəti/","pos":"n","meaning":"đặc điểm riêng"},{"word":"Breed","ipa":"/briːd/","pos":"v, n","meaning":"sinh sản; giống loài"},{"word":"Release","ipa":"/rɪˈliːs/","pos":"v, n","meaning":"thả; sự thả ra"},{"word":"Facility","ipa":"/fəˈsɪləti/","pos":"n","meaning":"cơ sở, cơ sở vật chất"},{"word":"Attack","ipa":"/əˈtæk/","pos":"n, v","meaning":"cuộc tấn công; tấn công"},{"word":"Attacker","ipa":"/əˈtækə(r)/","pos":"n","meaning":"kẻ tấn công"},{"word":"Decrease","ipa":"/dɪˈkriːs/","pos":"v","meaning":"giảm"},{"word":"Decrease","ipa":"/ˈdiːkriːs/","pos":"n","meaning":"sự giảm"},{"word":"Estimate","ipa":"/ˈestɪmeɪt/","pos":"v, n","meaning":"ước tính; sự ước tính"},{"word":"Estimation","ipa":"/ˌestɪˈmeɪʃn/","pos":"n","meaning":"sự ước tính"}],"mcq":[{"num":1,"question":"Land ______ is now a very serious problem in this dry region.","options":["degradation","degrade","degraded","degrading"],"answerIndex":0,"explanation":"Chủ ngữ của \"is\" cần danh từ: \"land degradation\" (sự suy thoái đất). \"degrade\" là động từ; \"degraded\" là tính từ; \"degrading\" là V-ing."},{"num":2,"question":"Twenty years of intensive farming have badly ______ the soil here.","options":["degradation","degraded","degrade","degrading"],"answerIndex":1,"explanation":"Thì hiện tại hoàn thành \"have + V3\" cần \"degraded\" (đã làm suy thoái). \"degradation\" là danh từ; \"degrade\" sai dạng sau \"have\"; \"degrading\" là V-ing."},{"num":3,"question":"Forest ______ for new farmland destroys the homes of many animals.","options":["estimation","facility","clearance","attacker"],"answerIndex":2,"explanation":"\"forest clearance\" (việc phát quang rừng) để lấy đất canh tác là cụm chuẩn. \"estimation\" (sự ước tính), \"facility\" (cơ sở) và \"attacker\" (kẻ tấn công) sai nghĩa."},{"num":4,"question":"A single careless fire can ______ hundreds of hectares of forest.","options":["destruction","destructive","destroyed","destroy"],"answerIndex":3,"explanation":"Sau \"can\" cần động từ nguyên thể: \"destroy\" (phá hủy). \"destruction\" là danh từ; \"destructive\" là tính từ; \"destroyed\" sai dạng sau động từ khuyết thiếu."},{"num":5,"question":"Bottom trawling is one of the most ______ fishing methods in the world.","options":["destroy","destruction","destructive","destroyed"],"answerIndex":2,"explanation":"Sau \"the most\" và trước danh từ \"fishing methods\" cần tính từ: \"destructive\" (có sức tàn phá). \"destroy\" là động từ; \"destruction\" là danh từ; \"destroyed\" là phân từ."},{"num":6,"question":"Thousands of old trees were ______ to make way for the new road.","options":["released","bred","estimated","cut down"],"answerIndex":3,"explanation":"\"cut down trees\" (chặt hạ cây) ở thể bị động là \"were cut down\". \"released\" (được thả), \"bred\" (được nhân giống) và \"estimated\" (được ước tính) sai nghĩa với \"old trees\"."},{"num":7,"question":"The new rules should ______ the number of animals killed each year.","options":["reduction","reduce","reduced","reducing"],"answerIndex":1,"explanation":"Sau \"should\" cần động từ nguyên thể: \"reduce the number of sth\" (giảm số lượng cái gì). \"reduction\" là danh từ; \"reduced/reducing\" sai dạng sau động từ khuyết thiếu."},{"num":8,"question":"There has been a sharp ______ in the elephant population since 1990.","options":["reduction","reduce","reduced","reducing"],"answerIndex":0,"explanation":"Sau \"a sharp\" cần danh từ: \"a reduction in sth\" (sự giảm về cái gì). \"reduce\" là động từ; \"reduced\" là tính từ; \"reducing\" là V-ing."},{"num":9,"question":"______ is driving several large mammals towards extinction.","options":["Poacher","Poaching","Poach","Poached"],"answerIndex":1,"explanation":"Chủ ngữ chỉ hiện tượng cần danh từ không đếm được: \"poaching\" (nạn săn trộm). \"poacher\" chỉ một người; \"poach/poached\" là động từ."},{"num":10,"question":"Ivory is highly ______ in some countries, and that is why elephants are hunted.","options":["desire","desired","desirable","desirably"],"answerIndex":2,"explanation":"Sau \"is highly\" cần tính từ: \"desirable\" (được ưa chuộng, được nhiều người muốn có). \"desire\" là danh từ/động từ; \"desired\" mang nghĩa \"đã được mong muốn\" và cần tân ngữ cụ thể; \"desirably\" là trạng từ."},{"num":11,"question":"Tigers are ______ vulnerable because each animal needs a very large territory.","options":["particular","particularity","particulars","particularly"],"answerIndex":3,"explanation":"Chỗ trống bổ nghĩa cho tính từ \"vulnerable\" nên cần trạng từ: \"particularly vulnerable\" (đặc biệt dễ bị tổn thương). \"particular\" là tính từ; \"particularity/particulars\" là danh từ."},{"num":12,"question":"These large birds only ______ once every two years.","options":["breed","breeding","bred","breeds"],"answerIndex":0,"explanation":"Câu ở thì hiện tại đơn với chủ ngữ số nhiều \"these large birds\" nên cần \"breed\" (sinh sản). \"breeds\" sai hòa hợp chủ ngữ; \"bred\" là quá khứ; \"breeding\" là V-ing."},{"num":13,"question":"Twenty young crocodiles were ______ into the river early last month.","options":["release","releasing","releases","released"],"answerIndex":3,"explanation":"Câu bị động \"were + V3\": \"were released\" (được thả). \"release\" là nguyên thể; \"releasing\" là V-ing; \"releases\" là dạng chia ngôi thứ ba."},{"num":14,"question":"The new breeding ______ can hold up to fifty animals at one time.","options":["attacker","facility","clearance","desire"],"answerIndex":1,"explanation":"\"a breeding facility\" (cơ sở nhân giống) là nơi có thể chứa động vật. \"attacker\" chỉ người; \"clearance\" là việc phát quang; \"desire\" là mong muốn."},{"num":15,"question":"There have been several ______ on rangers by armed poachers this year.","options":["attacks","estimates","facilities","clearances"],"answerIndex":0,"explanation":"\"attacks on sb\" (các vụ tấn công nhằm vào ai) là cụm chuẩn. \"estimates\" (ước tính), \"facilities\" (cơ sở) và \"clearances\" (việc phát quang) không đi với \"on rangers by armed poachers\"."},{"num":16,"question":"The number of wild elephants has ______ by half since 1990.","options":["decrease","decreasing","decreased","decreases"],"answerIndex":2,"explanation":"Thì hiện tại hoàn thành \"has + V3\" cần \"decreased\" (đã giảm). \"decrease/decreases\" là hiện tại; \"decreasing\" là V-ing."}],"gapfill":[{"num":1,"sentence":"Scientists ______ that only two thousand of these birds are left.","answer":"estimate"},{"num":2,"sentence":"The ______ of the rainforest continues at an alarming rate.","answer":"destruction"},{"num":3,"sentence":"Police arrested the ______ less than an hour after the incident.","answer":"attacker"},{"num":4,"sentence":"There has been a slight ______ in the number of visitors this year.","answer":"decrease"},{"num":5,"sentence":"Land ______ for a new airport destroyed a large area of wetland.","answer":"clearance"},{"num":6,"sentence":"This ______ species of frog lives only on one small island.","answer":"particular"},{"num":7,"sentence":"Armed ______ were caught with three rhino horns near the border.","answer":"poachers"},{"num":8,"sentence":"A ______ in plastic use would help sea animals enormously.","answer":"reduction"},{"num":9,"sentence":"Chemicals from the factory ______ the quality of the river water.","answer":"degrade"},{"num":10,"sentence":"Her ______ to protect wildlife began when she was a small child.","answer":"desire"}]},"6":{"title":"WRITING","words":[{"word":"problem-solving","ipa":"/ˈprɒbləm ˈsɒlvɪŋ/","pos":"N. / Adj.","meaning":"sự giải quyết vấn đề / giải quyết vấn đề"},{"word":"solve","ipa":"/sɒlv/","pos":"V.","meaning":"giải quyết, tìm ra lời giải"},{"word":"solution","ipa":"/səˈluːʃn/","pos":"N.","meaning":"giải pháp, cách giải quyết"},{"word":"threat","ipa":"/θret/","pos":"N.","meaning":"mối đe dọa, nguy cơ"},{"word":"threaten","ipa":"/ˈθretn/","pos":"V.","meaning":"đe dọa"},{"word":"threatening","ipa":"/ˈθretnɪŋ/","pos":"Adj.","meaning":"mang tính đe dọa, hăm dọa"},{"word":"degraded","ipa":"/dɪˈɡreɪdɪd/","pos":"Adj.","meaning":"bị suy thoái, bị giảm sút chất lượng"},{"word":"degrade","ipa":"/dɪˈɡreɪd/","pos":"V.","meaning":"làm suy thoái, làm giảm giá trị"},{"word":"degradation","ipa":"/ˌdeɡrəˈdeɪʃn/","pos":"N.","meaning":"sự suy thoái, sự mất chất lượng"},{"word":"harsh","ipa":"/hɑːʃ/","pos":"Adj.","meaning":"khắc nghiệt, thô ráp, gay gắt"},{"word":"harshly","ipa":"/ˈhɑːʃli/","pos":"Adv.","meaning":"một cách khắc nghiệt, nghiêm khắc"},{"word":"harshness","ipa":"/ˈhɑːʃnəs/","pos":"N.","meaning":"sự khắc nghiệt, tính gay gắt"},{"word":"punish","ipa":"/ˈpʌnɪʃ/","pos":"V.","meaning":"trừng phạt, phạt"},{"word":"punishment","ipa":"/ˈpʌnɪʃmənt/","pos":"N.","meaning":"hình phạt, sự trừng phạt"},{"word":"punishable","ipa":"/ˈpʌnɪʃəbl/","pos":"Adj.","meaning":"có thể bị xử phạt"},{"word":"poach","ipa":"/pəʊtʃ/","pos":"V.","meaning":"săn trộm, câu trộm"},{"word":"poacher","ipa":"/ˈpəʊtʃə(r)/","pos":"N.","meaning":"kẻ săn trộm"},{"word":"poaching","ipa":"/ˈpəʊtʃɪŋ/","pos":"N.","meaning":"nạn săn bắn trộm"}],"mcq":[{"num":1,"question":"Education may be the best long-term ______ to this difficult problem.","options":["solve","solution","solving","solved"],"answerIndex":1,"explanation":"Sau \"the best long-term\" cần danh từ: \"a solution to a problem\" (giải pháp cho một vấn đề). \"solve/solved\" là động từ; \"solving\" là V-ing."},{"num":2,"question":"No single country can ______ the problem of the illegal wildlife trade.","options":["solution","solving","solve","solved"],"answerIndex":2,"explanation":"Sau \"can\" cần động từ nguyên thể: \"solve a problem\" (giải quyết một vấn đề). \"solution\" là danh từ; \"solving/solved\" sai dạng sau động từ khuyết thiếu."},{"num":3,"question":"The course develops ______ skills as well as knowledge of the subject.","options":["problem-solving","threatening","punishable","degraded"],"answerIndex":0,"explanation":"\"problem-solving skills\" (kỹ năng giải quyết vấn đề) là cụm cố định. \"threatening\" (mang tính đe dọa), \"punishable\" (có thể bị xử phạt) và \"degraded\" (bị suy thoái) không mô tả được kỹ năng."},{"num":4,"question":"Climate change is now the biggest ______ to these mountain animals.","options":["threaten","threatening","threatened","threat"],"answerIndex":3,"explanation":"Sau \"the biggest\" cần danh từ: \"a threat to sb/sth\" (mối đe dọa đối với ai/cái gì). \"threaten\" là động từ; \"threatening/threatened\" là tính từ hoặc phân từ."},{"num":5,"question":"Rising sea temperatures ______ the survival of many coral species.","options":["threat","threatening","threatened","threaten"],"answerIndex":3,"explanation":"Câu ở thì hiện tại đơn với chủ ngữ số nhiều cần động từ: \"threaten\" (đe dọa). \"threat\" là danh từ; \"threatening\" là V-ing; \"threatened\" sai thì trong ngữ cảnh hiện tại này."},{"num":6,"question":"The landowner sent a ______ letter to the hunters who had crossed his field.","options":["threat","threatening","threaten","threatened"],"answerIndex":1,"explanation":"Trước danh từ \"letter\" cần tính từ chủ động: \"a threatening letter\" (lá thư mang tính đe dọa). \"threatened\" mang nghĩa bị đe dọa; \"threat\" là danh từ; \"threaten\" là động từ."},{"num":7,"question":"Much of the land around the old mine is now badly ______.","options":["degraded","degrade","degradation","degrading"],"answerIndex":0,"explanation":"Sau \"is now badly\" cần tính từ mô tả trạng thái: \"degraded\" (bị suy thoái). \"degrade\" là động từ; \"degradation\" là danh từ; \"degrading\" mang nghĩa chủ động (gây suy thoái)."},{"num":8,"question":"Soil ______ has made farming almost impossible in this area.","options":["degrade","degraded","degradation","degrading"],"answerIndex":2,"explanation":"Chủ ngữ của \"has made\" cần danh từ: \"soil degradation\" (sự suy thoái đất). \"degrade\" là động từ; \"degraded/degrading\" là tính từ."},{"num":9,"question":"The ______ of the winter killed many young animals in the reserve.","options":["harshness","harsh","harshly","harsher"],"answerIndex":0,"explanation":"Chủ ngữ của \"killed\" cần danh từ: \"the harshness of the winter\" (sự khắc nghiệt của mùa đông). \"harsh/harsher\" là tính từ; \"harshly\" là trạng từ."},{"num":10,"question":"Anyone caught poaching in the reserve will be punished ______.","options":["harsh","harshly","harshness","harsher"],"answerIndex":1,"explanation":"Chỗ trống bổ nghĩa cho động từ \"be punished\" nên cần trạng từ: \"punished harshly\" (bị trừng phạt nghiêm khắc). \"harsh/harsher\" là tính từ; \"harshness\" là danh từ."},{"num":11,"question":"Killing a protected animal is ______ by a long prison sentence.","options":["punish","punishment","punishable","punished"],"answerIndex":2,"explanation":"\"be punishable by sth\" (có thể bị xử phạt bằng hình thức gì) là cấu trúc cố định, cần tính từ. \"punish\" là động từ; \"punishment\" là danh từ; \"punished\" cần \"by sb\" chỉ người thực hiện chứ không đi với hình phạt theo cách này."},{"num":12,"question":"Rangers arrested three ______ near the border of the park last week.","options":["poaching","poach","poached","poachers"],"answerIndex":3,"explanation":"Sau số đếm \"three\" cần danh từ đếm được chỉ người: \"poachers\" (những kẻ săn trộm). \"poaching\" là danh từ không đếm được; \"poach/poached\" là động từ."}],"gapfill":[{"num":1,"sentence":"The government has promised to ______ anyone who trades in ivory.","answer":"punish"},{"num":2,"sentence":"The maximum ______ for this crime is now fifteen years in prison.","answer":"punishment"},{"num":3,"sentence":"Illegal ______ has fallen sharply since the new patrols began.","answer":"poaching"},{"num":4,"sentence":"Working in small groups improves students' ______ skills.","answer":"problem-solving"},{"num":5,"sentence":"So far nobody has found a simple ______ to this problem.","answer":"solution"},{"num":6,"sentence":"Money alone cannot ______ the crisis facing the rainforest.","answer":"solve"},{"num":7,"sentence":"Plastic waste in the ocean is a serious ______ to sea birds.","answer":"threat"},{"num":8,"sentence":"The weather in these mountains can be extremely ______ in winter.","answer":"harsh"},{"num":9,"sentence":"Land ______ is caused mainly by careless farming and overgrazing.","answer":"degradation"},{"num":10,"sentence":"He received several ______ messages after the article was published.","answer":"threatening"}]},"7":{"title":"COMMUNICATION AND CULTURE/ CILL","words":[{"word":"Internation Union for Conservation of Nature (IUCN)","ipa":"/ˌɪntəˈnæʃnəl ˈjuːniən fə(r) ˌkɒnsəˈveɪʃn əv ˈneɪtʃə(r)/","pos":"N. phr.","meaning":"Liên minh Bảo tồn Thiên nhiên Quốc tế"},{"word":"concern","ipa":"/kənˈsɜːn/","pos":"N. / V.","meaning":"sự lo ngại, mối quan tâm / làm lo lắng, liên quan đến"},{"word":"concerned","ipa":"/kənˈsɜːnd/","pos":"Adj.","meaning":"lo lắng, có liên quan"},{"word":"concerning","ipa":"/kənˈsɜːnɪŋ/","pos":"Prep.","meaning":"về việc, có liên quan đến"},{"word":"classify","ipa":"/ˈklæsɪfaɪ/","pos":"V.","meaning":"phân loại"},{"word":"classification","ipa":"/ˌklæsɪfɪˈkeɪʃn/","pos":"N.","meaning":"sự phân loại"},{"word":"precise","ipa":"/prɪˈsaɪs/","pos":"Adj.","meaning":"chính xác, tỉ mỉ"},{"word":"precisely","ipa":"/prɪˈsaɪsli/","pos":"Adv.","meaning":"một cách chính xác, đúng vậy"},{"word":"precision","ipa":"/prɪˈsɪʒn/","pos":"N.","meaning":"sự chính xác, độ chính xác"},{"word":"criteria","ipa":"/kraɪˈtɪəriə/","pos":"N. (Plural)","meaning":"các tiêu chí (số nhiều của criterion)"},{"word":"criterion","ipa":"/kraɪˈtɪəriən/","pos":"N. (Singular)","meaning":"tiêu chí (số ít)"},{"word":"measure","ipa":"/ˈmeʒə(r)/","pos":"V. / N.","meaning":"đo lường, đánh giá / biện pháp, sự đo lường"},{"word":"measurement","ipa":"/ˈmeʒəmənt/","pos":"N.","meaning":"sự đo lường, phép đo"},{"word":"geographic range","ipa":"/ˌdʒiːəˈɡræfɪk reɪndʒ/","pos":"N. phr.","meaning":"phạm vi phân bố địa lý"},{"word":"geography","ipa":"/dʒiˈɒɡrəfi/","pos":"N.","meaning":"địa lý học, địa hình"},{"word":"known as","ipa":"/nəʊn æz/","pos":"Adj. phr.","meaning":"được biết đến như là, gọi là"},{"word":"occupancy","ipa":"/ˈɒkjəpənsi/","pos":"N.","meaning":"sự cư ngụ, sự sở hữu, tỷ lệ sử dụng phòng"},{"word":"occupy","ipa":"/ˈɒkjəpaɪ/","pos":"V.","meaning":"cư ngụ, chiếm giữ"},{"word":"mature individual","ipa":"/məˈtʃʊə(r) ˌɪndɪˈvɪdʒuəl/","pos":"N. phr.","meaning":"cá thể trưởng thành"},{"word":"maturity","ipa":"/məˈtʃʊərəti/","pos":"N.","meaning":"sự trưởng thành, tính chín chắn"},{"word":"sturgeon","ipa":"/ˈstɜːdʒən/","pos":"N.","meaning":"cá tầm"},{"word":"reed-warbler","ipa":"/riːd ˈwɔːblə(r)/","pos":"N.","meaning":"chim chích đầm lầy, chim chích sậy"}],"mcq":[{"num":1,"question":"The IUCN uses five main criteria to ______ each species on its list.","options":["classification","classified","classify","classifying"],"answerIndex":2,"explanation":"Sau \"to\" chỉ mục đích cần động từ nguyên thể: \"classify\" (phân loại). \"classification\" là danh từ; \"classified/classifying\" sai dạng sau \"to\"."},{"num":2,"question":"The ______ of a species can change if its population suddenly falls.","options":["classify","classification","classified","classifying"],"answerIndex":1,"explanation":"Chủ ngữ của \"can change\" cần danh từ: \"the classification of sth\" (việc xếp loại cái gì). Ba phương án còn lại là dạng động từ."},{"num":3,"question":"Many biologists are deeply ______ about the future of the sturgeon.","options":["concerned","concern","concerning","concernedly"],"answerIndex":0,"explanation":"\"be concerned about sth\" (lo ngại về điều gì) là cấu trúc cố định, cần tính từ. \"concern\" là danh từ/động từ; \"concerning\" là giới từ mang nghĩa \"về việc\"; \"concernedly\" là trạng từ."},{"num":4,"question":"The sharp decline of wild bees is a growing ______ for farmers.","options":["concerned","concerning","concernedly","concern"],"answerIndex":3,"explanation":"Sau \"a growing\" cần danh từ: \"a concern\" (mối lo ngại). \"concerned\" là tính từ; \"concerning\" là giới từ; \"concernedly\" là trạng từ."},{"num":5,"question":"Scientists need ______ figures before they can make any decision.","options":["precise","precisely","precision","preciseness"],"answerIndex":0,"explanation":"Trước danh từ \"figures\" cần tính từ: \"precise figures\" (số liệu chính xác). \"precisely\" là trạng từ; \"precision/preciseness\" là danh từ."},{"num":6,"question":"Nobody knows ______ how many of these fish are left in the river.","options":["precise","precisely","precision","preciseness"],"answerIndex":1,"explanation":"Chỗ trống bổ nghĩa cho cả mệnh đề \"how many … are left\" nên cần trạng từ: \"precisely\" (chính xác là). \"precise\" là tính từ; hai phương án còn lại là danh từ."},{"num":7,"question":"All the measurements were made with very great ______.","options":["precise","precisely","preciseness","precision"],"answerIndex":3,"explanation":"\"with great precision\" (với độ chính xác cao) là cụm cố định, cần danh từ. \"precise\" là tính từ; \"precisely\" là trạng từ; \"preciseness\" tồn tại nhưng không dùng trong cụm cố định này."},{"num":8,"question":"The Red List uses five ______, including population size and geographic range.","options":["criterion","criterions","criteria","criterias"],"answerIndex":2,"explanation":"Sau số đếm \"five\" cần dạng số nhiều đúng: \"criteria\" (các tiêu chí). \"criterion\" là số ít; \"criterions\" và \"criterias\" không phải dạng số nhiều chuẩn của từ này."},{"num":9,"question":"Population size is only one ______ among several used by scientists.","options":["criteria","criterions","criterion","criterias"],"answerIndex":2,"explanation":"Sau \"one\" cần dạng số ít: \"criterion\" (một tiêu chí). \"criteria\" là số nhiều; \"criterions/criterias\" không phải dạng chuẩn."},{"num":10,"question":"It is extremely difficult to ______ the size of a whale population.","options":["measure","measurement","measured","measuring"],"answerIndex":0,"explanation":"Sau \"to\" cần động từ nguyên thể: \"measure\" (đo lường). \"measurement\" là danh từ; \"measured/measuring\" sai dạng sau \"to\"."},{"num":11,"question":"The ______ of this bird covers only two small islands in the south.","options":["mature individual","classification","occupancy","geographic range"],"answerIndex":3,"explanation":"\"geographic range\" (phạm vi phân bố địa lý) là khái niệm được đo bằng diện tích lãnh thổ. \"mature individual\" chỉ một cá thể; \"classification\" là việc xếp loại; \"occupancy\" là tỷ lệ sử dụng."},{"num":12,"question":"This small brown bird is ______ the reed-warbler in English.","options":["made of","known as","full of","covered in"],"answerIndex":1,"explanation":"\"be known as\" (được gọi là) là cụm cố định dùng khi nêu tên gọi. \"be made of\" (được làm bằng), \"be full of\" (đầy) và \"be covered in\" (bị phủ bởi) sai nghĩa."},{"num":13,"question":"Fewer than two hundred and fifty ______ of this species remain in the wild.","options":["mature individuals","geographic ranges","classifications","measurements"],"answerIndex":0,"explanation":"\"mature individuals\" (cá thể trưởng thành) là đơn vị đếm số lượng cá thể còn lại của một loài. \"geographic ranges\", \"classifications\" và \"measurements\" không phải cá thể sống."},{"num":14,"question":"These turtles reach ______ at about twenty-five years of age.","options":["mature","maturely","maturity","matured"],"answerIndex":2,"explanation":"\"reach maturity\" (đạt đến độ trưởng thành) là collocation cố định, cần danh từ. \"mature\" là tính từ/động từ; \"maturely\" là trạng từ; \"matured\" là phân từ."}],"gapfill":[{"num":1,"sentence":"The ______ is a large river fish valued for its eggs, or caviar.","answer":"sturgeon"},{"num":2,"sentence":"The ______ builds its nest among the tall reeds beside the river.","answer":"reed-warbler"},{"num":3,"sentence":"The report contains new information ______ the tiger population.","answer":"concerning"},{"num":4,"sentence":"Wild boars ______ a large area of forest in the north of the park.","answer":"occupy"},{"num":5,"sentence":"Hotel ______ falls sharply after the summer holidays are over.","answer":"occupancy"},{"num":6,"sentence":"The research team took careful ______ of every tree in the plot.","answer":"measurements"},{"num":7,"sentence":"Female turtles reach ______ only after twenty-five years.","answer":"maturity"},{"num":8,"sentence":"Scientists study the ______ of a region before choosing a release site.","answer":"geography"},{"num":9,"sentence":"The IUCN changed the ______ of this species from Vulnerable to Endangered.","answer":"classification"},{"num":10,"sentence":"A species must meet several ______ before it is listed as endangered.","answer":"criteria"}]}},"9":{"1":{"title":"GETTING STARTED","words":[{"word":"career adviser","ipa":"/kəˈrɪə(r) ədˌvaɪzə(r)/","pos":"n.phr","meaning":"cố vấn hướng nghiệp"},{"word":"keep up with","ipa":"/kiːp ʌp wɪð/","pos":"phr.v","meaning":"theo kịp, cập nhật"},{"word":"flight attendant","ipa":"/ˈflaɪt əˌtendənt/","pos":"n","meaning":"tiếp viên hàng không"},{"word":"mechanic","ipa":"/məˈkænɪk/","pos":"n","meaning":"thợ cơ khí, thợ sửa chữa"},{"word":"mechanical","ipa":"/məˈkænɪkl/","pos":"adj","meaning":"thuộc cơ khí"},{"word":"mechanically","ipa":"/məˈkænɪkli/","pos":"adv","meaning":"một cách máy móc"},{"word":"mechanics","ipa":"/məˈkænɪks/","pos":"n","meaning":"cơ học"},{"word":"repair worker","ipa":"/rɪˈpeə(r) ˌwɜːkə(r)/","pos":"n.phr","meaning":"công nhân sửa chữa"},{"word":"look down on","ipa":"/lʊk daʊn ɒn/","pos":"phr.v","meaning":"coi thường, khinh thường"},{"word":"apply","ipa":"/əˈplaɪ/","pos":"v","meaning":"nộp đơn; áp dụng"},{"word":"application","ipa":"/ˌæplɪˈkeɪʃn/","pos":"n","meaning":"đơn xin; sự áp dụng"},{"word":"applicant","ipa":"/ˈæplɪkənt/","pos":"n","meaning":"người nộp đơn"},{"word":"applicable","ipa":"/əˈplɪkəbl/","pos":"adj","meaning":"có thể áp dụng"},{"word":"applied","ipa":"/əˈplaɪd/","pos":"adj","meaning":"ứng dụng"},{"word":"automated","ipa":"/ˈɔːtəmeɪtɪd/","pos":"adj","meaning":"tự động"},{"word":"automate","ipa":"/ˈɔːtəmeɪt/","pos":"v","meaning":"tự động hóa"},{"word":"automation","ipa":"/ˌɔːtəˈmeɪʃn/","pos":"n","meaning":"sự tự động hóa"},{"word":"employ","ipa":"/ɪmˈplɔɪ/","pos":"v","meaning":"tuyển dụng"},{"word":"employee","ipa":"/ɪmˈplɔɪiː/","pos":"n","meaning":"nhân viên"},{"word":"employer","ipa":"/ɪmˈplɔɪə(r)/","pos":"n","meaning":"người sử dụng lao động"},{"word":"employment","ipa":"/ɪmˈplɔɪmənt/","pos":"n","meaning":"việc làm; sự tuyển dụng"},{"word":"unemployed","ipa":"/ˌʌnɪmˈplɔɪd/","pos":"adj","meaning":"thất nghiệp"},{"word":"unemployment","ipa":"/ˌʌnɪmˈplɔɪmənt/","pos":"n","meaning":"sự thất nghiệp"},{"word":"employable","ipa":"/ɪmˈplɔɪəbl/","pos":"adj","meaning":"có khả năng được tuyển dụng"},{"word":"interact","ipa":"/ˌɪntərˈækt/","pos":"v","meaning":"tương tác"},{"word":"interaction","ipa":"/ˌɪntərˈækʃn/","pos":"n","meaning":"sự tương tác"},{"word":"interactive","ipa":"/ˌɪntərˈæktɪv/","pos":"adj","meaning":"có tính tương tác"},{"word":"adapt","ipa":"/əˈdæpt/","pos":"v","meaning":"thích nghi; điều chỉnh"},{"word":"adaptation","ipa":"/ˌædæpˈteɪʃn/","pos":"n","meaning":"sự thích nghi; sự chuyển thể"},{"word":"adaptable","ipa":"/əˈdæptəbl/","pos":"adj","meaning":"dễ thích nghi"},{"word":"adaptability","ipa":"/əˌdæptəˈbɪləti/","pos":"n","meaning":"khả năng thích nghi"},{"word":"adapted","ipa":"/əˈdæptɪd/","pos":"adj","meaning":"được điều chỉnh, thích nghi"},{"word":"come up with","ipa":"/kʌm ʌp wɪð/","pos":"phr.v","meaning":"nghĩ ra, nảy ra (ý tưởng)"},{"word":"soft skill","ipa":"/ˌsɒft ˈskɪl/","pos":"n.phr","meaning":"kỹ năng mềm"}],"mcq":[{"num":1,"question":"Talk to the school's ______ before you choose your university course.","options":["flight attendant","mechanic","career adviser","repair worker"],"answerIndex":2,"explanation":"Người tư vấn chọn ngành học là \"career adviser\" (cố vấn hướng nghiệp). \"flight attendant\" (tiếp viên hàng không), \"mechanic\" (thợ cơ khí) và \"repair worker\" (công nhân sửa chữa) làm những công việc khác."},{"num":2,"question":"It is not easy to ______ all the changes in computer technology.","options":["keep up with","look down on","come up with","put up with"],"answerIndex":0,"explanation":"\"keep up with sth\" (theo kịp, cập nhật điều gì) đúng nghĩa với \"changes in computer technology\". \"look down on\" (coi thường), \"come up with\" (nghĩ ra) và \"put up with\" (chịu đựng) sai nghĩa."},{"num":3,"question":"A ______ must be able to stay calm during an emergency on board.","options":["mechanic","career adviser","repair worker","flight attendant"],"answerIndex":3,"explanation":"\"on board\" (trên khoang máy bay) chốt nghĩa \"flight attendant\" (tiếp viên hàng không). Ba nghề còn lại không làm việc trên máy bay."},{"num":4,"question":"The ______ found the fault in the engine within ten minutes.","options":["mechanics","mechanic","mechanical","mechanically"],"answerIndex":1,"explanation":"Người sửa động cơ là \"mechanic\" (thợ cơ khí). \"mechanics\" là môn cơ học; \"mechanical\" là tính từ; \"mechanically\" là trạng từ."},{"num":5,"question":"The train was delayed for two hours because of a ______ problem.","options":["mechanic","mechanical","mechanics","mechanically"],"answerIndex":1,"explanation":"Trước danh từ \"problem\" cần tính từ: \"a mechanical problem\" (sự cố kỹ thuật, cơ khí). \"mechanic/mechanics\" là danh từ; \"mechanically\" là trạng từ."},{"num":6,"question":"Nobody should ______ people who do manual jobs.","options":["keep up with","come up with","apply for","look down on"],"answerIndex":3,"explanation":"\"look down on sb\" (coi thường ai) đúng nghĩa trong lời khuyên về thái độ với người lao động chân tay. \"keep up with\" (theo kịp), \"come up with\" (nghĩ ra) và \"apply for\" (nộp đơn xin) sai nghĩa."},{"num":7,"question":"Only three ______ out of sixty were invited to the second interview.","options":["application","apply","applicants","applicable"],"answerIndex":2,"explanation":"Người nộp đơn được mời phỏng vấn là \"applicants\" (ứng viên). \"application\" là lá đơn; \"apply\" là động từ; \"applicable\" là tính từ."},{"num":8,"question":"Many simple factory jobs are now completely ______.","options":["automated","automate","automation","automatically"],"answerIndex":0,"explanation":"Sau \"are now completely\" cần tính từ mô tả trạng thái: \"automated\" (được tự động hóa). \"automate\" là động từ; \"automation\" là danh từ; \"automatically\" là trạng từ."},{"num":9,"question":"______ has replaced thousands of workers in this industry.","options":["Automate","Automation","Automated","Automatically"],"answerIndex":1,"explanation":"Chủ ngữ của \"has replaced\" cần danh từ: \"automation\" (sự tự động hóa). \"Automate\" là động từ; \"Automated\" là tính từ; \"Automatically\" là trạng từ."},{"num":10,"question":"Learning English and computing makes young people much more ______.","options":["employ","employee","employment","employable"],"answerIndex":3,"explanation":"Sau \"much more\" cần tính từ: \"employable\" (dễ được tuyển dụng). \"employ\" là động từ; \"employee\" và \"employment\" là danh từ."},{"num":11,"question":"______ among young graduates has risen sharply this year.","options":["Unemployment","Unemployed","Employment","Employ"],"answerIndex":0,"explanation":"Chủ ngữ của \"has risen sharply\" trong ngữ cảnh tiêu cực là \"unemployment\" (tỷ lệ thất nghiệp). \"Employment\" mang nghĩa ngược lại và không phù hợp với \"among young graduates has risen sharply\" khi nói về khó khăn; \"Unemployed\" là tính từ; \"Employ\" là động từ."},{"num":12,"question":"Nurses must ______ with patients and their families all day long.","options":["interaction","interactive","interact","interactively"],"answerIndex":2,"explanation":"Sau \"must\" cần động từ nguyên thể: \"interact with sb\" (tương tác với ai). \"interaction\" là danh từ; \"interactive\" là tính từ; \"interactively\" là trạng từ."},{"num":13,"question":"Employers are looking for young people who are ______ and willing to learn.","options":["adapt","adaptation","adaptable","adaptability"],"answerIndex":2,"explanation":"Sau \"are\" và song song với tính từ \"willing\" cần tính từ: \"adaptable\" (dễ thích nghi). \"adapt\" là động từ; \"adaptation/adaptability\" là danh từ."},{"num":14,"question":"In today's job market, ______ is more important than ever before.","options":["adaptable","adaptability","adapt","adapted"],"answerIndex":1,"explanation":"Chủ ngữ của \"is\" cần danh từ trừu tượng: \"adaptability\" (khả năng thích nghi). \"adaptable/adapted\" là tính từ; \"adapt\" là động từ."},{"num":15,"question":"The team had to ______ a solution in less than an hour.","options":["come up with","look down on","keep up with","get on with"],"answerIndex":0,"explanation":"\"come up with a solution\" (nghĩ ra một giải pháp) là cụm cố định. \"look down on\" (coi thường), \"keep up with\" (theo kịp) và \"get on with\" (hòa hợp với) sai nghĩa."},{"num":16,"question":"Communication and teamwork are two of the most important ______.","options":["applications","mechanics","adaptations","soft skills"],"answerIndex":3,"explanation":"Giao tiếp và làm việc nhóm là \"soft skills\" (kỹ năng mềm). \"applications\" (đơn xin việc), \"mechanics\" (cơ học) và \"adaptations\" (sự thích nghi) sai nghĩa."}],"gapfill":[{"num":1,"sentence":"She has been ______ since the factory closed down in March.","answer":"unemployed"},{"num":2,"sentence":"Fill in the ______ form and send it before Friday afternoon.","answer":"application"},{"num":3,"sentence":"My ______ suggested that I should study tourism and hotel management.","answer":"career adviser"},{"num":4,"sentence":"Teams of ______ came to fix the power lines after the storm.","answer":"repair workers"},{"num":5,"sentence":"Robots can now ______ many simple tasks in a modern factory.","answer":"automate"},{"num":6,"sentence":"Young people today must learn to ______ quickly to new technology.","answer":"adapt"},{"num":7,"sentence":"Face-to-face ______ with customers is an important part of this job.","answer":"interaction"},{"num":8,"sentence":"He answered all the questions ______, without any real thought.","answer":"mechanically"},{"num":9,"sentence":"A good ______ listens carefully to the ideas of the staff.","answer":"employer"},{"num":10,"sentence":"Communication, teamwork and time management are all ______.","answer":"soft skills"}]},"2":{"title":"LANGUAGE","words":[{"word":"pursue","ipa":"/pəˈsjuː/","pos":"v","meaning":"theo đuổi"},{"word":"pursuit","ipa":"/pəˈsjuːt/","pos":"n","meaning":"sự theo đuổi"},{"word":"pursuer","ipa":"/pəˈsjuːə(r)/","pos":"n","meaning":"người theo đuổi"},{"word":"deal with","ipa":"/diːl wɪð/","pos":"phr.v","meaning":"giải quyết; xử lý"},{"word":"passion","ipa":"/ˈpæʃn/","pos":"n","meaning":"niềm đam mê"},{"word":"passionate","ipa":"/ˈpæʃənət/","pos":"adj","meaning":"đam mê, nhiệt huyết"},{"word":"passionately","ipa":"/ˈpæʃənətli/","pos":"adv","meaning":"một cách say mê"},{"word":"walk away from","ipa":"/wɔːk əˈweɪ frɒm/","pos":"phr.v","meaning":"từ bỏ; rời bỏ"},{"word":"live up to","ipa":"/lɪv ʌp tuː/","pos":"phr.v","meaning":"đáp ứng, xứng đáng với"},{"word":"cut down on","ipa":"/kʌt daʊn ɒn/","pos":"phr.v","meaning":"cắt giảm"},{"word":"get on with","ipa":"/ɡet ɒn wɪð/","pos":"phr.v","meaning":"hòa hợp với; tiếp tục làm"},{"word":"put up with","ipa":"/pʊt ʌp wɪð/","pos":"phr.v","meaning":"chịu đựng"},{"word":"go in for","ipa":"/ɡəʊ ɪn fə(r)/","pos":"phr.v","meaning":"yêu thích; tham gia"},{"word":"get through to","ipa":"/ɡet θruː tuː/","pos":"phr.v","meaning":"làm cho ai hiểu; liên lạc được với"},{"word":"expectation","ipa":"/ˌekspekˈteɪʃn/","pos":"n","meaning":"sự mong đợi, kỳ vọng"},{"word":"expect","ipa":"/ɪkˈspekt/","pos":"v","meaning":"mong đợi"},{"word":"expected","ipa":"/ɪkˈspektɪd/","pos":"adj","meaning":"được mong đợi"},{"word":"unexpected","ipa":"/ˌʌnɪkˈspektɪd/","pos":"adj","meaning":"bất ngờ"},{"word":"unexpectedly","ipa":"/ˌʌnɪkˈspektɪdli/","pos":"adv","meaning":"một cách bất ngờ"},{"word":"expectant","ipa":"/ɪkˈspektənt/","pos":"adj","meaning":"mong chờ"},{"word":"graduate","ipa":"/ˈɡrædʒuət/ (n), /ˈɡrædʒueɪt/ (v)","pos":"n, v","meaning":"sinh viên tốt nghiệp; tốt nghiệp"},{"word":"graduation","ipa":"/ˌɡrædʒuˈeɪʃn/","pos":"n","meaning":"lễ/sự tốt nghiệp"},{"word":"undergraduate","ipa":"/ˌʌndəˈɡrædʒuət/","pos":"n, adj","meaning":"sinh viên đại học; thuộc bậc đại học"},{"word":"postgraduate","ipa":"/ˌpəʊstˈɡrædʒuət/","pos":"n, adj","meaning":"học viên sau đại học; thuộc sau đại học"}],"mcq":[{"num":1,"question":"After finishing school, she decided to ______ a career in medicine.","options":["pursue","pursuit","pursuer","pursuing"],"answerIndex":0,"explanation":"Sau \"decided to\" cần động từ nguyên thể: \"pursue a career\" (theo đuổi một sự nghiệp). \"pursuit/pursuer\" là danh từ; \"pursuing\" sai dạng sau \"to\"."},{"num":2,"question":"The ______ of happiness means very different things to different people.","options":["pursue","pursuit","pursuer","pursuing"],"answerIndex":1,"explanation":"Chủ ngữ của \"means\" cần danh từ: \"the pursuit of sth\" (sự theo đuổi điều gì). \"pursue\" là động từ; \"pursuer\" chỉ người; \"pursuing\" là V-ing."},{"num":3,"question":"A receptionist has to ______ difficult customers almost every day.","options":["walk away from","go in for","deal with","live up to"],"answerIndex":2,"explanation":"\"deal with sb/sth\" (xử lý, giải quyết) đúng nghĩa với \"difficult customers\". \"walk away from\" (bỏ đi), \"go in for\" (yêu thích) và \"live up to\" (đáp ứng kỳ vọng) sai nghĩa."},{"num":4,"question":"He has a real ______ for teaching young children.","options":["passionate","passionately","passions","passion"],"answerIndex":3,"explanation":"Sau \"a real\" cần danh từ số ít: \"a passion for sth\" (niềm đam mê với điều gì). \"passionate\" là tính từ; \"passionately\" là trạng từ; \"passions\" số nhiều không đi với \"a\"."},{"num":5,"question":"She is absolutely ______ about protecting the environment.","options":["passion","passionate","passionately","passions"],"answerIndex":1,"explanation":"\"be passionate about sth\" (say mê điều gì) là cấu trúc cố định, cần tính từ. \"passion/passions\" là danh từ; \"passionately\" là trạng từ."},{"num":6,"question":"It is not easy to ______ a well-paid job with a good future.","options":["live up to","put up with","get on with","walk away from"],"answerIndex":3,"explanation":"\"walk away from sth\" (từ bỏ, rời bỏ điều gì) đúng nghĩa với việc bỏ một công việc lương cao. \"live up to\" (đáp ứng), \"put up with\" (chịu đựng) và \"get on with\" (hòa hợp với) sai nghĩa."},{"num":7,"question":"The new film completely failed to ______ our expectations.","options":["cut down on","go in for","live up to","get through to"],"answerIndex":2,"explanation":"\"live up to expectations\" (đáp ứng được kỳ vọng) là cụm cố định. Ba cụm còn lại không kết hợp được với \"expectations\"."},{"num":8,"question":"The doctor told him to ______ coffee, salt and sugar.","options":["cut down on","get on with","go in for","put up with"],"answerIndex":0,"explanation":"\"cut down on sth\" (cắt giảm việc dùng thứ gì) đúng với lời khuyên của bác sĩ. \"get on with\" (hòa hợp), \"go in for\" (yêu thích) và \"put up with\" (chịu đựng) sai nghĩa."},{"num":9,"question":"She ______ all her new colleagues extremely well.","options":["gets on with","puts up with","goes in for","walks away from"],"answerIndex":0,"explanation":"\"get on with sb\" (hòa hợp với ai) là cụm duy nhất đi được với trạng từ tích cực \"extremely well\". \"put up with\" mang nghĩa miễn cưỡng chịu đựng nên mâu thuẫn; \"go in for\" và \"walk away from\" sai nghĩa."},{"num":10,"question":"I really cannot ______ this noise for another minute.","options":["get on with","go in for","put up with","live up to"],"answerIndex":2,"explanation":"\"put up with sth\" (chịu đựng điều gì khó chịu) đúng nghĩa với \"this noise\". \"get on with\" (hòa hợp), \"go in for\" (yêu thích) và \"live up to\" (đáp ứng) sai nghĩa."},{"num":11,"question":"He does not ______ team sports; he much prefers running alone.","options":["get through to","go in for","deal with","walk away from"],"answerIndex":1,"explanation":"\"go in for sth\" (thích và thường tham gia hoạt động gì) đúng nghĩa, đối lập với \"prefers running alone\". \"get through to\" (liên lạc được), \"deal with\" (xử lý) và \"walk away from\" (từ bỏ) sai nghĩa."},{"num":12,"question":"I telephoned five times but I could not ______ the office.","options":["put up with","go in for","cut down on","get through to"],"answerIndex":3,"explanation":"\"get through to sb\" (liên lạc được với ai qua điện thoại) đúng nghĩa với \"telephoned five times\". Ba cụm còn lại không mang nghĩa liên lạc."},{"num":13,"question":"The examination results were far above our ______.","options":["expectations","expect","expected","expectant"],"answerIndex":0,"explanation":"Sau \"above our\" cần danh từ: \"expectations\" (kỳ vọng). \"expect\" là động từ; \"expected/expectant\" là tính từ."},{"num":14,"question":"The manager resigned quite ______ in the middle of the year.","options":["unexpected","unexpectedly","expectation","expect"],"answerIndex":1,"explanation":"Chỗ trống bổ nghĩa cho động từ \"resigned\" nên cần trạng từ: \"unexpectedly\" (một cách bất ngờ). \"unexpected\" là tính từ; \"expectation\" là danh từ; \"expect\" là động từ."},{"num":15,"question":"After ______, he worked for a year before applying to university.","options":["graduate","undergraduate","postgraduate","graduation"],"answerIndex":3,"explanation":"Sau giới từ \"After\" cần danh từ chỉ sự kiện: \"graduation\" (việc tốt nghiệp). \"graduate\" chỉ người tốt nghiệp; \"undergraduate\" và \"postgraduate\" chỉ bậc học hoặc người học."},{"num":16,"question":"She is now doing a/an ______ course in economics after her first degree.","options":["undergraduate","graduation","postgraduate","graduate"],"answerIndex":2,"explanation":"\"after her first degree\" chốt nghĩa \"postgraduate course\" (khóa sau đại học). \"undergraduate\" là bậc cử nhân nên mâu thuẫn; \"graduation\" là sự tốt nghiệp; \"graduate\" chỉ người."}],"gapfill":[{"num":1,"sentence":"Every ______ of this school finds a job within six months.","answer":"graduate"},{"num":2,"sentence":"She is still an ______ and will finish her degree next summer.","answer":"undergraduate"},{"num":3,"sentence":"He spoke ______ about his love of the sea and sailing.","answer":"passionately"},{"num":4,"sentence":"The news of her sudden promotion was completely ______.","answer":"unexpected"},{"num":5,"sentence":"Managers must ______ complaints quickly and politely.","answer":"deal with"},{"num":6,"sentence":"The police caught the thief after a long ______ through the streets.","answer":"pursuit"},{"num":7,"sentence":"Everyone ______ him to become a doctor like his father.","answer":"expected"},{"num":8,"sentence":"I tried all morning but could not ______ the hospital by phone.","answer":"get through to"},{"num":9,"sentence":"Her exam results were far better than her parents' ______.","answer":"expectations"},{"num":10,"sentence":"Doctors advise us to ______ on salt, sugar and fatty food.","answer":"cut down"}]},"3":{"title":"READING","words":[{"word":"personality","ipa":"/ˌpɜːsəˈnæləti/","pos":"n","meaning":"tính cách"},{"word":"personal","ipa":"/ˈpɜːsənl/","pos":"adj","meaning":"cá nhân"},{"word":"personally","ipa":"/ˈpɜːsənəli/","pos":"adv","meaning":"đích thân; về mặt cá nhân"},{"word":"person","ipa":"/ˈpɜːsn/","p , v","meaning":"nhu cầu; yêu cầu"},{"word":"demanding","ipa":"/dɪˈmɑːndɪŋ/","pos":"adj","meaning":"đòi hỏi cao"},{"word":"population","ipa":"/ˌpɒpjuˈleɪʃn/","pos":"n","meaning":"dân số"},{"word":"populate","ipa":"/ˈpɒpjuleɪt/","pos":"v","meaning":"cư trú, sinh sống"},{"word":"populated","ipa":"/ˈpɒpjuleɪtɪd/","pos":"adj","meaning":"đông dân"},{"word":"opportunity","ipa":"/ˌɒpəˈtjuːnəti/","pos":"n","meaning":"cơ hội"},{"word":"opportune","ipa":"/ˈɒpətjuːn/","pos":"adj","meaning":"đúng lúc, thuận lợi"}],"mcq":[{"num":1,"question":"A cheerful ______ is very important in this kind of work.","options":["personality","personal","personally","person"],"answerIndex":0,"explanation":"Sau tính từ \"cheerful\" và ở vị trí chủ ngữ cần danh từ trừu tượng chỉ tính cách: \"personality\". \"personal\" là tính từ; \"personally\" là trạng từ; \"person\" chỉ một con người cụ thể nên không đi với \"cheerful … is important in this work\" theo nghĩa tính cách."},{"num":2,"question":"The manager ______ interviewed every single candidate.","options":["personal","personally","personality","person"],"answerIndex":1,"explanation":"Chỗ trống bổ nghĩa cho động từ \"interviewed\" nên cần trạng từ: \"personally\" (đích thân). \"personal\" là tính từ; \"personality/person\" là danh từ."},{"num":3,"question":"Employers should ______ a candidate's experience into account.","options":["make","put","bring","take"],"answerIndex":3,"explanation":"\"take sth into account\" (cân nhắc, tính đến điều gì) là cụm cố định. \"make/put/bring sth into account\" đều sai collocation."},{"num":4,"question":"You will need very good ______ to apply for this position.","options":["qualify","qualified","qualifications","qualifying"],"answerIndex":2,"explanation":"Sau \"very good\" cần danh từ số nhiều: \"qualifications\" (bằng cấp, trình độ). \"qualify\" là động từ; \"qualified/qualifying\" là tính từ."},{"num":5,"question":"Only ______ teachers are allowed to work in state schools.","options":["qualify","qualified","qualification","qualifying"],"answerIndex":1,"explanation":"Trước danh từ \"teachers\" cần tính từ: \"qualified teachers\" (giáo viên có đủ trình độ). \"qualify\" là động từ; \"qualification\" là danh từ; \"qualifying\" mang nghĩa \"đang đủ điều kiện\" nên không mô tả trình độ đã có."},{"num":6,"question":"He is a well-known ______ in children's diseases.","options":["speciality","specialise","specialist","specialised"],"answerIndex":2,"explanation":"Danh từ chỉ người có chuyên môn sâu là \"specialist\" (chuyên gia). \"speciality\" là lĩnh vực chuyên môn; \"specialise\" là động từ; \"specialised\" là tính từ."},{"num":7,"question":"Many young doctors ______ in surgery after five years of study.","options":["specialise","specialist","speciality","specialised"],"answerIndex":0,"explanation":"Câu ở thì hiện tại đơn với chủ ngữ số nhiều cần động từ: \"specialise in sth\" (chuyên về lĩnh vực gì). \"specialist/speciality\" là danh từ; \"specialised\" sai thì ở đây."},{"num":8,"question":"Fresh seafood is the ______ of this small family restaurant.","options":["special","specialise","specialist","speciality"],"answerIndex":3,"explanation":"\"the speciality of a restaurant\" (món đặc sản của nhà hàng) là cụm chuẩn. \"special\" là tính từ; \"specialise\" là động từ; \"specialist\" chỉ người."},{"num":9,"question":"As a ______, she makes more than three hundred cups of coffee a day.","options":["specialist","person","population","barista"],"answerIndex":3,"explanation":"Người pha chế cà phê là \"barista\". \"specialist\" là chuyên gia nói chung; \"person\" quá chung chung để đi với \"as a … she makes coffee\"; \"population\" là dân số."},{"num":10,"question":"The company plans to ______ twenty new engineers before June.","options":["hire","automate","populate","qualify"],"answerIndex":0,"explanation":"\"hire engineers\" (tuyển kỹ sư) là collocation chuẩn. \"automate\" (tự động hóa), \"populate\" (cư trú) và \"qualify\" (đủ điều kiện) không đi với \"twenty new engineers\"."},{"num":11,"question":"The doors of the supermarket open ______ when you walk towards them.","options":["automatic","automate","automatically","automation"],"answerIndex":2,"explanation":"Chỗ trống bổ nghĩa cho động từ \"open\" nên cần trạng từ: \"open automatically\" (tự động mở). \"automatic\" là tính từ; \"automate\" là động từ; \"automation\" là danh từ."},{"num":12,"question":"Many traditional skills have become ______ because of new machines.","options":["demanding","obsolete","populated","opportune"],"answerIndex":1,"explanation":"Sau \"have become\" cần tính từ, và \"because of new machines\" chốt nghĩa \"obsolete\" (lỗi thời). \"demanding\" (đòi hỏi cao), \"populated\" (đông dân) và \"opportune\" (đúng lúc) sai nghĩa."},{"num":13,"question":"Nursing is a very ______ job, both physically and emotionally.","options":["demanding","demand","demanded","demandingly"],"answerIndex":0,"explanation":"Trước danh từ \"job\" cần tính từ: \"a demanding job\" (công việc đòi hỏi cao). \"demand\" là danh từ/động từ; \"demanded\" là phân từ; \"demandingly\" là trạng từ."},{"num":14,"question":"There is a growing ______ for skilled electricians in this city.","options":["demanding","demanded","demands","demand"],"answerIndex":3,"explanation":"Sau \"a growing\" cần danh từ số ít: \"a demand for sb/sth\" (nhu cầu về ai/cái gì). \"demanding\" là tính từ; \"demanded\" là phân từ; \"demands\" số nhiều không đi với \"a\"."},{"num":15,"question":"The working ______ of this country is getting older every year.","options":["populate","population","populated","popular"],"answerIndex":1,"explanation":"Sau tính từ \"working\" cần danh từ: \"the working population\" (lực lượng lao động). \"populate\" là động từ; \"populated\" và \"popular\" là tính từ."},{"num":16,"question":"Learning a second language opens up many new ______.","options":["opportune","opportunity","opportunities","opportunely"],"answerIndex":2,"explanation":"Sau \"many new\" cần danh từ số nhiều: \"opportunities\" (cơ hội). \"opportunity\" số ít không đi với \"many\"; \"opportune\" là tính từ; \"opportunely\" là trạng từ."}],"gapfill":[{"num":1,"sentence":"Managers are ______ for the decisions they make.","answer":"accountable"},{"num":2,"sentence":"______ has completely changed the way cars are built.","answer":"Automation"},{"num":3,"sentence":"This city is one of the most densely ______ places in Asia.","answer":"populated"},{"num":4,"sentence":"You must pass this examination to ______ as a nurse.","answer":"qualify"},{"num":5,"sentence":"The hospital has a ______ unit for heart disease.","answer":"specialised"},{"num":6,"sentence":"Typewriters quickly became ______ when computers arrived.","answer":"obsolete"},{"num":7,"sentence":"The restaurant ______ three new waiters last week.","answer":"hired"},{"num":8,"sentence":"A scholarship like this is a golden ______ to study abroad.","answer":"opportunity"},{"num":9,"sentence":"Please do not ask her any questions about her ______ life.","answer":"personal"},{"num":10,"sentence":"Being a surgeon is extremely ______, both mentally and physically.","answer":"demanding"}]},"4":{"title":"SPEAKING","words":[{"word":"tour guide","ipa":"/ˈtʊə ɡaɪd/","pos":"n","meaning":"hướng dẫn viên du lịch"},{"word":"guide","ipa":"/ɡaɪd/","pos":"n, v","meaning":"hướng dẫn viên; hướng dẫn"},{"word":"guidance","ipa":"/ˈɡaɪdns/","pos":"n","meaning":"sự hướng dẫn"},{"word":"guided","ipa":"/ˈɡaɪdɪd/","pos":"adj","meaning":"có hướng dẫn"},{"word":"apprenticeship","ipa":"/əˈprentɪʃɪp/","pos":"n","meaning":"thời gian học nghề"},{"word":"apprentice","ipa":"/əˈprentɪs/","pos":"n","meaning":"người học việc"},{"word":"apprentice","ipa":"/əˈprentɪs/","pos":"v","meaning":"học nghề"},{"word":"patient","ipa":"/ˈpeɪʃnt/","pos":"adj","meaning":"kiên nhẫn"},{"word":"patience","ipa":"/ˈpeɪʃns/","pos":"n","meaning":"sự kiên nhẫn"},{"word":"patiently","ipa":"/ˈpeɪʃntli/","pos":"adv","meaning":"một cách kiên nhẫn"},{"word":"impatient","ipa":"/ɪmˈpeɪʃnt/","pos":"adj","meaning":"t
