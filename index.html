on","ipa":"/ˈvɪʒn/","pos":"n","meaning":"tầm nhìn; khả năng nhìn"}],"mcq":[{"num":1,"question":"He was adopted as a baby and met his ______ parents for the first time at the age of thirty.","options":["biology","biological","biologically","biologist"],"answerIndex":1,"explanation":"Trước danh từ \"parents\" cần tính từ: \"biological parents\" (cha mẹ ruột). \"biology\" và \"biologist\" là danh từ; \"biologically\" là trạng từ."},{"num":2,"question":"She was ______ by an American family when she was two years old.","options":["adoptive","adoption","adopted","adopt"],"answerIndex":2,"explanation":"Câu ở thể bị động \"was + V3\": \"was adopted\" (được nhận làm con nuôi). \"adoptive\" là tính từ chỉ người nhận nuôi; \"adoption\" là danh từ; \"adopt\" là động từ nguyên thể, không dùng sau \"was\"."},{"num":3,"question":"Although they were not related by blood, he loved his ______ family very much.","options":["adoptive","cancerous","stylish","visionary"],"answerIndex":0,"explanation":"\"adoptive family\" (gia đình nhận nuôi) khớp chính xác với chi tiết \"not related by blood\". \"cancerous\" (thuộc ung thư), \"stylish\" (thời trang) và \"visionary\" (có tầm nhìn xa) đều vô nghĩa khi mô tả \"family\" trong ngữ cảnh này."},{"num":4,"question":"The couple applied for ______ after waiting many years for a child.","options":["adopt","adopted","adoptive","adoption"],"answerIndex":3,"explanation":"Sau giới từ \"for\" cần danh từ: \"apply for adoption\" (làm thủ tục xin nhận con nuôi). \"adopt/adopted\" là động từ; \"adoptive\" là tính từ."},{"num":5,"question":"Steve Jobs wanted to make computers ______ to ordinary people, not just to experts.","options":["accessible","inaccessible","accessibility","access"],"answerIndex":0,"explanation":"\"make sth accessible to sb\" (làm cho ai dễ tiếp cận điều gì) cần tính từ. \"inaccessible\" trái nghĩa với \"not just to experts\"; \"accessibility\" và \"access\" là danh từ."},{"num":6,"question":"Before the new road was built, the village was almost ______ during the rainy season.","options":["accessible","accessibility","inaccessible","access"],"answerIndex":2,"explanation":"Chi tiết \"Before the new road was built\" và \"during the rainy season\" chốt nghĩa \"inaccessible\" (khó/không thể tiếp cận). \"accessible\" trái nghĩa; hai phương án còn lại là danh từ."},{"num":7,"question":"The company's ______ rose by forty per cent after the new phone was launched.","options":["sale","salesperson","selling","sales"],"answerIndex":3,"explanation":"\"sales\" (doanh số) là danh từ số nhiều, phù hợp với \"rose by forty per cent\". \"sale\" số ít nghĩa là một lần bán/đợt giảm giá; \"salesperson\" chỉ người; \"selling\" là V-ing, không dùng làm chủ ngữ ở đây."},{"num":8,"question":"He was ______ with pancreatic cancer in 2003.","options":["diagnosis","diagnosed","diagnostic","diagnose"],"answerIndex":1,"explanation":"\"be diagnosed with + tên bệnh\" (được chẩn đoán mắc bệnh) là cụm cố định ở thể bị động. \"diagnosis\" là danh từ; \"diagnostic\" là tính từ; \"diagnose\" là động từ nguyên thể."},{"num":9,"question":"A second specialist confirmed the doctor's ______.","options":["diagnose","diagnosed","diagnostic","diagnosis"],"answerIndex":3,"explanation":"Sau \"the doctor's\" cần danh từ làm tân ngữ của \"confirmed\": \"diagnosis\" (kết quả chẩn đoán). \"diagnose/diagnosed\" là động từ; \"diagnostic\" là tính từ."},{"num":10,"question":"He ______ college after only one semester because he could not afford the fees.","options":["dropped out of","bonded over","returned to","took part in"],"answerIndex":0,"explanation":"\"drop out of college\" (bỏ học đại học) đúng cả nghĩa lẫn giới từ, khớp với lý do \"could not afford the fees\". \"bond over\" (gắn kết nhờ điều gì), \"return to\" (quay lại) và \"take part in\" (tham gia) đều mâu thuẫn với ngữ cảnh."},{"num":11,"question":"Her grandmother ______ peacefully at home last winter.","options":["carried out","bonded over","passed away","dropped out of"],"answerIndex":2,"explanation":"\"pass away\" (qua đời) là cách nói trang trọng, khớp với \"peacefully at home\". \"carry out\", \"bond over\" và \"drop out of\" đều là cụm cần tân ngữ theo sau nên sai ngữ pháp, đồng thời sai nghĩa."},{"num":12,"question":"The board accepted his ______ and appointed a new director.","options":["resign","resignation","resigned","resigning"],"answerIndex":1,"explanation":"Sau \"his\" và làm tân ngữ của \"accepted\" cần danh từ: \"resignation\" (đơn xin từ chức). Ba phương án còn lại đều là dạng động từ."},{"num":13,"question":"As an ______, she draws the movements of cartoon characters frame by frame.","options":["animation","animator","animate","animated"],"answerIndex":1,"explanation":"\"as an + danh từ chỉ nghề nghiệp\": \"animator\" (họa sĩ hoạt hình). \"animation\" chỉ kỹ thuật/bộ phim hoạt hình, không chỉ người; \"animate\" là động từ; \"animated\" là tính từ."},{"num":14,"question":"Toy Story was the first full-length ______ film made entirely on computers.","options":["animated","animation","animator","animate"],"answerIndex":0,"explanation":"Trước danh từ \"film\" cần tính từ: \"animated film\" (phim hoạt hình). \"animation/animator\" là danh từ; \"animate\" là động từ."},{"num":15,"question":"The laboratory is equipped with ______ technology that no other hospital in the region has.","options":["unstylish","cancerous","cutting-edge","pancreatic"],"answerIndex":2,"explanation":"\"cutting-edge technology\" (công nghệ tiên tiến nhất) khớp với chi tiết \"no other hospital in the region has\". \"unstylish\" (không hợp thời trang), \"cancerous\" (thuộc ung thư) và \"pancreatic\" (thuộc tuyến tụy) đều vô nghĩa khi mô tả \"technology\"."},{"num":16,"question":"Many people describe Steve Jobs as a/an ______ leader who could see the future of technology.","options":["electronic","accessible","stylish","visionary"],"answerIndex":3,"explanation":"\"a visionary leader\" (nhà lãnh đạo có tầm nhìn xa) khớp với \"could see the future of technology\". \"electronic\" (thuộc điện tử), \"accessible\" (dễ tiếp cận) và \"stylish\" (thời trang) đều không mô tả được tầm nhìn của một nhà lãnh đạo."}],"gapfill":[{"num":1,"sentence":"The film earned 500 million dollars in its first week and became the ______ of the year.","answer":"blockbuster"},{"num":2,"sentence":"Father and son ______ over their shared love of football.","answer":"bonded"},{"num":3,"sentence":"Nowadays most documents are sent ______ instead of by post.","answer":"electronically"},{"num":4,"sentence":"Students in remote areas still have limited ______ to the internet.","answer":"access"},{"num":5,"sentence":"Einstein is often described as a ______ whose ideas changed physics for ever.","answer":"genius"},{"num":6,"sentence":"The new phone has a ______ display that responds to the lightest touch.","answer":"touch-screen"},{"num":7,"sentence":"She always dresses ______, choosing simple clothes in beautiful colours.","answer":"stylishly"},{"num":8,"sentence":"The ______ produces insulin and helps the body digest food.","answer":"pancreas"},{"num":9,"sentence":"Tests showed that the tumour was ______, so treatment began at once.","answer":"cancerous"},{"num":10,"sentence":"He ______ from his position as chief executive to spend more time with his family.","answer":"resigned"}]},"4":{"title":"SPEAKING","words":[{"word":"battle","ipa":"/ˈbætl/","pos":"n, v","meaning":"trận chiến; chiến đấu"},{"word":"battlefield","ipa":"/ˈbætlfiːld/","pos":"n","meaning":"chiến trường"},{"word":"Communist Party","ipa":"/ˈkɒmjənɪst ˈpɑːti/","pos":"n phr.","meaning":"Đảng Cộng sản"},{"word":"communist","ipa":"/ˈkɒmjənɪst/","pos":"n, adj","meaning":"người cộng sản; thuộc cộng sản"},{"word":"communism","ipa":"/ˈkɒmjənɪzəm/","pos":"n","meaning":"chủ nghĩa cộng sản"},{"word":"pass away","ipa":"/ˌpɑːs əˈweɪ/","pos":"phr.v","meaning":"qua đời"},{"word":"carry out","ipa":"/ˈkæri aʊt/","pos":"phr.v","meaning":"thực hiện, tiến hành"}],"mcq":[{"num":1,"question":"The ______ of Dien Bien Phu in 1954 lasted for fifty-six days.","options":["battle","battlefield","communism","army"],"answerIndex":0,"explanation":"\"the Battle of + địa danh\" (trận đánh tại…) là cách nói chuẩn cho một trận chiến cụ thể có thời lượng \"lasted for fifty-six days\". \"battlefield\" là chiến trường (địa điểm), \"communism\" (chủ nghĩa cộng sản) và \"army\" (quân đội) đều không thể \"lasted for fifty-six days\" theo nghĩa này."},{"num":2,"question":"Wounded soldiers were carried from the ______ to a field hospital nearby.","options":["battle","battlefield","army","duty"],"answerIndex":1,"explanation":"Sau \"carried from the\" cần danh từ chỉ nơi chốn: \"battlefield\" (chiến trường). \"battle\" chỉ trận đánh (sự kiện), \"army\" (quân đội) và \"duty\" (nhiệm vụ) không phải địa điểm để khiêng thương binh đi ra."},{"num":3,"question":"The research team ______ a series of experiments to test the new drug.","options":["passed away","dropped out of","carried out","bonded over"],"answerIndex":2,"explanation":"\"carry out an experiment\" (tiến hành thí nghiệm) là collocation chuẩn. \"pass away\" (qua đời) không có tân ngữ; \"drop out of\" (bỏ dở) và \"bond over\" (gắn kết nhờ điều gì) đều sai nghĩa với \"a series of experiments\"."},{"num":4,"question":"President Ho Chi Minh ______ on 2 September 1969.","options":["carried out","dropped out of","bonded over","passed away"],"answerIndex":3,"explanation":"\"pass away\" (qua đời) là cách nói trang trọng, phù hợp khi nói về ngày mất. Ba cụm còn lại đều bắt buộc phải có tân ngữ theo sau nên sai ngữ pháp, đồng thời sai nghĩa."},{"num":5,"question":"He devoted his life to spreading the ideas of ______ among workers and farmers.","options":["communism","communist","Communist Party","battlefield"],"answerIndex":0,"explanation":"\"the ideas of communism\" (những tư tưởng của chủ nghĩa cộng sản) — cần danh từ trừu tượng chỉ học thuyết. \"communist\" chỉ người cộng sản; \"Communist Party\" là một tổ chức và luôn cần mạo từ \"the\" đứng trước; \"battlefield\" sai nghĩa hoàn toàn."},{"num":6,"question":"Cuba has been a ______ country since 1959.","options":["heroic","voluntary","stylish","communist"],"answerIndex":3,"explanation":"Trước danh từ \"country\" cần tính từ: \"a communist country\" (một nước cộng sản), khớp với mốc thời gian 1959. \"heroic\" (quả cảm), \"voluntary\" (tự nguyện) và \"stylish\" (thời trang) đều không mô tả được thể chế chính trị của một quốc gia."},{"num":7,"question":"He joined the ______ at the age of nineteen and remained a member all his life.","options":["resistance war","field hospital","Communist Party","animated film"],"answerIndex":2,"explanation":"Chi tiết \"remained a member\" chốt nghĩa \"the Communist Party\" (Đảng Cộng sản) — chỉ tổ chức mới có \"member\". \"resistance war\" (cuộc kháng chiến), \"field hospital\" (bệnh viện dã chiến) và \"animated film\" (phim hoạt hình) đều không phải tổ chức để gia nhập và làm thành viên."},{"num":8,"question":"The government plans to ______ a survey on young people's reading habits.","options":["pass away","carry out","drop out of","bond over"],"answerIndex":1,"explanation":"\"carry out a survey\" (tiến hành một cuộc khảo sát) là collocation chuẩn. \"pass away\" không đi với tân ngữ; \"drop out of\" và \"bond over\" sai nghĩa hoàn toàn trong ngữ cảnh này."},{"num":9,"question":"In his memoir he described the fierce ______ he had taken part in during the war.","options":["battles","battlefields","armies","duties"],"answerIndex":0,"explanation":"\"take part in a battle\" (tham gia một trận đánh) là cách nói chuẩn, và tính từ \"fierce\" (ác liệt) mô tả trận đánh. \"battlefields\" là địa điểm, \"armies\" là các đội quân, \"duties\" là các nhiệm vụ — đều không đi với \"fierce\" theo nghĩa này."},{"num":10,"question":"The operation was ______ out by a team of five surgeons.","options":["passed","carried","dropped","based"],"answerIndex":1,"explanation":"Cụm \"carry out\" đã bị tách, phần \"out\" giữ nguyên trong câu nên chỗ trống cần \"carried\" ở dạng bị động \"was carried out\" (được tiến hành). \"passed out\" (ngất đi), \"dropped out\" (bỏ dở) và \"based out\" đều sai nghĩa hoặc sai cấu trúc."}],"gapfill":[{"num":1,"sentence":"Thousands of soldiers lost their lives on the ______ during the two resistance wars.","answer":"battlefield"},{"num":2,"sentence":"The ______ of Bach Dang River in 938 ended a thousand years of Chinese rule.","answer":"battle"},{"num":3,"sentence":"The great poet Nguyen Du ______ in 1820, leaving behind The Tale of Kieu.","answer":"passed away"},{"num":4,"sentence":"Scientists are ______ research into new treatments for cancer.","answer":"carrying out"},{"num":5,"sentence":"The ______ of Viet Nam was founded on 3 February 1930.","answer":"Communist Party"},{"num":6,"sentence":"Many ______ leaders of that generation had studied abroad before returning home.","answer":"communist"},{"num":7,"sentence":"Karl Marx and Friedrich Engels developed the theory of ______ in the nineteenth century.","answer":"communism"},{"num":8,"sentence":"The soldiers were ordered to ______ the plan at exactly midnight.","answer":"carry out"},{"num":9,"sentence":"Marie Curie ______ her whole life to scientific research.","answer":"devoted"},{"num":10,"sentence":"Among her many ______ were two Nobel Prizes in two different sciences.","answer":"achievements"}]},"5":{"title":"LISTENING","words":[{"word":"based on","ipa":"/ beɪst ɒn/","pos":"phr.v","meaning":"dựa trên"},{"word":"animated cartoon / film","ipa":"/ˈænɪmeɪtɪd kɑːˈtuːn/ ; /ˈænɪmeɪtɪd fɪlm/","pos":"n","meaning":"phim hoạt hình"},{"word":"live on stage","ipa":"/laɪv ɒn steɪdʒ/","pos":"phr.","meaning":"biểu diễn trực tiếp trên sân khấu"},{"word":"theme park","ipa":"/ˈθiːm pɑːk/","pos":"n","meaning":"công viên chủ đề"},{"word":"interact with","ipa":"/ˌɪntərˈækt wɪð/","pos":"phr.v","meaning":"tương tác với"},{"word":"interact","ipa":"/ˌɪntərˈækt/","pos":"v","meaning":"tương tác"},{"word":"interaction","ipa":"/ˌɪntərˈækʃn/","pos":"n","meaning":"sự tương tác"},{"word":"interactive","ipa":"/ˌɪntərˈæktɪv/","pos":"adj","meaning":"có tính tương tác"},{"word":"interactively","ipa":"/ˌɪntərˈæktɪvli/","pos":"adv","meaning":"một cách tương tác"},{"word":"impressive","ipa":"/ɪmˈpresɪv/","pos":"adj","meaning":"ấn tượng"},{"word":"impress","ipa":"/ɪmˈpres/","pos":"v","meaning":"gây ấn tượng"},{"word":"impression","ipa":"/ɪmˈpreʃn/","pos":"n","meaning":"ấn tượng"},{"word":"impressively","ipa":"/ɪmˈpresɪvli/","pos":"adv","meaning":"một cách ấn tượng"}],"mcq":[{"num":1,"question":"The film is ______ on the true story of a young musician.","options":["interacted","based","impressed","animated"],"answerIndex":1,"explanation":"\"be based on sth\" (dựa trên) là cụm cố định. \"be interacted on\", \"be impressed on\" và \"be animated on\" đều sai collocation và sai nghĩa."},{"num":2,"question":"Disneyland in California is the most famous ______ in the world.","options":["animated film","field hospital","theme park","touch screen"],"answerIndex":2,"explanation":"Disneyland là \"theme park\" (công viên chủ đề). \"animated film\" (phim hoạt hình), \"field hospital\" (bệnh viện dã chiến) và \"touch screen\" (màn hình cảm ứng) đều sai nghĩa hoàn toàn."},{"num":3,"question":"My little sister watches a/an ______ every evening before going to bed.","options":["animated film","theme park","touch screen","field hospital"],"answerIndex":0,"explanation":"Chỉ \"animated film\" (phim hoạt hình) mới là thứ có thể \"watch\" hằng tối. Ba cụm danh từ còn lại là địa điểm hoặc thiết bị nên không phù hợp với động từ \"watches\"."},{"num":4,"question":"Visitors can ______ with the cartoon characters and take photos with them.","options":["impress","animate","base","interact"],"answerIndex":3,"explanation":"\"interact with sb\" (tương tác với ai) đúng cả nghĩa lẫn giới từ. \"impress\", \"animate\" và \"base\" không đi với \"with\" theo nghĩa này."},{"num":5,"question":"There is much more ______ between teachers and students in small classes.","options":["interact","interactive","interaction","interactively"],"answerIndex":2,"explanation":"Sau \"much more\" và trước \"between\" cần danh từ không đếm được: \"interaction\" (sự tương tác). \"interact\" là động từ; \"interactive\" là tính từ; \"interactively\" là trạng từ."},{"num":6,"question":"The museum has an ______ exhibition where children can touch and move everything.","options":["interactive","interaction","interact","interactively"],"answerIndex":0,"explanation":"Trước danh từ \"exhibition\" cần tính từ: \"interactive\" (có tính tương tác), khớp với \"children can touch and move everything\"."},{"num":7,"question":"The new software allows learners to practise ______ instead of just listening.","options":["interactive","interaction","interact","interactively"],"answerIndex":3,"explanation":"Chỗ trống bổ nghĩa cho động từ \"practise\" nên cần trạng từ: \"interactively\" (một cách tương tác). \"interactive\" là tính từ; \"interaction\" là danh từ; \"interact\" là động từ."},{"num":8,"question":"The show was so ______ that the audience clapped for five minutes.","options":["impress","impressive","impression","impressively"],"answerIndex":1,"explanation":"Cấu trúc \"so + tính từ + that\" cần tính từ: \"impressive\" (ấn tượng). \"impress\" là động từ; \"impression\" là danh từ; \"impressively\" là trạng từ."},{"num":9,"question":"The young dancer performed ______ well for a girl of her age.","options":["impressively","impressive","impression","impress"],"answerIndex":0,"explanation":"Chỗ trống bổ nghĩa cho trạng từ \"well\" nên cần một trạng từ khác: \"impressively well\" (giỏi đến mức ấn tượng). Các phương án còn lại là tính từ, danh từ và động từ."},{"num":10,"question":"The theme park made a strong ______ on all the children.","options":["impressive","impress","impressively","impression"],"answerIndex":3,"explanation":"\"make an impression on sb\" (gây ấn tượng với ai) là cụm cố định, cần danh từ sau \"a strong\"."},{"num":11,"question":"The film failed to ______ the pting\" không tạo thành cụm chuẩn với \"process\" theo nghĩa này."},{"num":6,"question":"He worked as an ______ at a famous film studio for more than ten years.","options":["animator","animation","animate","animated"],"answerIndex":0,"explanation":"\"work as an + danh từ chỉ nghề nghiệp\": \"animator\" (họa sĩ hoạt hình). \"animation\" chỉ kỹ thuật/phim hoạt hình; \"animate\" là động từ; \"animated\" là tính từ."},{"num":7,"question":"Computer ______ has completely changed the way cartoons are made.","options":["animator","animation","animate","animated"],"answerIndex":1,"explanation":"Sau danh từ bổ nghĩa \"Computer\" cần một danh từ không đếm được làm chủ ngữ: \"computer animation\" (kỹ thuật hoạt hình máy tính). \"animator\" chỉ người nên không đi với \"has changed the way cartoons are made\" ở đây; \"animate\" là động từ; \"animated\" là tính từ."},{"num":8,"question":"Up and Frozen are two of the most successful ______ films of all time.","options":["animation","animator","animated","animate"],"answerIndex":2,"explanation":"Trước danh từ \"films\" cần tính từ: \"animated films\" (phim hoạt hình). \"animation/animator\" là danh từ; \"animate\" là động từ."},{"num":9,"question":"Special software is used to ______ the characters so that they seem to move naturally.","options":["animation","animator","animate","animated"],"answerIndex":2,"explanation":"Sau \"is used to\" trong cấu trúc \"be used to do sth\" cần động từ nguyên thể: \"animate the characters\" (tạo chuyển động cho các nhân vật). Các phương án còn lại là danh từ hoặc tính từ."},{"num":10,"question":"Several schools in the city have ______ a new method of teaching writing.","options":["dropped","adopted","carried","based"],"answerIndex":1,"explanation":"\"adopt a method\" (áp dụng một phương pháp) là collocation chuẩn — đây là nghĩa thứ hai của \"adopt\". \"dropped a method\" (bỏ đi), \"carried a method\" và \"based a method\" đều sai collocation hoặc mâu thuẫn với \"a new method\"."}],"gapfill":[{"num" "take part in an event\" (tham gia một sự kiện) đúng cả nghĩa lẫn giới từ. \"carry out\" đi với kế hoạch/nghiên cứu chứ không mang nghĩa tham dự; \"drop out of\" (bỏ dở) và \"bond over\" (gắn kết nhờ điều gì) sai nghĩa."},{"num":8,"question":"The company is famous for its ______ designs and fresh ideas.","options":["innovation","innovator","innovate","innovative"],"answerIndex":3,"explanation":"Trước danh từ \"designs\" cần tính từ: \"innovative designs\" (những thiết kế đổi mới). \"innovation/innovator\" là danh từ; \"innovate\" là động từ."},{"num":9,"question":"The smartphone was one of the most important ______ of the twenty-first century.","options":["innovators","innovations","innovative","innovate"],"answerIndex":1,"explanation":"Sau \"one of the most important\" cần danh từ số nhiều chỉ sự vật: \"innovations\" (những phát minh đổi mới). \"innovators\" chỉ người nên không phù hợp với \"the smartphone\"; \"innovative\" là tính từ; \"innovate\" là động từ."},{"num":10,"question":"The ______ decided to print another ten thousand copies of the novel.","options":["publisher","publication","publish","published"],"answerIndex":0,"explanation":"Chủ thể đưa ra quyết định phải là người hoặc tổ chức: \"publisher\" (nhà xuất bản). \"publication\" là ấn phẩm/sự xuất bản nên không thể \"decided\"; \"publish/published\" là động từ."},{"num":11,"question":"Her ______ to finish the marathon impressed everybody at the stadium.","options":["determine","determined","determinedly","determination"],"answerIndex":3,"explanation":"Sau \"Her\" và ở vị trí chủ ngữ cần danh từ: \"determination to do sth\" (sự quyết tâm làm gì). \"determine\" là động từ; \"determined\" là tính từ; \"determinedly\" là trạng từ."},{"num":12,"question":"Viet Nam declared its ______ on 2 September 1945.","options":["independent","independently","independence","depend"],"answerIndex":2,"explanation":"Sau tính từ sở hữu \"its\" cần danh từ: \"declare independence\" (tuyên bố độc lập). \"independent\" là tính từ; \"independently\" là trạng từ; \"depend\" là động từ."},{"num":13,"question":"The rapid ______ of the empire brought enormous wealth to its rulers.","options":["expansion","expand","expansive","expanded"],"answerIndex":0,"explanation":"Sau \"The rapid\" và ở vị trí chủ ngữ cần danh từ: \"expansion\" (sự mở rộng). \"expand/expanded\" là động từ; \"expansive\" là tính từ."},{"num":14,"question":"After a ______ discussion lasting three hours, the committee finally reached a decision.","options":["length","lengthen","lengthily","lengthy"],"answerIndex":3,"explanation":"Trước danh từ \"discussion\" cần tính từ: \"a lengthy discussion\" (một cuộc thảo luận dài), khớp với \"lasting three hours\". \"length\" là danh từ; \"lengthen\" là động từ; \"lengthily\" là trạng từ."},{"num":15,"question":"The invading army was completely ______ in the final battle.","options":["defeat","defeating","defeated","defeats"],"answerIndex":2,"explanation":"Câu ở thể bị động \"was + V3\": \"was defeated\" (bị đánh bại). \"defeat/defeats\" là động từ ở dạng chủ động; \"defeating\" là V-ing, không tạo thành bị động sau \"was\" theo nghĩa này."},{"num":16,"question":"He is an ______ young man who wants to run his own company before he is thirty.","options":["ambition","ambitious","ambitiously","ambitions"],"answerIndex":1,"explanation":"Trước cụm danh từ \"young man\" cần tính từ: \"an ambitious young man\" (một chàng trai đầy tham vọng). \"ambition/ambitions\" là danh từ; \"ambitiously\" là trạng từ."}],"gapfill":[{"num":1,"sentence":"Archaeologists have discovered an ______ temple more than two thousand years old.","answer":"ancient"},{"num":2,"sentence":"The Roman ______ once stretched from Britain to North Africa.","answer":"empire"},{"num":3,"sentence":"Foreign ______ came to Hoi An to buy silk and ceramics.","answer":"traders"},{"num":4,"sentence":"He ______ calm even when everyone around him was panicking.","answer":"remained"},{"num":5,"sentence":"The team played ______ well and won ","meaning":"thu hút"},{"word":"Attractive","ipa":"/əˈtræktɪv/","pos":"adj","meaning":"hấp dẫn"},{"word":"Attractively","ipa":"/əˈtræktɪvli/","pos":"adv","meaning":"một cách hấp dẫn"},{"word":"Tug of war","ipa":"/ˌtʌɡ əv ˈwɔː(r)/","pos":"n","meaning":"trò kéo co"},{"word":"Bamboo dancing","ipa":"/bæmˈbuː ˈdɑːnsɪŋ/","pos":"n","meaning":"múa sạp"},{"word":"Spring roll","ipa":"/ˌsprɪŋ ˈrəʊl/","pos":"n","meaning":"chả giò; nem rán"},{"word":"Grilled","ipa":"/ɡrɪld/","pos":"adj","meaning":"nướng"},{"word":"Grill","ipa":"/ɡrɪl/","pos":"v, n","meaning":"nướng; vỉ nướng"},{"word":"Meatball","ipa":"/ˈmiːtbɔːl/","pos":"n","meaning":"thịt viên"}],"mcq":[{"num":1,"question":"Singapore is a/an ______ society in which four official languages are used side by side.","options":["spicy","multicultural","grilled","attractive"],"answerIndex":1,"explanation":"\"a multicultural society\" (xã hội đa văn hóa) khớp với chi tiết \"four official languages\". \"spicy\" (cay), \"grilled\" (nướng) và \"attractive\" (hấp dẫn) đều không mô tả được cơ cấu văn hóa của một xã hội."},{"num":2,"question":"The government promotes ______ by supporting the festivals of every ethnic group.","options":["cuisine","autograph","multiculturalism","booth"],"answerIndex":2,"explanation":"\"multiculturalism\" (chủ nghĩa đa văn hóa) là danh từ trừu tượng duy nhất phù hợp với \"supporting the festivals of every ethnic group\". \"cuisine\" (ẩm thực), \"autograph\" (chữ ký) và \"booth\" (gian hàng) sai nghĩa."},{"num":3,"question":"The food fair celebrates the cultural ______ of the city, with dishes from more than twenty countries.","options":["diverse","diversify","diversely","diversity"],"answerIndex":3,"explanation":"Sau \"the cultural\" cần danh từ: \"diversity\" (sự đa dạng). \"diverse\" là tính từ; \"diversify\" là động từ; \"diversely\" là trạng từ."},{"num":4,"question":"Our school has a very ______ student body, with pupils from fifteen different countries.","options":["diverse","diversity","diversify","diversely"],"answerIndex":0,"explanation":"Trước cụm danh từ \"student body\" cần tính từ: \"diverse\" (đa dạng). \"diversity\" là danh từ; \"diversify\" là động từ; \"diversely\" là trạng từ."},{"num":5,"question":"The restaurant plans to ______ its menu by adding Thai and Indian dishes.","options":["diversify","diversity","diverse","diversely"],"answerIndex":0,"explanation":"Sau \"plans to\" cần động từ nguyên thể: \"diversify its menu\" (đa dạng hóa thực đơn). Các phương án còn lại là danh từ, tính từ và trạng từ."},{"num":6,"question":"All the food stalls were crowded, ______ the one selling grilled meatballs.","options":["particular","particularity","particulars","particularly"],"answerIndex":3,"explanation":"Chỗ trống cần trạng từ để nhấn mạnh một trường hợp nổi bật: \"particularly\" (đặc biệt là). \"particular\" là tính từ; \"particularity/particulars\" là danh từ."},{"num":7,"question":"Is there any ______ dish you would like to try at the food festival?","options":["particularly","particularity","particular","particulars"],"answerIndex":2,"explanation":"Trước danh từ \"dish\" cần tính từ: \"any particular dish\" (món cụ thể nào). \"particularly\" là trạng từ; \"particularity/particulars\" là danh từ."},{"num":8,"question":"Vietnamese ______ is famous for its fresh herbs and light flavours.","options":["booth","cuisine","autograph","attraction"],"answerIndex":1,"explanation":"\"cuisine\" (ẩm thực) là danh từ duy nhất đi với \"fresh herbs and light flavours\". \"booth\" (gian hàng), \"autograph\" (chữ ký) và \"attraction\" (điểm thu hút) sai nghĩa."},{"num":9,"question":"The curry was far too ______ for the children, so they drank a lot of water.","options":["grilled","delicious","attractive","spicy"],"answerIndex":3,"explanation":"Chi tiết \"they drank a lot of water\" chốt nghĩa \"spicy\" (cay). \"grilled\" (nướng), \"delicious\" (ngon) và \"attractive\" (hấp dẫn) không giải thích được việc phải uống nhiều nước."},{"num":10,"question":"Ginger, pepper and chilli are common ______ in Asian cooking.","options":["booths","spices","autographs","attractions"],"answerIndex":1,"explanation":"Gừng, tiêu và ớt là \"spices\" (gia vị). \"booths\" (gian hàng), \"autographs\" (chữ ký) và \"attractions\" (điểm thu hút) đều sai nghĩa."},{"num":11,"question":"After the show, hundreds of fans queued to get the singer's ______.","options":["cuisine","booth","autograph","meatball"],"answerIndex":2,"explanation":"\"get someone's autograph\" (xin chữ ký của người nổi tiếng) là collocation chuẩn, khớp với \"fans queued\". Ba danh từ còn lại sai nghĩa hoàn toàn."},{"num":12,"question":"Each class set up a food ______ decorated with flags and paper flowers.","options":["booth","spice","autograph","diversity"],"answerIndex":0,"explanation":"\"a food booth\" (gian hàng đồ ăn) là nơi có thể \"set up\" và \"decorate\". \"spice\" (gia vị), \"autograph\" (chữ ký) và \"diversity\" (sự đa dạng) không phải vật thể để dựng lên và trang trí."},{"num":13,"question":"The spring rolls were ______ crispy and disappeared within minutes.","options":["attractively","particularly","generally","deliciously"],"answerIndex":3,"explanation":"Chỗ trống bổ nghĩa cho tính từ \"crispy\" và phải diễn tả vị ngon: \"deliciously crispy\" (giòn ngon). \"attractively\" (một cách hấp dẫn về hình thức), \"particularly\" (đặc biệt là) và \"generally\" (nói chung) không diễn tả được vị ngon khiến món ăn hết trong vài phút."},{"num":14,"question":"The tug of war was the main ______ of the sports day.","options":["attraction","attract","attractive","attractively"],"answerIndex":0,"explanation":"Sau \"the main\" cần danh từ: \"attraction\" (điểm thu hút). \"attract\" là động từ; \"attractive\" là tính từ; \"attractively\" là trạng từ."},{"num":15,"question":"The stall looked very ______ with its colourful lanterns and fresh flowers.","options":["attraction","attract","attractive","attractively"],"answerIndex":2,"explanation":"Sau động từ nối \"looked\" cần tính từ: \"attractive\" (hấp dẫn, bắt mắt). \"attraction\" là danh từ; \"attract\" là động từ; \"attractively\" là trạng từ."},{"num":16,"question":"The bamboo dancing performance ______ a huge crowd of visitors.","options":["attraction","attracted","attractive","attractively"],"answerIndex":1,"explanation":"Câu cần động từ chính chia quá khứ: \"attracted a crowd\" (thu hút một đám đông). \"attraction\" là danh từ; \"attractive\" là tính từ; \"attractively\" là trạng từ."}],"gapfill":[{"num":1,"sentence":"At the food fair we tried ______ pork served with fresh rice noodles.","answer":"grilled"},{"num":2,"sentence":"The chef made hundreds of ______ from minced beef and chopped herbs.","answer":"meatballs"},{"num":3,"sentence":"My favourite Vietnamese dish is the fried ______, crispy outside and soft inside.","answer":"spring roll"},{"num":4,"sentence":"The tables were ______ arranged with flowers and small paper lanterns.","answer":"attractively"},{"num":5,"sentence":"Everyone agreed that the chicken soup was absolutely ______.","answer":"delicious"},{"num":6,"sentence":"In ______, two teams pull a rope in opposite directions until one side wins.","answer":"tug of war"},{"num":7,"sentence":"______ is a traditional performance in which dancers jump between long poles.","answer":"Bamboo dancing"},{"num":8,"sentence":"London is a truly ______ city where more than three hundred languages are spoken.","answer":"multicultural"},{"num":9,"sentence":"Da Nang has become a major tourist ______ in recent years.","answer":"attraction"},{"num":10,"sentence":"Vietnamese cooks use fresh herbs and ______ such as garlic, ginger and chilli.","answer":"spices"}]},"2":{"title":"LANGUAGE","words":[{"word":"be based on","ipa":"/biː beɪst ɒn/","pos":"V. phr.","meaning":"được dựa trên, dựa vào"},{"word":"base","ipa":"/beɪs/","pos":"N. / V.","meaning":"nền tảng, cơ sở / dựa vào"},{"word":"basic","ipa":"/ˈbeɪsɪk/","pos":"Adj.","meaning":"cơ bản, căn bản"},{"word":"attend school","ipa":"/əˈtend skuːl/","pos":"V. phr.","meaning":"đi học, đến trường"},{"word":"attend college","ipa":"/əˈtend ˈkɒlɪdʒ/","pos":"V. phr.","meaning":"học đại học / cao đẳng"},{"word":"attendance","ipa":"/əˈtendəns/","pos":"N.","meaning":"sự tham dự, sự có mặt"},{"word":"be admired for","ipa":"/biː ədˈmaɪəd fə(r)/","pos":"V. phr.","meaning":"được ngưỡng mộ vì điều gì"},{"word":"admire","ipa":"/əˈmaɪə(r)/","pos":"V.","meaning":"ngưỡng mộ, khâm phục"},{"word":"admiration","ipa":"/ˌædməˈreɪʃn/","pos":"N.","meaning":"sự ngưỡng mộ"},{"word":"admirable","ipa":"/ˈædmərəbl/","pos":"Adj.","meaning":"đáng ngưỡng mộ"},{"word":"achieve","ipa":"/əˈtʃiːv/","pos":"V.","meaning":"đạt được, giành được"},{"word":"achievement","ipa":"/əˈtʃiːvmənt/","pos":"N.","meaning":"thành tựu, thành tích"},{"word":"achievable","ipa":"/əˈtʃiːvəbl/","pos":"Adj.","meaning":"có thể đạt được"},{"word":"include","ipa":"/ɪnˈkluːd/","pos":"V.","meaning":"bao gồm, gồm có"},{"word":"inclusion","ipa":"/ɪnˈkluːʒn/","pos":"N.","meaning":"sự bao gồm, sự tính cả vào"},{"word":"inclusive","ipa":"/ɪnˈkluːsɪv/","pos":"Adj.","meaning":"bao gồm cả, tính toàn bộ"}],"mcq":[{"num":1,"question":"The film is ______ on a true story about a multicultural family in London.","options":["admired","included","achieved","based"],"answerIndex":3,"explanation":"\"be based on sth\" (được dựa trên) là cụm cố định. \"be admired on\", \"be included on\" và \"be achieved on\" đều sai giới từ và sai nghĩa."},{"num":2,"question":"Everyone should learn some ______ cooking skills before living away from home.","options":["base","basic","based","basically"],"answerIndex":1,"explanation":"Trước cụm danh từ \"cooking skills\" cần tính từ: \"basic\" (cơ bản). \"base\" là danh từ/động từ; \"based\" là phân từ; \"basically\" là trạng từ."},{"num":3,"question":"The company has its ______ in Ha Noi and offices in five other cities.","options":["basic","based","base","basically"],"answerIndex":2,"explanation":"Sau tính từ sở hữu \"its\" cần danh từ: \"base\" (trụ sở, cơ sở), đối lập với \"offices in five other cities\". \"basic\" là tính từ; \"based\" là phân từ; \"basically\" là trạng từ."},{"num":4,"question":"The teacher checks ______ at the start of every class.","options":["attendance","attend","attended","attending"],"answerIndex":0,"explanation":"Sau động từ \"checks\" cần danh từ làm tân ngữ: \"attendance\" (sĩ số, sự có mặt). Ba phương án còn lại đều là dạng động từ."},{"num":5,"question":"Children in Viet Nam usually ______ school from the age of six.","options":["attendance","attending","attend","attended"],"answerIndex":2,"explanation":"Câu ở thì hiện tại đơn với trạng từ \"usually\" và chủ ngữ số nhiều nên cần \"attend school\" (đi học). \"attendance\" là danh từ; \"attending\" không đứng một mình làm động từ chính; \"attended\" sai thì với \"usually\"."},{"num":6,"question":"She is widely ______ for her work with refugee children.","options":["admiration","admired","admirable","admirably"],"answerIndex":1,"explanation":"\"be admired for sth\" (được ngưỡng mộ vì điều gì) là cụm cố định ở thể bị động. \"admiration\" là danh từ; \"admirable\" là tính từ và không đi với \"for\" theo cấu trúc này; \"admirably\" là trạng từ."},{"num":7,"question":"He stood in front of the painting and looked at it with great ______.","options":["admiration","admire","admirable","admirably"],"answerIndex":0,"explanation":"Sau \"with great\" cần danh từ: \"admiration\" (sự ngưỡng mộ). \"admire\" là động từ; \"admirable\" là tính từ; \"admirably\" là trạng từ."},{"num":8,"question":"Her patience with the young students is truly ______.","options":["admiration","admire","admirably","admirable"],"answerIndex":3,"explanation":"Sau \"is truly\" cần tính từ làm bổ ngữ cho chủ ngữ \"patience\": \"admirable\" (đáng ngưỡng mộ). \"admirably\" là trạng từ nên không bổ nghĩa cho danh từ chủ ngữ."},{"num":9,"question":"Learning three languages before the age of twenty is a remarkable ______.","options":["achievement","achieve","achievable","achieved"],"answerIndex":0,"explanation":"Sau \"a remarkable\" cần danh từ: \"achievement\" (thành tựu). \"achieve/achieved\" là động từ; \"achievable\" là tính từ."},{"num":10,"question":"Set goals that are ______ so that you do not lose your motivation.","options":["achievement","achievable","achieve","achieved"],"answerIndex":1,"explanation":"Sau \"are\" trong mệnh đề quan hệ cần tính từ: \"achievable\" (có thể đạt được), khớp với \"do not lose your motivation\". \"achievement\" là danh từ; \"achieve/achieved\" là động từ."},{"num":11,"question":"The ticket price does not ______ food and drinks.","options":["inclusion","inclusive","included","include"],"answerIndex":3,"explanation":"Sau trợ động từ \"does not\" cần động từ nguyên thể: \"include\" (bao gồm). \"inclusion\" là danh từ; \"inclusive\" là tính từ; \"included\" sai dạng sau \"does not\"."},{"num":12,"question":"The school has an ______ policy that welcomes children of all abilities.","options":["inclusion","include","inclusive","included"],"answerIndex":2,"explanation":"Trước danh từ \"policy\" cần tính từ: \"an inclusive policy\" (chính sách hòa nhập). \"inclusion\" là danh từ; \"include/included\" là động từ."},{"num":13,"question":"The ______ of local dishes in the menu pleased international visitors.","options":["inclusion","include","inclusive","included"],"answerIndex":0,"explanation":"Chủ ngữ của \"pleased\" cần danh từ: \"the inclusion of sth\" (việc đưa cái gì vào). \"include/included\" là động từ; \"inclusive\" là tính từ."}],"gapfill":[{"num":1,"sentence":"His speech was ______ on his own experience of living abroad.","answer":"based"},{"num":2,"sentence":"Students need only ______ knowledge of English to follow this course.","answer":"basic"},{"num":3,"sentence":"Poor ______ at the evening classes worried the head teacher.","answer":"attendance"},{"num":4,"sentence":"She hopes to ______ college in Australia next year.","answer":"attend"},{"num":5,"sentence":"Many young people ______ her for her courage and honesty.","answer":
