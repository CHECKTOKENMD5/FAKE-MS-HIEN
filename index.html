};
</script>
<script>
(function () {
  "use strict";
  var DATA = window.__DATA__;
  var ASSETS = window.__ASSETS__;
  document.getElementById('logoImg').src = ASSETS.logo;
  document.getElementById('watermark').src = ASSETS.watermark;

  /* ======================= UTILS ======================= */
  var $ = function(s,r){ return (r||document).querySelector(s); };
  var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
  function h(tag, props) {
    var e = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'style') e.style.cssText = v;
      else if (k === 'dataset') for (var d in v) e.dataset[d] = v[d];
      else if (k.indexOf('on') === 0 && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) { c.forEach(function(x){ if(x!=null&&x!==false) e.appendChild(x instanceof Node ? x : document.createTextNode(String(x))); }); }
      else e.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return e;
  }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function strip(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase(); }
  function wordKey(u,l,w){ return u+'_'+l+'_'+w.word+'_'+w.meaning; }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  /* ======================= THEME ======================= */
  var THEME_KEY='v12_theme';
  function getTheme(){ return localStorage.getItem(THEME_KEY) || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  function setTheme(t){
    document.documentElement.setAttribute('data-theme',t);
    localStorage.setItem(THEME_KEY,t);
    var b=$('#themeBtn'); if(b) b.textContent = t==='dark' ? '☀️' : '🌙';
  }
  setTheme(getTheme());
  $('#themeBtn').addEventListener('click', function(){ setTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark'); });

  /* ======================= STORAGE ======================= */
  var PRE='v12_';
  function loadJSON(k,fb){ try{ var v=localStorage.getItem(PRE+k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
  function saveJSON(k,v){ try{ localStorage.setItem(PRE+k,JSON.stringify(v)); }catch(e){} }
  var profile = loadJSON('profile', null);
  var ID_PATTERN = /^\d{4}A\d{2}N\d{2}$/;
  var progress = null;
  function pKey(){ return 'progress_'+(profile?profile.id:'guest'); }
  function loadProgress(){ progress = loadJSON(pKey(), { known:{}, results:{}, bookmarks:{}, notes:{}, srs:{}, xp:0, streak:0, bestStreak:0, lastDay:null, ach:{} }); }
  function saveProgress(){ saveJSON(pKey(), progress); }
  loadProgress();

  /* ======================= STREAK / XP ======================= */
  function touchStreak(){
    var today=new Date().toDateString();
    if(progress.lastDay===today) return;
    var y=new Date(Date.now()-86400000).toDateString();
    if(progress.lastDay===y) progress.streak=(progress.streak||0)+1;
    else progress.streak=1;
    progress.bestStreak=Math.max(progress.bestStreak||0, progress.streak);
    progress.lastDay=today;
    saveProgress();
  }
  function addXP(n){ progress.xp=(progress.xp||0)+n; saveProgress(); }
  function recordResult(u,l,act,score,total){
    var k=u+'_'+l;
    if(!progress.results[k]) progress.results[k]={};
    var r=progress.results[k][act] || {attempts:0,bestScore:0,bestTotal:total};
    r.attempts++; r.lastScore=score; r.lastTotal=total;
    if(r.attempts===1 || score>r.bestScore){ r.bestScore=score; r.bestTotal=total; }
    progress.results[k][act]=r; saveProgress(); touchStreak(); addXP(score*10);
  }
  function toggleBookmark(k){ if(progress.bookmarks[k]) delete progress.bookmarks[k]; else progress.bookmarks[k]=true; saveProgress(); }
  function getNote(k){ return progress.notes[k]||''; }
  function setNote(k,v){ if(v && v.trim()) progress.notes[k]=v.trim(); else delete progress.notes[k]; saveProgress(); }

  /* ======================= SRS ======================= */
  function srsUpdate(k,q){
    var s = progress.srs[k] || { ease:2.5, interval:0, reps:0, due:0 };
    if(q<3){ s.reps=0; s.interval=0; }
    else { s.reps++; if(s.reps===1) s.interval=1; else if(s.reps===2) s.interval=6;
      else s.interval=Math.round(s.interval*s.ease);
      s.ease=Math.max(1.3, s.ease + (0.1 - (5-q)*(0.08+(5-q)*0.02)));
    }
    s.due=Date.now()+s.interval*86400000;
    progress.srs[k]=s; saveProgress();
  }
  function srsDue(){
    var now=Date.now(); var out=[];
    Object.keys(progress.srs||{}).forEach(function(k){
      if(progress.srs[k].due<=now){
        // find word from key
        var p=k.split('_');
        if(p.length>=4){
          var u=p[0],l=p[1],word=p[2],meaning=p.slice(3).join('_');
          var d=DATA[u] && DATA[u][l];
          if(d){ var w=d.words.find(function(x){return x.word===word && x.meaning===meaning;}); if(w) out.push({u:u,l:l,w:w,srs:progress.srs[k],key:k}); }
        }
      }
    });
    return out;
  }

  /* ======================= TTS ======================= */
  var ttsOK='speechSynthesis' in window; var enVoice=null;
  function pickVoice(){ if(!ttsOK) return; var vs=speechSynthesis.getVoices();
    enVoice = vs.find(function(v){return /en[-_]?(US|GB)/i.test(v.lang);}) || vs.find(function(v){return /^en/i.test(v.lang);}) || null; }
  if(ttsOK){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function speak(text, rate){
    if(!ttsOK||!text) return;
    try{
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.lang = enVoice ? enVoice.lang : 'en-US';
      if(enVoice) u.voice=enVoice;
      u.rate = rate || parseFloat(localStorage.getItem('v12_tts_rate')||'0.9');
      speechSynthesis.speak(u);
    }catch(e){}
  }
  function spkBtn(text,cls){
    if(!ttsOK) return null;
    var b=h('button',{class:cls||'spk-btn',type:'button','aria-label':'Pronounce'});
    b.innerHTML='🔊';
    b.addEventListener('click',function(ev){ev.stopPropagation(); b.classList.add('playing'); speak(text); setTimeout(function(){b.classList.remove('playing');},1200);});
    return b;
  }

  /* ======================= TOAST / MODAL ======================= */
  var toastEl=$('#toast');
  var toastTimer=null;
  function toast(msg,dur){
    toastEl.textContent=msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){toastEl.classList.remove('show');}, dur||2000);
  }
  function openModal(content){
    var bd=h('div',{class:'modal-backdrop',onclick:function(e){if(e.target===bd) close();}});
    var card=h('div',{class:'modal-card'},[content]);
    bd.appendChild(card); document.body.appendChild(bd);
    function close(){ bd.remove(); }
    bd.close=close;
    return bd;
  }

  /* ======================= ACHIEVEMENTS ======================= */
  var ACHIEVEMENTS=[
    { id:'first',   icon:'🎯', name:'First Step',    desc:'Complete 1 lesson activity',  check:function(){ return countActivities()>=1; } },
    { id:'ten',     icon:'📚', name:'Bookworm',      desc:'Learn 10 words',              check:function(){ return knownCount()>=10; } },
    { id:'fifty',   icon:'🧠', name:'Scholar',       desc:'Learn 50 words',              check:function(){ return knownCount()>=50; } },
    { id:'streak3', icon:'🔥', name:'On Fire',       desc:'3-day streak',                check:function(){ return (progress.streak||0)>=3; } },
    { id:'streak7', icon:'⚡', name:'Unstoppable',   desc:'7-day streak',                check:function(){ return (progress.streak||0)>=7; } },
    { id:'perfect', icon:'🏆', name:'Perfectionist', desc:'100% on any quiz',            check:function(){ return hasPerfect(); } },
    { id:'xp500',   icon:'⭐', name:'Star Collector',desc:'Earn 500 XP',                 check:function(){ return (progress.xp||0)>=500; } },
    { id:'xp2000',  icon:'💎', name:'Diamond',       desc:'Earn 2000 XP',                check:function(){ return (progress.xp||0)>=2000; } },
    { id:'bookmark',icon:'🔖', name:'Bookmarker',    desc:'Save 10 words',               check:function(){ return bookmarkCount()>=10; } },
    { id:'explore', icon:'🗺️', name:'Explorer',      desc:'Try 5 different activities',  check:function(){ return countActivities()>=5; } },
    { id:'master',  icon:'👑', name:'Master',        desc:'Learn all words in 1 unit',   check:function(){ return unitMastered(); } },
    { id:'allrounder',icon:'🎓',name:'All-Rounder',  desc:'Learn 200 words',             check:function(){ return knownCount()>=200; } }
  ];
  function countActivities(){ var c=0; Object.keys(progress.results||{}).forEach(function(k){ Object.keys(progress.results[k]).forEach(function(){ c++; }); }); return c; }
  function bookmarkCount(){ return Object.keys(progress.bookmarks||{}).length; }
  function hasPerfect(){
    var yes=false;
    Object.keys(progress.results||{}).forEach(function(k){
      Object.keys(progress.results[k]).forEach(function(a){
        var r=progress.results[k][a];
        if(r.bestScore===r.bestTotal && r.bestTotal>0) yes=true;
      });
    });
    return yes;
  }
  function unitMastered(){
    var yes=false;
    unitList().forEach(function(u){
      var tot=0, kn=0;
      lessonList(u).forEach(function(l){ var d=lessonData(u,l); if(!d) return; d.words.forEach(function(w){tot++; if(progress.known[wordKey(u,l,w)]) kn++;}); });
      if(tot>0 && kn===tot) yes=true;
    });
    return yes;
  }
  function refreshAchievements(){
    var unlocked=[];
    ACHIEVEMENTS.forEach(function(a){
      if(!progress.ach[a.id] && a.check()){
        progress.ach[a.id]=Date.now();
        unlocked.push(a);
      }
    });
    if(unlocked.length){ saveProgress(); unlocked.forEach(function(a){ toast('🏅 '+a.name+' unlocked!',2500); }); }
  }

  /* ======================= DATA HELPERS ======================= */
  function unitList(){ return Object.keys(DATA).map(Number).sort(function(a,b){return a-b;}); }
  function lessonList(u){ return Object.keys(DATA[u]||{}).map(Number).sort(function(a,b){return a-b;}); }
  function lessonData(u,l){
    var d=DATA[u]&&DATA[u][l]?DATA[u][l]:null;
    return (d&&d.words&&d.words.length>0)?d:null;
  }
  function allWords(){
    var out=[];
    unitList().forEach(function(u){
      lessonList(u).forEach(function(l){
        var d=lessonData(u,l);
        if(d) d.words.forEach(function(w){ out.push({u:u,l:l,w:w,key:wordKey(u,l,w)}); });
      });
    });
    return out;
  }
  function knownCount(){ var c=0; allWords().forEach(function(x){ if(progress.known[x.key]) c++; }); return c; }
  function totalWordsCount(){ return allWords().length; }
  function unitTitle(u){
    var t={1:'Our Lives',2:'Humans & Environment',3:'Global Issues',4:'Urbanisation',5:'World of Work',6:'AI & Technology',7:'Media & Culture',8:'Conservation',9:'Career Paths',10:'Lifelong Learning'};
    return t[u]||('Unit '+u);
  }
  function wordOfTheDay(){
    var all=allWords(); if(!all.length) return null;
    var d=new Date(); var seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
    return all[seed%all.length];
  }

  /* ======================= CONFETTI ======================= */
  function confetti(){
    var colors=['#d4a72c','#1b3a5c','#0f9d58','#dc3545','#f0c75e','#3b82f6','#8b5cf6','#ec4899'];
    for(var i=0;i<80;i++){
      (function(){
        var p=document.createElement('div');
        var sz=5+Math.random()*9;
        p.style.cssText='position:fixed;left:'+(50+Math.random()*20-10)+'%;top:38%;width:'+sz+'px;height:'+sz+'px;background:'+colors[i%colors.length]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';pointer-events:none;z-index:99999;';
        document.body.appendChild(p);
        var dx=(Math.random()-.5)*720, dy=-180-Math.random()*320, rot=Math.random()*900-450, dur=1200+Math.random()*900;
        p.animate([
          {transform:'translate(0,0) rotate(0)', opacity:1},
          {transform:'translate('+dx+'px,'+dy+'px) rotate('+rot+'deg)', opacity:1, offset:.5},
          {transform:'translate('+(dx*1.2)+'px,'+(dy+900)+'px) rotate('+(rot*1.5)+'deg)', opacity:0}
        ],{duration:dur, easing:'cubic-bezier(.22,1,.36,1)'}).onfinish=function(){p.remove();};
      })();
    }
  }

  /* ======================= DAILY CHALLENGE ======================= */
  function renderDailyChallenge(){
    var all=allWords();
    var sessDC=getS('_','_','dc',function(){
      var questions=shuffle(all).slice(0,10).map(function(x){
        var pool=all.filter(function(y){return y.key!==x.key && y.w.meaning!==x.w.meaning;});
        var dsh=shuffle(pool).slice(0,3);
        return {correct:x, dsh:dsh, order:null, answered:false, sel:null};
      });
      return {qs:questions, idx:0, score:0, wrong:[]};
    });
    var frag=h('div');
    var q=sessDC.qs;
    if(sessDC.idx>=q.length){
      confetti();
      var p=Math.round(sessDC.score/q.length*100);
      var rc=h('div',{class:'result-card'},[
        h('span',{class:'score-emoji'},[p>=90?'🏆':p>=70?'🎉':p>=50?'👍':'💪']),
        h('div',{class:'score-big'},[sessDC.score+' / '+q.length]),
        h('div',{class:'score-sub'},[p+'% correct'])
      ]);
      if(sessDC.wrong.length){
        rc.appendChild(h('div',{style:'text-align:left;font-weight:800;color:var(--navy);margin-top:14px;'},['Words you missed:']));
        var wl=h('div',{class:'wrong-list'});
        sessDC.wrong.forEach(function(w){ wl.appendChild(h('div',{class:'wrong-item'},[h('b',{},[w.w.word]),h('span',{},[w.w.meaning])])); });
        rc.appendChild(wl);
      }
      rc.appendChild(h('div',{class:'btn-row'},[
        h('button',{class:'btn block',onclick:function(){ delete sess['__dc']; render(); }},['🔄 Try New Challenge'])
      ]));
      frag.appendChild(rc);
      return frag;
    }

    var cur=q[sessDC.idx];
    if(!cur.order) cur.order=shuffle([cur.correct].concat(cur.dsh));
    var pbar=Math.round(sessDC.idx/q.length*100);
    frag.appendChild(h('div',{class:'progress-wrap'},[
      h('div',{class:'progress-bar'},[h('div',{style:'width:'+pbar+'%'})]),
      h('div',{class:'progress-label'},[(sessDC.idx+1)+' / '+q.length])
    ]));

    var qb=h('div',{class:'quiz-q'},[
      h('div',{class:'q-text'},['🎯 Choose the Vietnamese meaning of:']),
      h('div',{style:'font-size:22px;font-weight:900;color:var(--gold-3);margin:12px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;'},[
        cur.correct.w.word,
        cur.correct.w.pos?h('span',{class:'pos-tag'},['('+cur.correct.w.pos+')']):null
      ])
    ]);
    var sp=spkBtn(cur.correct.w.word); if(sp){ sp.style.marginLeft='4px'; qb.lastChild.appendChild(sp); }

    var letters=['A','B','C','D'];
    cur.order.forEach(function(opt,i){
      var isC=opt.key===cur.correct.key;
      var btn=h('button',{class:'opt-btn',disabled:cur.answered?'true':null},[
        h('span',{class:'opt-letter'},[letters[i]]),
        opt.w.meaning
      ]);
      if(cur.answered){ if(isC) btn.classList.add('correct'); else if(cur.sel===i) btn.classList.add('incorrect'); }
      btn.addEventListener('click',function(){
        if(cur.answered) return;
        cur.answered=true; cur.sel=i;
        if(isC) sessDC.score++; else sessDC.wrong.push(cur.correct);
        render();
      });
      qb.appendChild(btn);
    });
    frag.appendChild(qb);
    if(cur.answered){
      frag.appendChild(h('button',{class:'btn block gold',onclick:function(){
        sessDC.idx++;
        if(sessDC.idx>=q.length){ recordResult('_','_','daily',sessDC.score,q.length); }
        render();
      }},[sessDC.idx+1>=q.length?'🏁 See Results':'Next →']));
    }
    return frag;
  }

        h('div',{html:'<svg width="120" height="120" viewBox="0 0 120 120"><defs><linearGradient id="timerGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b3a5c"/><stop offset="1" stop-color="#c9a227"/></linearGradient></defs><circle class="tr-bg" cx="60" cy="60" r="52"/><circle class="tr-fg" cx="60" cy="60" r="52" style="stroke-dashoffset:'+off+'"/></svg>'}),

      ]));
    });
    return frag;
  }

  /* ======================= FLASHCARD ======================= */
  function renderFlashcard(){
    var u=state.unit, l=state.lesson; var d=lessonData(u,l);
    var s=getS(u,l,'flashcard',function(){ return { order:shuffle(d.words.map(function(_,i){return i;})), pos:0, flipped:false, reverse:false }; });
    var frag=h('div');
    if(s.pos>=s.order.length){
      confetti();
      frag.appendChild(h('div',{class:'result-card'},[
        h('span',{class:'score-emoji'},['🎉']),
        h('div',{style:'font-weight:900;color:var(--navy);font-size:18px;'},['All done!']),
        h('div',{class:'score-sub'},["You reviewed all "+d.words.length+' words.']),
        h('div',{class:'btn-row'},[
          h('button',{class:'btn secondary',onclick:function(){ s.order=shuffle(d.words.map(function(_,i){return i;})); s.pos=0; s.flipped=false; render(); }},['Study Again']),
          h('button',{class:'btn gold',onclick:function(){ go('recall',{activity:'recall'}); }},['Next: Recall →'])
        ])
      ]));
      return frag;
    }
    var idx=s.order[s.pos]; var w=d.words[idx];
    var pct=Math.round(s.pos/s.order.length*100);
    frag.appendChild(h('div',{class:'progress-wrap'},[
      h('div',{class:'progress-bar'},[h('div',{style:'width:'+pct+'%'})]),
      h('div',{class:'progress-label'},[(s.pos+1)+' / '+s.order.length])
    ]));
    frag.appendChild(h('div',{class:'opts-row'},[
      h('button',{class:'icon-toggle'+(s.reverse?' active':''),onclick:function(){ s.reverse=!s.reverse; s.flipped=false; render(); }},['🔄 Flip Direction']),
      h('button',{class:'icon-toggle',onclick:function(){ s.order=shuffle(d.words.map(function(_,i){return i;})); s.pos=0; s.flipped=false; render(); }},['🔀 Shuffle'])
    ]));
    var frontC, backC;
    if(!s.reverse){
      frontC=h('div',{},[h('div',{class:'fc-word'},[w.word]), w.ipa?h('div',{class:'fc-ipa'},[w.ipa]):null]);
      backC=h('div',{},[h('div',{class:'fc-word'},[w.word]), w.pos?h('span',{class:'fc-pos'},[w.pos]):null, h('div',{class:'fc-vi'},[w.meaning])]);
    } else {
      frontC=h('div',{},[h('div',{class:'fc-vi'},[w.meaning])]);
      backC=h('div',{},[h('div',{class:'fc-word'},[w.word]), w.pos?h('span',{class:'fc-pos'},[w.pos]):null, w.ipa?h('div',{class:'fc-ipa'},[w.ipa]):null]);
    }
    var fFace=h('div',{class:'flip-face flip-front'},[frontC]);
    if(!s.reverse){ var fsp=spkBtn(w.word,'spk-btn fc-spk'); if(fsp) fFace.appendChild(fsp); }
    var bFace=h('div',{class:'flip-face flip-back'},[backC]);
    var bsp=spkBtn(w.word,'spk-btn fc-spk'); if(bsp) bFace.appendChild(bsp);
    var inner=h('div',{class:'flip-card-inner'+(s.flipped?' flipped':'')},[fFace,bFace]);
    inner.addEventListener('click',function(){ s.flipped=!s.flipped; inner.classList.toggle('flipped',s.flipped); });
    var stage=h('div',{class:'card-stage'},[inner]);
    stage.appendChild(h('div',{class:'fc-hint'},['Tap card to flip']));
    frag.appendChild(stage);
    frag.appendChild(h('div',{class:'know-row'},[
      h('button',{class:'btn review',onclick:function(){ var k=wordKey(u,l,w); progress.known[k]=false; srsUpdate(k,1); saveProgress(); s.pos++; s.flipped=false; render(); }},['❌ Review Again']),
      h('button',{class:'btn know',onclick:function(){ var k=wordKey(u,l,w); progress.known[k]=true; srsUpdate(k,4); saveProgress(); addXP(5); s.pos++; s.flipped=false; render(); }},['✅ I Know This'])
    ]));
    return frag;
  }

  /* ======================= RECALL ======================= */
  function buildDist(u,l,c){
    var d=lessonData(u,l);
    var pool=d.words.filter(function(w){ return w.word!==c.word && w.meaning!==c.meaning; });
    if(pool.length<3){
      lessonList(u).forEach(function(ll){ var d2=lessonData(u,ll); if(!d2) return;
        d2.words.forEach(function(w){ if(w.word!==c.word&&w.meaning!==c.meaning&&pool.indexOf(w)===-1) pool.push(w); });
      });
    }
    return pool;
  }
  function renderRecall(){
    var u=state.unit, l=state.lesson; var d=lessonData(u,l);
    var s=getS(u,l,'recall',function(){
      return { dir:'vi2en', qs:shuffle(d.words.map(function(w){return {c:w,pool:buildDist(u,l,w)};})), idx:0, ans:false, sel:null, order:null, score:0, wrong:[] };
    });
    var frag=h('div');
    if(s.idx>=s.qs.length){
      confetti();
      var p=Math.round(s.score/s.qs.length*100);
      var rc=h('div',{class:'result-card'},[
        h('span',{class:'score-emoji'},[p>=90?'🏆':p>=70?'🎉':p>=50?'👍':'💪']),
        h('div',{class:'score-big'},[s.score+' / '+s.qs.length]),
        h('div',{class:'score-sub'},[p+'% correct'])
      ]);
      if(s.wrong.length){
        rc.appendChild(h('div',{style:'text-align:left;font-weight:800;color:var(--navy);margin-top:14px;'},['Missed:']));
        var wl=h('div',{class:'wrong-list'});
        s.wrong.forEach(function(w){ wl.appendChild(h('div',{class:'wrong-item'},[h('b',{},[w.word]),h('span',{},[w.meaning])])); });
        rc.appendChild(wl);
      }
      rc.appendChild(h('div',{class:'btn-row'},[
        h('button',{class:'btn secondary',onclick:function(){ clrS(u,l,'recall'); render(); }},['Try Again']),
        s.wrong.length?h('button',{class:'btn gold',onclick:function(){ go('flashcard',{activity:'flashcard'}); }},['Review Cards']):null
      ]));
      frag.appendChild(rc);
      return frag;
    }
    var q=s.qs[s.idx]; var pbar=Math.round(s.idx/s.qs.length*100);
    frag.appendChild(h('div',{class:'progress-wrap'},[
      h('div',{class:'progress-bar'},[h('div',{style:'width:'+pbar+'%'})]),
      h('div',{class:'progress-label'},[(s.idx+1)+' / '+s.qs.length])
    ]));
    frag.appendChild(h('div',{class:'opts-row'},[
      h('button',{class:'icon-toggle'+(s.dir==='vi2en'?' active':''),onclick:function(){ s.dir='vi2en'; s.order=null; render(); }},['VN → EN']),
      h('button',{class:'icon-toggle'+(s.dir==='en2vi'?' active':''),onclick:function(){ s.dir='en2vi'; s.order=null; render(); }},['EN → VN'])
    ]));
    var qb=h('div',{class:'quiz-q'},[h('div',{class:'q-text'},[s.dir==='vi2en'?'Choose the English word that means:':'Choose the Vietnamese meaning of:'])]);
    var pRow=h('div',{style:'font-size:20px;font-weight:900;color:var(--gold-3);margin:10px 0 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;'},[
      s.dir==='vi2en'?q.c.meaning:q.c.word,
      (s.dir==='en2vi'&&q.c.pos)?h('span',{class:'pos-tag'},['('+q.c.pos+')']):null
    ]);
    if(s.dir==='en2vi'){ var sp=spkBtn(q.c.word); if(sp) pRow.appendChild(sp); }
    qb.appendChild(pRow);
    if(!s.order) s.order=shuffle([q.c].concat(shuffle(q.pool).slice(0,3)));
    var L=['A','B','C','D'];
    s.order.forEach(function(opt,i){
      var isC=opt.word===q.c.word && opt.meaning===q.c.meaning;
      var btn=h('button',{class:'opt-btn',disabled:s.ans?'true':null},[
        h('span',{class:'opt-letter'},[L[i]]),
        s.dir==='vi2en'?opt.word:opt.meaning,
        (s.dir==='vi2en'&&opt.pos)?h('span',{class:'pos-tag'},[' ('+opt.pos+')']):null
      ]);
      if(s.ans){ if(isC) btn.classList.add('correct'); else if(s.sel===i) btn.classList.add('incorrect'); }
      btn.addEventListener('click',function(){
        if(s.ans) return;
        s.ans=true; s.sel=i;
        if(isC) s.score++; else s.wrong.push(q.c);
        render();
      });
      qb.appendChild(btn);
    });
    frag.appendChild(qb);
    if(s.ans){
      frag.appendChild(h('button',{class:'btn block gold',onclick:function(){
        s.idx++; s.ans=false; s.sel=null; s.order=null;
        if(s.idx>=s.qs.length) recordResult(u,l,'recall',s.score,s.qs.length);
        render();
      }},[s.idx+1>=s.qs.length?'🏁 See Results':'Next →']));
    }
    return frag;
  }

  /* ======================= MCQ ======================= */
  function renderMCQ(){
    var u=state.unit, l=state.lesson; var d=lessonData(u,l);
    var s=getS(u,l,'mcq',function(){ return { order:shuffle(d.mcq.map(function(_,i){return i;})), idx:0, ans:false, sel:null, order2:null, score:0, wrong:[] }; });
    var frag=h('div');
    if(s.idx>=s.order.length){
      confetti();
      var p=Math.round(s.score/s.order.length*100);
      var rc=h('div',{class:'result-card'},[
        h('span',{class:'score-emoji'},[p>=90?'🏆':p>=70?'🎉':p>=50?'👍':'💪']),
        h('div',{class:'score-big'},[s.score+' / '+s.order.length]),
        h('div',{class:'score-sub'},[p+'% correct'])
      ]);
      if(s.wrong.length){
        rc.appendChild(h('div',{style:'text-align:left;font-weight:800;color:var(--navy);margin-top:14px;font-size:14px;'},['Missed:']));
        var wl=h('div',{class:'wrong-list'});
        s.wrong.forEach(function(item){ wl.appendChild(h('div',{class:'wrong-item'},[h('b',{},['Q'+item.num]),h('span',{style:'flex:1;text-align:right;'},[item.question.slice(0,55)+'…'])])); });
        rc.appendChild(wl);
      }
      rc.appendChild(h('div',{class:'btn-row'},[
        h('button',{class:'btn block',onclick:function(){ clrS(u,l,'mcq'); render(); }},['🔀 Try Again (shuffled)'])
      ]));
      frag.appendChild(rc);
      return frag;
    }
    var q=d.mcq[s.order[s.idx]]; var pbar=Math.round(s.idx/s.order.length*100);
    frag.appendChild(h('div',{class:'progress-wrap'},[
      h('div',{class:'progress-bar'},[h('div',{style:'width:'+pbar+'%'})]),
      h('div',{class:'progress-label'},[(s.idx+1)+' / '+s.order.length])
    ]));
    var qb=h('div',{class:'quiz-q'},[h('div',{class:'q-text'},[q.question])]);
    if(!s.order2) s.order2=shuffle([0,1,2,3]);
    var L=['A','B','C','D'];
    s.order2.forEach(function(oi,i){
      var isC=oi===q.answerIndex;
      var btn=h('button',{class:'opt-btn',disabled:s.ans?'true':null},[
        h('span',{class:'opt-letter'},[L[i]]),q.options[oi]
      ]);
      if(s.ans){ if(isC) btn.classList.add('correct'); else if(s.sel===i) btn.classList.add('incorrect'); }
      btn.addEventListener('click',function(){
        if(s.ans) return;
        s.ans=true; s.sel=i;
        if(isC) s.score++; else s.wrong.push(q);
        render();
      });
      qb.appendChild(btn);
    });
    if(s.ans && q.explanation) qb.appendChild(h('div',{class:'explain-box'},['💡 '+q.explanation]));
    frag.appendChild(qb);
    if(s.ans){
      frag.appendChild(h('button',{class:'btn block gold',onclick:function(){
        s.idx++; s.ans=false; s.sel=null; s.order2=null;
        if(s.idx>=s.order.length) recordResult(u,l,'mcq',s.score,s.order.length);
        render();
      }},[s.idx+1>=s.order.length?'🏁 See Results':'Next →']));
    }
    return frag;
  }

  /* ======================= GAP FILL ======================= */
  function renderGapFill(){
    var u=state.unit, l=state.lesson; var d=lessonData(u,l);
    var s=getS(u,l,'gapfill',function(){
      return { items:d.gapfill.map(function(g){return {g:g,placed:null,placedText:null};}), bank:shuffle(d.gapfill.map(function(g,i){return {id:i,text:g.answer};})), tile:null, submitted:false };
    });
    var frag=h('div');
    frag.appendChild(h('div',{class:'small-note',style:'margin-bottom:14px;'},['💡 Tap a word in the bank, then tap a blank. Tap the blank again to return the word.']));
    function isC(it){ return it.placedText && it.placedText.toLowerCase()===it.g.answer.toLowerCase(); }
    s.items.forEach(function(it,i){
      var parts=it.g.sentence.split('______');
      var box=h('div',{class:'gf-sentence',dataset:{i:i}},[h('div',{class:'gf-num'},['Sentence '+(i+1)])]);
      var tl=h('div',{class:'gf-text'});
      tl.appendChild(document.createTextNode(parts[0]||''));
      var bc='gf-blank '+(it.placed==null?'empty':'filled');
      if(s.submitted) bc='gf-blank '+(isC(it)?'correct':'incorrect');
      var blank=h('span',{class:bc,onclick:function(){
        if(s.submitted) return;
        if(it.placed!=null){
          s.bank.push({id:it.placed,text:it.placedText});
          it.placed=null; it.placedText=null; render(); return;
        }
        if(s.tile!=null){
          it.placed=s.tile.id; it.placedText=s.tile.text;
          s.bank=s.bank.filter(function(t){return t.id!==s.tile.id;});
          s.tile=null; render();
        }
      }},[it.placed!=null?it.placedText:'']);
      tl.appendChild(blank);
      tl.appendChild(document.createTextNode(parts[1]||''));
      box.appendChild(tl);
      if(s.submitted && !isC(it)) box.appendChild(h('div',{class:'explain-box'},['Correct answer: '+it.g.answer]));
      frag.appendChild(box);
    });
    var all=s.items.every(function(it){return it.placed!=null;});
    if(!s.submitted){
      var wb=h('div',{class:'wordbank'},[h('div',{class:'wordbank-label'},['📦 Word Bank ('+s.bank.length+')'])]);
      var tiles=h('div',{class:'wordbank-tiles'});
      s.bank.forEach(function(t){
        tiles.appendChild(h('button',{class:'tile'+(s.tile&&s.tile.id===t.id?' selected':''),onclick:function(){ s.tile=(s.tile&&s.tile.id===t.id)?null:t; render(); }},[t.text]));
      });
      wb.appendChild(tiles);
      wb.appendChild(h('button',{class:'btn block gold',disabled:all?null:'true',onclick:function(){
        s.submitted=true;
        recordResult(u,l,'gapfill',s.items.filter(isC).length,s.items.length);
        render();
      }},['✓ Submit Answers']));
      frag.appendChild(wb);
    } else {
      var c=s.items.filter(isC).length; var p=Math.round(c/s.items.length*100);
      if(p>=70) confetti();
      frag.appendChild(h('div',{class:'result-card'},[
        h('span',{class:'score-emoji'},[p>=90?'🏆':p>=70?'🎉':p>=50?'👍':'💪']),
        h('div',{class:'score-big'},[c+' / '+s.items.length]),
        h('div',{class:'score-sub'},[p+'% correct']),
        h('button',{class:'btn block',style:'margin-top:10px;',onclick:function(){ clrS(u,l,'gapfill'); render(); }},['🔀 Try Again'])
      ]));
    }
    return frag;
  }

  /* ======================= SPELLING ======================= */
  function renderSpelling(){
    var u=state.unit, l=state.lesson; var d=lessonData(u,l);
    var s=getS(u,l,'spelling',function(){ return { order:shuffle(d.words.map(function(_,i){return i;})), pos:0, input:'', state:'idle', score:0, wrong:[] }; });
    var frag=h('div');
    if(s.pos>=s.order.length){
      confetti();
      var p=Math.round(s.score/s.order.length*100);
      var rc=h('div',{class:'result-card'},[
        h('span',{class:'score-emoji'},[p>=90?'🏆':p>=70?'🎉':p>=50?'👍':'💪']),
        h('div',{class:'score-big'},[s.score+' / '+s.order.length]),
        h('div',{class:'score-sub'},[p+'% correct'])
      ]);
      if(s.wrong.length){
        rc.appendChild(h('div',{style:'text-align:left;font-weight:800;color:var(--navy);margin-top:14px;font-size:14px;'},['Misspelled:']));
        var wl=h('div',{class:'wrong-list'});
        s.wrong.forEach(function(w){ wl.appendChild(h('div',{class:'wrong-item'},[h('b',{},[w.word]),h('span',{},[w.meaning])])); });
        rc.appendChild(wl);
      }
      rc.appendChild(h('div',{class:'btn-row'},[
        h('button',{class:'btn block',onclick:function(){ clrS(u,l,'spelling'); render(); }},['🔀 Try Again'])
      ]));
      frag.appendChild(rc);
      return frag;
    }
    var w=d.words[s.order[s.pos]]; var pbar=Math.round(s.pos/s.order.length*100);
    frag.appendChild(h('div',{class:'progress-wrap'},[
      h('div',{class:'progress-bar'},[h('div',{style:'width:'+pbar+'%'})]),
      h('div',{class:'progress-label'},[(s.pos+1)+' / '+s.order.length])
    ]));
    var qb=h('div',{class:'quiz-q',style:'text-align:center;'},[
      h('div',{class:'q-text'},['⌨️ Type the English word for:']),
      h('div',{style:'font-size:22px;font-weight:900;color:var(--gold-3);margin:14px 0 4px;'},[w.meaning]),
      w.pos?h('div',{class:'pos-tag'},['('+w.pos+')']):null
    ]);
    if(ttsOK){ var sp=spkBtn(w.word); if(sp){ sp.style.margin='10px auto 0'; qb.appendChild(sp); } }
    var inp=h('input',{class:'spell-input'+(s.state==='correct'?' correct':s.state==='incorrect'?' incorrect':''),type:'text',placeholder:'Type here...',value:s.input,autocomplete:'off',autocapitalize:'off',autocorrect:'off',spellcheck:'false',disabled:s.state!=='idle'?'true':null});
    inp.addEventListener('input',function(){ s.input=inp.value; });
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
    qb.appendChild(inp);
    frag.appendChild(qb);
    function submit(){
      if(s.state!=='idle') return;
      var g=s.input.trim().toLowerCase().replace(/[.,!?;:]/g,'');
      var c=w.word.toLowerCase().trim();
      if(g===c){ s.state='correct'; s.score++; srsUpdate(wordKey(u,l,w),5); addXP(5); }
      else { s.state='incorrect'; s.wrong.push(w); srsUpdate(wordKey(u,l,w),2); }
      saveProgress(); render();
    }
    if(s.state==='idle') frag.appendChild(h('button',{class:'btn block gold',onclick:submit},['Check']));
    else {
      if(s.state==='incorrect') frag.appendChild(h('div',{class:'explain-box',style:'margin-top:8px;'},['Correct spelling: '+w.word]));
      frag.appendChild(h('button',{class:'btn block',style:'margin-top:10px;',onclick:function(){
        s.pos++; s.input=''; s.state='idle';
        if(s.pos>=s.order.length) recordResult(u,l,'spelling',s.score,s.order.length);
        render();
      }},[s.pos+1>=s.order.length?'🏁 See Results':'Next →']));
    }
    setTimeout(function(){ if(inp && s.state==='idle') inp.focus(); },100);
    return frag;
  }

  /* ======================= KEYBOARD SHORTCUTS ======================= */
  document.addEventListener('keydown',function(e){
    if(state.screen==='flashcard' || state.screen==='srsReview'){
      if(e.key===' ' || e.key==='Enter'){
        e.preventDefault();
        var inner=document.querySelector('.flip-card-inner'); if(inner) inner.click();
      }
    }
  });

  /* ======================= HEADER SRS BUTTON ======================= */
  $('#srsBtn').addEventListener('click', function(){
    var d=srsDue();
    if(d.length) go('srsReview');
    else toast('No words due for review ✓');
  });
  function updateSRSDot(){
    var d=srsDue();
    $('#srsDot').classList.toggle('hidden', d.length===0);
  }

  /* ======================= SCROLL SHADOW ======================= */
  window.addEventListener('scroll', function(){
    $('#topbar').classList.toggle('scrolled', window.scrollY > 8);
  }, {passive:true});

  /* ======================= INIT ======================= */
  function boot(){
    render();
    updateSRSDot();
    refreshAchievements();
  }
  boot();
  setInterval(updateSRSDot, 60000);
})();
 </script>
