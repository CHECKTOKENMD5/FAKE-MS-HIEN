 ______ to the position you are applying for.","options":["relevance","relevantly","irrelevant","relevant"],"answerIndex":3,"explanation":"Sau \"is\" cần tính từ, và \"only the information\" cho thấy phải là thông tin có liên quan: \"relevant to sth\". \"irrelevant\" trái nghĩa; \"relevance\" là danh từ; \"relevantly\" là trạng từ."},{"num":4,"question":"The interviewer stopped him because his answer was completely ______ to the question.","options":["relevant","relevance","irrelevant","irrelevance"],"answerIndex":2,"explanation":"Việc người phỏng vấn ngắt lời chốt nghĩa \"irrelevant\" (không liên quan). \"relevant\" trái nghĩa; \"relevance/irrelevance\" là danh từ nên sai từ loại sau \"was completely\"."},{"num":5,"question":"The manager questioned the ______ of his previous experience to this particular job.","options":["relevance","relevant","relevantly","irrelevant"],"answerIndex":0,"explanation":"Sau \"the\" và trước \"of\" cần danh từ: \"the relevance of sth to sth\" (sự liên quan của cái gì với cái gì). \"relevant/irrelevant\" là tính từ; \"relevantly\" là trạng từ."},{"num":6,"question":"All the staff received a Tet ______ of one month's salary.","options":["applicant","employer","target","bonus"],"answerIndex":3,"explanation":"\"a Tet bonus\" (tiền thưởng Tết) là khoản tiền tương đương một tháng lương. \"applicant\" (ứng viên), \"employer\" (chủ lao động) và \"target\" (chỉ tiêu) không phải khoản tiền được nhận."},{"num":7,"question":"The restaurant now has twenty full-time ______ and ten part-time workers.","options":["employers","employment","employees","unemployment"],"answerIndex":2,"explanation":"Nhà hàng sử dụng lao động nên những người làm việc ở đó là \"employees\" (nhân viên). \"employers\" là người sử dụng lao động; \"employment/unemployment\" là danh từ trừu tượng không đếm được."},{"num":8,"question":"A good ______ listens carefully to the needs of the staff.","options":["employee","employer","employment","unemployment"],"answerIndex":1,"explanation":"Người lắng nghe nhu cầu của nhân viên là \"employer\" (người sử dụng lao động). \"employee\" chính là nhân viên nên mâu thuẫn với \"the staff\"; hai phương án còn lại là danh từ trừu tượng."},{"num":9,"question":"She has been in full-time ______ since she left university three years ago.","options":["employment","employ","employee","employer"],"answerIndex":0,"explanation":"\"be in full-time employment\" (có việc làm toàn thời gian) là cụm cố định, cần danh từ trừu tượng. \"employ\" là động từ; \"employee/employer\" chỉ người."},{"num":10,"question":"Teaching is not particularly well paid, but most teachers find it very ______.","options":["reward","rewarding","rewarded","rewardingly"],"answerIndex":1,"explanation":"Sau \"find it very\" cần tính từ: \"rewarding\" (đáng làm, mang lại nhiều giá trị tinh thần). \"reward\" là danh từ/động từ; \"rewarded\" mang nghĩa được thưởng; \"rewardingly\" là trạng từ."},{"num":11,"question":"The company offers a generous ______ to any employee who suggests a useful new idea.","options":["rewarding","rewarded","rewardingly","reward"],"answerIndex":3,"explanation":"Sau \"a generous\" cần danh từ: \"reward\" (phần thưởng). \"rewarding\" là tính từ; \"rewarded\" là phân từ; \"rewardingly\" là trạng từ."},{"num":12,"question":"The sales team worked very hard to ______ their targets for this quarter.","options":["apply","babysit","meet","employ"],"answerIndex":2,"explanation":"\"meet targets\" (đạt chỉ tiêu) là collocation cố định. \"apply\", \"babysit\" và \"employ\" không đi với \"targets\"."},{"num":13,"question":"More than fifty people have decided to ______ this vacancy.","options":["apply for","put up","go on","work in"],"answerIndex":0,"explanation":"\"apply for a vacancy/job\" (nộp đơn xin một vị trí) là cụm cố định. \"put up\", \"go on\" và \"work in\" không đi với \"this vacancy\"."},{"num":14,"question":"Only one ______ had all the qualifications the company was looking for.","options":["application","apply","applicable","applicant"],"answerIndex":3,"explanation":"Người có bằng cấp và nộp đơn là \"applicant\" (ứng viên). \"application\" là lá đơn; \"apply\" là động từ; \"applicable\" là tính từ."},{"num":15,"question":"Send your ______ together with a recent photograph and two references.","options":["applicant","apply","application","applicable"],"answerIndex":2,"explanation":"Thứ được gửi kèm ảnh và thư giới thiệu là \"application\" (đơn xin việc). \"applicant\" chỉ người; \"apply\" là động từ; \"applicable\" là tính từ."},{"num":16,"question":"This company values practical experience just as much as ______.","options":["babysitters","academic qualifications","bonuses","employers"],"answerIndex":1,"explanation":"\"academic qualifications\" (bằng cấp học vấn) là thứ được đặt song song với \"practical experience\". \"babysitters\", \"bonuses\" và \"employers\" không cùng phạm trù với kinh nghiệm làm việc."}],"gapfill":[{"num":1,"sentence":"She earns some extra money as a ______ at weekends.","answer":"babysitter"},{"num":2,"sentence":"Could you ______ my little brother on Saturday evening?","answer":"babysit"},{"num":3,"sentence":"______ among young people has fallen for the third year running.","answer":"Unemployment"},{"num":4,"sentence":"The factory will ______ another two hundred workers next year.","answer":"employ"},{"num":5,"sentence":"Nurses find their work hard but deeply ______.","answer":"rewarding"},{"num":6,"sentence":"The team failed to meet its sales ______ last month.","answer":"targets"},{"num":7,"sentence":"This rule is not ______ to part-time staff.","answer":"applicable"},{"num":8,"sentence":"He answered every question clearly and ______.","answer":"relevantly"},{"num":9,"sentence":"Learning to deal with difficult customers was a real ______ at first.","answer":"challenge"},{"num":10,"sentence":"The judge pointed out the complete ______ of the evidence to the case.","answer":"irrelevance"}]},"3":{"title":"READING","words":[{"word":"vacancy","ipa":"/ˈveɪkənsi/","pos":"n","meaning":"vị trí tuyển dụng, chỗ trống"},{"word":"flexible","ipa":"/ˈfleksəbl/","pos":"adj","meaning":"linh hoạt"},{"word":"flexibility","ipa":"/ˌfleksəˈbɪləti/","pos":"n","meaning":"sự linh hoạt"},{"word":"flexibly","ipa":"/ˈfleksəbli/","pos":"adv","meaning":"một cách linh hoạt"},{"word":"review","ipa":"/rɪˈvjuː/","pos":"n, v","meaning":"bài đánh giá; đánh giá"},{"word":"reviewer","ipa":"/rɪˈvjuːə(r)/","pos":"n","meaning":"người đánh giá, bình luận"},{"word":"reviewing","ipa":"/rɪˈvjuːɪŋ/","pos":"n","meaning":"sự xem xét, đánh giá"},{"word":"product reviewer","ipa":"/ˈprɒdʌkt rɪˈvjuːə(r)/","pos":"n","meaning":"người đánh giá sản phẩm"},{"word":"comment","ipa":"/ˈkɒment/","pos":"n, v","meaning":"bình luận; nhận xét"},{"word":"commentary","ipa":"/ˈkɒməntri/","pos":"n","meaning":"lời bình luận"},{"word":"sort","ipa":"/sɔːt/","pos":"v, n","meaning":"phân loại, sắp xếp"},{"word":"window display","ipa":"/ˈwɪndəʊ dɪˈspleɪ/","pos":"n","meaning":"trưng bày ở cửa sổ (cửa hàng)"},{"word":"on-the-job training","ipa":"/ˌɒn ðə ˈdʒɒb ˈtreɪnɪŋ/","pos":"n","meaning":"đào tạo tại nơi làm việc"},{"word":"wage","ipa":"/weɪdʒ/","pos":"n","meaning":"tiền công, tiền lương"},{"word":"casual","ipa":"/ˈkæʒuəl/","pos":"adj","meaning":"tạm thời; không chính thức"},{"word":"casually","ipa":"/ˈkæʒuəli/","pos":"adv","meaning":"một cách bình thường"},{"word":"casualness","ipa":"/ˈkæʒuəlnəs/","pos":"n","meaning":"tính xuề xòa, không trang trọng"},{"word":"candidate","ipa":"/ˈkændɪdət/","pos":"n","meaning":"ứng viên"},{"word":"candidacy","ipa":"/ˈkændɪdəsi/","pos":"n","meaning":"sự ứng cử; tư cách ứng viên"},{"word":"preferably female","ipa":"/ˈprefərəbli ˈfiːmeɪl/","pos":"phr.","meaning":"ưu tiên nữ"},{"word":"preferably","ipa":"/ˈprefərəbli/","pos":"adv","meaning":"tốt nhất là, ưu tiên"},{"word":"preference","ipa":"/ˈprefrəns/","pos":"n","meaning":"sự ưu tiên, sở thích"},{"word":"stick to","ipa":"/stɪk tuː/","pos":"phr.v","meaning":"bám sát; kiên trì với"},{"word":"permanent","ipa":"/ˈpɜːmənənt/","pos":"adj","meaning":"lâu dài, cố định"},{"word":"permanently","ipa":"/ˈpɜːmənəntli/","pos":"adv","meaning":"một cách lâu dài"},{"word":"permanence","ipa":"/ˈpɜːmənəns/","pos":"n","meaning":"tính lâu dài"}],"mcq":[{"num":1,"question":"The bookshop has a ______ for a part-time assistant at weekends.","options":["wage","commentary","candidacy","vacancy"],"answerIndex":3,"explanation":"\"a vacancy for sb\" (vị trí còn trống cần tuyển) là cụm chuẩn. \"wage\" (tiền công), \"commentary\" (lời bình luận) và \"candidacy\" (tư cách ứng viên) sai nghĩa."},{"num":2,"question":"The company offers ______ working hours to parents of young children.","options":["flexibility","flexible","flexibly","inflexible"],"answerIndex":1,"explanation":"Trước cụm danh từ \"working hours\" cần tính từ: \"flexible working hours\" (giờ làm linh hoạt). \"inflexible\" trái nghĩa với chính sách hỗ trợ cha mẹ; \"flexibility\" là danh từ; \"flexibly\" là trạng từ."},{"num":3,"question":"Students like this kind of job because of its ______.","options":["flexibility","flexible","flexibly","inflexible"],"answerIndex":0,"explanation":"Sau \"because of its\" cần danh từ: \"flexibility\" (sự linh hoạt). \"flexible/inflexible\" là tính từ; \"flexibly\" là trạng từ."},{"num":4,"question":"Staff can work ______, choosing their own starting and finishing times.","options":["flexible","flexibility","flexibly","inflexible"],"answerIndex":2,"explanation":"Chỗ trống bổ nghĩa cho động từ \"work\" nên cần trạng từ: \"work flexibly\" (làm việc linh hoạt)."},{"num":5,"question":"As a product ______, she tests new phones and writes about them online.","options":["review","reviewing","reviewer","reviewed"],"answerIndex":2,"explanation":"\"a product reviewer\" (người đánh giá sản phẩm) là danh từ chỉ nghề nghiệp. \"review\" là bài đánh giá; \"reviewing\" là danh động từ; \"reviewed\" là phân từ."},{"num":6,"question":"He wrote a long ______ of the new restaurant on a travel website.","options":["review","reviewer","reviewing","reviewed"],"answerIndex":0,"explanation":"Thứ được viết và đăng lên website là \"a review\" (bài đánh giá). \"reviewer\" chỉ người viết; \"reviewing/reviewed\" là dạng động từ."},{"num":7,"question":"Customers can leave ______ about the service on the shop's website.","options":["wages","vacancies","preferences","comments"],"answerIndex":3,"explanation":"\"leave comments\" (để lại bình luận) là collocation chuẩn. \"wages\" (tiền công), \"vacancies\" (vị trí trống) và \"preferences\" (sở thích) không phải thứ khách hàng để lại trên website."},{"num":8,"question":"Part of the job is to ______ the letters into different boxes.","options":["stick","sort","comment","review"],"answerIndex":1,"explanation":"\"sort sth into sth\" (phân loại cái gì vào đâu) đúng với giới từ \"into\" có sẵn. \"stick\", \"comment\" và \"review\" không đi với \"into different boxes\" theo nghĩa phân loại."},{"num":9,"question":"Her main task in the shop is to change the ______ every two weeks.","options":["on-the-job training","window display","product reviewer","candidacy"],"answerIndex":1,"explanation":"\"window display\" (phần trưng bày ở cửa kính) là thứ được thay đổi định kỳ trong cửa hàng. \"on-the-job training\" (đào tạo tại chỗ), \"product reviewer\" (người đánh giá sản phẩm) và \"candidacy\" (tư cách ứng viên) sai nghĩa."},{"num":10,"question":"No previous experience is necessary because ______ is provided.","options":["on-the-job training","window display","permanence","casualness"],"answerIndex":0,"explanation":"\"on-the-job training\" (đào tạo ngay tại nơi làm việc) giải thích được vì sao không cần kinh nghiệm. \"window display\", \"permanence\" và \"casualness\" không phải thứ được cung cấp cho nhân viên mới."},{"num":11,"question":"The ______ are quite low, but the working hours are very flexible.","options":["vacancies","displays","wages","preferences"],"answerIndex":2,"explanation":"\"wages\" (tiền công) là thứ có thể \"low\" và được đặt đối lập với giờ làm linh hoạt. \"vacancies\", \"displays\" và \"preferences\" không mô tả được mức thu nhập."},{"num":12,"question":"This is only ______ work; there is no contract for the whole year.","options":["casually","casualness","permanent","casual"],"answerIndex":3,"explanation":"Chi tiết \"no contract for the whole year\" chốt nghĩa \"casual work\" (việc làm thời vụ). \"permanent\" trái nghĩa; \"casually\" là trạng từ; \"casualness\" là danh từ."},{"num":13,"question":"After six months as a trainee she was offered a ______ contract.","options":["permanently","permanence","permanent","casual"],"answerIndex":2,"explanation":"Trước danh từ \"contract\" cần tính từ, và việc được đề nghị sau thời gian thử việc chốt nghĩa \"a permanent contract\" (hợp đồng dài hạn). \"casual\" trái nghĩa; \"permanently\" là trạng từ; \"permanence\" là danh từ."},{"num":14,"question":"Five ______ were invited to the second interview last Friday.","options":["candidates","candidacies","vacancies","commentaries"],"answerIndex":0,"explanation":"Người được mời phỏng vấn là \"candidates\" (ứng viên). \"candidacies\" là tư cách ứng cử; \"vacancies\" là vị trí trống; \"commentaries\" là lời bình luận."},{"num":15,"question":"The advertisement says the applicant should be ______ female and under thirty.","options":["preference","preferable","prefer","preferably"],"answerIndex":3,"explanation":"\"preferably female\" (ưu tiên nữ) là cách nói cố định trong quảng cáo tuyển dụng, cần trạng từ. \"preference\" là danh từ; \"preferable\" là tính từ; \"prefer\" là động từ."},{"num":16,"question":"You must ______ the safety rules if you want to keep this job.","options":["sort out","stick to","apply for","put up"],"answerIndex":1,"explanation":"\"stick to the rules\" (tuân thủ, bám sát các quy định) là cụm cố định. \"sort out\" (giải quyết), \"apply for\" (nộp đơn xin) và \"put up\" (dựng lên, trình diễn) sai nghĩa với \"the safety rules\"."}],"gapfill":[{"num":1,"sentence":"There is a ______ for a night receptionist at the hotel near the station.","answer":"vacancy"},{"num":2,"sentence":"He dressed far too ______ for such a formal interview.","answer":"casually"},{"num":3,"sentence":"The manager is still ______ all the applications she has received.","answer":"reviewing"},{"num":4,"sentence":"The minimum ______ in this country is set by the government each year.","answer":"wage"},{"num":5,"sentence":"She was employed ______ after her six-month trial period.","answer":"permanently"},{"num":6,"sentence":"Students value the ______ of part-time work in a café.","answer":"flexibility"},{"num":7,"sentence":"Please state your ______ for morning or afternoon shifts on the form.","answer":"preference"},{"num":8,"sentence":"The radio ______ on the football match lasted almost two hours.","answer":"commentary"},{"num":9,"sentence":"He withdrew his ______ for the position of manager at the last minute.","answer":"candidacy"},{"num":10,"sentence":"Nothing in this industry has any ______: companies open and close every year.","answer":"permanence"}]},"4":{"title":"SPEAKING","words":[{"word":"Challenging","ipa":"/ˈtʃælɪndʒɪŋ/","pos":"adj","meaning":"đầy thử thách"},{"word":"Challenge","ipa":"/ˈtʃælɪndʒ/","pos":"n, v","meaning":"thử thách; thách thức"},{"word":"Demanding","ipa":"/dɪˈmɑːndɪŋ/","pos":"adj","meaning":"đòi hỏi cao"},{"word":"Demand","ipa":"/dɪˈmɑːnd/","pos":"n, v","meaning":"nhu cầu; yêu cầu"},{"word":"Important","ipa":"/ɪmˈpɔːtənt/","pos":"adj","meaning":"quan trọng"},{"word":"Importance","ipa":"/ɪmˈpɔːtns/","pos":"n","meaning":"tầm quan trọng"},{"word":"Repetitive","ipa":"/rɪˈpetətɪv/","pos":"adj","meaning":"lặp đi lặp lại"},{"word":"Repeat","ipa":"/rɪˈpiːt/","pos":"v","meaning":"lặp lại"},{"word":"Repetition","ipa":"/ˌrepəˈtɪʃn/","pos":"n","meaning":"sự lặp lại"},{"word":"Rewarding","ipa":"/rɪˈwɔːdɪŋ/","pos":"adj","meaning":"đáng làm, bổ ích"},{"word":"Reward","ipa":"/rɪˈwɔːd/","pos":"n, v","meaning":"phần thưởng; thưởng"},{"word":"Stressful","ipa":"/ˈstresfl/","pos":"adj","meaning":"căng thẳng"},{"word":"Stress","ipa":"/stres/","pos":"n, v","meaning":"sự căng thẳng; gây căng thẳng"},{"word":"Assistant","ipa":"/əˈsɪstənt/","pos":"n","meaning":"trợ lý"},{"word":"Assist","ipa":"/əˈsɪst/","pos":"v","meaning":"hỗ trợ"},{"word":"Assistance","ipa":"/əˈsɪstəns/","pos":"n","meaning":"sự giúp đỡ"},{"word":"Volunteer","ipa":"/ˌvɒlənˈtɪə(r)/","pos":"n, v","meaning":"tình nguyện viên; tình nguyện"},{"word":"Voluntary","ipa":"/ˈvɒləntri/","pos":"adj","meaning":"tự nguyện"},{"word":"Reviewer","ipa":"/rɪˈvjuːə(r)/","pos":"n","meaning":"người đánh giá, nhận xét"},{"word":"Review","ipa":"/rɪˈvjuː/","pos":"n, v","meaning":"bài đánh giá; đánh giá"},{"word":"Babysitter","ipa":"/ˈbeɪbisɪtə(r)/","pos":"n","meaning":"người trông trẻ"},{"word":"Babysit","ipa":"/ˈbeɪbisɪt/","pos":"v","meaning":"trông trẻ"},{"word":"Responsibility","ipa":"/rɪˌspɒnsəˈbɪləti/","pos":"n","meaning":"trách nhiệm"},{"word":"Responsible","ipa":"/rɪˈspɒnsəbl/","pos":"adj","meaning":"có trách nhiệm"},{"word":"Responsibly","ipa":"/rɪˈspɒnsəbli/","pos":"adv","meaning":"một cách có trách nhiệm"},{"word":"Supervise","ipa":"/ˈsuːpəvaɪz/","pos":"v","meaning":"giám sát"},{"word":"Supervision","ipa":"/ˌsuːpəˈvɪʒn/","pos":"n","meaning":"sự giám sát"},{"word":"Supervisor","ipa":"/ˈsuːpəvaɪzə(r)/","pos":"n","meaning":"người giám sát"},{"word":"Attendance","ipa":"/əˈtendəns/","pos":"n","meaning":"sự có mặt, tham dự"},{"word":"Attend","ipa":"/əˈtend/","pos":"v","meaning":"tham dự"},{"word":"Attendee","ipa":"/əˌtenˈdiː/","pos":"n","meaning":"người tham dự"},{"word":"Donation","ipa":"/dəʊˈneɪʃn/","pos":"n","meaning":"khoản quyên góp"},{"word":"Donate","ipa":"/dəʊˈneɪt/","pos":"v","meaning":"quyên góp"},{"word":"Donor","ipa":"/ˈdəʊnə(r)/","pos":"n","meaning":"người quyên góp"},{"word":"Customer","ipa":"/ˈkʌstəmə(r)/","pos":"n","meaning":"khách hàng"},{"word":"Look after","ipa":"/ˌlʊk ˈɑːftə(r)/","pos":"phr v","meaning":"chăm sóc"},{"word":"Arrange","ipa":"/əˈreɪndʒ/","pos":"v","meaning":"sắp xếp"},{"word":"Arrangement","ipa":"/əˈreɪndʒmənt/","pos":"n","meaning":"sự sắp xếp; sự bố trí"},{"word":"Feed","ipa":"/fiːd/","pos":"v","meaning":"cho ăn"},{"word":"Feeding","ipa":"/ˈfiːdɪŋ/","pos":"n","meaning":"việc cho ăn"},{"word":"Patient","ipa":"/ˈpeɪʃnt/","pos":"adj","meaning":"kiên nhẫn"},{"word":"Patient","ipa":"/ˈpeɪʃnt/","pos":"n","meaning":"bệnh nhân"},{"word":"Patience","ipa":"/ˈpeɪʃns/","pos":"n","meaning":"sự kiên nhẫn"},{"word":"Patiently","ipa":"/ˈpeɪʃntli/","pos":"adv","meaning":"một cách kiên nhẫn"},{"word":"Get paid for","ipa":"/ˌɡet ˈpeɪd fɔː(r)/","pos":"phr v","meaning":"được trả tiền cho"}],"mcq":[{"num":1,"question":"Being an air traffic controller is a very ______ job that allows no mistakes.","options":["repetitive","voluntary","demanding","patient"],"answerIndex":2,"explanation":"\"a demanding job\" (công việc đòi hỏi cao) khớp với chi tiết \"allows no mistakes\". \"repetitive\" (lặp đi lặp lại) không đúng với công việc luôn thay đổi này; \"voluntary\" (tự nguyện, không lương) sai nghĩa; \"patient\" là tính từ mô tả người, không mô tả công việc."},{"num":2,"question":"Packing boxes on a production line all day is boring and ______.","options":["repeat","repetition","repeatedly","repetitive"],"answerIndex":3,"explanation":"Sau \"boring and\" cần tính từ song song: \"repetitive\" (lặp đi lặp lại). \"repeat\" là động từ; \"repetition\" là danh từ; \"repeatedly\" là trạng từ."},{"num":3,"question":"Learning a foreign language well requires a great deal of ______.","options":["repetition","repeat","repetitive","repeatedly"],"answerIndex":0,"explanation":"Sau \"a great deal of\" cần danh từ không đếm được: \"repetition\" (sự lặp lại). \"repeat\" là động từ; \"repetitive\" là tính từ; \"repeatedly\" là trạng từ."},{"num":4,"question":"Working to very tight deadlines can be extremely ______.","options":["stress","stressful","stressed","stressfully"],"answerIndex":1,"explanation":"Chủ ngữ là công việc gây căng thẳng nên cần tính từ chủ động \"stressful\". \"stressed\" dùng cho người cảm thấy căng thẳng; \"stress\" là danh từ/động từ; \"stressfully\" là trạng từ."},{"num":5,"question":"Everyone in the team understands the ______ of good communication.","options":["importance","important","importantly","imported"],"answerIndex":0,"explanation":"Sau \"the\" và trước \"of\" cần danh từ: \"the importance of sth\" (tầm quan trọng của điều gì). \"important\" là tính từ; \"importantly\" là trạng từ; \"imported\" là phân từ."},{"num":6,"question":"She works as a shop ______ every Saturday and Sunday.","options":["assist","assistance","assistant","assisted"],"answerIndex":2,"explanation":"\"a shop assistant\" (nhân viên bán hàng) là danh từ chỉ nghề nghiệp. \"assist/assisted\" là động từ; \"assistance\" là danh từ trừu tượng chỉ sự giúp đỡ."},{"num":7,"question":"Older customers may need ______ with carrying their shopping bags.","options":["assistant","assist","assisted","assistance"],"answerIndex":3,"explanation":"\"need assistance with sth\" (cần sự giúp đỡ trong việc gì) cần danh từ trừu tượng. \"assistant\" chỉ người; \"assist/assisted\" là động từ."},{"num":8,"question":"The work at the animal shelter is entirely ______, so nobody is paid.","options":["volunteer","voluntary","voluntarily","volunteered"],"answerIndex":1,"explanation":"Sau \"is entirely\" cần tính từ: \"voluntary\" (tự nguyện, không lương), khớp với \"nobody is paid\". \"volunteer\" là danh từ/động từ; \"voluntarily\" là trạng từ; \"volunteered\" là động từ chia quá khứ."},{"num":9,"question":"Twenty ______ helped to clean the beach last Sunday morning.","options":["voluntary","voluntarily","volunteering","volunteers"],"answerIndex":3,"explanation":"Chủ ngữ số nhiều chỉ người cần danh từ: \"volunteers\" (tình nguyện viên). \"voluntary\" là tính từ; \"voluntarily\" là trạng từ; \"volunteering\" là V-ing."},{"num":10,"question":"Looking after other people's children is a great ______.","options":["responsibility","responsible","responsibly","responsibilities"],"answerIndex":0,"explanation":"Sau \"a great\" cần danh từ số ít: \"responsibility\" (trách nhiệm). \"responsible\" là tính từ; \"responsibly\" là trạng từ; \"responsibilities\" số nhiều không đi với mạo từ \"a\"."},{"num":11,"question":"The assistant is ______ for keeping the shelves clean and tidy.","options":["responsibility","responsibly","responsible","responsibilities"],"answerIndex":2,"explanation":"\"be responsible for sth\" (chịu trách nhiệm về điều gì) là cấu trúc cố định, cần tính từ. \"responsibility/responsibilities\" là danh từ; \"responsibly\" là trạng từ."},{"num":12,"question":"If you have any problem during your shift, speak to your ______.","options":["supervise","supervisor","supervision","supervised"],"answerIndex":1,"explanation":"Người mà nhân viên báo cáo là \"supervisor\" (người giám sát). \"supervise/supervised\" là động từ; \"supervision\" là danh từ trừu tượng."},{"num":13,"question":"New staff work under close ______ for the first month.","options":["supervise","supervisor","supervision","supervised"],"answerIndex":2,"explanation":"\"under close supervision\" (dưới sự giám sát chặt chẽ) là cụm cố định, cần danh từ trừu tượng. \"supervisor\" chỉ người; \"supervise/supervised\" là động từ."},{"num":14,"question":"Good ______ at work is important for every employee.","options":["attend","attendee","attended","attendance"],"answerIndex":3,"explanation":"Chủ ngữ cần danh từ trừu tượng: \"good attendance\" (đi làm đầy đủ, đúng giờ). \"attend/attended\" là động từ; \"attendee\" chỉ người tham dự."},{"num":15,"question":"The charity collects ______ of food and warm clothes every winter.","options":["donate","donations","donor","donated"],"answerIndex":1,"explanation":"Sau \"collects\" cần danh từ chỉ vật được quyên góp: \"donations\" (các khoản/món quyên góp). \"donate/donated\" là động từ; \"donor\" chỉ người quyên góp."},{"num":16,"question":"Working with very small children requires a great deal of ______.","options":["patience","patient","patiently","patients"],"answerIndex":0,"explanation":"Sau \"a great deal of\" cần danh từ không đếm được: \"patience\" (sự kiên nhẫn). \"patient\" là tính từ hoặc danh từ chỉ bệnh nhân; \"patients\" là bệnh nhân số nhiều; \"patiently\" là trạng từ."}],"gapfill":[{"num":1,"sentence":"Volunteers ______ the animals twice a day at the rescue centre.","answer":"feed"},{"num":2,"sentence":"Her job is to ______ elderly people in their own homes.","answer":"look after"},{"num":3,"sentence":"The waiter waited ______ while the family chose their meal.","answer":"patiently"},{"num":4,"sentence":"More than three hundred ______ came to the university job fair.","answer":"attendees"},{"num":5,"sentence":"Many local companies ______ money to schools in poor districts.","answer":"donate"},{"num":6,"sentence":"Shop assistants must be polite to all ______, even difficult ones.","answer":"customers"},{"num":7,"sentence":"She is responsible for making the travel ______ for the whole team.","answer":"arrangements"},{"num":8,"sentence":"A senior nurse will ______ the new trainees during their first week.","answer":"supervise"},{"num":9,"sentence":"Could you ______ the question, please? I did not hear it clearly.","answer":"repeat"},{"num":10,"sentence":"Helping patients to recover is hard work but very ______.","answer":"rewarding"}]},"5":{"title":"LISTENING","words":[{"word":"Interfere with","ipa":"/ˌɪntəˈfɪə(r) wɪð/","pos":"phr v","meaning":"can thiệp vào"},{"word":"Interfere","ipa":"/ˌɪntəˈfɪə(r)/","pos":"v","meaning":"can thiệp"},{"word":"Interference","ipa":"/ˌɪntəˈfɪərəns/","pos":"n","meaning":"sự can thiệp"},{"word":"Influence","ipa":"/ˈɪnfluəns/","pos":"n, v","meaning":"ảnh hưởng"},{"word":"Influential","ipa":"/ˌɪnfluˈenʃl/","pos":"adj","meaning":"có ảnh hưởng"},{"word":"Performance","ipa":"/pəˈfɔːməns/","pos":"n","meaning":"màn trình diễn; hiệu suất"},{"word":"Perform","ipa":"/pəˈfɔːm/","pos":"v","meaning":"biểu diễn; thực hiện"},{"word":"Performer","ipa":"/pəˈfɔːmə(r)/","pos":"n","meaning":"người biểu diễn"},{"word":"Order","ipa":"/ˈɔːdə(r)/","pos":"n, v","meaning":"đơn đặt hàng; gọi món; ra lệnh"},{"word":"Orderly","ipa":"/ˈɔːdəli/","pos":"adj","meaning":"ngăn nắp, có trật tự"},{"word":"Request","ipa":"/rɪˈkwest/","pos":"n, v","meaning":"yêu cầu"},{"word":"Support","ipa":"/səˈpɔːt/","pos":"n, v","meaning":"hỗ trợ, ủng hộ"},{"word":"Supporter","ipa":"/səˈpɔːtə(r)/","pos":"n","meaning":"người ủng hộ"},{"word":"Supportive","ipa":"/səˈpɔːtɪv/","pos":"adj","meaning":"hay giúp đỡ, hỗ trợ"},{"word":"Accept","ipa":"/əkˈsept/","pos":"v","meaning":"chấp nhận"},{"word":"Acceptable","ipa":"/əkˈseptəbl/","pos":"adj","meaning":"có thể chấp nhận"},{"word":"Acceptance","ipa":"/əkˈseptəns/","pos":"n","meaning":"sự chấp nhận"},{"word":"Succeed","ipa":"/səkˈsiːd/","pos":"v","meaning":"thành công"},{"word":"Success","ipa":"/səkˈses/","pos":"n","meaning":"sự thành công"},{"word":"Successful","ipa":"/səkˈsesfl/","pos":"adj","meaning":"thành công"},{"word":"Successfully","ipa":"/səkˈsesfəli/","pos":"adv","meaning":"một cách thành công"},{"word":"Prevent","ipa":"/prɪˈvent/","pos":"v","meaning":"ngăn chặn"},{"word":"Prevention","ipa":"/prɪˈvenʃn/","pos":"n","meaning":"sự ngăn chặn"},{"word":"Preventive","ipa":"/prɪˈventɪv/","pos":"adj","meaning":"phòng ngừa"},{"word":"Require","ipa":"/rɪˈkwaɪə(r)/","pos":"v","meaning":"yêu cầu, đòi hỏi"},{"word":"Requirement","ipa":"/rɪˈkwaɪəmənt/","pos":"n","meaning":"yêu cầu, điều kiện"},{"word":"Quality","ipa":"/ˈkwɒləti/","pos":"n","meaning":"chất lượng"},{"word":"Qualify","ipa":"/ˈkwɒlɪfaɪ/","pos":"v","meaning":"đủ điều kiện"},{"word":"Qualified","ipa":"/ˈkwɒlɪfaɪd/","pos":"adj","meaning":"đủ trình độ"},{"word":"Vacancy","ipa":"/ˈveɪkənsi/","pos":"n","meaning":"vị trí tuyển dụng; chỗ trống"},{"word":"Vacant","ipa":"/ˈveɪkənt/","pos":"adj","meaning":"còn trống"},{"word":"Enquiry","ipa":"/ɪnˈkwaɪəri/","pos":"n","meaning":"sự hỏi thông tin, sự thắc mắc"},{"word":"Enquire","ipa":"/ɪnˈkwaɪə(r)/","pos":"v","meaning":"hỏi, thăm hỏi"}],"mcq":[{"num":1,"question":"A part-time job should not ______ your studies.","options":["interfere with","apply for","stick to","look after"],"answerIndex":0,"explanation":"\"interfere with sth\" (ảnh hưởng xấu, cản trở điều gì) đúng nghĩa và giới từ. \"apply for\" (nộp đơn xin), \"stick to\" (bám sát) và \"look after\" (chăm sóc) đều sai nghĩa với \"your studies\" trong lời khuyên này."},{"num":2,"question":"She is one of the most ______ women in the fashion industry today.","options":["influence","influential","influenced","influencing"],"answerIndex":1,"explanation":"Sau \"the most\" và trước danh từ \"women\" cần tính từ: \"influential\" (có ảnh hưởng). \"influence\" là danh từ/động từ; \"influenced/influencing\" là phân từ."},{"num":3,"question":"His old teacher had a strong ______ on his choice of career.","options":["influential","influenced","influence","influencing"],"answerIndex":2,"explanation":"\"have an influence on sb/sth\" (có ảnh hưởng đến ai/điều gì) là cụm cố định, cần danh từ sau \"a strong\"."},{"num":4,"question":"The manager was very pleased with her ______ during the first month.","options":["perform","performer","performed","performance"],"answerIndex":3,"explanation":"Sau tính từ sở hữu \"her\" cần danh từ: \"performance\" (hiệu suất làm việc). \"perform/performed\" là động từ; \"performer\" chỉ người biểu diễn."},{"num":5,"question":"Employees who ______ well during the trial period may be offered a contract.","options":["performance","perform","performer","performed"],"answerIndex":1,"explanation":"Mệnh đề quan hệ ở thì hiện tại đơn với chủ ngữ số nhiều cần động từ: \"perform well\" (làm việc tốt). \"performance/performer\" là danh từ; \"performed\" sai thì so với \"may be offered\"."},{"num":6,"question":"The customer placed a large ______ for two hundred office chairs.","options":["request","performance","order","acceptance"],"answerIndex":2,"explanation":"\"place an order for sth\" (đặt hàng) là collocation cố định. \"request\" không đi với động từ \"place\" theo cách này; \"performance\" và \"acceptance\" sai nghĩa."},{"num":7,"question":"We have received a/an ______ for more information about the training course.","options":["order","performance","acceptance","request"],"answerIndex":3,"explanation":"\"a request for information\" (yêu cầu cung cấp thông tin) là cụm chuẩn. \"an order for information\" nghĩa là đặt mua nên sai; \"performance\" và \"acceptance\" sai nghĩa."},{"num":8,"question":"My colleagues were very ______ when I first started working here.","options":["supportive","support","supporter","supportively"],"answerIndex":0,"explanation":"Sau \"were very\" cần tính từ: \"supportive\" (luôn hỗ trợ). \"support\" là danh từ/động từ; \"supporter\" chỉ người; \"supportively\" là trạng từ."},{"num":9,"question":"Arriving ten minutes late every single day is simply not ______.","options":["accept","acceptance","acceptable","accepted"],"answerIndex":2,"explanation":"Sau \"is not\" cần tính từ: \"acceptable\" (có thể chấp nhận được). \"accept\" là động từ; \"acceptance\" là danh từ; \"accepted\" mang nghĩa đã được chấp nhận."},{"num":10,"question":"She was delighted to receive a letter of ______ from the company.","options":["accept","acceptable","accepted","acceptance"],"answerIndex":3,"explanation":"\"a letter of acceptance\" (thư báo trúng tuyển) cần danh từ sau \"of\". \"accept/accepted\" là động từ; \"acceptable\" là tính từ."},{"num":11,"question":"He has been very ______ in his new career as a software engineer.","options":["successful","success","succeed","successfully"],"answerIndex":0,"explanation":"Sau \"has been very\" cần tính từ: \"successful\" (thành công). \"success\" là danh từ; \"succeed\" là động từ; \"successfully\" là trạng từ."},{"num":12,"question":"You need patience and hard work to ______ in this profession.","options":["success","succeed","successful","successfully"],"answerIndex":1,"explanation":"Sau \"to\" chỉ mục đích cần động từ nguyên thể: \"succeed in sth\" (thành công trong lĩnh vực gì). \"success\" là danh từ; \"successful\" là tính từ; \"successfully\" là trạng từ."},{"num":13,"question":"Wearing a helmet on the building site can ______ serious head injuries.","options":["prevention","preventive","prevented","prevent"],"answerIndex":3,"explanation":"Sau \"can\" cần động từ nguyên thể: \"prevent injuries\" (ngăn ngừa chấn thương). \"prevention\" là danh từ; \"preventive\" là tính từ; \"prevented\" sai dạng sau động từ khuyết thiếu."},{"num":14,"question":"Read the job ______ carefully before you fill in the application form.","options":["enquiries","requirements","vacancies","performances"],"answerIndex":1,"explanation":"\"job requirements\" (các yêu cầu của công việc) là thứ cần đọc kỹ trước khi nộp đơn. \"enquiries\" (câu hỏi), \"vacancies\" (vị trí trống) và \"performances\" (màn trình diễn) sai nghĩa."},{"num":15,"question":"Only ______ electricians are allowed to do this kind of work.","options":["qualified","qualify","quality","qualification"],"answerIndex":0,"explanation":"Trước danh từ \"electricians\" cần tính từ: \"qualified electricians\" (thợ điện có chuyên môn). \"qualify\" là động từ; \"quality\" và \"qualification\" là danh từ."},{"num":16,"question":"The position has been ______ for almost three months now.","options":["vacancy","vacantly","vacant","vacate"],"answerIndex":2,"explanation":"Sau \"has been\" cần tính từ: \"vacant\" (còn trống). \"vacancy\" là danh từ; \"vacantly\" là trạng từ; \"vacate\" là động từ."}],"gapfill":[{"num":1,"sentence":"She completed the training course ______ and started work in June.","answer":"successfully"},{"num":2,"sentence":"The ______ of accidents at work is everybody's responsibility.","answer":"prevention"},{"num":3,"sentence":"The football team has thousands of loyal ______ in the province.","answer":"supporters"},{"num":4,"sentence":"Please ______ at the reception desk about the parking permit.","answer":"enquire"},{"num":5,"sentence":"The magician was a wonderful ______ and the children loved his show.","answer":"performer"},{"num":6,"sentence":"Radio ______ made it impossible to hear the announcement clearly.","answer":"interference"},{"num":7,"sentence":"Customers care about the ______ of the service as much as the price.","answer":"quality"},{"num":8,"sentence":"Her ______ of the job offer arrived by email the next morning.","answer":"acceptance"},{"num":9,"sentence":"Advertising has a strong ______ on what young people buy.","answer":"influence"},{"num":10,"sentence":"The classroom was clean and ______ when the inspector arrived.","answer":"orderly"}]},"6":{"title":"WRITING","words":[{"word":"Application","ipa":"/ˌæplɪˈkeɪʃn/","pos":"n","meaning":"đơn xin; sự ứng dụng"},{"word":"Apply","ipa":"/əˈplaɪ/","pos":"v","meaning":"nộp đơn; áp dụng"},{"word":"Applicant","ipa":"/ˈæplɪkənt/","pos":"n","meaning":"người nộp đơn"},{"word":"Hire","ipa":"/ˈhaɪə(r)/","pos":"v, n","meaning":"thuê; tuyển dụng"},{"word":"Receptionist","ipa":"/rɪˈsepʃənɪst/","pos":"n","meaning":"lễ tân"},{"word":"Reception","ipa":"/rɪˈsepʃn/","pos":"n","meaning":"quầy lễ tân; sự đón tiếp"},{"word":"Look for","ipa":"/ˈlʊk fɔː(r)/","pos":"phr v","meaning":"tìm kiếm"},{"word":"Recipient","ipa":"/rɪˈsɪpiənt/","pos":"n","meaning":"người nhận"},{"word":"Receive","ipa":"/rɪˈsiːv/","pos":"v","meaning":"nhận"},{"word":"Reception","ipa":"/rɪˈsepʃn/","pos":"n","meaning":"sự tiếp nhận; lễ tân"},{"word":"Signature","ipa":"/ˈsɪɡnətʃə(r)/","pos":"n","meaning":"chữ ký"},{"word":"Sign","ipa":"/saɪn/","pos":"v, n","meaning":"ký; dấu hiệu"},{"word":"Relevant","ipa":"/ˈreləvənt/","pos":"adj","meaning":"liên quan"},{"word":"Relevance","ipa":"/ˈreləvəns/","pos":"n","meaning":"sự liên quan"},{"word":"Position","ipa":"/pəˈzɪʃn/","pos":"n","meaning":"vị trí"},{"word":"Position","ipa":"/pəˈzɪʃn/","pos":"v","meaning":"đặt, bố trí"},{"word":"Advertise","ipa":"/ˈædvətaɪz/","pos":"v","meaning":"quảng cáo; tuyển dụng"},{"word":"Advertisement","ipa":"/ədˈvɜːtɪsmənt/","pos":"n","meaning":"qu  your ______ for a sales assistant in yesterday's newspaper.","options":["advertise","advertisement","advertiser","advertised"],"answerIndex":1,"explanation":"Thứ đăng trên báo là \"advertisement\" (mẩu quảng cáo tuyển dụng). \"advertise/advertised\" là động từ; \"advertiser\" chỉ người hoặc công ty quảng cáo."},{"num":5,"question":"The company will ______ the position on its website next week.","options":["advertise","advertisement","advertiser","advertised"],"answerIndex":0,"explanation":"Sau \"will\" cần động từ nguyên thể: \"advertise a position\" (đăng tuyển một vị trí). \"advertisement/advertiser\" là danh từ; \"advertised\" sai dạng sau \"will\"."},{"num":6,"question":"After graduating, she found a job in the ______ industry, working at a resort.","options":["signature","consideration","persuasion","hospitality"],"answerIndex":3,"explanation":"\"the hospitality industry\" (ngành dịch vụ khách sạn – nhà hàng) khớp với \"working at a resort\". \"signature\" (chữ ký), \"consideration\" (sự cân nhắc) và \"persuasion\" (sự thuyết phục) sai nghĩa."},{"num":7,"question":"My main ______ included answering the phone and greeting visitors.","options":["responsible","responsibilities","responsibly","responsibility"],"answerIndex":1,"explanation":"Động từ \"included\" đi với chủ ngữ số nhiều nên cần \"responsibilities\" (các trách nhiệm). \"responsibility\" số ít không hợp với hai công việc được liệt kê sau đó; \"responsible\" là tính từ; \"responsibly\" là trạng từ."},{"num":8,"question":"I have ______ my CV and two references to this email.","options":["attach","attachment","attached","attaching"],"answerIndex":2,"explanation":"Thì hiện tại hoàn thành \"have + V3\" cần \"attached\" (đã đính kèm). \"attach\" là nguyên thể; \"attachment\" là danh từ; \"attaching\" là V-ing."},{"num":9,"question":"The employer asked me for two ______ from my former teachers.","options":["references","signatures","attachments","positions"],"answerIndex":0,"explanation":"\"a reference\" ở đây là thư giới thiệu do người từng dạy hoặc quản lý viết. \"signatures\" (chữ ký), \"attachments\" (tệp đính kèm) và \"positions\" (vị trí) sai nghĩa."},{"num":10,"question":"I am ______ for an interview at any time next week.","options":["availability","available","avail","availably"],"answerIndex":1,"explanation":"Sau \"am\" cần tính từ: \"be available for sth\" (có thể sắp xếp thời gian cho điều gì). \"availability\" là danh từ; \"avail\" là động từ; \"availably\" không phải dạng thông dụng và cũng sai từ loại ở đây."},{"num":11,"question":"Please let us know your ______ for the last two weeks of July.","options":["available","avail","availably","availability"],"answerIndex":3,"explanation":"Sau tính từ sở hữu \"your\" cần danh từ: \"availability\" (thời gian có thể sắp xếp). \"available\" là tính từ; hai phương án còn lại sai từ loại."},{"num":12,"question":"Thank you very much for your ______ of my application.","options":["consider","considerable","consideration","considerate"],"answerIndex":2,"explanation":"Sau \"your\" và trước \"of\" cần danh từ: \"your consideration of sth\" (việc quý vị xem xét điều gì). \"consider\" là động từ; \"considerable\" (đáng kể) và \"considerate\" (chu đáo) là tính từ."},{"num":13,"question":"He is a very ______ colleague who always helps new members of staff.","options":["considerable","consideration","considering","considerate"],"answerIndex":3,"explanation":"Trước danh từ \"colleague\" cần tính từ mô tả tính cách: \"considerate\" (chu đáo, biết nghĩ cho người khác). \"considerable\" nghĩa là đáng kể về số lượng nên sai nghĩa; \"consideration\" là danh từ; \"considering\" là V-ing."},{"num":14,"question":"If a letter begins with \"Dear Sir\", it should end with \"Yours ______\".","options":["faithful","faith","faithfully","faithfulness"],"answerIndex":2,"explanation":"\"Yours faithfully\" là công thức kết thư chuẩn khi mở đầu bằng \"Dear Sir/Madam\", cần trạng từ. \"faithful\" là tính từ; \"faith/faithfulness\" là danh từ."},{ ,{"word":"reflection","ipa":"/rɪˈflekʃn/","pos":"N.","meaning":"sự phản chiếu, sự phản ánh"},{"word":"demand for","ipa":"/dɪˈmɑːnd fə(r)/","pos":"N. phr.","meaning":"nhu cầu đối với cái gì"},{"word":"demanding","ipa":"/dɪˈmɑːndɪŋ/","pos":"Adj.","meaning":"đòi hỏi cao, khắt khe"},{"word":"scuba diver","ipa":"/ˈskuːbə ˈdaɪvə(r)/","pos":"N. phr.","meaning":"thợ lặn có bình khí"},{"word":"scuba diving","ipa":"/ˈskuːbə ˈdaɪvɪŋ/","pos":"N.","meaning":"môn lặn có bình khí"},{"word":"dive","ipa":"/daɪv/","pos":"V. / N.","meaning":"lặn / sự lặn xuống"}],"mcq":[{"num":1,"question":"Please ______ this email as soon as you can.","options":["respond to","concentrate on","worry about","squeeze into"],"answerIndex":0,"explanation":"\"respond to an email\" (trả lời email) đúng nghĩa và giới từ. \"concentrate on\" (tập trung vào), \"worry about\" (lo lắng về) và \"squeeze into\" (chen vào) đều sai nghĩa với một email cần được trả lời."},{"num":2,"question":"We have not received any ______ to our advertisement yet.","options":["respond","responsive","response","responded"],"answerIndex":2,"explanation":"Sau \"any\" cần danh từ: \"a response to sth\" (phản hồi cho điều gì). \"respond/responded\" là động từ; \"responsive\" là tính từ."},{"num":3,"question":"She felt extremely ______ about her first day at the new office.","options":["nervously","nervous","nerve","nerves"],"answerIndex":1,"explanation":"Sau động từ nối \"felt\" cần tính từ: \"be nervous about sth\" (lo lắng, hồi hộp về điều gì). \"nervously\" là trạng từ; \"nerve/nerves\" là danh từ."},{"num":4,"question":"He is very ______ about losing his job if the factory closes.","options":["worry","worrying","worriedly","worried"],"answerIndex":3,"explanation":"\"be worried about sth\" (lo lắng về điều gì) là cấu trúc cố định dùng cho người. \"worrying\" mô tả điều gây lo lắng chứ không mô tả người và không đi với \"about\" theo cách này; \"worry\" là động từ/danh từ; \"worriedly\" là trạng từ."},{"num":5,"question":"My ______ at the office are friendly and always ready to help.","options":["commuters","employers","colleagues","divers"],"answerIndex":2,"explanation":"Những người làm việc cùng bạn ở văn phòng là \"colleagues\" (đồng nghiệp). \"commuters\" (người đi làm xa), \"employers\" (chủ lao động) và \"divers\" (thợ lặn) sai nghĩa."},{"num":6,"question":"The new office chairs are much more ______ than the old ones.","options":["comfortable","comfort","uncomfortable","comfortably"],"answerIndex":0,"explanation":"Sau \"much more\" trong so sánh cần tính từ, và \"new … than the old ones\" hàm ý tốt hơn: \"comfortable\" (thoải mái). \"uncomfortable\" trái nghĩa; \"comfort\" là danh từ; \"comfortably\" là trạng từ."},{"num":7,"question":"Standing on a crowded bus for a whole hour is extremely ______.","options":["comfortable","uncomfortable","comfort","comfortably"],"answerIndex":1,"explanation":"Chi tiết \"a crowded bus for a whole hour\" chốt nghĩa \"uncomfortable\" (khó chịu). \"comfortable\" trái nghĩa; \"comfort\" là danh từ; \"comfortably\" là trạng từ."},{"num":8,"question":"It is very difficult to ______ on your work when the office is noisy.","options":["concentration","concentrated","concentrating","concentrate"],"answerIndex":3,"explanation":"Sau \"to\" cần động từ nguyên thể: \"concentrate on sth\" (tập trung vào điều gì). \"concentration\" là danh từ; \"concentrated/concentrating\" sai dạng sau \"to\"."},{"num":9,"question":"This job requires great ______ and close attention to detail.","options":["concentration","concentrate","concentrated","concentrating"],"answerIndex":0,"explanation":"Sau \"great\" cần danh từ không đếm được: \"concentration\" (sự tập trung). Ba phương án còn lại đều là dạng động từ."},{"num":10,"question":"Thousands of ______ take the train into the city every morning.","options":["colleagues","divers","employers","commuters"],"answerIndex":3,"explanation":"Người ngày ngày đi tàu vào thành phố làm việc là \"commuters\". \"colleagues\" (đồng nghiệp), \"divers\" (thợ lặn) và \"employers\" (chủ lao động) không mang nghĩa này."},{"num":11,"question":"She has to ______ forty kilometres to work and back every day.","options":["endure","squeeze","commute","reflect"],"answerIndex":2,"explanation":"\"commute\" (đi lại đều đặn giữa nhà và nơi làm) đúng với \"forty kilometres to work and back\". \"endure\" (chịu đựng), \"squeeze\" (chen lấn) và \"reflect\" (phản chiếu) sai nghĩa."},{"num":12,"question":"The workers had to ______ very high temperatures inside the factory.","options":["commute","endure","reflect","dive"],"answerIndex":1,"explanation":"\"endure high temperatures\" (chịu đựng nhiệt độ cao) là collocation chuẩn. \"commute\" (đi lại), \"reflect\" (phản chiếu) và \"dive\" (lặn) sai nghĩa."},{"num":13,"question":"Working night shifts for many years requires great physical ______.","options":["endure","enduring","endured","endurance"],"answerIndex":3,"explanation":"Sau \"great physical\" cần danh từ: \"endurance\" (sức chịu đựng). \"endure/endured\" là động từ; \"enduring\" là tính từ mang nghĩa lâu dài."},{"num":14,"question":"During the rush hour, passengers have to ______ into the crowded carriage.","options":["squeeze","reflect","dive","respond"],"answerIndex":0,"explanation":"\"squeeze into somewhere\" (chen vào chỗ chật) đúng nghĩa và giới từ. \"reflect into\", \"dive into\" và \"respond into\" đều sai cấu trúc hoặc sai nghĩa trong ngữ cảnh tàu đông người."},{"num":15,"question":"There is a growing ______ skilled software engineers in this country.","options":["response to","demand for","worry about","reflection of"],"answerIndex":1,"explanation":"\"a demand for sb/sth\" (nhu cầu về nhân lực hoặc hàng hóa) đúng nghĩa và giới từ. \"response to\", \"worry about\" và \"reflection of\" không diễn tả nhu cầu tuyển dụng."},{"num":16,"question":"As a professional ______, he works on underwater pipelines all year round.","options":["commuter","colleague","scuba diver","receptionist"],"answerIndex":2,"explanation":"Người làm việc dưới nước với bình khí là \"scuba diver\" (thợ lặn). \"commuter\", \"colleague\" và \"receptionist\" không phải nghề làm việc dưới nước."}],"gapfill":[{"num":1,"sentence":"The office block has ______ windows that keep out the heat of the sun.","answer":"reflective"},{"num":2,"sentence":"She could clearly see her ______ in the glass door.","answer":"reflection"},{"num":3,"sentence":"Being a surgeon is one of the most ______ jobs in the world.","answer":"demanding"},{"num":4,"sentence":"Do not ______ so much — you will certainly find a job soon.","answer":"worry"},{"num":5,"sentence":"Marathon runners need great physical ______ as well as speed.","answer":"endurance"},{"num":6,"sentence":"Professional divers regularly ______ to depths of thirty metres or more.","answer":"dive"},{"num":7,"sentence":"He has been in full-time ______ since he left college two years ago.","answer":"employment"},{"num":8,"sentence":"Noise in an open-plan office can destroy your ______.","answer":"concentration"},{"num":9,"sentence":"The company is very ______ to its customers' needs and answers within a day.","answer":"responsive"},{"num":10,"sentence":"Air conditioning adds greatly to the ______ of office workers in summer.","answer":"comfort"}]}},"6":{"1":{"title":"GETTING STARTED","words":[{"word":"intelligent","ipa":"/ɪnˈtelɪdʒənt/","pos":"adj.","meaning":"thông minh"},{"word":"intelligence","ipa":"/ɪnˈtelɪdʒəns/","pos":"n.","meaning":"trí thông minh"},{"word":"intelligently","ipa":"/ɪnˈtelɪdʒəntli/","pos":"adv.","meaning":"một cách thông minh"},{"word":"robot","ipa":"/ˈrəʊbɒt/","pos":"n.","meaning":"rô-bốt"},{"word":"robotic","ipa":"/rəʊˈbɒtɪk/","pos":"adj.","meaning":"thuộc rô-bốt"},{"word":"robotics","ipa":"/rəʊˈbɒtɪks/","pos":"n.","meaning":"ngành rô-bốt học"},{"word":"interact","ipa":"/ˌɪntərˈækt/","pos":"v.","meaning":"tương tác"},{"word":"interaction","ipa":"/ˌɪntərˈækʃn/","pos":"n.","meaning":"sự tương tác"},{"word":"interactive","ipa":"/ˌɪntərˈæktɪv/","pos":"adj.","meaning":"có tính tương tác"},{"word":"translate","ipa":"/trænzˈleɪt/","pos":"v.","meaning":"dịch"},{"word":"translation","ipa":"/trænzˈleɪʃn/","pos":"n.","meaning":"bản dịch; sự dịch"},{"word":"translator","ipa":"/trænzˈleɪtə(r)/","pos":"n.","meaning":"người dịch"},{"word":"develop","ipa":"/dɪˈveləp/","pos":"v.","meaning":"phát triển"},{"word":"development","ipa":"/dɪˈveləpmənt/","pos":"n.","meaning":"sự phát triển"},{"word":"developer","ipa":"/dɪˈveləpə(r)/","pos":"n.","meaning":"nhà phát triển"},{"word":"developed","ipa":"/dɪˈveləpt/","pos":"adj.","meaning":"phát triển"},{"word":"application","ipa":"/ˌæplɪˈkeɪʃn/","pos":"n.","meaning":"ứng dụng"},{"word":"apply","ipa":"/əˈplaɪ/","pos":"v.","meaning":"áp dụng"},{"word":"applicable","ipa":"/əˈplɪkəbl/","pos":"adj.","meaning":"có thể áp dụng"},{"word":"identify","ipa":"/aɪˈdentɪfaɪ/","pos":"v.","meaning":"nhận dạng"},{"word":"identification","ipa":"/aɪˌdentɪfɪˈkeɪʃn/","pos":"n.","meaning":"sự nhận dạng"},{"word":"identifiable","ipa":"/aɪˈdentɪfaɪəbl/","pos":"adj.","meaning":"có thể nhận dạng"},{"word":"recognise","ipa":"/ˈrekəɡnaɪz/","pos":"v.","meaning":"nhận diện"},{"word":"recognition","ipa":"/ˌrekəɡˈnɪʃn/","pos":"n.","meaning":"sự nhận diện"},{"word":"recognisable","ipa":"/ˈrekəɡnaɪzəbl/","pos":"adj.","meaning":"dễ nhận ra"},{"word":"virtual","ipa":"/ˈvɜːtʃuəl/","pos":"adj.","meaning":"ảo"},{"word":"virtually","ipa":"/ˈvɜːtʃuəli/","pos":"adv.","meaning":"hầu như"},{"word":"assistant","ipa":"/əˈsɪstənt/","pos":"n.","meaning":"trợ lý"},{"word":"assist","ipa":"/əˈsɪst/","pos":"v.","meaning":"hỗ trợ"},{"word":"assistance","ipa":"/əˈsɪstəns/","pos":"n.","meaning":"sự hỗ trợ"},{"word":"facial recognition","ipa":"/ˈfeɪʃl ˌrekəɡˈnɪʃn/","pos":"n. phr.","meaning":"nhận diện khuôn mặt"},{"word":"facial","ipa":"/ˈfeɪʃl/","pos":"adj.","meaning":"thuộc khuôn mặt"},{"word":"face","ipa":"/feɪs/","pos":"n.","meaning":"khuôn mặt"},{"word":"human-like","ipa":"/ˈhjuːmən laɪk/","pos":"adj.","meaning":"giống con người"},{"word":"human","ipa":"/ˈhjuːmən/","pos":"n., adj.","meaning":"con người; thuộc con người"},{"word":"humanity","ipa":"/hjuːˈmænəti/","pos":"n.","meaning":"nhân loại"},{"word":"capable (of)","ipa":"/ˈkeɪpəbl/","pos":"adj.","meaning":"có khả năng"},{"word":"capability","ipa":"/ˌkeɪpəˈbɪləti/","pos":"n.","meaning":"khả năng"},{"word":"improve","ipa":"/ɪmˈpruːv/","pos":"v.","meaning":"cải thiện"},{"word":"improvement","ipa":"/ɪmˈpruːvmənt/","pos":"n.","meaning":"sự cải thiện"},{"word":"improved","ipa":"/ɪmˈpruːvd/","pos":"adj.","meaning":"được cải thiện"},{"word":"technology","ipa":"/tekˈnɒlədʒi/","pos":"n.","meaning":"công nghệ"},{"word":"technological","ipa":"/ˌteknəˈlɒdʒɪkl/","pos":"adj.","meaning":"thuộc công nghệ"},{"word":"technologically","ipa":"/ˌteknəˈlɒdʒɪkli/","pos":"adv.","meaning":"về mặt công nghệ"}],"mcq":[{"num":1,"question":"Artificial ______ is changing the way we work, study and travel.","options":["intelligence","intelligent","intelligently","intelligences"],"answerIndex":0,"explanation":"\"artificial intelligence\" (trí tuệ nhân tạo) là cụm danh từ cố định, cần danh từ không đếm được. \"intelligent\" là tính từ; \"intelligently\" là trạng từ; \"intelligences\" số nhiều không dùng trong cụm này."},{"num":2,"question":"This robot is ______ enough to learn from its own mistakes.","options":["intelligence","intelligently","intelligences","intelligent"],"answerIndex":3,"explanation":"Cấu trúc \"be + tính từ + enough\" cần tính từ: \"intelligent\" (thông minh). \"intelligence/intelligences\" là danh từ; \"intelligently\" là trạng từ."},{"num":3,"question":"He is studying ______ at a technical university in Japan.","options":["robot","robotics","robotic","robots"],"answerIndex":1,"explanation":"Tên một ngành học cần danh từ không đếm được: \"robotics\" (ngành rô-bốt học). \"robot/robots\" chỉ máy móc cụ thể; \"robotic\" là tính từ."},{"num":4,"question":"The machine moves in a stiff, ______ way that looks quite unnatural.","options":["robot","robotics","robotic","robotically"],"answerIndex":2,"explanation":"Trước danh từ \"way\" cần tính từ: \"a robotic way\" (kiểu chuyển động như máy). \"robot\" là danh từ; \"robotics\" là tên ngành học; \"robotically\" là trạng từ."},{"num":5,"question":"The museum has an ______ display that responds to the visitor's voice.","options":["interact","interaction","interactively","interactive"],"answerIndex":3,"explanation":"Trước danh từ \"display\" cần tính từ: \"an interactive display\" (màn hình tương tác). \"interact\" là động từ; \"interaction\" là danh từ; \"interactively\" là trạng từ."},{"num":6,"question":"This app works as a ______ and can handle more than fifty languages.","options":["translator","translation","translate","translated"],"answerIndex":0,"explanation":"\"work as a + danh từ chỉ người/công cụ đảm nhiệm vai trò\": \"translator\" (người/công cụ dịch). \"translation\" là bản dịch; \"translate/translated\" là động từ."},{"num":7,"question":"The ______ produced by the software was surprisingly accurate.","options":["translate","translator","translation","translated"],"answerIndex":2,"explanation":"Chủ ngữ của \"was\" cần danh từ chỉ sản phẩm: \"translation\" (bản dịch). \"translator\" chỉ người dịch nên không phải thứ \"produced by the software\"; \"translate/translated\" là động từ."},{"num":8,"question":"The company employs three hundred software ______ in this city alone.","options":["development","developers","develop","developed"],"answerIndex":1,"explanation":"\"software developers\" (lập trình viên) là danh từ chỉ người được tuyển dụng. \"development\" là danh từ trừu tượng; \"develop/developed\" là động từ."},{"num":9,"question":"Scientists have ______ a robot that can perform simple surgery.","options":["developed","development","developer","developing"],"answerIndex":0,"explanation":"Thì hiện tại hoàn thành \"have + V3\" cần \"developed\" (đã phát triển). \"development/developer\" là danh từ; \"developing\" là V-ing."},{"num":10,"question":"This ______ helps students practise their pronunciation at home.","options":["apply","applicable","application","applied"],"answerIndex":2,"explanation":"Chủ ngữ của \"helps\" cần danh từ: \"application\" (ứng dụng). \"apply/applied\" là động từ; \"applicable\" là tính từ."},{"num":11,"question":"The system can ______ a person from a photograph in less than a second.","options":["identification","identify","identifiable","identified"],"answerIndex":1,"explanation":"Sau \"can\" cần động từ nguyên thể: \"identify\" (nhận dạng). \"identification\" là danh từ; \"identifiable\" là tính từ; \"identified\" sai dạng sau động từ khuyết thiếu."},{"num":12,"question":"Facial ______ is now used to unlock most modern smartphones.","options":["recognise","recognisable","recognised","recognition"],"answerIndex":3,"explanation":"\"facial recognition\" (nhận diện khuôn mặt) là cụm danh từ cố định. \"recognise/recognised\" là động từ; \"recognisable\" là tính từ."},{"num":13,"question":"Many students now attend ______ classes without leaving home.","options":["capable","virtual","facial","human-like"],"answerIndex":1,"explanation":"\"virtual classes\" (lớp học trực tuyến, lớp ảo) khớp với \"without leaving home\". \"capable\" (có khả năng) dùng cho người/máy; \"facial\" (thuộc khuôn mặt) và \"human-like\" (giống con người) không mô tả được lớp học."},{"num":14,"question":"This drone is ______ of flying for two hours without stopping.","options":["capability","capably","capable","capabilities"],"answerIndex":2,"explanation":"\"be capable of doing sth\" (có khả năng làm gì) là cấu trúc cố định, cần tính từ. \"capability/capabilities\" là danh từ; \"capably\" là trạng từ."},{"num":15,"question":"There has been a huge ______ in translation software over the last ten years.","options":["improvement","improve","improved","improving"],"answerIndex":0,"explanation":"Sau \"a huge\" cần danh từ: \"improvement\" (sự cải thiện). \"improve\" là động từ; \"improved\" là tính từ/phân từ; \"improving\" là V-ing."},{"num":16,"question":"______ change is happening faster today than at any time in history.","options":["Technology","Technologically","Technologies","Technological"],"answerIndex":3,"explanation":"Trước danh từ \"change\" cần tính từ: \"technological change\" (sự thay đổi công nghệ). \"Technology/Technologies\" là danh từ; \"Technologically\" là trạng từ."}],"gapfill":[{"num":1,"sentence":"A virtual ______ such as Siri can set alarms and answer simple questions.","answer":"assistant"},{"num":2,"sentence":"Older passengers may need ______ with the new ticket machines.","answer":"assistance"},{"num":3,"sentence":"The airport uses ______ to check passengers at the boarding gate.","answer":"facial recognition"},{"num":4,"sentence":"Please show some form of ______ before entering the laboratory.","answer":"identification"},{"num":5,"sentence":"The robot behaved so ______ that visitors forgot it was a machine.","answer":"intelligently"},{"num":6,"sentence":"Modern ______ has completely changed the way we learn languages.","answer":"technology"},{"num":7,"sentence":"The two photographs are ______ identical; only the date is different.","answer":"virtually"},{"num":8,"sentence":"This new model has the ______ to translate speech in real time.","answer":"capability"},{"num":9,"sentence":"His voice is instantly ______, even on a bad telephone line.","answer":"recognisable"},{"num":10,"sentence":"Some scientists worry about what these machines will mean for ______ as a whole.","answer":"humanity"}]},"2":{"title":"LANGUAGE","words":[{"word":"advanced","ipa":"/ədˈvɑːnst/","pos":"adj","meaning":"tiên tiến, hiện đại"},{"word":"advance","ipa":"/ədˈvɑːns/","pos":"v","meaning":"phát triển, tiến bộ"},{"word":"advancement","ipa":"/ədˈvɑːnsmənt/","pos":"n","meaning":"sự tiến bộ, sự phát triển"},{"word":"chatbot","ipa":"/ˈtʃætbɒt/","pos":"n","meaning":"chatbot, chương trình trò chuyện tự động"},{"word":"artificial intelligence","ipa":"/ˌɑːtɪfɪʃl ɪnˈtelɪdʒəns/","pos":"n","meaning":"trí tuệ nhân tạo (AI)"},{ __ can explain a difficult point again and again without getting tired.","options":["platform","tutor","portfolio","experiment"],"answerIndex":1,"explanation":"Người (hoặc chương trình đóng vai người) giảng lại bài là \"tutor\" (gia sư). \"platform\" (nền tảng), \"portfolio\" (hồ sơ năng lực) và \"experiment\" (thí nghiệm) không giảng bài."},{"num":8,"question":"Private ______ has become very expensive in the big cities.","options":["tutor","tutored","tutoring","tutors"],"answerIndex":2,"explanation":"Chủ ngữ chỉ hoạt động, không đếm được, đi với \"has become\": \"tutoring\" (việc dạy kèm). \"tutor/tutors\" chỉ người; \"tutored\" là phân từ."},{"num":9,"question":"This learning ______ now has more than a million registered users.","options":["portfolio","platform","tutor","analysis"],"answerIndex":1,"explanation":"\"a learning platform\" (nền tảng học trực tuyến) là hệ thống có người dùng đăng ký. \"portfolio\", \"tutor\" và \"analysis\" không phải hệ thống trực tuyến."},{"num":10,"question":"Each student receives a ______ study plan based on their test results.","options":["personalise","personalisation","personalised","personally"],"answerIndex":2,"explanation":"Trước cụm danh từ \"study plan\" cần tính từ: \"a personalised study plan\" (kế hoạch học cá nhân hóa). \"personalise\" là động từ; \"personalisation\" là danh từ; \"personally\" là trạng từ."},{"num":11,"question":"The ______ of lessons is the biggest advantage of this program.","options":["personalisation","personalise","personalised","personally"],"answerIndex":0,"explanation":"Chủ ngữ của \"is\" cần danh từ: \"the personalisation of sth\" (sự cá nhân hóa cái gì). \"personalise\" là động từ; \"personalised\" là tính từ; \"personally\" là trạng từ."},{"num":12,"question":"The online lessons are so ______ that children do not want to stop.","options":["engaged","engagement","engage","engaging"],"answerIndex":3,"explanation":"Chủ ngữ là sự vật gây hứng thú nên cần tính từ chủ động \"engaging\" (hấp dẫn). \"engaged\" mô tả người đang tham gia; \"engagement\" là danh từ; \"engage\" là động từ."},{"num":13,"question":"Teachers noticed a big rise in student ______ after the app was introduced.","options":["engagement","engage","engaging","engaged"],"answerIndex":0,"explanation":"Sau danh từ bổ nghĩa \"student\" cần danh từ: \"student engagement\" (mức độ tham gia của học sinh). \"engage\" là động từ; \"engaging/engaged\" là tính từ."},{"num":14,"question":"Students can carry out a dangerous ______ safely in a virtual laboratory.","options":["portfolio","platform","tutor","experiment"],"answerIndex":3,"explanation":"\"carry out an experiment\" (tiến hành một thí nghiệm) là collocation cố định. \"portfolio\", \"platform\" và \"tutor\" không phải thứ được tiến hành trong phòng thí nghiệm."},{"num":15,"question":"The app teaches children about ______ animals such as tigers and pangolins.","options":["endanger","endangered","endangering","endangerment"],"answerIndex":1,"explanation":"Trước danh từ \"animals\" cần tính từ: \"endangered animals\" (động vật có nguy cơ tuyệt chủng). \"endanger\" là động từ; \"endangering\" là V-ing; \"endangerment\" là danh từ."},{"num":16,"question":"The program shows how two ______ substances react with each other.","options":["chemistry","chemically","chemical","chemicals"],"answerIndex":2,"explanation":"Trước danh từ \"substances\" cần tính từ: \"chemical substances\" (chất hóa học). \"chemistry\" và \"chemicals\" là danh từ; \"chemically\" là trạng từ."}],"gapfill":[{"num":1,"sentence":"She studies ______, and her favourite topic is the human heart.","answer":"biology"},{"num":2,"sentence":"In ______ we learn how different substances react with one another.","answer":"chemistry"},{"num":3,"sentence":"He ______ the video to the class page late last night.","answer":"uploaded"},{"num":4,"sentence":"______ allows students in remote areas to follow the same courses.","answer":"Distance-learning"},{"num":5,"sentence":"The teacher encourages students to think ______ about every claim they read.","answer":"analytically"},{"num":6,"sentence":"Online courses often lack face-to-face ______ between classmates.","answer":"interaction"},{"num":7,"sentence":"The school is testing an ______ timetable this term before deciding.","answer":"experimental"},{"num":8,"sentence":"Plastic waste in the ocean can seriously ______ sea turtles.","answer":"endanger"},{"num":9,"sentence":"Teachers can now ______ the exercises for each individual learner.","answer":"personalise"},{"num":10,"sentence":"______ speaking, humans and chimpanzees are extremely close.","answer":"Biologically"}]},"4":{"title":"SPEAKING","words":[{"word":"personalise","ipa":"/ˈpɜːsənəlaɪz/","pos":"v.","meaning":"cá nhân hóa"},{"word":"personalised","ipa":"/ˈpɜːsənəlaɪzd/","pos":"adj.","meaning":"được cá nhân hóa"},{"word":"personalisation","ipa":"/ˌpɜːsənəlaɪˈzeɪʃn/","pos":"n.","meaning":"sự cá nhân hóa"},{"word":"virtual","ipa":"/ˈvɜːtʃuəl/","pos":"adj.","meaning":"ảo; trực tuyến"},{"word":"virtually","ipa":"/ˈvɜːtʃuəli/","pos":"adv.","meaning":"hầu như; gần như"},{"word":"recognition","ipa":"/ˌrekəɡˈnɪʃn/","pos":"n.","meaning":"sự nhận diện; sự công nhận"},{"word":"recognise","ipa":"/ˈrekəɡnaɪz/","pos":"v.","meaning":"nhận ra; công nhận"},{"word":"recognisable","ipa":"/ˈrekəɡnaɪzəbl/","pos":"adj.","meaning":"có thể nhận ra"},{"word":"support","ipa":"/səˈpɔːt/","pos":"v., n.","meaning":"hỗ trợ; sự hỗ trợ"},{"word":"supportive","ipa":"/səˈpɔːtɪv/","pos":"adj.","meaning":"mang tính hỗ trợ"},{"word":"supporter","ipa":"/səˈpɔːtə(r)/","pos":"n.","meaning":"người ủng hộ"},{"word":"application","ipa":"/ˌæplɪˈkeɪʃn/","pos":"n.","meaning":"ứng dụng; đơn xin"},{"word":"apply","ipa":"/əˈplaɪ/","pos":"v.","meaning":"áp dụng; nộp đơn"},{"word":"applicant","ipa":"/ˈæplɪkənt/","pos":"n.","meaning":"người nộp đơn"},{"word":"available","ipa":"/əˈveɪləbl/","pos":"adj.","meaning":"có sẵn"},{"word":"availability","ipa":"/əˌveɪləˈbɪləti/","pos":"n.","meaning":"sự có sẵn"},{"word":"interaction","ipa":"/ˌɪntərˈækʃn/","pos":"n.","meaning":"sự tương tác"},{"word":"interact","ipa":"/ˌɪntərˈækt/","pos":"v.","meaning":"tương tác"},{"word":"interactive","ipa":"/ˌɪntərˈæktɪv/","pos":"adj.","meaning":"có tính tương tác"},{"word":"critical thinking","ipa":"/ˌkrɪtɪkl ˈθɪŋkɪŋ/","pos":"n.","meaning":"tư duy phản biện"}],"mcq":[{"num":1,"question":"The app gives every learner a ______ list of vocabulary to revise.","options":["personalised","personalise","personalisation","personally"],"answerIndex":0,"explanation":"Trước danh từ \"list\" cần tính từ: \"a personalised list\" (danh sách được cá nhân hóa). \"personalise\" là động từ; \"personalisation\" là danh từ; \"personally\" là trạng từ."},{"num":2,"question":"A/An ______ assistant can book your tickets and read your messages aloud.","options":["recognisable","applicable","available","virtual"],"answerIndex":3,"explanation":"\"a virtual assistant\" (trợ lý ảo) là cụm cố định chỉ phần mềm như Siri hay Alexa. \"recognisable\" (dễ nhận ra), \"applicable\" (có thể áp dụng) và \"available\" (có sẵn) không tạo thành loại trợ lý này."},{"num":3,"question":"The system can ______ your voice even in a fairly noisy room.","options":["recognition","recognisable","recognise","recognised"],"answerIndex":2,"explanation":"Sau \"can\" cần động từ nguyên thể: \"recognise\" (nhận diện). \"recognition\" là danh từ; \"recognisable\" là tính từ; \"recognised\" sai dạng sau động từ khuyết thiếu."},{"num":4,"question":"Voice ______ has improved enormously over the last five years.","options":["recognise","recognition","recognisable","recognised"],"answerIndex":1,"explanation":"Chủ ngữ của \"has improved\" cần danh từ: \"voice recognition\" (nhận diện giọng nói). \"recognise/recognised\" là động từ; \"recognisable\" là tính từ."},{"num":5,"question":"My teacher was extremely ______ when I was struggling with maths.","options":["support","supportive","supporter","supportively"],"answerIndex":1,"explanation":"Sau \"was extremely\" cần tính từ: \"supportive\" (luôn động viên, hỗ trợ). \"support\" là danh từ/động từ; \"supporter\" chỉ người ủng hộ; \"supportively\" là trạng từ."},{"num":6,"question":"Students can get technical ______ by email at any time of the day.","options":["supportive","supporter","support","supportively"],"answerIndex":2,"explanation":"\"technical support\" (hỗ trợ kỹ thuật) là cụm danh từ cố định. \"supportive\" là tính từ; \"supporter\" chỉ người; \"supportively\" là trạng từ."},{"num":7,"question":"You can download the ______ free of charge from the school website.","options":["application","apply","applicant","applicable"],"answerIndex":0,"explanation":"Thứ được tải xuống là \"application\" (ứng dụng). \"apply\" là động từ; \"applicant\" chỉ người nộp đơn; \"applicable\" là tính từ."},{"num":8,"question":"You can ______ these study techniques to almost any subject.","options":["application","applicant","applicable","apply"],"answerIndex":3,"explanation":"Sau \"can\" cần động từ nguyên thể: \"apply sth to sth\" (áp dụng cái gì vào đâu). \"application/applicant\" là danh từ; \"applicable\" là tính từ."},{"num":9,"question":"The library's e-books are ______ twenty-four hours a day.","options":["availability","avail","available","availably"],"answerIndex":2,"explanation":"Sau \"are\" cần tính từ: \"available\" (có sẵn để dùng). \"availability\" là danh từ; \"avail\" là động từ; \"availably\" sai từ loại ở đây."},{"num":10,"question":"The ______ of free online courses has changed higher education.","options":["available","avail","availably","availability"],"answerIndex":3,"explanation":"Chủ ngữ của \"has changed\" cần danh từ: \"the availability of sth\" (sự sẵn có của cái gì). \"available\" là tính từ; hai phương án còn lại sai từ loại."},{"num":11,"question":"Each lesson includes ______ games and short quizzes.","options":["interaction","interactive","interact","interactively"],"answerIndex":1,"explanation":"Trước danh từ \"games\" cần tính từ: \"interactive games\" (trò chơi tương tác). \"interaction\" là danh từ; \"interact\" là động từ; \"interactively\" là trạng từ."},{"num":12,"question":"Machines can find facts very fast, but ______ is still a human skill.","options":["critical thinking","voice recognition","personalisation","availability"],"answerIndex":0,"explanation":"\"critical thinking\" (tư duy phản biện) là kỹ năng đánh giá thông tin mà máy móc chưa thay thế được, đối lập với việc \"find facts\". \"voice recognition\", \"personalisation\" và \"availability\" đều là những thứ máy móc làm tốt nên mâu thuẫn với \"still a human skill\"."}],"gapfill":[{"num":1,"sentence":"Students can ______ with the teacher through the chat box during the lesson.","answer":"interact"},{"num":2,"sentence":"The basic version of the app is ______ free; you pay only for extra features.","answer":"virtually"},{"num":3,"sentence":"The logo of this company is instantly ______ all over the world.","answer":"recognisable"},{"num":4,"sentence":"Face ______ is used at the airport to check passports quickly.","answer":"recognition"},{"num":5,"sentence":"She is a strong ______ of using technology in language classrooms.","answer":"supporter"},{"num":6,"sentence":"His parents were very ______ when he decided to study computer science.","answer":"supportive"},{"num":7,"sentence":"More than two hundred ______ applied for the technology scholarship.","answer":"applicants"},{"num":8,"sentence":"A few tickets are still ______ for tomorrow's lecture on robotics.","answer":"available"},{"num":9,"sentence":"______ helps students judge whether information online is reliable.","answer":"Critical thinking"},{"num":10,"sentence":"The ______ of learning means that each student follows a different path.","answer":"personalisation"}]},"5":{"title":"LISTENING","words":[{"word":"expert","ipa":"/ˈekspɜːt/","pos":"n.","meaning":"chuyên gia"},{"word":"expert","ipa":"/ˈekspɜːt/","pos":"adj.","meaning":"thành thạo, chuyên môn cao"},{"word":"advanced","ipa":"/ədˈvɑːnst/","pos":"adj.","meaning":"tiên tiến, nâng cao"},{"word":"advance","ipa":"/ədˈvɑːns/","pos":"v.","meaning":"tiến lên; thúc đẩy"},{"word":"advance","ipa":"/ədˈvɑːns/","pos":"n.","meaning":"sự tiến bộ; sự tiến lên"},{"word":"operate","ipa":"/ˈɒpəreɪt/","pos":"v.","meaning":"vận hành; hoạt động"},{"word":"operation","ipa":"/ˌɒpəˈreɪʃn/","pos":"n.","meaning":"sự vận hành; hoạt động"},{"word":"operator","ipa":"/ˈɒpəreɪtə(r)/","pos":"n.","meaning":"người vận hành"},{"word":"artificial intelligence","ipa":"/ˌɑːtɪfɪʃl ɪnˈtelɪdʒəns/","pos":"n.","meaning":"trí tuệ nhân tạo"},{"word":"in advance","ipa":"/ɪn ədˈvɑːns/","pos":"adv.","meaning":"trước, trước đó"},{"word":"interact","ipa":"/ˌɪntərˈækt/","pos":"v.","meaning":"tương tác"},{"word":"interaction","ipa":"/ˌɪntərˈækʃn/","pos":"n.","meaning":"sự tương tác"},{"word":"interactive","ipa":"/ˌɪntərˈæktɪv/","pos":"adj.","meaning":"có tính tương tác"},{"word":"be capable of","ipa":"/ˈkeɪpəbl/","pos":"phr.","meaning":"có khả năng làm gì"}],"mcq":[{"num":1,"question":"We invited an ______ in robotics to give a talk to our class.","options":["operator","operation","expert","advance"],"answerIndex":2,"explanation":"\"an expert in sth\" (chuyên gia về lĩnh vực gì) là cụm chuẩn cho người được mời nói chuyện. \"operator\" là người vận hành máy; \"operation\" và \"advance\" không chỉ người."},{"num":2,"question":"The shop assistant gave us ______ advice on choosing a laptop.","options":["interactive","expert","artificial","capable"],"answerIndex":1,"explanation":"\"expert advice\" (lời khuyên chuyên môn) là collocation cố định. \"interactive\" (có tính tương tác), \"artificial\" (nhân tạo) và \"capable\" (có khả năng) không kết hợp với \"advice\"."},{"num":3,"question":"Two trained engineers are needed to ______ this machine safely.","options":["operation","operator","operating","operate"],"answerIndex":3,"explanation":"Sau \"to\" cần động từ nguyên thể: \"operate a machine\" (vận hành máy). \"operation/operator\" là danh từ; \"operating\" sai dạng sau \"to\"."},{"num":4,"question":"The ______ of the new system will begin at the end of June.","options":["operation","operate","operator","operating"],"answerIndex":0,"explanation":"Chủ ngữ của \"will begin\" cần danh từ: \"the operation of sth\" (việc vận hành cái gì). \"operate\" là động từ; \"operator\" chỉ người; \"operating\" là V-ing."},{"num":5,"question":"The crane ______ must hold a special licence for this type of work.","options":["operator","operation","operate","operating"],"answerIndex":0,"explanation":"Người có giấy phép điều khiển cần cẩu là \"operator\" (người vận hành). \"operation\" là danh từ trừu tượng; \"operate/operating\" là động từ."},{"num":6,"question":"Please book your seat ______ if you want to attend the talk.","options":["in operation","in advance","in interaction","in capability"],"answerIndex":1,"explanation":"\"book sth in advance\" (đặt trước) là cụm cố định. \"in operation\" nghĩa là đang hoạt động; \"in interaction\" và \"in capability\" không phải cụm chuẩn."},{"num":7,"question":"This is a great ______ in medical technology and will save many lives.","options":["operator","expert","interaction","advance"],"answerIndex":3,"explanation":"\"an advance in sth\" (một bước tiến trong lĩnh vực gì) là cụm chuẩn. \"operator\" và \"expert\" chỉ người; \"interaction\" (sự tương tác) sai nghĩa."},{"num":8,"question":"The course is designed for ______ learners who already speak fluently.","options":["advance","advancement","advanced","advancing"],"answerIndex":2,"explanation":"Trước danh từ \"learners\" cần tính từ: \"advanced learners\" (người học trình độ cao). \"advance/advancement\" là danh từ; \"advancing\" là V-ing."},{"num":9,"question":"There is very little ______ between the robot and the customers.","options":["interaction","interact","interactive","interactively"],"answerIndex":0,"explanation":"Sau \"very little\" cần danh từ không đếm được: \"interaction\" (sự tương tác). \"interact\" là động từ; \"interactive\" là tính từ; \"interactively\" là trạng từ."},{"num":10,"question":"The classroom whiteboard is ______, so pupils can move objects with a finger.","options":["interaction","interact","interactive","interactively"],"answerIndex":2,"explanation":"Sau \"is\" cần tính từ: \"interactive\" (có tính tương tác). \"interaction\" là danh từ; \"interact\" là động từ; \"interactively\" là trạng từ."},{"num":11,"question":"This computer is ______ of processing a billion instructions a second.","options":["capability","capable","capably","capabilities"],"answerIndex":1,"explanation":"\"be capable of doing sth\" (có khả năng làm gì) là cấu trúc cố định, cần tính từ. \"capability/capabilities\" là danh từ; \"capably\" là trạng từ."},{"num":12,"question":"Many hospitals now use ______ to help doctors read X-ray images.","options":["interaction","operation","advance","artificial intelligence"],"answerIndex":3,"explanation":"Công nghệ giúp bác sĩ đọc phim X-quang là \"artificial intelligence\" (trí tuệ nhân tạo). \"interaction\" (sự tương tác), \"operation\" (sự vận hành) và \"advance\" (bước tiến) không phải công cụ được sử dụng theo cách này."}],"gapfill":[{"num":1,"sentence":"You must book the tickets ______ because the show is very popular.","answer":"in advance"},{"num":2,"sentence":"Only a trained ______ is allowed to use this heavy equipment.","answer":"operator"},{"num":3,"sentence":"Nobody in the office knows how to ______ the old printer any more.","answer":"operate"},{"num":4,"sentence":"Recent ______ in battery technology have made electric cars much cheaper.","answer":"advances"},{"num":5,"sentence":"This robot is ______ of recognising more than fifty different faces.","answer":"capable"},{"num":6,"sentence":"The museum's new display is fully ______: visitors can touch everything.","answer":"interactive"},{"num":7,"sentence":"Face-to-face ______ is still very important for young children.","answer":"interaction"},{"num":8,"sentence":"Many large hospitals now use ______ to analyse medical images.","answer":"artificial intelligence"},{"num":9,"sentence":"The class is for ______ students who already have a good level of English.","answer":"advanced"},{"num":10,"sentence":"We asked an ______ to check the safety of the old building.","answer":"expert"}]},"6":{"title":"WRITING","words":[{"word":"bonding","ipa":"/bɒnd/","pos":"n.","meaning":"quá trình gắn kết"},{"word":"bond","ipa":"/bɒnd/","pos":"v.","meaning":"gắn kết; kết dính"},{"word":"repetitive","ipa":"/rɪˈpetətɪv/","pos":"adj.","meaning":"lặp đi lặp lại"},{"word":"repetition","ipa":"/ˌrepəˈtɪʃn/","pos":"n.","meaning":"sự lặp lại"},{"word":"repeat","ipa":"/rɪˈpiːt/","pos":"v.","meaning":"lặp lại"},{"word":"repeat","ipa":"/rɪˈpiːt/","pos":"n.","meaning":"sự lặp lại"},{"word":"maintenance","ipa":"/ˈmeɪntənəns/","pos":"n.","meaning":"sự bảo trì; bảo dưỡng"},{"word":"maintain","ipa":"/meɪnˈteɪn/","pos":"v.","meaning":"duy trì; bảo trì"},{"word":"perform","ipa":"/pəˈfɔːm/","pos":"v.","meaning":"thực hiện; biểu diễn"},{"word":"performance","ipa":"/pəˈfɔːməns/","pos":"n.","meaning":"sự thực hiện; màn biểu diễn; hiệu suất"},{"word":"performer","ipa":"/pəˈfɔːmə(r)/","pos":"n.","meaning":"người biểu diễn"}],"mcq":[{"num":1,"question":"Playing games together is an important part of family ______.","options":["bonding","bond","bonded","bonds"],"answerIndex":0,"explanation":"Sau \"family\" và làm tân ngữ của giới từ \"of\" cần danh từ chỉ quá trình: \"family bonding\" (sự gắn kết gia đình). \"bond/bonds\" chỉ mối quan hệ cụ thể; \"bonded\" là phân từ."},{"num":2,"question":"Babies usually ______ with their parents in the first months of life.","options":["bonding","bonded","bonds","bond"],"answerIndex":3,"explanation":"Câu ở thì hiện tại đơn với chủ ngữ số nhiều \"babies\" nên cần \"bond\" (gắn kết). \"bonds\" sai hòa hợp chủ ngữ; \"bonding\" và \"bonded\" không đứng một mình làm động từ chính."},{"num":3,"question":"Many jobs on a production line are boring and ______.","options":["repetition","repeat","repetitive","repeatedly"],"answerIndex":2,"explanation":"Sau \"boring and\" cần tính từ song song: \"repetitive\" (lặp đi lặp lại). \"repetition\" là danh từ; \"repeat\" là động từ; \"repeatedly\" là trạng từ."},{"num":4,"question":"Too much ______ makes a language lesson very dull.","options":["repetitive","repetition","repeat","repeatedly"],"answerIndex":1,"explanation":"Sau \"too much\" cần danh từ không đếm được: \"repetition\" (sự lặp lại). \"repetitive\" là tính từ; \"repeat\" là động từ; \"repeatedly\" là trạng từ."},{"num":5,"question":"Could you ______ the last sentence, please? I did not catch it.","options":["repetition","repeat","repetitive","repeatedly"],"answerIndex":1,"explanation":"Sau \"Could you\" cần động từ nguyên thể: \"repeat\" (nhắc lại). \"repetition\" là danh từ; \"repetitive\" là tính từ; \"repeatedly\" là trạng từ."},{"num":6,"question":"Robots need regular ______ if they are to work properly for years.","options":["maintain","maintained","maintenance","maintaining"],"answerIndex":2,"explanation":"Sau \"regular\" cần danh từ không đếm được: \"maintenance\" (việc bảo trì). \"maintain/maintained\" là động từ; \"maintaining\" là V-ing."},{"num":7,"question":"It is very expensive to ______ such an old machine.","options":["maintain","maintenance","maintained","maintaining"],"answerIndex":0,"explanation":"Sau \"to\" trong cấu trúc \"It is + tính từ + to do sth\" cần động từ nguyên thể: \"maintain\" (bảo trì, duy trì). \"maintenance\" là danh từ; hai phương án còn lại sai dạng sau \"to\"."},{"num":8,"question":"The factory manager was very pleased with the robot's ______.","options":["perform","performer","performed","performance"],"answerIndex":3,"explanation":"Sau sở hữu cách \"the robot's\" cần danh từ: \"performance\" (hiệu suất làm việc). \"perform/performed\" là động từ; \"performer\" chỉ người biểu diễn."},{"num":9,"question":"These machines can ______ the same task thousands of times a day.","options":["performance","performer","pe
